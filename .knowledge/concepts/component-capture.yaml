id: component:capture
type: component
title: 'capture: recording what a renderer draws through the encoder into a packet sink'
summary: capture.Recorder reads the pixels of a Source (Bounds + ReadPixels, which *ebiten.Image satisfies
  without the package importing Ebitengine) on every frame, encodes them on a background goroutine and
  pushes the packets into a hwmediacodec.PacketWriteCloser; frames are dropped and counted instead of
  blocking the game loop, PTS are wall-clock based and quantised to the frame rate, RequestKeyframe forces
  a keyframe. Consolidated on 2026-10-16 from milestone:capture-package and the recorder parts of the
  sample milestones.
lifecycle: active
authority: authored
aliases:
- capture package
- screen recorder
- 画面録画パッケージ
- Recorder
constraints:
- 'Capture never blocks the game loop: ReadPixels runs in Draw (about 2 ms at 1280x720 on the M3, 3.7
  ms including the demo scene), the RGBA buffer goes through a bounded channel to the encoder goroutine,
  and a full queue drops the frame (counted) instead of stalling.'
- 'PTS are wall-clock based and quantised to the frame rate (slot = round(elapsed*fps), pts = slot*90000/fps):
  a dropped frame leaves a gap rather than speeding the recording up, and a second Draw inside one slot
  (120 Hz display, 60 fps game) is ignored.'
- Recorder.RequestKeyframe sets ForceKeyframe on the next captured frame (atomic flag); the broadcaster
  calls it when a peer registers and when the RTP sender reads a PictureLossIndication or FullIntraRequest.
- Capture counts a frame only once it is queued (a frame that found a free buffer but no queue slot used
  to be counted as both captured and dropped); VideoToolbox may still skip frames under bursts, so packets
  <= captured.
- Nothing in capture imports Ebitengine, mp4ff or pion. Container and transport sinks live with their
  dependencies (mediacontainer/mp4.VideoFile and Segmenter, examples/webrtc.Broadcaster) and satisfy capture.Sink
  structurally.
- 'Named capture, not screencast: to the author screencast suggests mirroring a screen to a television
  (casting), while the package grabs frames and encodes them. The type stays Recorder (capture.New returns
  *capture.Recorder, fed with Recorder.Capture).'
- 'A subpackage, not the root package: the root package is the codec API (Decoder, Encoder, Probe) and
  the recorder is a consumer of it, like annexb and ivf are helpers around it. Recorder, Options and Sink
  in package hwmediacodec would have needed prefixed names (NewRecorder, RecorderOptions).'
- Packets go from the encoder goroutine straight into Sink.WritePacket in memory; no file is involved
  unless the sink is one. The WebRTC sample hands each access unit to pion's TrackLocalStaticSample and
  the HLS sample segments in memory.
- The package tests cannot use an MP4 muxer, so TestRecorderEncodes collects the packets through Funcs,
  checks PTS steps on the packets themselves and lets ffmpeg decode the concatenated Annex-B stream; the
  MP4-level check (ffprobe frame count, duration, PTS steps) is TestVideoFileRecordsCapture in mediacontainer/mp4.
acceptance:
  exscreen-recorder-mp4:
    text: Sixty frames of a synthetic screen captured at 30 fps (two captures per slot) give an MP4 with
      60 frames, PTS steps of 3000 at 90 kHz, 2.000 s duration, no drops, decodable by ffmpeg, whose first
      frame matches the first captured image within 30 dB.
    scope:
      milestone: examples-screencast-hls
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exscreen-recorder-test
  exscreen-recorder-drops:
    text: With a queue of two frames, bursts of captures are either encoded or counted as dropped and
      every encoded frame yields a packet.
    scope:
      milestone: examples-screencast-hls
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exscreen-recorder-test
  exwebrtc-keyframe-request:
    text: RequestKeyframe makes the next captured frame a keyframe (keyframes at 0, 10, 20 for requests
      before captures 10 and 20 with a 300-frame interval).
    scope:
      milestone: examples-webrtc
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exwebrtc-recorder-keyframe-test
  capture-recorder-core:
    text: Sixty frames of a synthetic screen captured at 30 fps (two captures per slot) reach the sink
      as 60 packets starting with a keyframe, PTS steps of 3000 at 90 kHz, 2 s duration, no drops, the
      sink closed; ffmpeg decodes the Annex-B stream to 60 pictures and the first matches the first captured
      image within 30 dB (8x8-block PSNR).
    scope:
      milestone: capture-package
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - capture-recorder-core-test
  capture-recorder-keyframe-drops:
    text: RequestKeyframe yields keyframes exactly at the requested captures, and with a queue of two
      frames every capture is either encoded or counted as dropped.
    scope:
      milestone: capture-package
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - capture-recorder-core-test
  capture-no-new-dependencies:
    text: The core module builds on its own (GOWORK=off), and go list -deps ./capture shows only the standard
      library, purego, x/sys and packages of the module; go vet passes for linux and windows.
    scope:
      milestone: capture-package
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - capture-deps-check
  capture-samples-follow:
    text: record, texture, hls and webrtc build against the moved package; the MP4 sink test passes in
      mediacontainer/mp4 and the record app still writes a playable 1280x720 file.
    scope:
      milestone: capture-package
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - capture-videofile-test
    - capture-record-run
