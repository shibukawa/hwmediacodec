open_questions:
  exscreen-hidpi-capture:
    text: Should the recorder capture at the device pixel size (ebiten.Monitor().DeviceScaleFactor())
      instead of the logical Layout size? That needs the game to render at device resolution.
    state: deferred
    resolution: The logical size is what the game draws; a game that wants a sharper recording can return
      a larger Layout.
    scope:
      platform: darwin
      gpu: apple-silicon
  capture-examples-release:
    text: When is the core module tagged with the capture package, so that examples/go.mod can require
      it and the examples run by module path again?
    state: answered
    scope:
      platform: darwin
      gpu: apple-silicon
    resolution: 'The core module was tagged v0.2.0 on 2026-10-10 with capture, mediacontainer, image,
      net/hls and playback; ebitenvideo, net/webrtc and examples require that version (PR #16, 2026-10-10).'
  capture-more-sinks:
    text: Should the core module ship sinks that need no dependency (an Annex-B io.Writer sink, an IVF
      sink for AV1)?
    state: deferred
    resolution: Funcs covers them in three lines; add them when a user asks.
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  api:
    screencast: New(width, height, sink, Options{Codec, FPS, Bitrate, Quality, CBR, KeyframeInterval,
      LowLatency, Profile, Queue, Software, Extra}) -> Recorder{Capture(Source), CaptureAt, Close, Err,
      Captured, Dropped, Encoded, Duration}; Source = Bounds()+ReadPixels() (ebiten.Image); Sink = WritePacket+Close;
      Funcs{Write, Done}; TimeScale 90000. Since milestone:capture-package the package is github.com/shibukawa/hwmediacodec/capture
      in the core module and the MP4 sink is mp4.CreateVideoFile(path, codec, timeScale)
    screencast_exwebrtc: Recorder.RequestKeyframe()
    capture: import github.com/shibukawa/hwmediacodec/capture; New(width, height, sink, Options{Codec,
      FPS, Bitrate, Quality, CBR, KeyframeInterval, LowLatency, Profile, Queue, Software, Extra}) -> Recorder{Capture(Source),
      CaptureAt, RequestKeyframe, Close, Err, Captured, Dropped, Encoded, Duration}; Source = Bounds()+ReadPixels();
      Sink = WritePacket+Close; Funcs{Write, Done}; TimeScale 90000
    container: CreateVideoFile(path, codec, timeScale) -> *VideoFile{WritePacket, Close} (mediacontainer/mp4)
      replaces screencast.NewMP4File(path, codec)
  delivery_results:
    milestone:examples-screencast-hls:
      result:
        status: delivered 2026-10-09
        performance: 1280x720 at 60 fps - ReadPixels about 2 ms per frame (3.7 ms with the scene render
          it waits for), no drops; 5 s recording 278 frames
    milestone:capture-package:
      result:
        status: delivered 2026-10-09
