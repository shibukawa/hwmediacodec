id: milestone:windows-nvidia-nvdec-nvenc
type: milestone
title: Windows NVIDIA - the NVDEC/NVENC backend loaded from nvcuda.dll, nvcuvid.dll and nvEncodeAPI64.dll
summary: 'Windows slice requested by the author on 2026-10-09 ("NVIDIAのnvdec/nvenc直叩きの方向で"), after
  asking whether the merged Media Foundation backend also covers AMD and NVIDIA (it does, without telling
  vendors apart). The Linux NVIDIA backend (internal/nvidia) now also builds for windows/amd64: the sys
  package got a per-platform library loader and a platform-sized unsigned long, and the backend is
  registered before Media Foundation. The decoder and encoder code is shared unchanged with Linux.
  Written on a Mac: the Windows struct layouts are measured with two Windows-targeting C compilers and
  asserted at compile time, nothing has run on Windows yet.'
lifecycle: active
authority: authored
aliases:
- Windows NVIDIA
- Windows NVDEC
- Windows NVENC
- nvcuvid.dll
- nvEncodeAPI64.dll
scope:
  platform: windows
  gpu: nvidia
  milestone: windows-nvidia
constraints:
- CGO_ENABLED=0. The three driver DLLs are loaded with LoadLibraryEx(LOAD_LIBRARY_SEARCH_SYSTEM32)
  through golang.org/x/sys/windows, so a DLL of the same name next to the executable is never used;
  entry points are bound with purego.RegisterFunc (syscall.SyscallN underneath) and the parser
  callbacks with purego.NewCallback (syscall.NewCallback). No module dependency is added.
- One backend for both operating systems. Everything in internal/nvidia and the bindings in
  internal/nvidia/sys carry the build tag linux || (windows && amd64); only the library names, the
  loader (lib_linux.go, lib_windows.go) and the width of unsigned long (ulong_lp64.go,
  ulong_windows.go) differ.
- windows/amd64 only. NVIDIA ships no NVDEC/NVENC libraries for Windows on ARM, so windows/arm64 keeps
  Media Foundation alone (registerNVIDIA is a no-op there).
- Same struct version floor as Linux (Video Codec SDK 11.1); on Windows that is driver 471.41 or newer.
- Registered before Media Foundation in backends_windows.go, following policy:support-tiers (Windows
  NVIDIA primary = backend:nvenc-nvdec, alternative = backend:media-foundation). Media Foundation
  takes over when the nvidia backend reports ErrUnsupported.
non_goals:
- NVENC asynchronous mode (completion events), which exists only on Windows; the synchronous mode used
  on Linux works on Windows too and keeps one code path.
- Direct3D 11 input or output (NV_ENC_DEVICE_TYPE_DIRECTX, cudaVideoCreate_PreferDXVA); the session
  stays on the CUDA primary context with system-memory frames.
- A way to prefer Media Foundation over an installed NVIDIA driver, or to choose the backend per call
  (see open_questions.backend-selection).
- Everything the Linux slice left out (RGBA/BGRA decode output, 10-bit, interlaced, AV1, zero-copy).
acceptance:
  windows-struct-layout:
    text: Every struct the backend exchanges with the driver has, for windows/amd64, the size and
      field offsets a Windows C compiler measures. Only CUVIDSOURCEDATAPACKET and CUVIDDECODECREATEINFO
      differ from Linux (their unsigned long fields are 32 bits wide); those two are asserted at
      compile time, the others are covered by the shared layout test.
    scope:
      milestone: windows-nvidia
    verified_by:
    - windows-layout-oracle
  windows-loader:
    text: On a Windows machine with the NVIDIA driver every nvcuda.dll, nvcuvid.dll and
      nvEncodeAPI64.dll entry point the backend uses binds, NvEncodeAPIGetMaxSupportedVersion reports
      at least 11.1 and Probe lists nvidia capabilities ahead of mediafoundation ones. Without the
      driver Probe lists only mediafoundation capabilities and nothing fails.
    scope:
      milestone: windows-nvidia
    verified_by:
    - windows-loader-run
  decode-reference-windows-nvidia:
    text: On a Windows machine with an NVIDIA GPU the decode conformance tests pass on the nvidia
      backend (per-frame NV12 checksums equal ffmpeg's software decoder, B-frame display order,
      TestDecodeOrderOption now running instead of skipping, parameter-set change, flush and resume).
    scope:
      milestone: windows-nvidia
    verified_by:
    - hardware-decode-windows
  encode-reference-windows-nvidia:
    text: On the same machine the encode conformance tests and the transcode round trip pass on the
      nvidia backend, including RGBA/BGRA input and B-frames, which the Media Foundation backend does
      not offer.
    scope:
      milestone: windows-nvidia
    verified_by:
    - hardware-encode-windows
  cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets and go vet passes for windows/amd64 and
      windows/arm64 with the backend wired in.
    scope:
      milestone: windows-nvidia
    verified_by:
    - cross-build-check
  linux-unaffected:
    text: The loader refactor does not change the Linux backend - every symbol still binds against a
      real driver build and the no-driver path still yields an empty Probe result.
    scope:
      milestone: windows-nvidia
    verified_by:
    - linux-regression
  host-suite-unaffected:
    text: The full macOS test suite still passes; the test changes (the Windows probe list accepts the
      nvidia backend on amd64, TestDecodeOrderOption skips by serving backend instead of by operating
      system) keep the other platforms' expectations.
    scope:
      milestone: windows-nvidia
    verified_by:
    - host-suite
