history:
  requested-2026-10-09:
    summary: Author asked whether the merged Media Foundation backend covers AMD and NVIDIA, then asked
      for NVDEC/NVENC to be driven directly on Windows, on top of the Linux NVIDIA backend now in main.
  implemented-2026-10-09:
    summary: 'Code complete on branch claude/media-foundation-gpu-support-b3f3d6: shared backend builds
      for windows/amd64, Windows layouts measured and asserted at compile time, Linux binding re-verified
      in the container, host suite and cross builds pass; nothing has run on Windows.'
  superseded-2026-10-16:
    summary: Folded into backend:nvenc-nvdec on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
