id: milestone:windows-nvidia-nvdec-nvenc
type: milestone
title: Windows NVIDIA - the NVDEC/NVENC backend loaded from nvcuda.dll, nvcuvid.dll and nvEncodeAPI64.dll
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:nvenc-nvdec (keys prefixed nvwin-). Original summary: Windows slice requested by
  the author on 2026-10-09 ("NVIDIAのnvdec/nvenc直叩きの方向で"), after asking whether the merged Media Foundation
  backend also covers AMD and NVIDIA (it does, without telling vendors apart). The Linux NVIDIA backend
  (internal/nvidia) now also builds for windows/amd64: the sys package got a per-platform library loader
  and a platform-sized unsigned long, and the backend is registered before Media Foundation. The decoder
  and encoder code is shared unchanged with Linux. Written on a Mac: the Windows struct layouts are measured
  with two Windows-targeting C compilers and asserted at compile time, nothing has run on Windows yet.'
lifecycle: superseded
authority: authored
aliases:
- Windows NVIDIA
- Windows NVDEC
- Windows NVENC
- nvcuvid.dll
- nvEncodeAPI64.dll
scope:
  platform: windows
  gpu: nvidia
  milestone: windows-nvidia
non_goals:
- NVENC asynchronous mode (completion events), which exists only on Windows; the synchronous mode used
  on Linux works on Windows too and keeps one code path.
- Direct3D 11 input or output (NV_ENC_DEVICE_TYPE_DIRECTX, cudaVideoCreate_PreferDXVA); the session stays
  on the CUDA primary context with system-memory frames.
- A way to prefer Media Foundation over an installed NVIDIA driver, or to choose the backend per call
  (see open_questions.backend-selection).
- Everything the Linux slice left out (RGBA/BGRA decode output, 10-bit, interlaced, AV1, zero-copy).
