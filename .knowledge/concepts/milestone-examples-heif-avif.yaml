open_questions:
  encoder-odd-sizes:
    text: Should the VideoToolbox encoder (and the Encoder contract) handle odd picture sizes itself, by
      padding and writing the conformance window / clean aperture, instead of silently rounding down?
    state: open
    resolution: Observed on the M3 with the HEVC encoder (321x203 -> SPS 320x202). Left to the consumer
      for now and documented in the README; a library fix would pad the pixel buffer and set
      kVTCompressionPropertyKey_CleanAperture or write the SPS conformance window.
  iphone-photos:
    text: Real iPhone photos (grid of 512x512 hvc1 tiles, irot, EXIF, HDR gain maps, 10-bit for HDR
      captures) were not available in the session; the grid and irot paths were exercised only with files
      this package wrote and ImageIO read.
    state: open
    resolution: Try the author's photos; 10-bit captures are expected to fail with ErrUnsupported from
      the decoder.
