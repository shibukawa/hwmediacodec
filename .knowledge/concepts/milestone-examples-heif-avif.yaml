id: milestone:examples-heif-avif
type: milestone
title: Examples - HEIC/HEIF and AVIF still images with the hardware codecs
summary: 'Fifth usage-sample slice: examples/heif reads HEIF files (hvc1/hev1 and av01 items, grid
  derived images, clap, irot, imir, iloc construction methods 0 and 1) and writes HEIC (and AVIF where
  an AV1 encoder exists) with one keyframe per picture or tile, hvcC/av1C built from the in-band
  parameter sets, optional grid tiling, rotation and a clap for odd sizes; examples/heifconv converts
  between HEIC/AVIF and PNG/JPEG. AVIF decoding relies on the AV1 decoder added to the VideoToolbox
  backend in milestone:darwin-av1-decode (merged into this branch).'
lifecycle: active
authority: authored
aliases:
- HEIC sample
- AVIF sample
- HEIF 変換
- heifconv
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-heif-avif
constraints:
- 'Box plumbing is hand-written in the examples module (meta/hdlr/pitm/iinf/iref/iprp/ipco/ipma/iloc/idat,
  mdat); only the decoder configuration records come from mp4ff (hevc.DecodeHEVCDecConfRec, mp4.CreateHvcC,
  av1.ParseSequenceHeader, av1.CodecConfRecFromSequenceHeader).'
- 'Decoding uses one decoder per file with WithOutputFormat(RGBA) and WithDecodeOrder(); every item is a
  keyframe packet (hvcC parameter sets + length-prefixed NAL units as Annex-B; AV1 temporal unit with
  the av1C configOBUs prepended when the item has no sequence header OBU). Grid tiles are decoded in
  row-major order and stitched, then cropped to the grid output size.'
- 'Transformations apply in ipma order: clap (centre-relative clean aperture, integer arithmetic on
  doubled coordinates), irot (anti-clockwise, matching ffmpeg''s displaymatrix rotation of +90 for irot
  1), imir (axis 0 = left-right).'
- 'Encoding: WithKeyframeInterval(1), ForceKeyframe, WithFrameRate(1), WithQuality; VPS/SPS/PPS taken
  from the first packet into hvcC (shared property when identical bytes); samples hold the slice NAL
  units with 4-byte lengths. Items get hvcC (essential), ispe, pixi (8,8,8), colr nclx 1/1/1 video range;
  the grid item gets ispe/pixi/colr plus clap/irot; tiles are hidden infe entries; iloc version 0 with
  absolute 32-bit offsets, meta built twice to learn the mdat offset.'
- 'The VideoToolbox encoder rounds odd picture sizes down (321x203 request -> 320x202 SPS; the decoder
  then reports 320x202), so odd pictures are padded by one replicated row/column, encoded even and
  declared through clap. ImageIO opens such files at the right size but resamples instead of cropping
  (35.7 dB vs 36.9 dB for our crop against the source); ffmpeg rounds the odd clap to even (320x202).'
- 'ImageIO (sips) does not bake irot into converted pixels (it keeps orientation metadata); ffmpeg
  maps irot to a display matrix and autorotates, so ffmpeg is the oracle for the rotation direction and
  ImageIO for the stored picture.'
- 8-bit 4:2:0 only (the library limit); 10-bit HEIC (iPhone HDR) is out of scope.
non_goals:
- Alpha and depth auxiliary images, image sequences (HEIF video), EXIF/XMP metadata, overlays (iovl),
  10-bit, lossless, AVIF encoding on Apple Silicon (no encoder).
acceptance:
  heic-write-imageio:
    text: HEIC files written for a 640x480 picture (single, 256-pixel grid, rotated 90, grid rotated 270)
      and a 321x203 picture open in macOS ImageIO at the stored size within 35 dB (4x4 block PSNR) of
      the source; our decoder returns the rotated size, within 40 dB (pixel PSNR) of ImageIO for even
      pictures and within 35 dB of the source for all; ffmpeg autorotates even single pictures to the
      rotated source within 35 dB; Info reports HEVC, the tile count and the rotation.
    scope:
      milestone: examples-heif-avif
    verified_by:
    - heif-encode-test
  heic-read:
    text: An 800x600 HEIC written by ImageIO decodes to 800x600 within 40 dB of ImageIO's own decode and
      35 dB of the source.
    scope:
      milestone: examples-heif-avif
    verified_by:
    - heif-decode-test
  avif-read:
    text: A 640x480 AVIF written by ffmpeg (libsvtav1) decodes through the AV1 hardware decoder to 640x480
      within 40 dB of ffmpeg's decode and 30 dB of the source.
    scope:
      milestone: examples-heif-avif
    verified_by:
    - avif-decode-test
  avif-write:
    text: Encode with Codec AV1 returns ErrUnsupported where Probe lists no AV1 encoder, and round-trips
      where one exists.
    scope:
      milestone: examples-heif-avif
    verified_by:
    - avif-encode-test
