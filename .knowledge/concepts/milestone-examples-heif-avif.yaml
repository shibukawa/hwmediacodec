id: milestone:examples-heif-avif
type: milestone
title: Examples - HEIC/HEIF and AVIF still images with the hardware codecs
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:examples, component:image (keys prefixed exheif-). Original
  summary: Fifth usage-sample slice: examples/heif reads HEIF files (hvc1/hev1 and av01 items, grid derived
  images, clap, irot, imir, iloc construction methods 0 and 1) and writes HEIC (and AVIF where an AV1
  encoder exists) with one keyframe per picture or tile, hvcC/av1C built from the in-band parameter sets,
  optional grid tiling, rotation and a clap for odd sizes; examples/heifconv converts between HEIC/AVIF
  and PNG/JPEG. AVIF decoding relies on the AV1 decoder added to the VideoToolbox backend in milestone:darwin-av1-decode
  (merged into this branch).'
lifecycle: superseded
authority: authored
aliases:
- HEIC sample
- AVIF sample
- HEIF 変換
- heifconv
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-heif-avif
non_goals:
- Alpha and depth auxiliary images, image sequences (HEIF video), EXIF/XMP metadata, overlays (iovl),
  10-bit, lossless, AVIF encoding on Apple Silicon (no encoder).
