id: milestone:linux-vaapi-h264-decode
type: milestone
title: Linux AMD - H.264 decode and encode via VA-API with a Go parser/DPB and header writer (built out
  of roadmap order; M2 is macOS encode)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:vaapi, component:bitstream (keys prefixed vah264-). Original summary: Linux slice,
  requested by the author on 2026-10-09 ("Linux AMD support, starting with the decoder"): the VA-API backend
  for Linux (AMD Mesa radeonsi, also Intel iHD/i965) decoding H.264 Annex-B streams to NV12 frames, with
  the slice-level bookkeeping (SPS/PPS/slice headers, POC, reference marking, reference lists) implemented
  in Go and checked against ffmpeg. Built on a Mac; hardware verification is the open step.'
lifecycle: superseded
authority: authored
scope:
  platform: linux
  gpu:
  - amd
  - intel
  milestone: linux-vaapi-decode
non_goals:
- HEVC/AV1 on VA-API, B-frame encoding, display-order output, zero-copy (DMA-BUF) frames, Intel VPL, NVDEC.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:vaapi
- relation: tests_decision
  to: decision:ffi-strategy
- relation: follows
  to: milestone:m1-darwin-h264-decode
- relation: superseded_by
  to: backend:vaapi
- relation: superseded_by
  to: component:bitstream
history:
  requested-2026-10-09:
    summary: Author asked for Linux AMD support, decoder first.
  implemented-2026-10-09:
    summary: Code complete with host-side oracle tests and a Linux container smoke test; hardware conformance
      pending.
  encoder-added-2026-10-09:
    summary: VA-API H.264 encoder added to the same PR at the author's request; header writer verified
      on the host, hardware encode pending.
  merged-display-order-2026-10-09:
    summary: Merged main after the display-order/RGBA milestone; the reorder tracker now runs on the full
      H.264 parser of this slice (the lightweight parser was removed), so MMCO 5 resets are honoured,
      and VA-API decoders are wrapped by the reorder layer like VideoToolbox. RGBA/BGRA stay VideoToolbox-only.
  hevc-followed-2026-10-09:
    summary: milestone:linux-vaapi-hevc generalised the decoder and encoder plumbing for a second codec
      and exercised the H.264 paths end to end against the fake VA driver (decode incl. B-pyramids, six
      references, three slices, cropping, sequence change and seek; encode in CQP, CBR and VBR with and
      without packed slice headers). No H.264 defect was found.
  superseded-2026-10-16:
    summary: Folded into backend:vaapi, component:bitstream on 2026-10-16 so that the current state of
      each backend and package is read from one concept; this file keeps the slice's definition and timeline.
