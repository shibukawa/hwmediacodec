facts:
  steps:
  - internal/bitstream - lazy emulation-prevention removal (slice headers no longer copy the slice) and
    more_rbsp_data().
  - internal/h264 - scaling lists (zigzag, defaults, fall-back rules), SPS incl. VUI/HRD, PPS (lazy parse
    against its SPS), slice header incl. modification/pred-weight/MMCO, DPB (POC 8.2.1, gaps 8.2.5.2,
    marking 8.2.5, lists 8.2.4) with a Surfaces callback for backend storage.
  - internal/vaapi/sys - purego bindings for 30 libva entry points, struct mirrors, message callbacks.
  - internal/vaapi - display/device selection, Probe, decoder (sequence setup, per-picture buffers, output
    copy via derive/getimage, surface pool with ErrAgain backpressure).
  - Root wiring (backends_linux.go), platform-independent conformance tests, CLI ErrAgain handling, README.
  oracle_recipes:
    headers: ffmpeg -i x.h264 -c copy -bsf:v trace_headers -f null - (prints every syntax element with
      bit position; the Extradata copy before the first Packet line is skipped).
    dpb: ffmpeg -threads 1 -loglevel debug -debug mmco (short/long term lists after each picture; ffmpeg
      logs an empty state when an IDR slice starts, emulate it; pick the codec context with most lines
      because ffmpeg decodes once for probing).
    poc: ffmpeg -threads 1 -loglevel debug -debug pict (per slice "frame:N poc:T/B"; ffmpeg adds 65536
      at each IDR for POC type 0).
    display_order: not available from raw .h264 via ffprobe (pts/pkt_dts are N/A); POC equality with
      ffmpeg is used instead.
  learned:
  - The whole slice-level stack can be validated on a machine without the target GPU by using ffmpeg's
    debug logs as oracles; only the final pixel comparison needs hardware.
  - ffmpeg's POC values carry an internal +65536 offset (prev_poc_msb = 1<<16 at IDR); compare differences,
    not absolute values.
  - A sequence change while frames are pending must not tear down surfaces; returning ErrAgain from
    Send until the caller drains keeps the memory model simple.
  - Non-existing frames only need any valid surface id; one shared dummy surface avoids pool pressure.
  next_candidates:
  - Run the conformance tests on the author's AMD machine; then record vendor string, Mesa version and
    fps in this file.
  - HEVC decode on VA-API (VPS/SPS/PPS parser with RPS, VAPictureParameterBufferHEVC/VASliceParameterBufferHEVC).
  - Display-order output using the POC now available (requirement open question frame-reordering).
  - Field (PAFF) pictures if a consumer needs interlaced content.
