id: milestone:linux-vaapi-h264-decode
type: milestone
title: Linux AMD, decoder first - H.264 decode via VA-API with a Go parser/DPB (built out of roadmap order; M2 is macOS encode)
summary: 'Linux slice, requested by the author on 2026-10-09 ("Linux AMD support, starting with the
  decoder"): the VA-API backend for Linux (AMD Mesa radeonsi, also Intel iHD/i965) decoding H.264 Annex-B
  streams to NV12 frames, with the slice-level bookkeeping (SPS/PPS/slice headers, POC, reference marking,
  reference lists) implemented in Go and checked against ffmpeg. Built on a Mac; hardware verification
  is the open step.'
lifecycle: active
authority: authored
scope:
  platform: linux
  gpu:
  - amd
  - intel
  milestone: linux-vaapi-decode
constraints:
- CGO_ENABLED=0; libva and libva-drm are dlopened with purego; no new module dependencies.
- Same public API and Send/Receive/Flush contract as M1; frames in decode order, NV12 in CPU memory.
- H.264 first (project codec priority); HEVC follows once H.264 is verified on hardware.
- Progressive frames only; field pictures are reported as ErrUnsupported rather than decoded wrongly.
non_goals:
- HEVC/AV1 on VA-API, encoding, display-order output, zero-copy (DMA-BUF) frames, Intel VPL, NVDEC.
acceptance:
  parser-matches-ffmpeg:
    text: Every SPS, PPS and slice-header syntax element the parser exposes equals ffmpeg's trace_headers
      output, and the computed slice_data() bit offset equals the end of ffmpeg's header trace, on streams
      covering CAVLC/CABAC, POC types 0 and 2, B-pyramids, 16 references, weighted prediction, explicit
      scaling matrices, multiple slices, reference list modification and MMCO.
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - parser-oracle-test
  dpb-matches-ffmpeg:
    text: After every reference picture the set of short- and long-term references (frame_num, LongTermFrameIdx)
      equals ffmpeg's -debug mmco log, and every picture's POC equals ffmpeg's -debug pict value up to
      ffmpeg's constant offset.
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - dpb-oracle-test
  va-struct-layout:
    text: Go mirrors of VAPictureParameterBufferH264, VASliceParameterBufferH264, VAIQMatrixBufferH264,
      VAImage, VASurfaceAttrib and friends have the sizes and field offsets measured with a C compiler
      against the libva headers.
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - layout-test
  graceful-without-hardware:
    text: Without libva, or without a usable render node, Probe returns an empty list and NewDecoder returns
      ErrUnsupported; nothing is printed to stderr and nothing crashes.
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - container-smoke-test
  decode-reference-linux:
    text: On a Linux machine with a VA-API driver, TestDecodeH264MatchesReference, the B-frame set test,
      the SPS-change test and the flush/seek test pass (per-frame NV12 checksums equal ffmpeg's software
      decoder).
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - hardware-conformance
  cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-vaapi-decode
    verified_by:
    - cross-build-check
