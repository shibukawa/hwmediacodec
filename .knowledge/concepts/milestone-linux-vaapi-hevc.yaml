facts:
  steps:
  - internal/hevc - full parsers (profile_tier_level, SPS incl. scaling lists, short- and long-term
    reference picture sets, VUI, HRD skipped, range extension; PPS incl. tiles and range extension;
    slice segment header incl. dependent segments, list modification, prediction weights, entry
    points), ParameterSets, DPB (POC 8.3.1, reference picture set 8.3.2, lists 8.3.4, RASL skipping,
    stand-ins for missing references), writers for VPS/SPS/PPS/slice segment headers. The earlier
    lightweight parsers became ParseSPSHead/ParsePPSHead/ParseSliceHead and still serve the reorder
    tracker.
  - internal/vaapi/sys - Go mirrors of VAPictureHEVC, the HEVC decode and encode parameter buffers and
    the HEVC capability attribute words, with layout and bit-field tests.
  - internal/vaapi - hevcdec.go (access unit handling), hevcfill.go (parameter buffers, platform
    independent), hevcenc.go and hevcparams.go (encoder; the libva-free part is platform independent),
    shared decoder/encoder plumbing generalised for a second codec.
  - Conformance tests widened to both codecs (parameter set change, flush, transcode) and two HEVC
    tests added (coding tools, open GOP); all validated on VideoToolbox.
  - A fake VA driver (C) plus a libdrm shim and a script that runs the backend through libva in a
    container.
  design:
    reference_frames_order: ReferenceFrames lists the DPB in reference picture set order (StCurrBefore,
      StCurrAfter, LtCurr, then pictures kept for later), so a driver that rebuilds the sets from the
      flags (Mesa) sees them in the order of the specification; ffmpeg lists DPB slot order.
    slice_offsets: slice_data_byte_offset counts unescaped bytes from the NAL header (as ffmpeg and
      GStreamer do) and slice_data_num_emu_prevn_bytes carries the emulation prevention bytes of the
      header (as GStreamer does; ffmpeg leaves it 0). st_rps_bits is the size of a set coded in the
      slice header, which AMD's firmware needs to skip it.
    scaling_lists: kept in coded (up-right diagonal) order end to end, which is what VAIQMatrixBufferHEVC
      wants; no scan tables are needed.
    encoder_structure: IDR and P pictures, one reference; one short-term reference picture set {-1}
      in the SPS selected by short_term_ref_pic_set_sps_flag (the structure Mesa's own VCN header writer
      uses); 12-bit POC lsb; coding tree block size, minimum coding block and coding tools from VAConfigAttribEncHEVCBlockSizes
      and VAConfigAttribEncHEVCFeatures (AMP and SAO when offered, tools a driver marks as required),
      else ffmpeg's guess of 32x32 / 16x16; VPS+SPS+PPS as one packed sequence header and the slice
      header as a packed slice header where the driver accepts them.
    output_check: on the first keyframe the SPS in the coded data is parsed; a driver-written SPS whose
      conformance window is not the requested size is an error.
  oracle_recipes:
    headers: ffmpeg -f hevc -i x.hevc -c copy -bsf:v trace_headers -f null - (positions count from the
      NAL header, after emulation prevention removal; the trace ends with the byte_alignment() bits).
    reference_lists: x265 --csv f.csv --csv-log-level 1 writes "List 0" / "List 1" columns with the POCs
      of each frame's lists in encode order; POC restarts at IDR pictures.
    sps_reference_sets: x265 two-pass with --multi-pass-opt-rps moves the sets into the SPS (short_term_ref_pic_set_idx);
      it never uses inter RPS prediction.
    weights: a fade (ffmpeg fade filter on testsrc2) makes x265 code luma and chroma weights.
  learned:
  - A fake VA driver is cheap (about 1,400 lines of C) and turns "never executed" backend code
    into code that ran through libva. libva loads any driver named by LIBVA_DRIVER_NAME; vaGetDisplayDRM
    only needs drmGetNodeTypeFromFd to accept the descriptor, which an LD_PRELOAD shim provides (the
    purego binary is dynamically linked even with CGO_ENABLED=0).
  - os.Setenv in a cgo-free binary does not reach C getenv, so the driver's personality is chosen
    by the process environment, one test run per personality.
  - Docker Desktop bind mounts can serve a stale file length right after an edit on the host; rerun
    before believing a compile error at "end of input".
  - Debian trixie's libx265 4.1 writes corrupt streams (or crashes) with slices > 1; it produced
    slice segments without slice data, which the decoder now rejects as ErrInvalidData.
  - VA_PICTURE_H264_NON_EXISTING (0x20), which the H.264 path sets for frame_num gap frames, is not
    defined by libva 2.22; drivers ignore the bit.
  - libva can succeed in vaInitialize after reporting an error through the message callback; the
    message is dropped so that it is not attached to the first real failure.
  next_candidates:
  - Run the H.264 and HEVC conformance tests on the author's AMD machine (HWMEDIACODEC_BACKENDS=vaapi
    go test -count=1 -v .) and record vendor string, Mesa version and results here.
  - B-frames in the VA-API encoders; generalised-B for Intel HEVC encoders without P-frames.
  - Main 10 (P010 surfaces) decode once a 10-bit frame format exists in the public API.
  - Frame-rate detection from the HEVC VUI, now that it is parsed.
