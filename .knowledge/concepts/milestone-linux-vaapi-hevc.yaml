history:
  requested-2026-10-09:
    summary: Author asked for "Linux AMD support" again after H.264 had merged; HEVC on VA-API, the
      documented next VA-API step, was taken as the slice (stated assumption).
  implemented-2026-10-09:
    summary: HEVC decode and encode code complete; parser, DPB, VA buffers and encoder headers verified
      against ffmpeg and x265 on the host; the backend run end to end through libva against the fake
      driver; hardware conformance pending.
