id: milestone:linux-vaapi-hevc
type: milestone
title: Linux AMD - HEVC decode and encode via VA-API with a Go parser, reference picture sets and header writer
summary: 'Linux AMD slice, requested by the author on 2026-10-09 ("Linux AMD support", after H.264 had
  shipped): HEVC on the VA-API backend, both directions. The slice-level bookkeeping HEVC needs
  (VPS/SPS/PPS and slice segment headers, picture order count, reference picture sets, reference
  lists) is implemented in Go and checked against ffmpeg and x265; the backend itself was run end to
  end through libva against a checking fake driver. Built on a Mac; AMD hardware is the open step.'
lifecycle: active
authority: authored
scope:
  platform: linux
  gpu:
  - amd
  - intel
  milestone: linux-vaapi-hevc
constraints:
- CGO_ENABLED=0; libva through purego; no new module dependencies.
- Same public API and Send/Receive/Flush contract as the H.264 path; frames reach the caller in display
  order through the existing reorder layer.
- 8-bit 4:2:0 (HEVC Main) only; everything else is reported as ErrUnsupported, never decoded wrongly.
- The reorder layer of the other backends keeps using head-only parsers (ParseSPSHead, ParsePPSHead,
  ParseSliceHead) so that a stream this package does not fully model cannot break reordering there.
non_goals:
- Main 10 / P010 surfaces, range extensions, screen content coding, multilayer streams.
- B-frames in the encoder, generalised-B for Intel encoders without P-frames (ErrUnsupported; the VPL
  backend serves those GPUs), tiles or several slices in the encoder.
- VASubsetsParameterBufferHEVC (entry point subsets), zero-copy frames, AV1.
acceptance:
  hevc-parser-matches-ffmpeg:
    text: Every SPS, PPS and slice segment header syntax element the parser exposes equals ffmpeg's
      trace_headers output, and the computed start of slice_segment_data() equals the end of ffmpeg's
      header trace, on x265 streams covering B-pyramids, several references, weighted prediction with
      real weights, default scaling lists, several slices, wavefront entry points, open GOPs, HRD
      parameters, temporal sub-layers, a conformance window, 10-bit and field coding, and on two-pass
      streams whose reference picture sets live in the SPS.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - hevc-parser-oracle
  hevc-reference-lists-match-x265:
    text: The picture order count and both reference picture lists of every picture equal what the
      x265 encoder reports it used, no picture misses a reference, the DPB never holds more than
      sps_max_dec_pic_buffering_minus1 references, and decoding from a CRA picture skips exactly its
      RASL pictures.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - hevc-dpb-oracle
  hevc-va-buffers:
    text: The VAPictureParameterBufferHEVC, VASliceParameterBufferHEVC and VAIQMatrixBufferHEVC built
      for x265 streams agree with x265 (reference frames resolve to the lists it used) and ffmpeg
      (slice_data_byte_offset, st_rps_bits, flags, prediction weights), and the Go mirrors of the VA
      HEVC structures have the sizes, offsets and bit-field positions measured with gcc.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - hevc-va-buffer-test
    - hevc-layout-test
  hevc-encoder-headers:
    text: The VPS, SPS, PPS and slice segment headers the encoder writes parse back identically, are
      accepted element by element by ffmpeg's trace_headers, are seen by ffprobe as the requested
      profile, level, size and frame rate, and drive a decoder-side DPB so that every P picture
      references exactly the picture before it, across the wrap of the picture order count.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - hevc-writer-test
    - hevc-encoder-header-test
  backend-runs-through-libva:
    text: Without a GPU, the vaapi backend decodes and encodes H.264 and HEVC end to end through the real
      libva against a driver that checks every buffer through the libva C headers; frames come back
      cropped and in display order from the surface each picture was decoded into.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - fake-driver-test
  hevc-conformance-linux:
    text: On a Linux machine with a VA-API driver, the HEVC decode tests (reference, B-frames, coding
      tools, open GOP, parameter set change, flush) match ffmpeg's software decoder frame for frame and
      the HEVC encode tests (PSNR, keyframes, rate control, profile, flush, transcode) pass.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - hevc-hardware-decode
    - hevc-hardware-encode
  cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets.
    scope:
      milestone: linux-vaapi-hevc
    verified_by:
    - cross-build-check
