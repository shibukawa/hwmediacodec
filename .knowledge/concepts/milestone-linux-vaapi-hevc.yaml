id: milestone:linux-vaapi-hevc
type: milestone
title: Linux AMD - HEVC decode and encode via VA-API with a Go parser, reference picture sets and header
  writer
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:vaapi, component:bitstream, component:display-order (keys prefixed vahevc-). Original
  summary: Linux AMD slice, requested by the author on 2026-10-09 ("Linux AMD support", after H.264 had
  shipped): HEVC on the VA-API backend, both directions. The slice-level bookkeeping HEVC needs (VPS/SPS/PPS
  and slice segment headers, picture order count, reference picture sets, reference lists) is implemented
  in Go and checked against ffmpeg and x265; the backend itself was run end to end through libva against
  a checking fake driver. Built on a Mac; AMD hardware is the open step.'
lifecycle: superseded
authority: authored
scope:
  platform: linux
  gpu:
  - amd
  - intel
  milestone: linux-vaapi-hevc
non_goals:
- Main 10 / P010 surfaces, range extensions, screen content coding, multilayer streams.
- B-frames in the encoder, generalised-B for Intel encoders without P-frames (ErrUnsupported; the VPL
  backend serves those GPUs), tiles or several slices in the encoder.
- VASubsetsParameterBufferHEVC (entry point subsets), zero-copy frames, AV1.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:vaapi
- relation: follows
  to: milestone:linux-vaapi-h264-decode
- relation: tests_decision
  to: decision:ffi-strategy
- relation: superseded_by
  to: backend:vaapi
- relation: superseded_by
  to: component:bitstream
- relation: superseded_by
  to: component:display-order
history:
  requested-2026-10-09:
    summary: Author asked for "Linux AMD support" again after H.264 had merged; HEVC on VA-API, the documented
      next VA-API step, was taken as the slice (stated assumption).
  implemented-2026-10-09:
    summary: HEVC decode and encode code complete; parser, DPB, VA buffers and encoder headers verified
      against ffmpeg and x265 on the host; the backend run end to end through libva against the fake driver;
      hardware conformance pending.
  superseded-2026-10-16:
    summary: Folded into backend:vaapi, component:bitstream, component:display-order on 2026-10-16 so
      that the current state of each backend and package is read from one concept; this file keeps the
      slice's definition and timeline.
