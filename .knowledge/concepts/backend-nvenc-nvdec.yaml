facts:
  libraries:
    linux:
    - libnvidia-encode.so.1
    - libnvcuvid.so.1
    - libcuda.so.1
    windows:
    - nvEncodeAPI64.dll
    - nvcuvid.dll
    - nvcuda.dll
  headers_licence: The SDK headers are redistributed under a permissive licence as FFmpeg's nv-codec-headers;
    the runtime is the proprietary driver.
  api_model: NVDEC is a full decoder (cuvidCreateVideoParser + cuvidCreateDecoder); NVENC is a session
    API taking CUDA or D3D11 input buffers.
  key_calls:
    decode:
    - cuInit
    - cuCtxCreate
    - cuvidCreateVideoParser
    - cuvidParseVideoData
    - cuvidCreateDecoder
    - cuvidDecodePicture
    - cuvidMapVideoFrame
    - cuMemcpy2D
    encode:
    - NvEncodeAPICreateInstance
    - nvEncOpenEncodeSessionEx
    - nvEncInitializeEncoder
    - nvEncCreateInputBuffer
    - nvEncEncodePicture
    - nvEncLockBitstream
  ffi_notes:
  - Designed for dlopen/LoadLibrary (FFmpeg loads them that way); purego/syscall fit well.
  - Requires a CUDA driver context; output frames are in device memory and need cuMemcpy2D to reach Go
    memory.
  - Function tables are versioned structs (NV_ENCODE_API_FUNCTION_LIST); layout must match the SDK version.
  why_it_matters: Only path to NVIDIA hardware on Linux without third-party VA-API shims; also usable
    on Windows where Media Foundation lacks a vendor MFT.
  session_limit: GeForce (non-qualified) GPUs are capped at 8 concurrent NVENC sessions per system with
    recent drivers (Windows 551.76+ / Linux 550.54.14+); older drivers cap at 5 or 3. Professional GPUs
    are limited by hardware only. Probe() should surface this.
  codec_support_by_generation:
    note: Inferred; confirm with cuvidGetDecoderCaps / nvEncGetEncodeCaps.
    decode:
      h264: Kepler and newer
      hevc: Maxwell GM206 and newer
      vp9: Maxwell GM206 (8-bit) / Pascal and newer
      av1: Ampere (RTX 30) and newer
    encode:
      h264: Kepler and newer
      hevc: Maxwell GM206 and newer
      av1: Ada (RTX 40) and newer
  evidence:
  - url: https://docs.nvidia.com/video-technologies/video-codec-sdk/13.0/nvenc-application-note/index.html
    claim: Non-qualified GPUs are limited to 8 concurrent encode sessions per system.
  support_tier: tier1 (Linux and Windows NVIDIA)
  implementation:
    package: internal/nvidia (backend.go, device.go, decoder.go, encoder.go) over internal/nvidia/sys
      (purego loaders per library, SDK 11.1 struct mirrors checked by layout_test.go against clang
      offsetof output for linux/amd64 and linux/arm64).
    sdk_version: Video Codec SDK 11.1 headers (nv-codec-headers n11.1.5.3); NVENC API 11.1 is the floor
      the driver must report (470.57+), struct version tags are computed in Go from NVENCAPI_VERSION.
    device: cuInit once per process; device ordinal from HWMEDIACODEC_NVIDIA_DEVICE (default 0);
      cuDevicePrimaryCtxRetain per decoder/encoder; every driver call sequence runs on a locked OS thread
      between cuCtxPushCurrent and cuCtxPopCurrent.
    decoder: cuvidCreateVideoParser (ulMaxNumDecodeSurfaces 1, error threshold 100, display delay 0)
      with purego callbacks created once and dispatched by user-data key; access units are fed with
      CUVID_PKT_ENDOFPICTURE; the sequence callback checks cuvidGetDecoderCaps limits and creates
      cuvidCreateDecoder (coded size, NV12, Weave, PreferCUVID, min_num_decode_surfaces + 2 surfaces,
      one output surface); the decode callback rejects field pictures, calls cuvidDecodePicture, maps
      the picture with cuvidMapVideoFrame64 and copies the display area with cuMemcpy2D (chroma at
      pitch * coded height) into pooled NV12 buffers; a Go keyframe gate feeds only parameter sets until
      an IDR/IRAP; Flush sends CUVID_PKT_ENDOFSTREAM and destroys the parser, the decoder is reused.
    encoder: nvEncOpenEncodeSessionEx on the primary context; nvEncGetEncodeGUIDs for codec support;
      nvEncGetEncodeCaps for size limits and max B-frames; nvEncGetEncodePresetConfigEx(P4, HIGH_QUALITY
      or LOW_LATENCY); NV_ENC_CONFIG adjusted for profile GUID, gopLength/idrPeriod, frameIntervalP,
      rcParams (CONSTQP from WithQuality or 26 by default, VBR with 2x peak, CBR), repeatSPSPPS,
      chromaFormatIDC 1, CAVLC for Baseline, BT.601 VUI tag for RGB input; nvEncInitializeEncoder with
      enablePTD; input buffers (NV12, ABGR for RGBA, ARGB for BGRA) and bitstream buffers created on
      demand, filled via nvEncLockInputBuffer; nvEncEncodePicture with FORCEIDR|OUTPUT_SPSPPS for forced
      keyframes; on NV_ENC_SUCCESS every in-flight bitstream is locked in order; EOS picture on Flush.
    output_contract: decode order NV12 frames with the packet's PTS and reorder key; Annex-B packets
      with Keyframe from the NAL types, SPS/PPS (and VPS) prepended from nvEncGetSequenceParams when
      missing, DTS = input PTS of the k-th frame minus bframes * frame duration.
    limitations:
    - 8-bit 4:2:0 progressive only; NV12 output only (no RGBA/BGRA decode); no AV1.
    - Synchronous per-picture decode and host copy inside Send.
    - Parameter sets are not cached across Flush; the next IDR must carry SPS/PPS in band (the usual
      case for streams the library's own encoders and ffmpeg produce).
    - Linux only; the Windows DLL loader is not written yet.
  host_verification_2026-10-09:
    layouts: 482 sizes/offsets equal the C compiler's values for both Linux targets; version tags equal
      the header macros.
    symbols: all entry points bind against libcuda/libnvcuvid/libnvidia-encode 535.309.01 in a Debian
      container (NVENC API 12.1 reported); without the libraries Probe returns an empty list.
    pending: decode and encode conformance on real NVIDIA hardware (see milestone:linux-nvidia-h264-hevc).
