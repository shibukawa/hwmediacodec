acceptance:
  nvlinux-nv-struct-layout:
    text: Go mirrors of CUDA_MEMCPY2D, CUVIDEOFORMAT, CUVIDPARSERPARAMS, CUVIDDECODECAPS, CUVIDDECODECREATEINFO,
      CUVIDPICPARAMS, CUVIDPROCPARAMS, NV_ENC_CONFIG (with the H.264/HEVC and rate-control members), NV_ENC_INITIALIZE_PARAMS,
      NV_ENC_PRESET_CONFIG, NV_ENC_PIC_PARAMS, NV_ENC_LOCK_BITSTREAM, NV_ENC_LOCK_INPUT_BUFFER, NV_ENC_SEQUENCE_PARAM_PAYLOAD,
      NV_ENC_OPEN_ENCODE_SESSION_EX_PARAMS and NV_ENCODE_API_FUNCTION_LIST have the sizes and field offsets
      a C compiler measures for linux/amd64 and linux/arm64, and the struct version tags computed in Go
      equal the header macros. (The expectations for the two structs with unsigned long fields live in
      layout_lp64_test.go since milestone:windows-nvidia-nvdec-nvenc.)
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-layout-test
  nvlinux-symbols-bind:
    text: Every libcuda, libnvcuvid and libnvidia-encode entry point the backend uses binds against a
      real driver build, NvEncodeAPIGetMaxSupportedVersion reports at least 11.1 and NvEncodeAPICreateInstance
      fills the function table.
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-symbol-binding-container
  nvlinux-graceful-without-hardware:
    text: Without the driver libraries, or with them but without a GPU, Probe returns an empty list and
      NewDecoder/NewEncoder return ErrUnsupported; nothing crashes and nothing is printed.
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-container-smoke-test
    - nvlinux-symbol-binding-container
  nvlinux-decode-reference-linux:
    text: On a Linux machine with an NVIDIA GPU, TestDecodeMatchesReference/h264-bf0, TestDecodeMatchesReference/hevc-bf0,
      the B-frame display-order tests, TestDecodeOrderOption, TestDecodeParameterSetChange and TestFlushResumesAtKeyframe
      pass (per-frame NV12 checksums equal ffmpeg's software decoder).
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-hardware-decode
  nvlinux-encode-reference-linux:
    text: On the same machine the encode conformance tests (PSNR against the source, keyframe interval,
      forced keyframes, B-frames with monotonic DTS, CBR/VBR sizes, quality ordering, low latency, profiles,
      flush/reuse, RGBA/BGRA input tagged BT.601) and the transcode round trip pass.
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-hardware-encode
  nvlinux-cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-cross-build-check
  nvlinux-host-suite-unaffected:
    text: The full macOS test suite still passes with the backend wired in; the test changes (the Linux
      probe list accepts the nvidia backend, the RGB encode test accepts a BT.601 colour matrix next to
      BT.709) keep the VideoToolbox expectations.
    scope:
      milestone: linux-nvidia
      platform: linux
      gpu: nvidia
    verified_by:
    - nvlinux-host-suite
  nvwin-windows-struct-layout:
    text: Every struct the backend exchanges with the driver has, for windows/amd64, the size and field
      offsets a Windows C compiler measures. Only CUVIDSOURCEDATAPACKET and CUVIDDECODECREATEINFO differ
      from Linux (their unsigned long fields are 32 bits wide); those two are asserted at compile time,
      the others are covered by the shared layout test.
    scope:
      milestone: windows-nvidia
      platform: windows
      gpu: nvidia
    verified_by:
    - nvwin-windows-layout-oracle
  nvwin-windows-loader:
    text: On a Windows machine with the NVIDIA driver every nvcuda.dll, nvcuvid.dll and nvEncodeAPI64.dll
      entry point the backend uses binds, NvEncodeAPIGetMaxSupportedVersion reports at least 11.1 and
      Probe lists nvidia capabilities ahead of mediafoundation ones. Without the driver Probe lists only
      mediafoundation capabilities and nothing fails.
    scope:
      milestone: windows-nvidia
      platform: windows
      gpu: nvidia
    verified_by:
    - nvwin-windows-loader-run
  nvwin-decode-reference-windows-nvidia:
    text: On a Windows machine with an NVIDIA GPU the decode conformance tests pass on the nvidia backend
      (per-frame NV12 checksums equal ffmpeg's software decoder, B-frame display order, TestDecodeOrderOption
      now running instead of skipping, parameter-set change, flush and resume).
    scope:
      milestone: windows-nvidia
      platform: windows
      gpu: nvidia
    verified_by:
    - nvwin-hardware-decode-windows
  nvwin-encode-reference-windows-nvidia:
    text: On the same machine the encode conformance tests and the transcode round trip pass on the nvidia
      backend, including RGBA/BGRA input and B-frames, which the Media Foundation backend does not offer.
    scope:
      milestone: windows-nvidia
      platform: windows
      gpu: nvidia
    verified_by:
