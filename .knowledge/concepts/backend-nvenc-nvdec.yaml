id: backend:nvenc-nvdec
type: backend
title: NVIDIA Video Codec SDK (NVENC / NVDEC)
summary: NVIDIA's proprietary encoder (NVENC) and decoder (NVDEC/cuvid) APIs, available on Linux and Windows
  through runtime-loaded driver libraries. NVDEC includes its own bitstream parser, so it behaves like
  a full decoder.
lifecycle: active
authority: inferred
aliases:
- NVENC
- NVDEC
- cuvid
- nvEncodeAPI
- Video Codec SDK
- evenc
scope:
  platform:
  - linux
  - windows
  gpu: nvidia
constraints:
- CGO_ENABLED=0; libcuda.so.1, libnvcuvid.so.1 and libnvidia-encode.so.1 are dlopened with purego and
  no module dependency is added. The structs mirror Video Codec SDK 11.1 (FFmpeg nv-codec-headers n11.1.5.3),
  the floor supported by driver 470.57 and newer; newer drivers accept the older struct version tags.
- Same public API and Send/Receive/Flush contract as the other backends; frames in decode order (the reorder
  layer provides display order), NV12 in CPU memory, 8-bit 4:2:0 progressive only.
- CUDA contexts are per thread and goroutines migrate, so every sequence of driver, NVDEC or NVENC calls
  runs on a locked OS thread between cuCtxPushCurrent and cuCtxPopCurrent of the device's primary context,
  which is retained per decoder or encoder and shared with other CUDA users of the process.
- Registered before the VA-API backend in backends_linux.go, so a discrete NVIDIA GPU wins over an integrated
  GPU's VA-API driver and HEVC is available on Linux.
- CGO_ENABLED=0. The three driver DLLs are loaded with LoadLibraryEx(LOAD_LIBRARY_SEARCH_SYSTEM32) through
  golang.org/x/sys/windows, so a DLL of the same name next to the executable is never used; entry points
  are bound with purego.RegisterFunc (syscall.SyscallN underneath) and the parser callbacks with purego.NewCallback
  (syscall.NewCallback). No module dependency is added.
- One backend for both operating systems. Everything in internal/nvidia and the bindings in internal/nvidia/sys
  carry the build tag linux || (windows && amd64); only the library names, the loader (lib_linux.go, lib_windows.go)
  and the width of unsigned long (ulong_lp64.go, ulong_windows.go) differ.
- windows/amd64 only. NVIDIA ships no NVDEC/NVENC libraries for Windows on ARM, so windows/arm64 keeps
  Media Foundation alone (registerNVIDIA is a no-op there).
- Same struct version floor as Linux (Video Codec SDK 11.1); on Windows that is driver 471.41 or newer.
- Registered before Media Foundation in backends_windows.go, following policy:support-tiers (Windows NVIDIA
  primary = backend:nvenc-nvdec, alternative = backend:media-foundation). Media Foundation takes over
  when the nvidia backend reports ErrUnsupported.
