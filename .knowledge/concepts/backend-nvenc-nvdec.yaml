  nvwin-linux-unaffected:
    text: The loader refactor does not change the Linux backend - every symbol still binds against a real
      driver build and the no-driver path still yields an empty Probe result.
    scope:
      milestone: windows-nvidia
      platform: windows
      gpu: nvidia
