open_questions:
  nvwin-hardware-verification:
    text: Does the backend work on a Windows machine with an NVIDIA GPU? Nothing above the compile-time
      checks has run on Windows; the Linux hardware run is open as well, so the shared decoder and encoder
      logic is unverified on any GPU.
    state: open
    resolution: Run go test ./... on a Windows x64 machine with an NVIDIA driver and ffmpeg; record GPU,
      driver version and results in verification and flip the capability authority to observed.
    scope:
      platform: windows
      gpu: nvidia
  nvwin-backend-selection:
    text: Should the caller be able to choose the backend (an option, or an environment variable such
      as a backend list)? With the NVIDIA driver installed the nvidia backend always wins on Windows x64,
      so the Media Foundation path cannot be exercised on such a machine and a laptop with an integrated
      GPU always wakes the NVIDIA one.
    state: deferred
    resolution: Not needed for this slice's outcome. Revisit when the author tests Media Foundation on
      an NVIDIA machine, or when a user reports the discrete GPU being used unintentionally. The same
      question applies to nvidia versus vaapi on Linux.
    scope:
      platform: windows
      gpu: nvidia
  nvwin-wine-smoke-test:
    text: Would a Wine container run be worth adding - the windows/amd64 test binaries, and stub DLLs
      built with mingw from the SDK headers that check the arguments they receive?
    state: deferred
    resolution: It would exercise the Windows calling convention, the callbacks and the 32-bit unsigned
      long layout without hardware, but needs Wine packages that were not downloaded in this session.
      Revisit if the first hardware run fails in a way that is hard to diagnose remotely.
    scope:
      platform: windows
      gpu: nvidia
  av1lw-nvdec-display-callback:
    text: The NVDEC AV1 path assumes that the cuvid parser raises the display callback once per shown
      frame inside the cuvidParseVideoData call of its temporal unit (ulMaxDisplayDelay 0, CUVID_PKT_ENDOFPICTURE),
      passes the packet timestamp through, and that mapping the picture applies film grain. None of this
      is observed.
    state: open
    resolution: Run the AV1 tests on an RTX 30 or newer. If frames arrive one unit late the count per
      Send changes but PTS stay right (they travel through the parser); if CUVID_PKT_ENDOFPICTURE confuses
      units with hidden frames, drop the flag for AV1.
    scope:
      platform:
      - linux
      - windows
  av1lw-nvdec-frame-size-change:
    text: NVDEC frames are cropped with the display area of the sequence callback; whether the parser
      raises a new sequence callback when a frame changes size inside a sequence (reference scaling) is
      unknown.
    state: open
    resolution: Decode an aomenc --resize-mode=2 stream on NVIDIA hardware and compare frame sizes with
      dav1d.
    scope:
      platform:
      - linux
      - windows
facts:
  libraries:
    linux:
    - libnvidia-encode.so.1
    - libnvcuvid.so.1
    - libcuda.so.1
    windows:
    - nvEncodeAPI64.dll
    - nvcuvid.dll
    - nvcuda.dll
  headers_licence: The SDK headers are redistributed under a permissive licence as FFmpeg's nv-codec-headers;
    the runtime is the proprietary driver.
  api_model: NVDEC is a full decoder (cuvidCreateVideoParser + cuvidCreateDecoder); NVENC is a session
    API taking CUDA or D3D11 input buffers.
  key_calls:
    decode:
    - cuInit
    - cuCtxCreate
    - cuvidCreateVideoParser
    - cuvidParseVideoData
    - cuvidCreateDecoder
    - cuvidDecodePicture
    - cuvidMapVideoFrame
    - cuMemcpy2D
    encode:
    - NvEncodeAPICreateInstance
    - nvEncOpenEncodeSessionEx
    - nvEncInitializeEncoder
    - nvEncCreateInputBuffer
    - nvEncEncodePicture
    - nvEncLockBitstream
  ffi_notes:
  - Designed for dlopen/LoadLibrary (FFmpeg loads them that way); purego/syscall fit well.
  - Requires a CUDA driver context; output frames are in device memory and need cuMemcpy2D to reach Go
    memory.
  - Function tables are versioned structs (NV_ENCODE_API_FUNCTION_LIST); layout must match the SDK version.
  why_it_matters: Only path to NVIDIA hardware on Linux without third-party VA-API shims; also usable
    on Windows where Media Foundation lacks a vendor MFT.
  session_limit: GeForce (non-qualified) GPUs are capped at 8 concurrent NVENC sessions per system with
    recent drivers (Windows 551.76+ / Linux 550.54.14+); older drivers cap at 5 or 3. Professional GPUs
    are limited by hardware only. Probe() should surface this.
  codec_support_by_generation:
    note: Inferred; confirm with cuvidGetDecoderCaps / nvEncGetEncodeCaps.
    decode:
      h264: Kepler and newer
      hevc: Maxwell GM206 and newer
      vp9: Maxwell GM206 (8-bit) / Pascal and newer
      av1: Ampere (RTX 30) and newer
    encode:
      h264: Kepler and newer
      hevc: Maxwell GM206 and newer
      av1: Ada (RTX 40) and newer
  evidence:
  - url: https://docs.nvidia.com/video-technologies/video-codec-sdk/13.0/nvenc-application-note/index.html
    claim: Non-qualified GPUs are limited to 8 concurrent encode sessions per system.
  support_tier: tier1 (Linux and Windows NVIDIA)
  implementation:
    package: internal/nvidia (backend.go, device.go, decoder.go, encoder.go) over internal/nvidia/sys
      (purego bindings per library in cuda.go, cuvid.go and nvenc.go; the library names and the loader
      in lib_linux.go and lib_windows.go; SDK 11.1 struct mirrors checked by layout_test.go against C
      compiler output for linux/amd64, linux/arm64 and windows/amd64). Build tag linux || (windows &&
      amd64).
    platform_differences: Windows loads nvcuda.dll, nvcuvid.dll and nvEncodeAPI64.dll with LoadLibraryEx(LOAD_LIBRARY_SEARCH_SYSTEM32)
      and needs driver 471.41+; unsigned long is 32 bits there, which changes CUVIDSOURCEDATAPACKET (24
      bytes instead of 32) and CUVIDDECODECREATEINFO (112 instead of 176) and nothing else - sys.ULong
      carries the difference. The NVENC structs, the symbol names, the CUDA device type and the synchronous
      encode mode are the same on both. On Windows the backend is registered before Media Foundation (amd64
      only).
    sdk_version: Video Codec SDK 11.1 headers (nv-codec-headers n11.1.5.3); NVENC API 11.1 is the floor
      the driver must report (470.57+), struct version tags are computed in Go from NVENCAPI_VERSION.
    device: cuInit once per process; device ordinal from HWMEDIACODEC_NVIDIA_DEVICE (default 0); cuDevicePrimaryCtxRetain
      per decoder/encoder; every driver call sequence runs on a locked OS thread between cuCtxPushCurrent
      and cuCtxPopCurrent.
    decoder: cuvidCreateVideoParser (ulMaxNumDecodeSurfaces 1, error threshold 100, display delay 0) with
      purego callbacks created once and dispatched by user-data key; access units are fed with CUVID_PKT_ENDOFPICTURE;
      the sequence callback checks cuvidGetDecoderCaps limits and creates cuvidCreateDecoder (coded size,
      NV12, Weave, PreferCUVID, min_num_decode_surfaces + 2 surfaces, one output surface); the decode
      callback rejects field pictures, calls cuvidDecodePicture, maps the picture with cuvidMapVideoFrame64
      and copies the display area with cuMemcpy2D (chroma at pitch * coded height) into pooled NV12 buffers;
      a Go keyframe gate feeds only parameter sets until an IDR/IRAP; Flush sends CUVID_PKT_ENDOFSTREAM
      and destroys the parser, the decoder is reused.
    encoder: nvEncOpenEncodeSessionEx on the primary context; nvEncGetEncodeGUIDs for codec support; nvEncGetEncodeCaps
      for size limits and max B-frames; nvEncGetEncodePresetConfigEx(P4, HIGH_QUALITY or LOW_LATENCY);
      NV_ENC_CONFIG adjusted for profile GUID, gopLength/idrPeriod, frameIntervalP, rcParams (CONSTQP
      from WithQuality or 26 by default, VBR with 2x peak, CBR), repeatSPSPPS, chromaFormatIDC 1, CAVLC
      for Baseline, BT.601 VUI tag for RGB input; nvEncInitializeEncoder with enablePTD; input buffers
      (NV12, ABGR for RGBA, ARGB for BGRA) and bitstream buffers created on demand, filled via nvEncLockInputBuffer;
      nvEncEncodePicture with FORCEIDR|OUTPUT_SPSPPS for forced keyframes; on NV_ENC_SUCCESS every in-flight
      bitstream is locked in order; EOS picture on Flush.
    output_contract: decode order NV12 frames with the packet's PTS and reorder key; Annex-B packets with
      Keyframe from the NAL types, SPS/PPS (and VPS) prepended from nvEncGetSequenceParams when missing,
      DTS = input PTS of the k-th frame minus bframes * frame duration.
    limitations:
    - 8-bit 4:2:0 progressive only; NV12 output only (no RGBA/BGRA decode); AV1 is decoded only (8-bit
      Main profile).
    - Synchronous per-picture decode and host copy inside Send.
    - Parameter sets are not cached across Flush; the next IDR must carry SPS/PPS in band (the usual case
      for streams the library's own encoders and ffmpeg produce).
    - No Windows on ARM (NVIDIA ships no driver libraries for it); NVENC asynchronous mode and Direct3D
      11 interop on Windows are not used.
  host_verification_2026-10-09:
    layouts: 482 sizes/offsets equal the C compiler's values for both Linux targets; version tags equal
      the header macros.
    symbols: all entry points bind against libcuda/libnvcuvid/libnvidia-encode 535.309.01 in a Debian
      container (NVENC API 12.1 reported); without the libraries Probe returns an empty list.
    pending: decode and encode conformance on real NVIDIA hardware (see milestone:linux-nvidia-h264-hevc).
    windows: 478 sizes, offsets and constants measured with x86_64-w64-mingw32-gcc and clang's MSVC target;
      25 differ from Linux, all in the two unsigned long structs, and are asserted at compile time (see
      milestone:windows-nvidia-nvdec-nvenc). Nothing has run on Windows.
  milestone_notes:
    nvlinux:
      steps:
      - internal/nvidia/sys - constants, GUIDs and struct mirrors of the SDK 11.1 headers with the struct
        version tags computed in Go; one purego loader per library (LoadCUDA, LoadCuvid, LoadNVENC, the
        last one binding the NV_ENCODE_API_FUNCTION_LIST instance); layout and loader tests.
      - internal/nvidia/device.go - cuInit once, device by HWMEDIACODEC_NVIDIA_DEVICE ordinal, primary
        context retain/release, run() = LockOSThread + cuCtxPushCurrent/cuCtxPopCurrent, cuMemcpy2D helper.
      - internal/nvidia/decoder.go - cuvid parser with three purego callbacks created once and dispatched
        through a registry keyed by the user-data value; the sequence callback checks NVDEC caps and creates
        or recreates the decoder for the coded size (PreferCUVID, NV12, Weave, min_num_decode_surfaces
        + 2); the decode callback submits the picture, maps it and copies the display area with two cuMemcpy2D
        calls into pooled buffers tagged with the packet's PTS and reorder key; a keyframe gate in Go
        still feeds the parameter sets of skipped access units; Flush sends CUVID_PKT_ENDOFSTREAM and
        drops the parser so the next Send starts clean.
      - internal/nvidia/encoder.go - session on the primary context; codec GUID and caps checks (max/min
        size, max B-frames); P4 preset for HIGH_QUALITY or LOW_LATENCY tuning; GOP and IDR period; frameIntervalP
        1, or 3 with WithBFrames; rate control CONSTQP (quality, or 26 by default), VBR with 2x peak,
        or CBR; codec config with repeatSPSPPS, 4:2:0, CAVLC for Baseline and a BT.601 VUI tag for RGB
        input; input/bitstream buffer pairs created on demand and filled through nvEncLockInputBuffer;
        all in-flight pictures drained on NV_ENC_SUCCESS; DTS from the input PTS queue; SPS/PPS prepended
        from nvEncGetSequenceParams when a keyframe lacks them.
      - Root wiring (nvidia registered before vaapi), probe and RGB encode test adjustments, README status
        row and Linux notes.
      oracle_recipes:
        layout: a C program including dynlink_cuda.h, dynlink_nvcuvid.h and nvEncodeAPI.h prints sizeof
          and offsetof for every mirrored struct; the printed values become _Static_asserts compiled with
          clang -target x86_64-unknown-linux-gnu and -target aarch64-unknown-linux-gnu -fsyntax-only -ffreestanding
          (stub stdlib.h/stdio.h), then the Go layout test.
        symbols: docker build --platform linux/amd64 from debian:bookworm-slim with Components non-free
          and apt-get install libcuda1 libnvcuvid1 libnvidia-encode1, then run the CGO_ENABLED=0 linux/amd64
          test binaries; no kernel driver is needed for binding, cuInit then reports no device.
      design_choices:
      - The cuvid parser instead of the Go H.264 parser/DPB (internal/h264) - it gives HEVC immediately
        and keeps reference management in the driver, as ffmpeg's h264_cuvid does; the Go parser stays
        the VA-API path and the reorder tracker still derives POC for display order.
      - Synchronous host copy inside the decode callback - the parser recycles picture indexes on its
        own schedule, so copying at once is the only way to never read an overwritten surface without
        a second surface pool; throughput is bounded by per-picture decode latency.
      - SDK 11.1 as the struct version floor (driver 470+) rather than 12.x (520+ or 550+) so that the
        Debian 11 and Ubuntu 22.04 driver packages are covered.
      - NVIDIA registered before VA-API so that NVDEC/NVENC wins on mixed machines and so that nvidia-vaapi-driver
        (decode only) is never preferred over the native path.
    nvwin:
      steps:
      - internal/nvidia/sys - cuda_linux.go, cuvid_linux.go, nvenc_linux.go and sys_linux_test.go renamed
        to cuda.go, cuvid.go, nvenc.go and sys_test.go with the tag linux || (windows && amd64); the binder
        now calls openLibrary/lookup from lib_linux.go (purego.Dlopen/Dlsym) or lib_windows.go (windows.LoadLibraryEx
        with LOAD_LIBRARY_SEARCH_SYSTEM32, windows.GetProcAddress).
      - 'internal/nvidia/sys - type ULong: uint64 off Windows, uint32 on Windows, used for the tcu_ulong
        fields of CUVIDSOURCEDATAPACKET and CUVIDDECODECREATEINFO and for the cudaVideoCreateFlags and
        CUvideopacketflags constants; layout_windows.go asserts the Windows layout of both structs at
        compile time and the layout test takes its expectations for them per ABI (layout_lp64_test.go,
        layout_windows_test.go).'
      - internal/nvidia - build tags widened, sys.ULong conversions in decoder.go; no behavioural change.
      - Root wiring - backends_windows.go calls registerNVIDIA() before registering Media Foundation;
        backends_windows_amd64.go registers the backend and backends_windows_arm64.go is a no-op, so the
        order does not depend on file init order.
      - Tests - the Windows probe expectations accept the nvidia backend on amd64; TestDecodeOrderOption
        skips when the serving backend is mediafoundation instead of on every Windows machine.
      - README (status row, "Windows (NVDEC / NVENC)" notes), package documentation, ebitenvideo/go.sum.
      oracle_recipes:
        layout: scratch table.c generated from the Linux slice's layout.c (every sizeof/offsetof/constant
          as an element of a const unsigned long long array), compiled to assembly with x86_64-w64-mingw32-gcc
          -S and with clang --target=x86_64-pc-windows-msvc -ffreestanding -S (stub windows.h with GUID
          and RECT), the .quad values paired with the names and diffed against the Linux values.
      design_choices:
      - Share internal/nvidia with Linux rather than write a Windows-specific backend - the SDK is the
        same on both systems and the only ABI differences are the loader and unsigned long; a second backend
        would duplicate about 1500 lines of decoder and encoder logic.
      - A defined type (ULong) rather than an alias, so that a plain uint64 conversion at a call site
        fails to compile on every platform, not only in the Windows cross-build.
      - purego.RegisterFunc on Windows too (it supports amd64 there, including struct arguments), so the
        function variables and the NVENC function table are bound by one piece of code.
      - CUDA device type and synchronous NVENC on Windows, as on Linux; Direct3D 11 interop and the asynchronous
        mode would only pay off with GPU-side frames, which the API does not expose yet.
    av1lw:
      implementation:
        nvidia: cuvidCodec maps AV1 to cudaVideoCodec_AV1; sendAV1 gates on the key frame and prepends
          the stored sequence header OBU; the decode callback only submits, the display callback copies
          the picture with the timestamp the parser passes through (CUVID_PKT_TIMESTAMP is set for AV1
          only).
  learned:
  - The NVDEC and NVENC headers can be validated without a GPU - a C program for sizes and offsets plus
    cross-target static assertions, and a Debian container with the non-free user-space libraries for
    symbol binding.
  - purego passes 16-byte structs by value on linux/amd64 and linux/arm64, which the NVENC calls that
    take a GUID need; purego callbacks are limited in number, so parser callbacks are created once per
    process and dispatched by key.
  - NVENC converts RGB input with the BT.601 matrix (ffmpeg tags such streams BT.470BG), unlike VideoToolbox
    which uses BT.709, so the RGB encode test accepts either tag and relies on the PSNR check against
    the reference decode with the declared matrix.
  - The NVENC half of the SDK is LLP64-clean (fixed-width integers and pointers only); the cuvid half
    uses unsigned long in exactly two structures the backend touches.
  - mingw-w64 gcc and clang's MSVC target agree on every measured value, including the NVENC bit-field
    structs, so either is a sufficient oracle from a Mac.
  - purego v0.11.1 passes structs under the Win64 ABI (1, 2, 4 and 8 byte aggregates by value, larger
    ones by pointer to a copy) and falls back to syscall.NewCallback for callbacks, which accepts pointer-sized
    arguments only - the parser callbacks already had that shape.
  - The ebitenvideo module could not be built for Windows since the Media Foundation slice because its
    go.sum lacked the golang.org/x/sys v0.48.0 hash; go mod tidy fixed it.
  next_candidates:
  - Run the decode and encode conformance tests on an NVIDIA Linux machine; record driver version, GPU
    and fps here and flip the verification states.
  - Cache the parameter-set NAL units in Go and replay them into the fresh parser after Flush, so that
    seeking to an IDR without in-band SPS/PPS works as on VA-API.
  - Linux-only unit tests for configureGOP, configureRateControl, configureCodec and packet (runnable
    in the container without a GPU).
  - Asynchronous decode (keep pictures on the device until Receive) with a second surface pool, pinned
    host memory for the copy, and RGBA output through a Go NV12-to-RGBA converter or a CUDA kernel.
  - Run the sys tests and the conformance suite on Windows x64 with an NVIDIA GPU and record the result.
  - Backend selection (option or environment variable) for machines with more than one usable backend.
  - The Linux slice's follow-ups apply here unchanged (parameter-set cache across Flush, unit tests for
    the encoder configure functions, RGBA decode output).
  known_risks:
  - Everything above the compile-time checks is unverified on Windows; see open_questions.hardware-verification.
  - On a laptop with an integrated GPU and an NVIDIA one the NVIDIA GPU is used whenever its driver is
    installed; see open_questions.backend-selection.
