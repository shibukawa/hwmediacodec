id: milestone:examples-texture
type: milestone
title: Examples - video as a texture in Ebitengine (cube, Kage shader) and MP4 input for ebitenvideo
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:examples, component:mediacontainer (keys prefixed extex-). Original summary: Third
  usage-sample slice: examples/texture plays a video through ebitenvideo and draws the player image flat,
  on the faces of a spinning cube with DrawTriangles (8x8 subdivided faces, winding culling, vertex-colour
  lighting) and through a Kage shader (barrel distortion, ripple, scanlines, vignette). MP4 files are
  played directly: container.VideoTrack.ElementaryStream() exposes the track as a rewindable Annex-B io.ReadSeeker
  and FrameRate() supplies the frame rate, so ebitenvideo needs no change.'
lifecycle: superseded
authority: authored
aliases:
- texture sample
- video on a cube
- テクスチャ動画再生
- MP4 直読み
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-texture
non_goals:
- Seeking inside the video, audio, several simultaneous videos (one player per video works but is not
  demonstrated), perspective-correct interpolation inside a triangle.
