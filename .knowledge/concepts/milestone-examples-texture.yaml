id: milestone:examples-texture
type: milestone
title: Examples - video as a texture in Ebitengine (cube, Kage shader) and MP4 input for ebitenvideo
summary: 'Third usage-sample slice: examples/texture plays a video through ebitenvideo and draws the
  player image flat, on the faces of a spinning cube with DrawTriangles (8x8 subdivided faces, winding
  culling, vertex-colour lighting) and through a Kage shader (barrel distortion, ripple, scanlines,
  vignette). MP4 files are played directly: container.VideoTrack.ElementaryStream() exposes the track
  as a rewindable Annex-B io.ReadSeeker and FrameRate() supplies the frame rate, so ebitenvideo needs
  no change.'
lifecycle: active
authority: authored
aliases:
- texture sample
- video on a cube
- テクスチャ動画再生
- MP4 直読み
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-texture
constraints:
- 'The player image is a plain *ebiten.Image updated in place, so no ebitenvideo API change was needed:
  DrawImage, DrawTriangles (as the texture) and DrawRectShader (Images[0]) all take it as is.'
- 'Ebitengine DrawTriangles interpolates texture coordinates affinely; each cube face is split into an
  8x8 grid whose corners are projected individually so that the perspective error stays invisible.'
- 'Back faces are culled by the projected winding (corners listed counter-clockwise from outside give
  a positive cross product on screen with y down when facing the camera); the first attempt had the sign
  inverted and showed five faces head-on, which the mesh unit test caught.'
- 'DrawRectShader requires the destination rectangle and Images[0] to have the same size, so the shader
  is drawn at video size and scaled with GeoM; scanlines are keyed to dstPos.y so they do not alias with
  the video resolution.'
- 'ElementaryStream supports only Seek(0, io.SeekStart) (ebitenvideo loops by rewinding); other seeks
  return an error.'
non_goals:
- Seeking inside the video, audio, several simultaneous videos (one player per video works but is not
  demonstrated), perspective-correct interpolation inside a triangle.
acceptance:
  elementary-stream:
    text: ElementaryStream yields exactly the concatenation of AccessUnit(i), annexb.Reader splits it back
      into the same access units after a rewind, and seeking elsewhere fails.
    scope:
      milestone: examples-texture
    verified_by:
    - stream-test
  cube-mesh:
    text: Head-on only the front face is emitted (25 vertices, 96 indices for 4x4 cells) with texture
      coordinates spanning the texture once and a centred square projection; 45 degrees shows two faces,
      tilted three; all indices are in range.
    scope:
      milestone: examples-texture
    verified_by:
    - mesh-test
  renders:
    text: The app plays an HEVC MP4 at 1280x720 and, recorded through screencast for 13 s, shows the
      flat video, the lit cube with the video on three visible faces, and the shader effect in frames
      extracted at 2 s, 6 s and 10 s.
    scope:
      milestone: examples-texture
    verified_by:
    - texture-run
