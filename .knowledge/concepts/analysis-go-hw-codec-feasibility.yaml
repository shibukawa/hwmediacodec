id: analysis:go-hw-codec-feasibility
type: analysis
title: Feasibility - is it hard to use OS/driver video engines from Go?
summary: >-
  Feasible but not small. Go itself is not the obstacle; the work is in binding
  three different native object models, choosing an FFI strategy, handling
  bitstream parsing on slice-level APIs, and testing on real hardware.
lifecycle: proposed
authority: inferred
aliases: [難易度評価, feasibility]
scope:
  platform: [darwin, linux, windows]
facts:
  verdict: >-
    Medium-to-high effort, low technical risk per platform, high total breadth.
    A single platform decode path is a few weeks of focused work; three platforms
    with decode+encode and a Linux parser/DPB is a multi-month library.
  hard_parts_ranked:
    - name: FFI strategy
      why: cgo gives easy headers but breaks cross-compilation; purego gives CGO_ENABLED=0 builds but every struct, callback and COM vtable is hand-written.
    - name: API model mismatch
      why: VideoToolbox is callback-driven with CoreFoundation objects; Media Foundation is COM with an asynchronous MFT event loop and a D3D11 device manager; VA-API is a slice-level accelerator with explicit surfaces and parameter buffers; NVDEC needs a CUDA context.
    - name: Slice-level accelerators need a Go bitstream layer
      why: VA-API, DXVA2/D3D11VA and Vulkan Video expect the application to parse SPS/PPS/slice headers, build reference lists and manage the DPB. VideoToolbox, Media Foundation MFTs and NVDEC (cuvid parser) accept compressed NAL units directly.
    - name: Frame memory and lifetime
      why: Output lives in CVPixelBuffer / IMFSample+D3D11 texture / VASurface / CUDA memory; copying to CPU is simple but costs bandwidth, zero-copy needs per-backend GPU interop.
    - name: Hardware-specific behaviour
      why: Codec/profile support, B-frame handling, rate-control options and even presence of an encoder MFT vary by GPU vendor and driver version; software fallbacks differ per OS.
    - name: Testing
      why: Hosted CI has GPUs only on Apple Silicon macOS runners; Linux/Windows backends need self-hosted or developer hardware.
  per_platform:
    darwin:
      api: VideoToolbox (C API over CoreMedia/CoreVideo)
      model: full decoder/encoder; accepts AVCC NAL units with parameter sets
      difficulty: lowest
      note: purego precedent exists (go-macos/videotoolbox, decode only).
    windows:
      api: Media Foundation MFTs (COM), DXVA2/D3D11VA for raw decode acceleration
      model: full decoder/encoder MFTs; hardware MFTs are asynchronous and need IMFDXGIDeviceManager
      difficulty: medium
      note: COM from Go without cgo works via vtable syscalls (go-ole pattern); Go-implemented callbacks needed for async events. Vendor hardware encoder MFTs are sometimes missing on a given driver.
    linux:
      api: VA-API (libva) for Intel/AMD; NVDEC/NVENC for NVIDIA; V4L2 M2M on ARM SoCs
      model: VA-API is slice-level (application parses bitstream, manages DPB); NVDEC is a full decoder with its own parser
      difficulty: highest for a from-scratch binding
      note: Alternative is to accept an FFmpeg or GStreamer dependency on Linux only.
  cross_vendor_options:
    vulkan-video: Windows and Linux only; MoltenVK on macOS does not implement VK_KHR_video_*; slice-level like VA-API.
    ffmpeg: Covers everything with cgo and licensing cost; best as an optional module or test oracle.
  comparison_with_other_languages: >-
    The same work exists in Rust and C++; what Go adds is the cgo/purego decision
    and goroutine-safety around callback-driven APIs. There is no Go-specific
    blocker.
  evidence:
    - url: https://pkg.go.dev/github.com/go-macos/videotoolbox
      claim: Pure Go (CGO_ENABLED=0, purego) H.264/HEVC hardware decode on macOS exists.
    - url: https://pkg.go.dev/github.com/ebitengine/purego@v0.10.1
      claim: purego tier-1 targets are linux, darwin, windows, android, ios on amd64/arm64.
    - url: https://learn.microsoft.com/en-ie/Windows/Win32/medfound/hardware-mfts
      claim: Hardware MFTs must use the asynchronous processing model.
    - url: https://docs.rs/crate/mediaway-encoder/0.1.3/source/docs/windows/benchmarks.md
      claim: A given NVIDIA/Intel driver may register no hardware H.264 encoder MFT; test on target hardware.
    - url: https://www.lunarg.com/new-vulkan-1-3-239-0-sdks-add-three-video-decode-extensions
      claim: Vulkan video extensions ship in SDK headers; macOS driver support is a separate matter and MoltenVK does not provide it.
