id: component:image
type: component
title: 'image/heif and image/avif: HEIC and AVIF still images with the hardware codecs'
summary: 'image/heif (HEVC pictures) and image/avif (AV1 pictures) read and write HEIF files with the
  conventions of the standard image packages (Decode, DecodeConfig, Encode, RegisterFormat) over the shared
  internal/imageitem box code: coded items and grids, clap/irot/imir, hvcC/av1C from in-band parameter
  sets, one keyframe per picture or tile, odd sizes padded and declared through clap. Hardware codecs
  only; the imgconv sample shows the cgo-free fallback. Consolidated on 2026-10-16 from milestone:image-heif
  and milestone:examples-heif-avif.'
lifecycle: active
authority: authored
aliases:
- heif package
- HEIC
- AVIF
- image.Decode HEIC
- internal/imageitem
constraints:
- Box plumbing is hand-written (meta/hdlr/pitm/iinf/iref/iprp/ipco/ipma/iloc/idat, mdat), since 2026-10-10
  in internal/imageitem; only the decoder configuration records come from mp4ff (hevc.DecodeHEVCDecConfRec,
  mp4.CreateHvcC, av1.ParseSequenceHeader, av1.CodecConfRecFromSequenceHeader).
- Decoding uses one decoder per file with WithOutputFormat(RGBA) and WithDecodeOrder(); every item is
  a keyframe packet (hvcC parameter sets + length-prefixed NAL units as Annex-B; AV1 temporal unit with
  the av1C configOBUs prepended when the item has no sequence header OBU). Grid tiles are decoded in row-major
  order and stitched, then cropped to the grid output size.
- 'Transformations apply in ipma order: clap (centre-relative clean aperture, integer arithmetic on doubled
  coordinates), irot (anti-clockwise, matching ffmpeg''s displaymatrix rotation of +90 for irot 1), imir
  (axis 0 = left-right).'
- 'Encoding: WithKeyframeInterval(1), ForceKeyframe, WithFrameRate(1), WithQuality; VPS/SPS/PPS taken
  from the first packet into hvcC (shared property when identical bytes); samples hold the slice NAL units
  with 4-byte lengths. Items get hvcC (essential), ispe, pixi (8,8,8), colr nclx 1/1/1 video range; the
  grid item gets ispe/pixi/colr plus clap/irot; tiles are hidden infe entries; iloc version 0 with absolute
  32-bit offsets, meta built twice to learn the mdat offset.'
- The VideoToolbox encoder rounds odd picture sizes down (321x203 request -> 320x202 SPS; the decoder
  then reports 320x202), so odd pictures are padded by one replicated row/column, encoded even and declared
  through clap. ImageIO opens such files at the right size but resamples instead of cropping (35.7 dB
  vs 36.9 dB for our crop against the source); ffmpeg rounds the odd clap to even (320x202).
- ImageIO (sips) does not bake irot into converted pixels (it keeps orientation metadata); ffmpeg maps
  irot to a display matrix and autorotates, so ffmpeg is the oracle for the rotation direction and ImageIO
  for the stored picture.
- 8-bit 4:2:0 only (the library limit); 10-bit HEIC (iPhone HDR) is out of scope.
- The author made the image/heif path conditional on the package being usable like a standard image format,
  not only a parser; hence Decode/DecodeConfig/RegisterFormat and the *Options argument of Encode (nil
  means defaults, as jpeg.Encode).
- 'Formats are registered by major brand after "????ftyp": image/heif registers heic, heix, hevc, hevx,
  heim, heis, hevm, hevs as "heic"; image/avif registers avif, avis as "avif". The generic mif1 and msf1
  do not name the codec: internal/imageitem registers them once as "heif" when either package is linked
  and dispatches by the primary item''s type, answering with an error that names the missing package when
  the codec''s package is not linked.'
- 'Each package reads only its codec: heif.Decode of an AVIF file (and the reverse) fails with an error
  naming the other package, checked from the boxes before a decoder is opened. Info and Options are declared
  in both packages (no Codec field any more); the shared code is internal/imageitem.'
- 'Colours: the hardware decoder converts to RGB from what the bitstream declares. An HEVC item whose
  SPS has no video_signal_type while the item has a colr nclx property (gen2brain/h265 writes full-range
  BT.601 that way) is decoded to NV12 and converted in Go with the nclx matrix and range; before this
  such files came out with stretched contrast (220 read as 234). Found by letting the hardware decoder
  read the pure-Go encoder''s files in the imgconv tests.'
- 'Decode has no context or option parameter (the image package signature): it uses context.Background
  and hardware codecs only. DecodeBytes takes hwmediacodec.DecoderOption values (software fallback).'
- 'DecodeConfig and DecodeInfo use only the boxes: ispe of the primary item or the grid descriptor, then
  clap and irot in their stored order, so they need no decoder. The tests require them to predict exactly
  what DecodeBytes returns for every file decoded.'
- Decoding needs a hardware HEVC or AV1 decoder, so image.Decode fails on machines without one (the error
  wraps hwmediacodec.ErrUnsupported). Output is opaque *image.RGBA; alpha (auxiliary items), 10-bit and
  4:4:4 pictures are not handled.
acceptance:
  exheif-heic-write-imageio:
    text: HEIC files written for a 640x480 picture (single, 256-pixel grid, rotated 90, grid rotated 270)
      and a 321x203 picture open in macOS ImageIO at the stored size within 35 dB (4x4 block PSNR) of
      the source; our decoder returns the rotated size, within 40 dB (pixel PSNR) of ImageIO for even
      pictures and within 35 dB of the source for all; ffmpeg autorotates even single pictures to the
      rotated source within 35 dB; Info reports HEVC, the tile count and the rotation.
    scope:
      milestone: examples-heif-avif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exheif-heif-encode-test
  exheif-heic-read:
    text: An 800x600 HEIC written by ImageIO decodes to 800x600 within 40 dB of ImageIO's own decode and
      35 dB of the source.
    scope:
      milestone: examples-heif-avif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exheif-heif-decode-test
  exheif-avif-read:
    text: A 640x480 AVIF written by ffmpeg (libsvtav1) decodes through the AV1 hardware decoder to 640x480
      within 40 dB of ffmpeg's decode and 30 dB of the source.
    scope:
      milestone: examples-heif-avif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exheif-avif-decode-test
  exheif-avif-write:
    text: Encode with Codec AV1 returns ErrUnsupported where Probe lists no AV1 encoder, and round-trips
      where one exists.
    scope:
      milestone: examples-heif-avif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exheif-avif-encode-test
  heif-image-package:
    text: For every HEIC and AVIF file the tests decode (written by this package as single, odd-sized,
      grid, rotated and rotated-grid pictures, written by ImageIO, written by ffmpeg with libsvtav1),
      image.DecodeConfig reports the format and the size of the decoded picture, image.Decode returns
      the same pixels as DecodeBytes, and DecodeInfo equals the Info DecodeBytes returns.
    scope:
      milestone: image-heif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - heif-heif-test
  heif-encode-defaults:
    text: Encode with nil options writes a HEIC file that image.Decode reads back within 30 dB of the
      source.
    scope:
      milestone: image-heif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - heif-heif-test
  heif-garbage:
    text: Empty, text and zero input is rejected by DecodeBytes, Decode, DecodeConfig and image.Decode.
    scope:
      milestone: image-heif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - heif-heif-test
  heif-heifconv:
    text: heifconv writes a tiled, rotated HEIC from a PNG, prints its structure with -info without decoding
      and converts it back to a PNG of the rotated size.
    scope:
      milestone: image-heif
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - heif-heifconv-run
