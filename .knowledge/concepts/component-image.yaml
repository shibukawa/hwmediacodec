open_questions:
  exheif-iphone-photos:
    text: Real iPhone photos (grid of 512x512 hvc1 tiles, irot, EXIF, HDR gain maps, 10-bit for HDR captures)
      were not available in the session; the grid and irot paths were exercised only with files this package
      wrote and ImageIO read.
    state: open
    resolution: Try the author's photos; 10-bit captures are expected to fail with ErrUnsupported from
      the decoder.
    scope:
      platform: darwin
      gpu: apple-silicon
  heif-real-phone-photos:
    text: iPhone photos are 10-bit HDR by default on recent models and carry auxiliary items; how far
      should the decoder go (tone-mapped 8-bit output, alpha)?
    state: open
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  delivery_results:
    milestone:examples-heif-avif:
      result:
        status: delivered 2026-10-09
    milestone:image-heif:
      result:
        status: delivered 2026-10-10
  api:
    heif: 'import github.com/shibukawa/hwmediacodec/image/heif (registers heic) or .../image/avif (registers
      avif); either also registers the generic heif. Same functions in both: Decode(io.Reader) (image.Image,
      error); DecodeConfig(io.Reader) (image.Config, error); DecodeBytes(data, ...hwmediacodec.DecoderOption)
      (*image.RGBA, *Info, error); DecodeInfo(data) (*Info, error); Encode(w, img, *Options{Quality, TileSize,
      Rotation, Software}) error; Info{Width, Height, Tiles, Rotation, Mirror}'
relations:
- relation: part_of
  to: requirement:hwmediacodec
- relation: supersedes
  to: milestone:examples-heif-avif
- relation: supersedes
  to: milestone:image-heif
- relation: depends_on
  to: component:core-api
history:
  exheif-delivered-2026-10-09:
    summary: Fifth and last of the requested sample slices; the AV1 decode branch was merged first so
      that AVIF input works on the M3.
  heif-delivered-2026-10-10:
    summary: The author proposed image/heif provided the package offers image-compatible use rather than
      a parser only, then asked for the image compatibility.
  heif-split-2026-10-10:
    summary: The author asked for image/avif and image/heif to be separate packages; the code moved to
      internal/imageitem with a codec filter, and the colr-only colour signalling fix followed from the
      imgconv fallback tests (milestone:imgconv-fallback).
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:examples-heif-avif, milestone:image-heif
      was folded into this concept (keys prefixed with the milestone's tag; dated measurements kept as
      evidence notes); the milestone files remain as superseded stubs with their timelines.
    supersedes:
    - milestone:examples-heif-avif
    - milestone:image-heif
