id: milestone:examples-screencast-hls
type: milestone
title: Examples - Ebitengine screen recording to MP4 and live HLS streaming
summary: 'Second usage-sample slice: screencast.Recorder captures an Ebitengine screen with ReadPixels
  on every Draw and feeds the hardware encoder (RGBA input) on a background goroutine; sinks write the
  packets to an MP4 file (examples/record) or through container.Segmenter into CMAF/fMP4 segments
  served by an in-memory sliding-window HLS playlist (examples/hls). Verified on the M3 with ffmpeg/ffprobe
  as oracles and by playing the live stream in the desktop app browser pane through hls.js.'
lifecycle: active
authority: authored
aliases:
- screen recording sample
- HLS sample
- 画面録画
- HLS 配信
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-screencast-hls
constraints:
- 'Capture never blocks the game loop: ReadPixels runs in Draw (about 2 ms at 1280x720 on the M3, 3.7
  ms including the demo scene), the RGBA buffer goes through a bounded channel to the encoder goroutine,
  and a full queue drops the frame (counted) instead of stalling.'
- 'PTS are wall-clock based and quantised to the frame rate (slot = round(elapsed*fps), pts = slot*90000/fps):
  a dropped frame leaves a gap rather than speeding the recording up, and a second Draw inside one slot
  (120 Hz display, 60 fps game) is ignored.'
- 'The segmenter needs PTS == DTS (no B-frames) and cuts at the first keyframe after the target length,
  so the HLS sample sets the encoder keyframe interval to fps*segment and WithLowLatency; segments are
  styp+moof+mdat with per-sample flags, tfdt continuing across segments, init segment from mp4ff CreateEmptyInit
  + SetAVCDescriptor/SetHEVCDescriptor.'
- 'VideoToolbox rejects constant bitrate for H.264 on the author''s M3 ("ConstantBitRate is not supported
  by this encoder"), so the HLS sample uses VBR; WithRateControl(CBR) is left to the user.'
- 'The first demo scene drew with DrawImage only. Ebitengine 2.10 anti-aliased vector fills (24 FillCircle
  + StrokeCircle per frame) cost about 80 ms a frame at 720p and dragged Draw to 12 fps, which first looked
  like a capture problem. The scene was later replaced by the fireworks show (milestone:examples-fireworks).'
- Live playlist with EXT-X-VERSION 7, EXT-X-MAP, EXT-X-MEDIA-SEQUENCE, EXT-X-INDEPENDENT-SEGMENTS, a sliding
  window of N segments and EXT-X-ENDLIST once the game exits; 503 until the first segment exists.
non_goals:
- Low-latency HLS (partial segments, blocking playlist reload), DASH manifests, audio capture.
- Zero-copy capture (Ebitengine has no texture export); see requirement open question ebitengine-zero-copy.
- Recording the window at HiDPI device resolution (the logical screen size from Layout is captured).
acceptance:
  recorder-mp4:
    text: Sixty frames of a synthetic screen captured at 30 fps (two captures per slot) give an MP4 with
      60 frames, PTS steps of 3000 at 90 kHz, 2.000 s duration, no drops, decodable by ffmpeg, whose
      first frame matches the first captured image within 30 dB.
    scope:
      milestone: examples-screencast-hls
    verified_by:
    - recorder-test
  recorder-drops:
    text: With a queue of two frames, bursts of captures are either encoded or counted as dropped and
      every encoded frame yields a packet.
    scope:
      milestone: examples-screencast-hls
    verified_by:
    - recorder-test
  segmenter:
    text: An ffmpeg-made stream with a keyframe every 10 frames at 30 fps segmented at 1 s gives three
      1 s segments, each one fragment of 30 samples starting with a sync sample and tfdt continuing;
      init + segments decode with ffmpeg to the source's frame MD5s; a 100 ms target cuts at every keyframe.
    scope:
      milestone: examples-screencast-hls
    verified_by:
    - segmenter-test
  hls-server:
    text: The playlist server answers 503 before the first segment, serves the m3u8 with the required
      tags, init.mp4 and seg_N.m4s with the right content types, keeps a sliding window, and after End
      ffprobe reads the whole stream over HTTP (150 frames); the live app plays in a browser.
    scope:
      milestone: examples-screencast-hls
    verified_by:
    - hls-server-test
    - hls-live-run
  record-app:
    text: The record app at 1280x720 and 60 fps records 5 s without drops at about 56 fps including window
      start-up, with ReadPixels costing a few milliseconds per draw.
    scope:
      milestone: examples-screencast-hls
    verified_by:
    - record-run
