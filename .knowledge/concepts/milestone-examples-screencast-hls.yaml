history:
  delivered-2026-10-09:
    summary: Second sample slice (screen recording and HLS) delivered after the converter/thumbnails slice;
      all tests pass on the author's M3 and the live HLS stream was played in a Chromium browser pane.
  moved-2026-10-09:
    summary: screencast.Recorder left the examples module for the core module as capture.Recorder (milestone:capture-package);
      NewMP4File became CreateVideoFile of the MP4 package and the MP4 acceptance test moved there; the
      package itself (container, with the Segmenter) became mediacontainer/mp4 in the core module on 2026-10-10
      (milestone:mediacontainer-mp4), and the Playlist of examples/hls/server.go became net/hls (milestone:mediacontainer-hls);
      the sample keeps the player page (examples/hls/page.go).
  superseded-2026-10-16:
    summary: Folded into backend:videotoolbox, component:capture, component:examples, component:mediacontainer,
      component:net-hls on 2026-10-16 so that the current state of each backend and package is read from
      one concept; this file keeps the slice's definition and timeline.
