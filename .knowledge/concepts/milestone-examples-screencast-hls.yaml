open_questions:
  hidpi-capture:
    text: Should the recorder capture at the device pixel size (ebiten.Monitor().DeviceScaleFactor())
      instead of the logical Layout size? That needs the game to render at device resolution.
    state: deferred
    resolution: The logical size is what the game draws; a game that wants a sharper recording can return
      a larger Layout.
facts:
  api:
    screencast: 'New(width, height, sink, Options{Codec, FPS, Bitrate, Quality, CBR, KeyframeInterval,
      LowLatency, Profile, Queue, Software, Extra}) -> Recorder{Capture(Source), CaptureAt, Close, Err,
      Captured, Dropped, Encoded, Duration}; Source = Bounds()+ReadPixels() (ebiten.Image); Sink =
      WritePacket+Close; Funcs{Write, Done}; TimeScale 90000. Since milestone:capture-package the package
      is github.com/shibukawa/hwmediacodec/capture in the core module and the MP4 sink is mp4.CreateVideoFile(path,
      codec, timeScale)'
    segmenter: 'NewSegmenter(codec, timeScale, target, onInit, onSegment) -> WritePacket, Close; Segment{Seq,
      Data, Start, Duration}'
    hls: 'Playlist{SetInit, Add, End, M3U8, ServeHTTP} serving /, /index.m3u8, /init.mp4, /seg_N.m4s;
      flags -addr -codec -bitrate -fps -size -segment -window'
    record: 'flags -o -codec -bitrate -fps -size -seconds'
  result:
    status: delivered 2026-10-09
    performance: 1280x720 at 60 fps - ReadPixels about 2 ms per frame (3.7 ms with the scene render it
      waits for), no drops; 5 s recording 278 frames
history:
  delivered-2026-10-09:
    summary: Second sample slice (screen recording and HLS) delivered after the converter/thumbnails slice;
      all tests pass on the author's M3 and the live HLS stream was played in a Chromium browser pane.
  moved-2026-10-09:
    summary: screencast.Recorder left the examples module for the core module as capture.Recorder (milestone:capture-package);
      NewMP4File became CreateVideoFile of the MP4 package and the MP4 acceptance test moved there; the
      package itself (container, with the Segmenter) became mediacontainer/mp4 in the core module on 2026-10-10
      (milestone:mediacontainer-mp4), and the Playlist of examples/hls/server.go became net/hls
      (milestone:mediacontainer-hls); the sample keeps the player page (examples/hls/page.go).
