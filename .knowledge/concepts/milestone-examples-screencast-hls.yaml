id: milestone:examples-screencast-hls
type: milestone
title: Examples - Ebitengine screen recording to MP4 and live HLS streaming
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:capture, component:examples, component:mediacontainer, component:net-hls
  (keys prefixed exscreen-). Original summary: Second usage-sample slice: screencast.Recorder (capture.Recorder
  since milestone:capture-package) captures an Ebitengine screen with ReadPixels on every Draw and feeds
  the hardware encoder (RGBA input) on a background goroutine; sinks write the packets to an MP4 file
  (examples/record) or through container.Segmenter into CMAF/fMP4 segments served by an in-memory sliding-window
  HLS playlist (examples/hls). Verified on the M3 with ffmpeg/ffprobe as oracles and by playing the live
  stream in the desktop app browser pane through hls.js.'
lifecycle: superseded
authority: authored
aliases:
- screen recording sample
- HLS sample
- 画面録画
- HLS 配信
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-screencast-hls
non_goals:
- Low-latency HLS (partial segments, blocking playlist reload), DASH manifests, audio capture.
- Zero-copy capture (Ebitengine has no texture export); see requirement open question ebitengine-zero-copy.
- Recording the window at HiDPI device resolution (the logical screen size from Layout is captured).
