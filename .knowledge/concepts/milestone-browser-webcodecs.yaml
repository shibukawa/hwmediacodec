history:
  h264-clip-2026-10-13:
    summary: 'The author chose the H.264 copy of the bundled clip (over a <video>-element player, whose drawbacks
      were discussed: a player rather than a decoder, no frame-exact Send/Receive, its own clock) and asked for
      automated tests. examples/assets now embeds waterfall-720p-h264.mp4 (High@3.1, 2 Mbit/s, 2.5 MB, same 293
      frames and audio; the ffmpeg command is in assets.go) and lists both in assets.Clips; examples/internal/bundled
      opens the first one that decodes (HEVC, then H.264; in a browser a second round with software decoders)
      and is what player and texture use. The codec is never given by the caller for MP4 - the demuxer reads
      it from the sample entry (avc1/avc3, hvc1/hev1, av01); only raw Annex-B streams need it stated.'
  survey-2026-10-13:
    summary: 'The author asked whether Safari could simply start in realtime mode, doubted that Firefox lacks HEVC,
      and asked for a throwaway survey of codecs and colour information without touching product code. The survey
      (backend:webcodecs facts.survey_2026-10-13) showed Firefox''s WebCodecs HEVC behind a preference, the hardware
      hint meaning something in Chrome only, and how each browser treats colour; the encoder now prefers realtime
      for H.264 on WebKit while the trial keeps deciding.'
  safari-run-2026-10-13:
    summary: 'The author pasted Firefox''s console (the HEVC clip cannot play there and the player exited silently)
      and said Safari was running. examples/player and examples/texture now fall back to the browser''s software
      decoder on js and show a fatal error in the page (examples/internal/fatal). The Safari run showed
      full-range frames, an H.264 encoder that only works in realtime mode and full-range NV12 input, each
      handled in the backend; diagnostic tests (TestSupportMatrix, TestEncoderBehaviour, TestDecoderBehaviour,
      HWMEDIACODEC_TEST_DIAGNOSE=1) log what a browser does.'
  firefox-run-2026-10-13:
    summary: The author ran the script with Firefox, which hung; a Firefox started by its binary path cannot
      start content processes on macOS, so the wrapper now starts it through "open". The run that followed
      showed Firefox's own limits (RGB frames, colour description, quality mode) and led to ErrUnsupported
      for NV12 there and to the encoder confirming its configuration.
  implemented-2026-10-12:
    summary: Backend, registration, browser test wrapper, README browser notes and knowledge written; verified
      in headless Chrome on an Apple M3 and with the Ebitengine player in a browser; other browsers and
      operating systems not run.
facts:
  options_discussed:
    gopherjs: Go to JavaScript; syscall/js exists, but it trails the Go releases (a search on 2026-10-12
      found v1.21.0 from June 2026 without the Go version it supports; the module needs go 1.27); not
      targeted, not tried
    go_js_wasm: the standard toolchain's browser target and Ebitengine's; chosen
    go_wasip1: no syscall/js; reaching WebCodecs would need a hand-written JavaScript host through go:wasmimport;
      not targeted
    tinygo: -target wasm is GOOS=js with a syscall/js of its own (the option missing from the author's
      list); wasip1/wasip2 as for Go; untested, a later check
  test_harness:
    wrapper: internal/browserexec, built as go_js_wasm_exec and put first on PATH by scripts/browser_test.sh,
      so that go test finds it without -exec
    page: loads wasm_exec.js from GOROOT, starts the test binary with the go test flags (minus those that
      write files), posts its output and exit code back
    host_access: 'endpoints behind a random path token on 127.0.0.1: exec (ffmpeg, ffprobe, x265, aomenc
      only, working directory inside the wrapper''s temporary directory), lookpath, mktemp, file (paths
      below that directory only)'
    browsers: Chrome, Chromium or Edge found in the usual places; HWMEDIACODEC_BROWSER names another (Firefox
      gets Firefox flags, anything else just the URL); HWMEDIACODEC_BROWSER_HEADED, _ARGS, _LOG
    lifetime: the wrapper stops the browser on exit and on SIGINT/SIGTERM/SIGQUIT (go test's timeout)
  findings_2026-10-12:
  - Headless Chrome on macOS has the hardware codecs (VideoToolbox behind WebCodecs), including the M3's
    AV1 decoder; nothing extra is needed to get them.
  - decodeQueueSize is the saturation signal - it stays 0 while the codec takes chunks at once - so blocking
    while it is above zero is both the back-pressure and the moment the event loop delivers frames.
  - VideoFrame.copyTo({format RGBA}) on Chrome is exact enough to score 86 dB and more against ffmpeg once
    the matrix is right.
  - A floating-point test value that rounded differently on arm64 (fused multiply-add) and wasm was replaced
    (quantizer(0.9)).
  next_candidates:
  - Run scripts/browser_test.sh on the author's Windows machine; AV1 in Safari.
  - Conformance tests that compare by PSNR where a browser cannot be bit-exact (Safari), so that its run
    is a regression signal.
  - Firefox colours - tag the SPS/VPS VUI ourselves on encoder output, and tag untagged H.264 input for RGB
    output, with the header writers of internal/h264 and internal/hevc.
  - Zero-copy VideoFrame to WebGL for ebitenvideo, if Ebitengine gains a way in.
  - TinyGo -target wasm build check.
