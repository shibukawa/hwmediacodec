history:
  zero-copy-removed-2026-10-13:
    summary: After asking how the other backends manage frame memory (CPU copies in a per-decoder pool,
      no GPU hand-over anywhere), the author decided to drop the direct upload from ebitenvideo. The player
      takes RGBA frames again on every platform; the Native frame format stays in the core, and a game-loop
      test in the browser stays in ebitenvideo.
  zero-copy-2026-10-13:
    summary: The author asked for zero-copy display. The core gained the Native frame format (the decoder's
      VideoFrame behind Frame.Native) and ebitenvideo uploads those frames straight into the texture of
      its image in Chrome and Safari, found from outside Ebitengine and verified by reading back; Player.ZeroCopy
      tells. Measured, it pays from 1080p up in Chrome and in Safari, not in Firefox, which keeps RGBA
      frames; where the texture cannot be found the player restarts the stream with RGBA frames.
  safari-nv12-2026-10-13:
    summary: The author asked for the Safari NV12 difference to be dealt with and, where the output is
      in another form, for tests against a fixture in that form. The form was measured (full range plus
      a quarter-line chroma shift), the decoder now undoes both, and the Safari run has a fixture test
      in WebKit's form that every frame meets to within one step; the checksum tests skip there instead
      of failing.
  h264-clip-2026-10-13:
    summary: 'The author chose the H.264 copy of the bundled clip (over a <video>-element player, whose
      drawbacks were discussed: a player rather than a decoder, no frame-exact Send/Receive, its own clock)
      and asked for automated tests. examples/assets now embeds waterfall-720p-h264.mp4 (High@3.1, 2 Mbit/s,
      2.5 MB, same 293 frames and audio; the ffmpeg command is in assets.go) and lists both in assets.Clips;
      examples/internal/bundled opens the first one that decodes (HEVC, then H.264; in a browser a second
      round with software decoders) and is what player and texture use. The codec is never given by the
      caller for MP4 - the demuxer reads it from the sample entry (avc1/avc3, hvc1/hev1, av01); only raw
      Annex-B streams need it stated.'
  survey-2026-10-13:
    summary: The author asked whether Safari could simply start in realtime mode, doubted that Firefox
      lacks HEVC, and asked for a throwaway survey of codecs and colour information without touching product
      code. The survey (backend:webcodecs facts.survey_2026-10-13) showed Firefox's WebCodecs HEVC behind
      a preference, the hardware hint meaning something in Chrome only, and how each browser treats colour;
      the encoder now prefers realtime for H.264 on WebKit while the trial keeps deciding.
  safari-run-2026-10-13:
    summary: The author pasted Firefox's console (the HEVC clip cannot play there and the player exited
      silently) and said Safari was running. examples/player and examples/texture now fall back to the
      browser's software decoder on js and show a fatal error in the page (examples/internal/fatal). The
      Safari run showed full-range frames, an H.264 encoder that only works in realtime mode and full-range
      NV12 input, each handled in the backend. The diagnostic tests that logged what a browser does (TestSupportMatrix,
      TestEncoderBehaviour, TestDecoderBehaviour behind HWMEDIACODEC_TEST_DIAGNOSE=1) were removed on
      2026-10-16, their findings being in the backend and the README's browser notes.
  firefox-run-2026-10-13:
    summary: The author ran the script with Firefox, which hung; a Firefox started by its binary path
      cannot start content processes on macOS, so the wrapper now starts it through "open". The run that
      followed showed Firefox's own limits (RGB frames, colour description, quality mode) and led to ErrUnsupported
      for NV12 there and to the encoder confirming its configuration.
  implemented-2026-10-12:
    summary: Backend, registration, browser test wrapper, README browser notes and knowledge written;
      verified in headless Chrome on an Apple M3 and with the Ebitengine player in a browser; other browsers
      and operating systems not run.
  superseded-2026-10-16:
    summary: Folded into backend:webcodecs, component:examples, component:playback on 2026-10-16 so that
      the current state of each backend and package is read from one concept; this file keeps the slice's
      definition and timeline.
