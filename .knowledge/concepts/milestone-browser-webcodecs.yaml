id: milestone:browser-webcodecs
type: milestone
title: Browsers through the WebCodecs backend (GOOS=js GOARCH=wasm)
summary: 'Requested 2026-10-12 ("Goをブラウザで動かす場合にも使えるようにしたい"; the author chose Go + wasm
  as the first target because that is what Ebitengine supports, and told the agent to go ahead with the
  recommended approach). A new backend internal/webcodecs on the WebCodecs API through syscall/js: H.264,
  HEVC and AV1 decoding and H.264 and HEVC encoding, frames in CPU memory through VideoFrame.copyTo, RGBA
  and BGRA converted by the browser, hardware only unless WithSoftwareFallback. Registered by backends_js.go.
  Verified in headless Chrome on an Apple M3 with the existing conformance tests, which run in the browser
  through a new go test wrapper (internal/browserexec) that lends them the host''s ffmpeg; examples/player
  and examples/texture play the bundled clip in the browser.'
lifecycle: active
authority: authored
aliases:
- browser support
- ブラウザ対応
- WebCodecs backend
- GOOS=js
- Go + wasm
- wasm
scope:
  platform: js
  milestone: browser-webcodecs
constraints:
- 'Target chosen by the author: GOOS=js GOARCH=wasm with the standard Go toolchain (Ebitengine''s web
  target). GopherJS, TinyGo and the WASI targets were discussed and left out: GopherJS trails the Go
  release the module needs (not confirmed which release it reaches), TinyGo''s -target wasm shares GOOS=js
  and syscall/js and may work untested, WASI has no way to the page''s API.'
- No JavaScript source and no eval - everything goes through syscall/js, so a page's Content-Security-Policy
  needs nothing beyond what running WebAssembly needs.
- Callbacks never block and never let a JavaScript exception escape (both would end the program); methods
  wait on a one-slot channel the callbacks signal, bounded by the context and a 30 s stall timeout.
- Decoded VideoFrames are copied out and closed as soon as they arrive, not when Receive is called, so
  that a hardware decoder's small picture pool is never held by the Go side.
- H.264 and HEVC frames go through the Go reorder layer with a private timestamp per chunk; the result
  does not depend on the engine's own ordering or on the caller's timestamps.
- The conformance tests are the root package's own, unchanged in what they assert; internal/testutil reaches
  ffmpeg and files through one seam (host.go) that is os/exec natively and HTTP to the wrapper in the
  browser.
non_goals:
- Zero-copy display (VideoFrame to a WebGL texture); frames cross into Go memory like on every backend.
- AV1 encoding (a separate slice on every backend).
- GopherJS, TinyGo and WASI support.
- Running Firefox, Safari, or Chrome on other operating systems from this session.
acceptance:
  builds-everywhere:
    text: GOOS=js GOARCH=wasm go build and go vet pass for the core module, the other targets still build
      (scripts/crossbuild.sh, which now includes js/wasm), and under Node.js the tests build, Probe is
      empty and the ffmpeg-based tests skip.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - crossbuild
    - node-run
  chrome-conformance:
    text: In headless Chrome with hardware codecs, scripts/browser_test.sh passes the root package's tests -
      H.264, HEVC and AV1 frames bit-exact with ffmpeg in display order, RGBA/BGRA against ffmpeg's conversion,
      H.264 and HEVC encoding with every encoder control, the pipelines.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - chrome-conformance
  software-and-recovery:
    text: The browser's software decoders (planar frames) are bit-exact with ffmpeg, its software H.264
      encoder's output decodes, and a Decoder whose VideoDecoder the browser closed after bad data decodes
      the next stream.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - chrome-software
  ebitengine-in-browser:
    text: examples/player built for js/wasm plays the bundled clip in a browser at the display rate without
      skipped frames, and seeking works.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - player-in-browser
  no-hardware-is-reported:
    text: With accelerated video switched off in Chrome, Probe lists nothing and NewDecoder reports ErrUnsupported
      instead of using the software decoder.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - chrome-no-acceleration
  other-browsers:
    text: The same script passes (or skips for stated reasons) in Firefox and Safari and in Chrome on Windows,
      Linux and Android.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - other-browsers
  existing-suites:
    text: go test ./... passes natively on the Mac after internal/testutil moved to the host seam.
    scope:
      milestone: browser-webcodecs
    verified_by:
    - existing-suites
