id: milestone:browser-webcodecs
type: milestone
title: Browsers through the WebCodecs backend (GOOS=js GOARCH=wasm)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:webcodecs, component:examples, component:playback (keys prefixed browser-). Original
  summary: Requested 2026-10-12 ("Goをブラウザで動かす場合にも使えるようにしたい"; the author chose Go + wasm as the first target
  because that is what Ebitengine supports, and told the agent to go ahead with the recommended approach).
  A new backend internal/webcodecs on the WebCodecs API through syscall/js: H.264, HEVC and AV1 decoding
  and H.264 and HEVC encoding, frames in CPU memory through VideoFrame.copyTo, RGBA and BGRA converted
  by the browser, hardware only unless WithSoftwareFallback. Registered by backends_js.go. Verified in
  headless Chrome on an Apple M3 with the existing conformance tests, which run in the browser through
  a new go test wrapper (internal/browserexec) that lends them the host''s ffmpeg; examples/player and
  examples/texture play the bundled clip in the browser.'
lifecycle: superseded
authority: authored
aliases:
- browser support
- ブラウザ対応
- WebCodecs backend
- GOOS=js
- Go + wasm
- wasm
scope:
  platform: js
  milestone: browser-webcodecs
non_goals:
- Zero-copy display in ebitenvideo - tried and taken out; it needs a sanctioned way into Ebitengine's
  textures (facts.zero_copy).
- AV1 encoding (a separate slice on every backend).
- GopherJS, TinyGo and WASI support.
- Running Chrome on other operating systems from this session.
- Working around Firefox's own gaps (no YUV frames, colour description ignored and not written, no constant
  quality); they are recorded, and the two colour ones have a possible fix in facts.next_candidates.
