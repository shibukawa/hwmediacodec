open_questions:
  nvdec-display-callback:
    text: The NVDEC AV1 path assumes that the cuvid parser raises the display callback once per shown
      frame inside the cuvidParseVideoData call of its temporal unit (ulMaxDisplayDelay 0, CUVID_PKT_ENDOFPICTURE),
      passes the packet timestamp through, and that mapping the picture applies film grain. None of this
      is observed.
    state: open
    resolution: Run the AV1 tests on an RTX 30 or newer. If frames arrive one unit late the count per Send
      changes but PTS stay right (they travel through the parser); if CUVID_PKT_ENDOFPICTURE confuses units
      with hidden frames, drop the flag for AV1.
  nvdec-frame-size-change:
    text: NVDEC frames are cropped with the display area of the sequence callback; whether the parser
      raises a new sequence callback when a frame changes size inside a sequence (reference scaling)
      is unknown.
    state: open
    resolution: Decode an aomenc --resize-mode=2 stream on NVIDIA hardware and compare frame sizes with
      dav1d.
  vpl-hidden-frames:
    text: The VPL decoder is assumed to return MFX_ERR_MORE_DATA after a hidden frame with the rest of
      the temporal unit unread, which the loop answers by calling again (ffmpeg's qsvdec re-submits the
      remainder the same way). Not observed.
    state: open
    resolution: Run TestDecodeAV1MatchesReference with HWMEDIACODEC_BACKENDS=vpl on Tiger Lake or newer.
  media-foundation-av1-mft:
    text: The Microsoft AV1 decoder MFT is assumed to be synchronous and Direct3D 11 aware like the H.264
      and HEVC ones, to need MF_MT_FRAME_SIZE in the input type, and to take temporal units without temporal
      delimiters with the sequence header in band. The DXVA profile GUID b8be4ccb-cf53-46ba-8d59-d6b8a6da5d2a
      is written from memory of dxva.h, not checked against an SDK here.
    state: open
    resolution: Run the AV1 tests on Windows with the AV1 Video Extension installed; if the MFT turns
      out asynchronous the backend reports why in the UnsupportedError (candidate.usable).
  vaapi-on-hardware:
    text: The buffers equal ffmpeg's, so a driver sees what it sees from ffmpeg; what remains unobserved
      is the surface handling around them - surfaces created at the sequence maximum for smaller frames,
      vaGetImage/vaDeriveImage of a surface that is still a reference, and the surface count (8 slots +
      6, or 17 + 6 with film grain).
    state: open
    resolution: Run HWMEDIACODEC_BACKENDS=vaapi go test -count=1 . on AMD (radeonsi) and Intel (iHD)
      hardware; film grain output cannot be bit-exact with dav1d unless both apply the same grain, so
      compare a film-grain stream by PSNR.
  ten-bit:
    text: 10-bit AV1 (common for HDR) is refused on Linux and Windows.
    state: deferred
    resolution: Deferred until a consumer needs it - P010 surfaces plus a 10-to-8-bit conversion in Go,
      or a P010 pixel format in the public API.
  av1-encode:
    text: The author wants AV1 used wherever the hardware supports it; this slice is decoding only.
    state: deferred
    resolution: Next AV1 slice - NVENC AV1 (RTX 40) and VPL AV1 (Arc) first since both write complete
      temporal units; VA-API AV1 encoding needs a frame header writer.
facts:
  implementation:
    parser: internal/av1/header.go - State (sequence header plus eight RefFrame slots), State.ParseHeader
      (whole uncompressed_header - frame size with superres and frame_size_with_refs, set_frame_refs, tile
      info, quantisation, segmentation, delta q/lf, loop filter, CDEF, loop restoration, tx mode, skip mode,
      global motion with the previous parameters of the primary reference frame and the shear validity
      check, film grain incl. load from a reference), State.Update (reference frame update, and the reload
      of a key frame shown by show_existing_frame), Header.ParseTileGroup (tile sizes and offsets). seqhdr.go
      now keeps the decoder model lengths and every operating point.
    vaapi: internal/vaapi/av1fill.go (platform neutral) fills the picture parameters and appends tile parameters;
      av1dec.go walks the OBUs of a unit, drops OBUs outside operating point 0, begins a picture at a
      frame header, collects tile groups until the last tile, submits (picture parameters, then per tile
      group one parameter buffer with an element per tile and one data buffer), updates the slots and
      copies a shown picture at once. sequence/surface pool is reused from H.264/HEVC with maxRefs 8 (17
      with film grain).
    nvidia: cuvidCodec maps AV1 to cudaVideoCodec_AV1; sendAV1 gates on the key frame and prepends the stored
      sequence header OBU; the decode callback only submits, the display callback copies the picture with
      the timestamp the parser passes through (CUVID_PKT_TIMESTAMP is set for AV1 only).
    vpl: decodeCodecID adds MFX_CODEC_AV1; Send gates on the key frame like NVDEC; the DecodeFrameAsync
      loop continues after MFX_ERR_MORE_DATA when the unit is not consumed (AV1 only). Film grain surfaces
      come from the existing MFX_ERR_MORE_SURFACE handling.
    mediafoundation: mfCodec maps AV1 to MFVideoFormat_AV1 and the AV1 profile 0 DXVA GUID; configure(width,
      height) is deferred to the first sequence header for AV1 and sets MF_MT_FRAME_SIZE; sendAV1 strips
      temporal delimiters and makes one sample per unit.
    fake_driver: decode_av1 in fake_drv_video.c checks sizes, the two surfaces, reference slots, superres
      denominator, that tile sizes add up to the coded frame, tile order/offsets/groups, and logs the
      normalised picture parameters and tile parameters in hex; contexts without render targets (ffmpeg)
      are accepted; AV1 has a VLD entrypoint only.
    tests: testutil.GenerateAV1With (any ffmpeg AV1 encoder) and GenerateAV1Aomenc (aomenc via y4m); the
      fake driver image now installs aom-tools.
  result:
    status: delivered 2026-10-09, hardware runs pending
    environment:
      host: Apple M3, macOS 26; containers through OrbStack (linux/arm64 native, linux/amd64 emulated)
      go: go1.27.0
      oracle: ffmpeg 7.1.5 (Debian 13) with libaom 3.12.1, SVT-AV1, rav1e, aomenc; libva 2.22; libvpl headers
      date: '2026-10-09'
  learned:
  - ffmpeg's VA-API AV1 decoder renders into current_frame (the reference picture) and names the grained
    picture in current_display_picture; rendering into the display surface is the natural reading of the
    libva comment and is wrong by that precedent.
  - A fake VA driver doubles as a differential oracle - run ffmpeg -hwaccel vaapi -c:v av1 against it
    (LD_PRELOAD shim, /dev/null as the DRM device, a context without render targets) and compare the logged
    buffers. Everything a header trace cannot show (reference slots, inherited loop filter/segmentation/global
    motion state, set_frame_refs) is covered that way.
  - ffmpeg's libaom wrapper has no option for super-resolution, reference scaling or S-frames (aom-params
    rejects them); aomenc has. No available encoder writes frame_refs_short_signaling, so the test rewrites
    headers bit by bit; a rewritten header is kept only if it parses to exactly its new length, because
    skip_mode_present exists only when the derived references allow skip mode.
  - ffmpeg 7.1's trace prints the coded force_integer_mv bit for intra frames, where the specification
    (and the value sent to VA-API) is 1.
  - trace_headers prints dotted names (delta_q_y_dc.delta_coded); the trace parser's name pattern needed
    the dot.
