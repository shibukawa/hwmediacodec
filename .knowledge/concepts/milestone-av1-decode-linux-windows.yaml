id: milestone:av1-decode-linux-windows
type: milestone
title: AV1 decoding on the Linux and Windows backends (VA-API, NVDEC, Intel VPL, Media Foundation)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:intel-vpl, backend:media-foundation, backend:nvenc-nvdec, backend:vaapi, component:bitstream,
  component:core-api, requirement:hwmediacodec (keys prefixed av1lw-). Original summary: Slice requested
  on 2026-10-09: AV1 decoding wherever the GPU has an AV1 decoder, after the macOS slice (milestone:darwin-av1-decode).
  VA-API takes one frame at a time, so internal/av1 gained a complete uncompressed_header parser, the
  reference frame state it is parsed against and the tile group layout; the VA-API backend fills VADecPictureParameterBufferAV1
  and one VASliceParameterBufferAV1 per tile, keeps the surfaces of the eight reference slots and gives
  film grain its own display surface. NVDEC, Intel VPL and Media Foundation leave the stream to the driver''s
  parser and needed small additions. 8-bit Main profile to NV12 on all four; AV1 encoding stays out. Verified
  without hardware only: the frame header parser against ffmpeg trace_headers on 32 stream configurations,
  and every VA-API buffer byte for byte against ffmpeg''s own VA-API AV1 decoder through the fake VA driver.
  No run on a GPU yet.'
lifecycle: superseded
authority: authored
aliases:
- AV1 decode Linux
