id: milestone:av1-decode-linux-windows
type: milestone
title: AV1 decoding on the Linux and Windows backends (VA-API, NVDEC, Intel VPL, Media Foundation)
summary: 'Slice requested on 2026-10-09: AV1 decoding wherever the GPU has an AV1 decoder, after the
  macOS slice (milestone:darwin-av1-decode). VA-API takes one frame at a time, so internal/av1 gained
  a complete uncompressed_header parser, the reference frame state it is parsed against and the tile
  group layout; the VA-API backend fills VADecPictureParameterBufferAV1 and one VASliceParameterBufferAV1
  per tile, keeps the surfaces of the eight reference slots and gives film grain its own display surface.
  NVDEC, Intel VPL and Media Foundation leave the stream to the driver''s parser and needed small additions.
  8-bit Main profile to NV12 on all four; AV1 encoding stays out. Verified without hardware only: the
  frame header parser against ffmpeg trace_headers on 32 stream configurations, and every VA-API buffer
  byte for byte against ffmpeg''s own VA-API AV1 decoder through the fake VA driver. No run on a GPU yet.'
lifecycle: active
authority: authored
aliases:
- AV1 decode Linux
- AV1 decode Windows
- VADecPictureParameterBufferAV1
- AV1デコード Linux Windows
scope:
  platform:
  - linux
  - windows
  milestone: av1-decode-linux-windows
constraints:
- CGO_ENABLED=0; libva, cuvid, VPL and Media Foundation are called through the existing sys packages; ffmpeg,
  aomenc and the encoders behind them are test oracles and stream generators only.
- Packet.Data is one temporal unit in the low-overhead OBU format, as on macOS; every unit yields exactly
  one frame with its packet's PTS; all four decoders implement codec.DisplayOrderer for AV1, so the reorder
  layer is bypassed and WithDecodeOrder is a no-op.
- Decoding starts and resumes after Flush at a unit with a shown key frame; the last sequence header OBU
  is kept in Go and prepended to such a unit when it carries none (NVDEC, VPL, Media Foundation), since
  their parsers are recreated or restarted.
- 8-bit Main profile 4:2:0 to NV12 only on these backends; 10-bit, seq_profile 1 and 2 and monochrome
  report ErrUnsupported (VA-API checks the sequence header itself; the others rely on the driver's answer).
- VA-API - the render target of vaBeginPicture is the reference picture (current_frame); with film grain
  the picture to show is a second surface named in current_display_picture. This is what ffmpeg does and
  the fake driver now requires.
- VA-API - shown pictures are copied to CPU memory inside Send, because a surface stays with the reference
  slots and may be shown again by show_existing_frame; Send returns ErrAgain when four frames wait for
  Receive.
non_goals:
- AV1 encoding on any backend (NVENC from RTX 40, VPL from Arc, VA-API from RDNA3/Arc, vendor encoder
  MFTs) - a later slice.
- 10-bit AV1 on Linux and Windows (needs P010 surfaces and a conversion; VideoToolbox converts itself).
- RGBA/BGRA output from the backends themselves (they return NV12; the conversion in Go of milestone:decoder-rgb-conversion
  provides both formats, with the matrix and range of the sequence header's color_config).
- Spatial scalability (several spatial layers) and large-scale-tile streams on VA-API - ErrUnsupported.
- The Annex B length-delimited AV1 format.
acceptance:
  frame-header-oracle:
    text: Every syntax element of every frame header that ffmpeg's trace_headers prints equals the parser's
      value, and every header has the length ffmpeg read, for 32 stream configurations written by SVT-AV1,
      libaom (through ffmpeg and through aomenc) and rav1e, with headers parsed against the reference state
      the parser maintains itself.
    scope:
      milestone: av1-decode-linux-windows
    verified_by:
    - frame-header-trace-test
  vaapi-buffers-equal-ffmpeg:
    text: For 22 stream configurations (hidden frames, show_existing_frame, forward key frames, tiles,
      three tile groups, film grain from SVT-AV1 and libaom, super-resolution, random reference scaling,
      S-frames with frame numbers, screen content, lossless, segmentation, delta q/lf, quantiser matrices,
      128x128 superblocks with loop restoration, global motion) the picture parameter buffer, the tile parameters
      and the tile data the backend submits for every frame equal those ffmpeg's VA-API AV1 decoder submits
      to the same driver, with surfaces compared by the number of the picture they hold.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
    verified_by:
    - fake-vaapi-av1-test
  vaapi-short-signaling:
    text: For two streams rewritten to use frame_refs_short_signaling the references the backend derives
      (set_frame_refs) equal ffmpeg's for every frame, including frames whose derived references differ
      from the ones the encoder signalled.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
    verified_by:
    - fake-vaapi-av1-short-signaling-test
  vaapi-output:
    text: Through the fake driver every temporal unit yields one frame with its PTS that shows the right
      picture (the grained surface where film grain applies) at the frame's own size; reference slots
      match a simulation of the stream; a second sequence of another size rebuilds the surfaces; after Flush
      non-key units are skipped and decoding resumes at a key frame; 10-bit, 4:4:4 and monochrome streams
      report ErrUnsupported before anything reaches the driver; Probe lists av1 decode and no av1 encode.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
    verified_by:
    - fake-vaapi-av1-test
    - fake-vaapi-av1-sequence-test
  struct-layouts:
    text: The Go mirrors of VASegmentationStructAV1, VAFilmGrainStructAV1, VAWarpedMotionParamsAV1, VADecPictureParameterBufferAV1
      (1160 bytes) and VASliceParameterBufferAV1 (40 bytes) have the sizes and offsets gcc reports for libva
      2.22 on x86-64 and arm64, and MFX_CODEC_AV1 / MFX_PROFILE_AV1_MAIN have the header values.
    scope:
      milestone: av1-decode-linux-windows
    verified_by:
    - av1-layout-test
  hardware-conformance:
    text: On a GPU with an AV1 decoder the generic AV1 tests pass per backend - TestDecodeAV1MatchesReference
      (bit-exact with libdav1d), WithoutTemporalDelimiters, DecodeOrderOption, InvalidData, TestDecodeParameterSetChange/av1
      and TestFlushResumesAtKeyframe/av1.
    scope:
      milestone: av1-decode-linux-windows
    verified_by:
    - hardware-av1-decode
  builds:
    text: go vet and go test ./... pass on the Mac (including the VideoToolbox AV1 tests), scripts/crossbuild.sh
      builds six targets, the ebitenvideo and examples modules pass, and the existing container checks of
      the NVIDIA and VPL bindings still pass.
    scope:
      milestone: av1-decode-linux-windows
    verified_by:
    - build-check
