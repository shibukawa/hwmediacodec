history:
  accepted-2026-10-09:
    summary: The author noticed that the README named AV1 for macOS only and asked for AV1 wherever the
      platform supports it (macOS decode only); asked which slice, chose AV1 decoding on every platform
      on top of the merged macOS slice.
  delivered-2026-10-09:
    summary: Full frame header parser and reference state, VA-API AV1 decoder, AV1 on NVDEC, Intel VPL
      and Media Foundation, fake driver AV1 support with an ffmpeg differential oracle, README. Verified
      without hardware; GPU runs pending.
  superseded-2026-10-16:
    summary: Folded into backend:intel-vpl, backend:media-foundation, backend:nvenc-nvdec, backend:vaapi,
      component:bitstream, component:core-api, requirement:hwmediacodec on 2026-10-16 so that the current
      state of each backend and package is read from one concept; this file keeps the slice's definition
      and timeline.
