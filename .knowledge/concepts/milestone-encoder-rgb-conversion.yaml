id: milestone:encoder-rgb-conversion
type: milestone
title: RGBA/BGRA encoder input on the NV12-only backends (conversion in Go)
summary: 'WithInputFormat(RGBA|BGRA) works on every backend: where the backend encoder takes NV12 only
  (Media Foundation, VA-API, Intel VPL) NewEncoder opens it for NV12 and puts internal/pixconv in front,
  which converts each frame in Go with the BT.709 video-range matrix and asks the backend to declare that
  matrix in the stream. Triggered by the webrtc sample failing on Windows with "h264 encode is unsupported
  by mediafoundation: input format rgba is not supported; use NV12" (examples/screencast feeds RGBA).'
lifecycle: active
authority: authored
aliases:
- pixconv
- RGB to NV12 conversion
- input format rgba is not supported; use NV12
- RGBA入力のソフトウェア変換
scope:
  milestone: encoder-rgb-conversion
constraints:
- 'Selection (hwmediacodec.newEncoder): every backend is asked with the caller''s format first; one
  that answers ErrUnsupported for RGBA/BGRA is asked again with InputFormat NV12 and BT709 set, and
  when that succeeds the encoder is wrapped in pixconv.Encoder. Backend order is kept (the first backend
  that can serve the request wins, converted or not); backends with their own RGB input (VideoToolbox,
  NVENC) are never wrapped. When both attempts fail the NV12 attempt''s error is reported, which names
  the real obstacle instead of the pixel format.'
- 'Conversion (pixconv.RGBToNV12): BT.709, video range (Y 16..235, CbCr 16..240), 16.16 fixed point
  with coefficients chosen so that white is 235 and greys have CbCr 128 exactly; chroma is the matrix
  applied to the sum of each 2x2 block; odd sizes repeat the last column/row; pictures of 256 rows or
  more are split into bands across GOMAXPROCS goroutines. BT.709 because VideoToolbox converts RGB
  input with it, so a stream looks the same whichever backend produced it.'
- 'codec.EncoderConfig.BT709 carries the request to declare BT.709 primaries/transfer/matrix in video
  range: VA-API sets the video signal fields of the VUI in its Go-written SPS (H.264 and HEVC); Intel
  VPL attaches mfxExtVideoSignalInfo (third extension buffer, dropped after mfxExtCodingOption3 when the
  runtime rejects the configuration); Media Foundation sets MF_MT_VIDEO_PRIMARIES, MF_MT_TRANSFER_FUNCTION,
  MF_MT_YUV_MATRIX and MF_MT_VIDEO_NOMINAL_RANGE on the output and input media types and retries without
  them when the MFT refuses the type; VideoToolbox sets the same properties it sets for its own RGB
  input.'
- pixconv.Encoder converts into one reused NV12 buffer; that is safe because Encoder.Send copies the
  frame before it returns.
non_goals:
- NV12 to RGBA/BGRA for decoders (WithOutputFormat on VA-API, NVDEC, Intel VPL and Media Foundation still
  reports ErrUnsupported; ebitenvideo and the player/texture/thumbnails samples need it there).
- SIMD or GPU conversion, BT.601 or full-range variants, a public option to choose the matrix.
- Rewriting the SPS of an encoder that ignores the colour description.
acceptance:
  conversion-exact:
    text: The fixed-point conversion is within 1 of the floating-point BT.709 equations for even and odd
      sizes, padded rows and pictures split across goroutines; black/white/grey/primaries map to the
      video-range values; destination padding is left alone.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - pixconv-unit-test
  selection:
    text: An NV12-only backend gets the conversion and BT709; a backend with RGB input and NV12 requests
      are passed through; backend order wins; an unavailable backend is skipped; a backend failure is
      returned as is.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - selection-test
  hardware-roundtrip:
    text: RGBA and BGRA frames converted in Go and encoded by the hardware encoder decode (ffmpeg, RGB,
      declared matrix) to the source within 35 dB 8x8-block PSNR and the stream declares bt709.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - videotoolbox-roundtrip-test
  vaapi-path:
    text: Through the real VA-API backend the driver receives the BT.709 video-range picture and the SPS
      of H.264 and HEVC streams declares BT.709.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - vaapi-fake-driver-test
  windows-webrtc:
    text: examples/webrtc starts on Windows with an Intel or AMD GPU (Media Foundation) and the browser
      shows the fireworks with correct colours.
    scope:
      milestone: encoder-rgb-conversion
      platform: windows
    verified_by:
    - windows-hardware-run
