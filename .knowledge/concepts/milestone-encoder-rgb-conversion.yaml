id: milestone:encoder-rgb-conversion
type: milestone
title: RGBA/BGRA encoder input on the NV12-only backends (conversion in Go)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:pixel-conversion (keys prefixed encrgb-). Original summary: WithInputFormat(RGBA|BGRA)
  works on every backend: where the backend encoder takes NV12 only (Media Foundation, VA-API, Intel VPL)
  NewEncoder opens it for NV12 and puts internal/pixconv in front, which converts each frame in Go with
  the BT.709 video-range matrix and asks the backend to declare that matrix in the stream. Triggered by
  the webrtc sample failing on Windows with "h264 encode is unsupported by mediafoundation: input format
  rgba is not supported; use NV12" (examples/screencast feeds RGBA).'
lifecycle: superseded
authority: authored
aliases:
- pixconv
- RGB to NV12 conversion
- input format rgba is not supported; use NV12
- RGBA入力のソフトウェア変換
scope:
  milestone: encoder-rgb-conversion
non_goals:
- NV12 to RGBA/BGRA for decoders - delivered separately as milestone:decoder-rgb-conversion.
- SIMD or GPU conversion, BT.601 or full-range variants, a public option to choose the matrix.
- Rewriting the SPS of an encoder that ignores the colour description.
