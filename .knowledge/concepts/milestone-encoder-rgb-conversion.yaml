history:
  delivered-2026-10-09:
    summary: Delivered after the webrtc sample failed on Windows; conversion, selection and the VA-API
      path are tested, the Media Foundation and Intel VPL paths wait for a hardware run.
  superseded-2026-10-16:
    summary: Folded into component:pixel-conversion on 2026-10-16 so that the current state of each backend
      and package is read from one concept; this file keeps the slice's definition and timeline.
