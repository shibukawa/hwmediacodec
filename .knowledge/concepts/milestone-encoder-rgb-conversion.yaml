open_questions:
- Do the Intel, AMD and NVIDIA encoder MFTs copy MF_MT_YUV_MATRIX and friends into the VUI? If not, streams
  from Windows stay untagged and players guess (BT.709 for HD in browsers, BT.601 in ffmpeg).
- NV12 to RGBA for the decoders of the same backends is the mirror of this milestone and still missing.
