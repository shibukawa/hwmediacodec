id: analysis:security-review-2
type: analysis
title: Second security and performance review (2026-10-16) - bounds the first review missed, server hardening, image and container limits
summary: 'A second whole-tree audit after the feature set was complete (2026-10-16; PR description of
  branch claude/performance-security-review-949eb1). Four
  read-only audits (core and parsers, containers and images, native backends, capture/net/examples) found
  what the 2026-10-14 pass (PR #22) missed: unbounded H.264
  long-term references pinning the VA-API surface pool, a 13-byte HEVC slice allocating 64 MiB through
  num_entry_point_offsets, decoder output queues without a bound in VPL and NVDEC, an indefinitely blocking
  event wait in the Media Foundation encoder, a VA-API display leak, unlimited keyframe requests and peers in
  net/webrtc, samples listening on every interface, HEIF grid canvases and iloc extent floods bounded only by
  the file, mp4 samples read from the wrong offset when the reader did not start at 0. Everything reproducible
  got a regression test; govulncheck, staticcheck and gosec were run as well.'
lifecycle: active
authority: observed
aliases:
- security review round 2
- セキュリティレビュー第2回
- performance review 2026-10-16
scope:
  milestone: security-review-2
constraints:
- 'Decoder parsers refuse what the specification forbids only where a hostile value has a cost: H.264
  long_term_frame_idx and max_long_term_frame_idx_plus1 are bounded by 16 (not by MaxLongTermFrameIdx,
  which real streams exceed without MMCO 4) and the DPB sheds the oldest long-term reference past
  max_num_ref_frames; HEVC num_entry_point_offsets follows 7.4.7.1 and the offsets are read one at a time.'
- 'Every backend decoder answers ErrAgain once it holds 8 (VPL, NVDEC) or its own bound of decoded frames;
  the Send/Receive contract promises that Receive then makes progress.'
- 'net/webrtc merges keyframe requests closer than 500 ms, caps viewers at MaxViewers (32, counting
  connections in setup), serves every viewer from a goroutine with a 64-packet queue and drops one that
  overflows; ServeHTTP answers 400 for a bad offer and 503 when full or closed. net/hls serves GET and HEAD
  and caches a segment only for the duration the window lists.'
- 'image/heif and image/avif refuse files beyond MaxPixels (16384 x 16384), MaxTiles (4096) and
  MaxInputBytes (256 MiB) with ErrTooLarge before a decoder is opened; DecodeConfig and DecodeInfo keep
  reporting the declared size. A seekable reader is read header-first, another one up to MaxInputBytes.'
- 'The examples hls and webrtc listen on 127.0.0.1:8080 unless -addr says otherwise, because the streams
  are unauthenticated.'
- 'An audio encoder encodes a frame longer than its queue in parts: Send stops at maxPending packets
  (256 on AudioToolbox, 64 in the browser), Receive encodes the rest as it hands packets out, Flush
  encodes what is left at once. The unencoded samples are at most the frame Send accepted last.'
non_goals:
- 'GPU/CPU overlap in the VA-API, VPL and NVDEC paths (one synchronous wait per frame), a staging texture
  ring for Media Foundation, pinned host memory for NVDEC: left for a session with the hardware.'
acceptance:
  parsers-bounded:
    text: A stream that marks every picture long-term keeps at most max_num_ref_frames references; a slice
      header announcing 16M entry points is refused without allocating for them; crop sums, tile sums,
      scaling deltas and weighted-prediction offsets outside the specification are syntax errors.
    scope:
      milestone: security-review-2
    verified_by:
    - parser-tests
  servers-bounded:
    text: 100 picture loss indications reach the encoder once; a stalled viewer is dropped at 65 queued
      packets; a full or closed Broadcaster answers 503, a bad offer 400; HLS answers 405 to POST.
    scope:
      milestone: security-review-2
    verified_by:
    - webrtc-tests
  images-bounded:
    text: A grid beyond MaxTiles or MaxPixels is refused with ErrTooLarge before decoding; an iloc of
      65,535 free extents per item parses in microseconds; a seekable file is read header-first.
    scope:
      milestone: security-review-2
    verified_by:
    - image-tests
  audio-queue-bounded:
    text: One frame of a minute of PCM leaves at most maxPending packets queued after Send, a second Send
      gets ErrAgain, Receive encodes the rest without the queue growing past the bound, and after Flush
      the packets cover every sample plus the encoder's delay.
    scope:
      milestone: security-review-2
    verified_by:
    - audio-queue-tests
