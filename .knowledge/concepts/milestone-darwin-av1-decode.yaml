history:
  accepted-2026-10-09:
    summary: Author asked for AV1 decoding on the VideoToolbox backend (Apple M3), with an IVF package
      and CLI support; encoding out of scope since no Apple chip has an AV1 encoder.
  delivered-2026-10-09:
    summary: internal/av1 parser, VideoToolbox AV1 session via av1C, DisplayOrderer bypass of the reorder
      layer, ivf package, CLI, ffmpeg-oracle tests; all acceptance checks passed on the author's M3 with
      CGO_ENABLED=1 and 0.
  superseded-2026-10-16:
    summary: Folded into backend:videotoolbox, component:bitstream, component:core-api, component:mediacontainer
      on 2026-10-16 so that the current state of each backend and package is read from one concept; this
      file keeps the slice's definition and timeline.
