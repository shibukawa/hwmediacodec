open_questions:
  software-av1-on-m1-m2:
    text: On an M1 or M2, NewDecoder(AV1, WithSoftwareFallback()) runs av1SessionAvailable, which on
      the M3 with hardware decoding disabled fails with kVTCouldNotFindVideoDecoderErr. The M1/M2 behaviour
      itself is inferred from that measurement, not observed.
    state: open
    resolution: Run TestUnsupportedCodec and NewDecoder(AV1, WithSoftwareFallback()) on an M1 or M2 Mac;
      if VideoToolbox does hand out its software AV1 decoder there, the decoder works unchanged and only
      the README sentence needs a correction.
  av1-colour-tags:
    text: Only untagged streams were measured for RGB conversion (VideoToolbox assumed BT.601, as for
      H.264 at 320x240). Whether it reads color_config from av1C for tagged streams (BT.709, BT.2020)
      is not measured.
    state: open
    resolution: Encode a tagged stream (-color_primaries bt709 -color_trc bt709 -colorspace bt709) and
      compare RGB output with ffmpeg's BT.709 conversion; if VideoToolbox ignores the tags, add the
      kCMFormatDescriptionExtension_ColorPrimaries/TransferFunction/YCbCrMatrix extensions from the parsed
      sequence header.
  film-grain:
    text: What VideoToolbox does with film_grain_params_present streams (grain synthesis in hardware,
      and whether output is then deterministic) is not measured; the tests encode with film-grain=0.
    state: deferred
    resolution: Deferred until a consumer needs film grain; libdav1d applies grain by default, so a comparison
      would need -filmgrain 0 on the ffmpeg side or a PSNR check.
facts:
  api:
    decoder: NewDecoder(ctx, AV1, WithOutputFormat(NV12|RGBA|BGRA)); Packet.Data is one temporal unit;
      Frame.PTS == Packet.PTS; WithDecodeOrder is a no-op; WithSoftwareFallback does not help without the
      hardware engine
    probe: Capability{Backend videotoolbox, Codec AV1, Direction Decode, Hardware true} only when VTIsHardwareDecodeSupported('av01')
      != 0
    ivf: ivf.NewReader(io.Reader) (*Reader, error) with Header() {FourCC, Width, Height, TimebaseNum,
      TimebaseDen, FrameCount} and Next() (frame, pts, error); ivf.NewWriter(io.Writer, fourcc, width,
      height, timebaseNum, timebaseDen) with WriteFrame(data, pts) and Close() (patches the frame count
      when the writer can seek)
    cli: decode -codec av1 input.ivf (PTS from the IVF timebase, rescaled to 90 kHz); transcode -in av1;
      probe prints av1 decode
  implementation:
    parser: internal/av1 - Split (OBU framing, leb128, extension headers, size-less last OBU), ParseSequenceHeader
      (whole sequence_header_obu incl. timing/decoder model info, operating points, color_config), ParseFrameHeader
      (show_existing_frame, frame_type, show_frame), ParseTemporalUnit (classification - HasFrame, Keyframe,
      ShowExistingFrame), CodecConfigurationRecord (av1C, re-framing the sequence header OBU with obu_has_size_field=1),
      StripTemporalDelimiters
    videotoolbox: internal/videotoolbox/av1.go - sendAV1 parses the unit, rebuilds the session on a new
      sequence header (CMVideoFormatDescriptionCreate with 'av01', max_frame_width/height and an extensions
      dictionary whose SampleDescriptionExtensionAtoms entry holds the av1C record as CFData), skips until
      a shown key frame after creation and Flush, and hands the whole unit (temporal delimiters included)
      to VTDecompressionSessionDecodeFrame; decoder.go now branches Send by codec (sendAnnexB / sendAV1)
      and shares decodePacket; OutputsDisplayOrder() returns true for AV1
    probe: backend.go lists AV1 decode from VTIsHardwareDecodeSupported('av01'), never asks the encoder
      property dictionary for 'av01'; NewDecoder(AV1) without hardware returns UnsupportedError, with WithSoftwareFallback
      only after av1SessionAvailable(true) fails
    sys: CFDataCreate, CMVideoFormatDescriptionCreate and kCMFormatDescriptionExtension_SampleDescriptionExtensionAtoms
      added; CFData helper
    tests: testutil.GenerateAV1 (ffmpeg -f lavfi testsrc2 -c:v libsvtav1 -preset 10 -g 25 -svtav1-params
      film-grain=0 -f ivf), HasDecoder, containerFormat/decoderArgs (ivf + libdav1d); decode_test.go splits
      packets with splitStream (annexb or ivf) and joins streams with concatStreams (ivf.Writer for AV1)
  result:
    status: delivered 2026-10-09
    environment:
      host: Apple M3, macOS 26 (Darwin 27.0.0)
      go: go1.27.0 darwin/arm64
      purego: github.com/ebitengine/purego v0.11.1
      oracle: ffmpeg/ffprobe 9.0.1 with libsvtav1 (SVT-AV1 4.2.0) and libdav1d
      date: '2026-10-09'
    tests:
    - TestDecodeAV1MatchesReference (60 frames bit-exact, 28 hidden frames, 28 show_existing_frame units)
    - TestDecodeAV1WithoutTemporalDelimiters, TestDecodeAV1DecodeOrderOption, TestDecodeAV1InvalidData, TestDecodeAV1TenBit
      (53.50 dB)
    - TestDecodeRGBA/av1-rgba and av1-bgra (35.35 dB), TestDecodeParameterSetChange/av1, TestFlushResumesAtKeyframe/av1
    - TestProbe, TestUnsupportedCodec
    - internal/av1 unit and ffmpeg oracle tests; ivf unit and ffmpeg interop tests
    - go test ./... and CGO_ENABLED=0 go test ./... all ok; scripts/crossbuild.sh six targets ok
    performance:
      av1_1080p_decode_fps_nv12: 821
      av1_1080p_decode_fps_bgra: 308
      av1_1080p_decode_fps_rgba: 223
      note: cmd/hwmediacodec decode on an M3 over a 300-frame 1920x1080 SVT-AV1 (preset 10, -g 60) IVF
        file, including the CPU copy; RGBA pays for the Go R/B swap as with H.264
  learned:
  - VTIsHardwareDecodeSupported('av01') is 1 on the M3 before any registration call; VTRegisterSupplementalVideoDecoderIfAvailable('av01')
    changes nothing for AV1 (and VP9 stays 0 after registering it), so it is not called.
  - VideoToolbox accepts an AV1 temporal unit as one sample buffer with or without the leading temporal
    delimiter OBU and outputs the same frames; a unit holding hidden frames plus a shown frame yields one
    frame, and a 5-byte show_existing_frame unit yields the previously decoded hidden frame.
  - The hardware AV1 decoder runs synchronously under VTDecodeFrameFlags 0 like H.264/HEVC - the output
    callback fires before DecodeFrame returns - and its 8-bit output is bit-exact with libdav1d.
  - Main profile 10-bit input is accepted with a '420v' destination; VideoToolbox converts to 8-bit itself
    (53.5 dB against ffmpeg's conversion, no frame exact).
  - macOS 26 registers "SW AV1 Decoder" (com.apple.videotoolbox.videodecoder.av1.sw) in VTCopyVideoDecoderList
    next to the AVD hardware entry, but a session with EnableHardwareAcceleratedVideoDecoder=false fails with
    -12906, as does naming the DecoderID; applications cannot use it.
  - The av1C ffmpeg writes into MP4 is 0x81, profile/level, the flags byte and 0x00 followed by the sequence
    header OBU; a parser built from the specification reproduces it byte for byte.
  - SVT-AV1 at preset 10 with -g 25 produces temporal units with up to four hidden frames in front of
    a shown one and show_existing_frame units of 5 bytes, which is enough to exercise the hidden-frame path.
