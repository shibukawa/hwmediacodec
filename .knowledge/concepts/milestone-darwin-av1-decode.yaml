id: milestone:darwin-av1-decode
type: milestone
title: macOS AV1 decoding through VideoToolbox (Apple M3 and newer)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:bitstream, component:core-api, component:mediacontainer
  (keys prefixed av1mac-). Original summary: macOS slice, requested on 2026-10-09: AV1 decoding on the
  VideoToolbox backend. A Packet is one temporal unit in the low-overhead OBU format (an IVF frame or
  an ISOBMFF av01 sample); the sequence header is parsed in Go (internal/av1) to build the av1C record
  that CMVideoFormatDescriptionCreate takes as a SampleDescriptionExtensionAtoms entry; every temporal
  unit yields exactly one frame in presentation order, so the decoder implements codec.DisplayOrderer
  and bypasses the POC reorder layer. 8-bit output is bit-exact with libdav1d; Main profile 10-bit input
  is converted to 8-bit by VideoToolbox. A public ivf package reads and writes IVF files and the CLI reads
  IVF for -codec av1. No Apple Silicon chip has an AV1 encoder.'
lifecycle: superseded
authority: authored
aliases:
- AV1 decode
- av01
- AV1デコード
- IVF
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: darwin-av1-decode
non_goals:
- AV1 encoding (no Apple Silicon chip has an AV1 encoder; NewEncoder reports ErrUnsupported).
- AV1 on the Linux and Windows backends.
- The length-delimited (Annex B) AV1 bitstream format and container parsing beyond IVF.
- 10-bit output formats (P010); 10-bit input comes out as 8-bit.
- Film grain synthesis - the test streams are generated with film grain off, and what VideoToolbox does
  with film_grain_params_present streams is not measured.
