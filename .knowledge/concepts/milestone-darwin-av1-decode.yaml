id: milestone:darwin-av1-decode
type: milestone
title: macOS AV1 decoding through VideoToolbox (Apple M3 and newer)
summary: 'macOS slice, requested on 2026-10-09: AV1 decoding on the VideoToolbox backend. A Packet is
  one temporal unit in the low-overhead OBU format (an IVF frame or an ISOBMFF av01 sample); the
  sequence header is parsed in Go (internal/av1) to build the av1C record that CMVideoFormatDescriptionCreate
  takes as a SampleDescriptionExtensionAtoms entry; every temporal unit yields exactly one frame in
  presentation order, so the decoder implements codec.DisplayOrderer and bypasses the POC reorder
  layer. 8-bit output is bit-exact with libdav1d; Main profile 10-bit input is converted to 8-bit by
  VideoToolbox. A public ivf package reads and writes IVF files and the CLI reads IVF for -codec av1.
  No Apple Silicon chip has an AV1 encoder.'
lifecycle: active
authority: authored
aliases:
- AV1 decode
- av01
- AV1デコード
- IVF
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: darwin-av1-decode
constraints:
- CGO_ENABLED=0; every framework call goes through internal/videotoolbox/sys via purego; ffmpeg (libsvtav1
  as the encoder, libdav1d as the reference decoder) is a test oracle only.
- Packet.Data for AV1 is one temporal unit whose OBUs carry obu_has_size_field=1 (the last one may run
  to the end); temporal delimiter OBUs are optional and passed through; Annex-B does not apply.
- The AV1 decoder implements codec.DisplayOrderer returning true, so NewDecoder does not wrap it in
  the reorder layer; WithDecodeOrder is a no-op; Frame.PTS equals Packet.PTS; one Receive per temporal
  unit.
- Probe lists av1 decode only when VTIsHardwareDecodeSupported('av01') is non-zero; NewDecoder returns
  *UnsupportedError otherwise, also with WithSoftwareFallback, because VideoToolbox does not let applications
  instantiate its software AV1 decoder (checked with a probe session at NewDecoder time).
- Streams outside Main profile 4:2:0 (High and Professional profiles, monochrome) report ErrUnsupported
  from Send before a session is created; a different sequence header replaces the session.
non_goals:
- AV1 encoding (no Apple Silicon chip has an AV1 encoder; NewEncoder reports ErrUnsupported).
- AV1 on the Linux and Windows backends.
- The length-delimited (Annex B) AV1 bitstream format and container parsing beyond IVF.
- 10-bit output formats (P010); 10-bit input comes out as 8-bit.
- Film grain synthesis - the test streams are generated with film grain off, and what VideoToolbox does
  with film_grain_params_present streams is not measured.
acceptance:
  av1-bit-exact:
    text: Decoding an SVT-AV1 8-bit 4:2:0 IVF stream (320x240, 60 frames, keyframe every 25, hidden
      alternate reference frames shown later through show_existing_frame) to NV12 yields exactly libdav1d's
      frames, one frame per temporal unit in order, each carrying its packet's PTS, and the frame count
      equals ffmpeg's.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-reference-test
  av1-temporal-delimiters-optional:
    text: The same kind of stream with the temporal delimiter OBUs removed from every unit decodes to
      identical frames.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-no-td-test
  av1-rgba:
    text: WithOutputFormat(RGBA|BGRA) on AV1 returns tightly packed frames within 30 dB (8x8-block PSNR)
      of ffmpeg's BT.601 conversion, alpha 255, RGBA the exact mirror of BGRA.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-rgba-test
  av1-sequence-change:
    text: Two IVF streams of different sizes (320x240 then 160x120) written into one IVF file decode
      as 60 frames of the right sizes matching ffmpeg's frames; the session is recreated at the new
      sequence header.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-sequence-change-test
  av1-flush-resume:
    text: After Flush, Receive returns io.EOF; a non-key temporal unit is then skipped without error
      and decoding resumes at a key temporal unit; garbage input is ErrInvalidData; WithDecodeOrder returns
      the same frames in the same order.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-flush-resume-test
    - av1-decode-order-noop-test
  av1-ten-bit:
    text: A Main profile 10-bit stream decodes with NV12 requested - VideoToolbox converts to 8-bit, every
      frame within 45 dB PSNR of ffmpeg's conversion, and BGRA output works as well.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-ten-bit-test
  av1-parser-oracle:
    text: Split, ParseSequenceHeader, ParseFrameHeader and CodecConfigurationRecord agree with ffmpeg's
      trace_headers (OBU types and sizes, every sequence header field, show_existing_frame/frame_type/show_frame)
      and with the av1C ffmpeg writes into an MP4 of the same stream, on 8-bit and 10-bit SVT-AV1 streams;
      the synthetic unit tests cover the branches SVT-AV1 never takes.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - av1-parser-oracle-test
    - av1-parser-unit-test
  ivf-round-trip:
    text: ivf.Writer output is read back by ivf.Reader (and by ffprobe) with the same frames, timestamps,
      frame count and timebase, is byte-identical to ffmpeg's IVF of the same frames, and truncated files
      and bad signatures are errors.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - ivf-unit-test
  probe-and-unsupported:
    text: Probe lists videotoolbox av1 decode hardware=true on the M3; NewEncoder(AV1) and NewDecoder of
      an unknown codec return *UnsupportedError, as does NewDecoder(AV1) where Probe lists no AV1 hardware.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - probe-test
  builds:
    text: go test ./... and CGO_ENABLED=0 go test ./... pass, scripts/crossbuild.sh builds every target,
      and the ebitenvideo module still builds.
    scope:
      milestone: darwin-av1-decode
    verified_by:
    - build-check
