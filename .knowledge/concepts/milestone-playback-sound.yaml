history:
  implemented-2026-10-14:
    summary: Audio stream, device clock and Ebitengine output written and measured in a day; the device
      tests found the demuxer's unsynchronised reads and the stale ready signal, the fresh module cache
      of that morning found the go.sum mismatch.
  superseded-2026-10-16:
    summary: Re-applied onto main and folded into component:playback on 2026-10-16 so that the current state
      is read from one concept; this file keeps the slice's definition and timeline.
