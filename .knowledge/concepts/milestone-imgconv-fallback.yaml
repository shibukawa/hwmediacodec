id: milestone:imgconv-fallback
type: milestone
title: imgconv sample - HEIC/AVIF conversion that falls back to cgo-free codecs without hardware
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:examples (keys prefixed imgconv-). Original summary: The heifconv sample was renamed
  imgconv and now shows what to do when image/heif or image/avif answer ErrUnsupported: with -engine auto
  it switches to github.com/gen2brain/h265 (an HEVC and HEIC codec written in Go) for HEIC and github.com/gen2brain/avif
  (libavif with dav1d and libaom compiled to WebAssembly, run by wazero) for AVIF. On Apple Silicon this
  is what writes AVIF, since no chip there encodes AV1. The fallback lives in the sample; the core module
  does not depend on these libraries.'
lifecycle: superseded
authority: authored
aliases:
- imgconv
- heifconv
- pure Go fallback
- ソフトウェアフォールバック
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: imgconv-fallback
non_goals:
- A software fallback inside image/heif and image/avif.
- A fallback for the video converter (examples/convert).
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:image-heif
- relation: superseded_by
  to: component:examples
history:
  delivered-2026-10-10:
    summary: The author asked for the sample converter to use pure-Go encoders and decoders when there
      is no hardware codec, and for the sample to be called imgconv.
  superseded-2026-10-16:
    summary: Folded into component:examples on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
