id: milestone:imgconv-fallback
type: milestone
title: imgconv sample - HEIC/AVIF conversion that falls back to cgo-free codecs without hardware
summary: 'The heifconv sample was renamed imgconv and now shows what to do when image/heif or image/avif
  answer ErrUnsupported: with -engine auto it switches to github.com/gen2brain/h265 (an HEVC and HEIC codec
  written in Go) for HEIC and github.com/gen2brain/avif (libavif with dav1d and libaom compiled to WebAssembly,
  run by wazero) for AVIF. On Apple Silicon this is what writes AVIF, since no chip there encodes AV1. The
  fallback lives in the sample; the core module does not depend on these libraries.'
lifecycle: active
authority: authored
aliases:
- imgconv
- heifconv
- pure Go fallback
- ソフトウェアフォールバック
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: imgconv-fallback
constraints:
- 'The author asked for the fallback in the sample converter, not in the library: image/heif and image/avif
  stay hardware-only and the examples module takes the new dependencies (gen2brain/avif v0.6.0 with wazero
  v1.12.0, gen2brain/h265 v0.2.3).'
- 'The author asked for pure-Go codecs. gen2brain/h265 is Go code; no AV1 encoder or decoder written
  in Go was found, so the AVIF fallback is WebAssembly run by wazero: cgo-free, CGO_ENABLED=0 builds
  work, but it is not Go source. The README and the program''s messages say so.'
- 'Fallback only on errors.Is(err, hwmediacodec.ErrUnsupported), which also covers a hardware decoder
  that exists but refuses the stream (VideoToolbox and 4:4:4 AV1). Other errors are reported, not hidden.
  -engine hardware and -engine go force one side; who did the work is printed on standard error.'
- 'The hardware path encodes into memory, so nothing reaches the output when the fallback takes over, and
  a failed conversion leaves no file.'
- 'The fallback encoders store no irot: -rotate turns the pixels (same displayed picture). The AVIF fallback
  is told to write 4:2:0 because its default 4:4:4 (seq_profile 1) is refused by hardware decoders.'
- 'Both fallback libraries also register heic/avif with the image package when imported; the sample therefore
  calls the packages directly for HEIF input instead of image.Decode.'
non_goals:
- A software fallback inside image/heif and image/avif.
- A fallback for the video converter (examples/convert).
acceptance:
  fallback-round-trip:
    text: With -engine go both formats encode and decode within 32 dB (4x4-block PSNR) of the source, and
      where the machine has a hardware decoder it reads the fallback encoders' files to the same quality.
    scope:
      milestone: imgconv-fallback
    verified_by:
    - imgconv-test
  auto-choice:
    text: -engine auto uses the hardware for every format and direction Probe lists and the fallback otherwise;
      forcing the hardware where there is none is ErrUnsupported with nothing written.
    scope:
      milestone: imgconv-fallback
    verified_by:
    - imgconv-test
  cross-read:
    text: The fallback HEIC decoder reads the hardware encoder's files, a rotated 128-pixel grid included,
      with the same size and rotation direction.
    scope:
      milestone: imgconv-fallback
    verified_by:
    - imgconv-test
  command:
    text: On the M3, imgconv writes a 1000x700 PNG as AVIF through the fallback, reads it back with the
      hardware decoder, writes and reads a rotated HEIC with -engine go, and -engine hardware for AVIF output
      fails without leaving a file.
    scope:
      milestone: imgconv-fallback
    verified_by:
    - imgconv-run
