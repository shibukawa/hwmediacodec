open_questions:
  audio-encoder-queue-bound:
    text: The encoders re-applied on 2026-10-16 (libopus, libfdk-aac, MediaCodec, Media Foundation) check
      maxPending only before a Send, so one long frame still produces every packet at once - the case
      the second security review fixed for AudioToolbox and WebCodecs (Send encodes until the queue is
      full, Receive encodes the rest, Flush the remainder). Their input handling was also not reviewed
      against the standards of the codec hardening pass.
    state: answered
    resolution: 'Answered 2026-10-16 (PR #27): every encoder pumps up to the bound in Send and Receive and
      encodes the rest in Flush; libopus, libfdk-aac and MediaCodec are verified by the long-frame test
      (audiolx-long-frame, audiomc-long-frame), Media Foundation only compiles (audiomf-long-frame). Input
      handling: audioutil.CheckPacket bounds decoder packets at MaxPacketBytes (1 MiB) in the five re-applied
      decoders, NewAudioDecoder refuses a Config over 64 KiB, and the library-reported sizes are checked
      (opus_decode sample count, aacEncEncode consumed and written bytes, MediaCodec output ranges through
      outputRange, IMFMediaBuffer lengths, libavcodec planar line sizes).'
