id: component:audio
type: component
title: 'Audio: the AAC/Opus API, the AudioToolbox backend (macOS, iOS), the Linux library backends and MP4 audio tracks'
summary: NewAudioDecoder and NewAudioEncoder with AudioFormat and AudioFrame in the root package; AAC-LC/HE-AAC
  and Opus through AudioToolbox's AudioConverter on darwin and iOS, through WebCodecs in the browser (see
  backend:webcodecs), through MediaCodec on Android (backend:mediacodec, audiomc-), Media Foundation
  on Windows (backend:media-foundation, audiomf-) and libopus, libavcodec and libfdk-aac on Linux (audiolx-
  keys here), with the shared helpers in internal/audioutil; encoding/adts for .aac files; audio
  tracks in mediacontainer/mp4 with the encoder delay in the edit list. No bundled codec, PCM in and out,
  no devices (decision:audio-codecs). Consolidated on 2026-10-16 from milestone:audio-audiotoolbox and milestone:audio-linux.
lifecycle: active
authority: authored
aliases:
- audio support
- 音声対応
- AAC
- Opus
- AudioToolbox
- NewAudioDecoder
- NewAudioEncoder
- AudioFormat
constraints:
- AAC and Opus are values of the one Codec type (Codec.IsAudio tells them apart) so that Packet, PacketReader,
  Capability and UnsupportedError serve audio unchanged; NewDecoder and NewEncoder answer ErrUnsupported
  for them and name the audio constructor. Probe appends the audio capabilities with Hardware false; HWMEDIACODEC_BACKENDS
  filters the video backends only.
- 'AudioFormat is the hub type: {Codec, SampleRate, Channels, Config, FrameSamples, Delay}. Config is
  the AudioSpecificConfig for AAC and the OpusHead for Opus. Containers report it, AudioEncoder.Format
  returns it, NewAudioDecoder(ctx, format) and mp4.Muxer.AddAudioTrack(format, timeScale) take it. Without
  Config an AAC decoder assumes AAC-LC at SampleRate and Channels.'
- 'Packets are raw: one AAC access unit without ADTS header, one Opus packet. Every audio packet is a
  keyframe. Packet gained Duration (TimeScale units, 0 when unknown; set by audio encoders, left 0 by
  the video encoders).'
- A decoder returns one AudioFrame per packet, with the packet's PTS and every sample the packet codes
  (delay and padding included); it has no time scale of its own. AudioFrame is plain Go memory (interleaved
  S16 or F32 little-endian in Data), needs no Release, and has Int16s/Float32s views; S16Frame/F32Frame
  wrap slices as encoder input.
- 'An encoder takes frames of any length as one continuous signal anchored at the PTS of the first frame
  after start or Flush; packet k has PTS base + (k*FrameSamples - Delay) and a Duration cut at the last
  sample sent, both rescaled from samples to the time scale (default: the sample rate). WithBitrate and
  WithRateControl return SharedEncoderOption (video and audio); Option (WithTimeScale, WithSoftwareFallback)
  is accepted by all four constructors; WithSampleFormat is the audio-only option.'
- 'AudioConverter is driven piecewise: the input callback returns a private status (''hwnd'') when it
  has nothing to give, which AudioConverterFillComplexBuffer passes through while keeping its state; 0
  packets with noErr means end of stream and is followed by AudioConverterReset. Callbacks reach their
  queue through an integer handle, never a Go pointer; the chunk handed out stays referenced until the
  next callback.'
- 'Observed AudioToolbox behaviour (macOS 27, Apple M3, 2026-10-13): the AAC encoder reports 1024 samples
  per packet and a delay (kAudioConverterPrimeInfo leadingFrames) of 2112; the Opus encoder 960 and 312,
  48 kHz only here. The AAC magic cookie is an ES_Descriptor around the AudioSpecificConfig. The AAC-LC
  decoder gives 1024 samples per packet at once. The Opus decoder withholds its first 120 samples for
  good (given back as silence, they lie inside the pre-skip) and needs the packet length in its input
  description (a new converter when it changes); packets of several frames (60 ms from libopus) decode.
  The HE-AAC decoder runs 962 samples behind and returns them at end of stream, so the decoder keeps a
  sample queue and emits frames one packet late for HE-AAC only.'
- Asked for kAudioFormatMPEG4AAC, the decoder plays only the AAC-LC core of an HE-AAC stream (half the
  rate, mono under parametric stereo). The backend parses the AudioSpecificConfig itself and asks for
  'aach' or 'aacp' when SBR or PS is signalled (explicitly or by sync extension). Implicitly signalled
  HE-AAC (ADTS) stays core-only.
- 'AudioToolbox''s Opus encoder starts in the VoIP application (2048). There is no property for it; it
  is the first of seven big-endian uint32 in the encoder''s compression magic cookie ([application, sample
  rate, frame samples, bitrate (-1000 = auto), channels, 0, 0]), and writing the cookie back with 2049
  (audio) takes effect: the round-trip SNR of the test signal rises from 17 dB (with a phase lead of 2
  to 5 samples) to 36 dB at shift 0. The layout is undocumented, so the backend only writes when the cookie
  is 28 bytes and its first, second and fifth fields match what it expects.'
- A refused kAudioConverterEncodeBitRate leaves the converter unable to answer kAudioConverterApplicableEncodeBitRates,
  so the list for the error message is read before the attempt. AAC CBR holds the average only (bit reservoir);
  Opus CBR makes every packet the same size. The channel layout properties are 'ocl ' and 'icl ' (with
  a space); the decoder's default output layout is already the WAV order (MPEG_x_A tags) and the backend
  sets it explicitly for more than two channels.
- 'MP4: an audio track written from packets gets an edit list starting at the encoder delay; the edit
  duration is rounded up to the movie time scale (1/1000 s) because ffmpeg cuts the track at the end of
  the edit, while the sample durations bound it exactly. Tracks written from packets share a clock: the
  one whose presentation starts later gets an empty edit of the difference in front; passthrough tracks
  keep their source''s edit list. Demuxed audio packets have PTS minus the edit offset, so the delay lies
  before 0. AudioPacketSource.SeekKeyframe positions one packet (AAC) or 80 ms (Opus) before the target.'
- 'Registration order (backends_linux.go): libopus, libavcodec, fdk-aac. AAC decodes with libavcodec
  where both are installed, because the FDK builds of Fedora and Ubuntu 24.04 (fdk-aac-free) are AAC-LC
  only; libfdk-aac is there for its encoder and as the decoder of machines without libavcodec.'
- 'libopus: libopus.so.0; opus_decode / opus_decode_float into a 5760-sample buffer, one frame per packet;
  encoder at 48 kHz, mono or stereo, OPUS_APPLICATION_AUDIO, 960-sample packets from a FIFO, bitrate
  and VBR/CBR through opus_encoder_ctl (variadic, called with three fixed arguments, which works on amd64
  and arm64), delay from OPUS_GET_LOOKAHEAD (312). Decoder and encoder states are recreated on Flush.'
- 'libavcodec: libavcodec.so.62 down to .58 (anything else is not loaded, and avcodec_version is checked);
  libavutil symbols are found through the same handle. Only functions and the heads of three structures
  are used, which are identical from 58 to 62: AVCodecParameters (codec_type@0, codec_id@4, extradata@16,
  extradata_size@24), AVPacket (data@24, size@32) and AVFrame (data@0, linesize@64, extended_data@96,
  nb_samples@112, format@116). The AudioSpecificConfig goes in as av_mallocz''d extradata with 64 bytes
  of padding; the packet borrows the caller''s bytes (no AVBufferRef, so the library copies). The channel
  count is read from the frame''s planes (planar) or av_opt_get_int "ac" / linesize (packed), the rate
  from av_opt_get_int "ar". Sample formats S16, S32 and FLT, packed or planar. Decode only: encoding
  would need AVFrame.ch_layout, whose place changed between versions.'
- 'libfdk-aac: libfdk-aac.so.2 or .so.1. Decoder: TT_MP4_RAW, aacDecoder_ConfigRaw with the AudioSpecificConfig,
  AAC_PCM_OUTPUT_CHANNEL_MAPPING 1 (WAV order), AAC_PCM_LIMITER_ENABLE 0 and AAC_CONCEAL_METHOD 1 -
  the limiter and the default concealment of AAC-LC (energy interpolation) each delay the output, the
  latter by a whole packet, which showed as a 1024-sample shift against ffmpeg and as a measured encoder
  delay of 3072 instead of 2048 before it was set. Only the first three fields of CStreamInfo are read.
  Encoder: AOT 2, bitrate mode 0 (both rate controls), afterburner on, raw access units, input in WAV
  order; delay measured by audioutil.MeasureDelay with the backend''s own decoder (2048), new handle
  per signal.'
- 'aacDecoder_GetLibInfo with 64 zeroed LIB_INFO entries tells whether the FDK library has the SBR decoder
  module (FDK_SBRDEC = 5). Without it (fdk-aac-free) an explicitly signalled HE-AAC stream is refused
  with ErrUnsupported instead of being decoded as its core at half the rate.'
- 'HE-AAC: both libraries leave the 962 samples of the band replication''s delay in their output (aac.SBRDecoderDelay).
  When the decoded rate differs from the core rate the backends skip that many samples at the start
  (audioutil.Frames.Skip) so that HE-AAC lies where AudioToolbox puts it; the tail comes from aacDecoder_DecodeFrame
  with AACDEC_FLUSH for the FDK library and is silence for libavcodec, whose decoder has nothing to
  drain.'
- 'HWMEDIACODEC_AUDIO_BACKENDS is a list like HWMEDIACODEC_BACKENDS (selectBackends became generic).
  When no backend takes a request the error reported is the first one from a backend that implements
  the codec (codec.NotImplemented marks the others), so a refused bitrate is explained by the encoder
  and not by the last backend in the list.'
- 'ffmpeg 7 and older play the padding of AAC behind an MP4 edit list (ffmpeg 9 on the Mac trims it);
  the mux tests accept both.'
- 'Every audio encoder takes a frame of any length in parts: Send encodes until maxPending packets wait
  and keeps the rest, Receive encodes more as it hands packets out, Flush encodes the remainder (the
  queue may then exceed the bound by what one frame codes to). MediaCodec is asynchronous, so there the
  bound is on the input handed over; the queue passes it by at most the packets of the codec''s buffers
  in flight. internal/testutil.CheckLongFrame is the shared regression check.'
acceptance:
  audioat-aac-decode-matches-ffmpeg:
    text: AAC-LC streams from ffmpeg's encoder (48 kHz stereo, 44.1 kHz mono, 22.05 kHz stereo in ADTS;
      48 kHz stereo and 44.1 kHz mono in MP4; 3.0, 4.0, 5.0 and 5.1 in ADTS) decode to as many samples
      as ffmpeg's decoder gives with -flags2 +skip_manual, at shift 0 and at least 50 dB (30 dB per channel
      for the layouts with more than two, where the order must be the WAV order); S16 and F32 output agree.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-root-audio-tests
    - audioat-mp4-audio-tests
  audioat-opus-decode-matches-libopus:
    text: Opus in MP4 from libopus (stereo and mono; 10, 20 and 60 ms packets) decodes to libopus's samples
      at shift 0 and at least 50 dB outside the first 120 samples, with one frame of the packet's length
      per packet.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-mp4-audio-tests
  audioat-presentation-is-the-input:
    text: Dropping the decoded samples before PTS 0 and after the track length leaves exactly the samples
      of the signal that was encoded, at shift 0, for AAC and Opus files from ffmpeg and for files written
      by this library.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-mp4-audio-tests
  audioat-encode-decodable-in-place:
    text: ffmpeg decodes the encoder's AAC packets from an ADTS file and from an MP4 file, and its Opus
      packets from an MP4 file, to the input signal at shift 0 (which checks Delay to the sample); packet
      PTS, DTS and Duration follow k*FrameSamples - Delay and end at the last input sample; ffprobe reports
      codec, rate, channels, packet count, start 0 and the duration within 2 ms.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-root-audio-tests
    - audioat-mp4-audio-tests
  audioat-bitrate-control:
    text: With noise as input, 64 and 160 kbit/s requests give that rate within 5 percent under CBR (and
      equal packet sizes for Opus) and within -40/+30 percent under VBR, for AAC and Opus.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-root-audio-tests
  audioat-flush-reuse-errors:
    text: After Flush an encoder codes a second signal with the same packets at moved timestamps and a
      decoder entered in the middle of a stream lands on the samples of a full decoding once run in; unsupported
      requests (Opus at 44.1 kHz, 2 Mbit/s AAC, six channels, an odd rate, an unknown sample format, video
      codecs, audio codecs given to the video constructors) match ErrUnsupported, frames that do not fit
      the encoder and broken configs match ErrInvalidData, and calls after Close match ErrClosed.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-root-audio-tests
  audioat-he-aac-decode:
    text: HE-AAC and HE-AAC v2 files from afconvert report 48 kHz stereo with frames of 2048, decode to
      one such frame per packet, and place the input signal 4224 samples in (the encoder delay at the
      output rate) at shift 0; a second decoding after Flush is identical.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-mp4-audio-tests
  audioat-av-offset-in-file:
    text: A file with an H.264 track copied from packets and an AAC track whose signal starts 500 ms after
      the first picture (or 250 ms before it) shows those start times in ffprobe within 1.5 ms, and the
      sound decodes in place.
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-mp4-audio-tests
  audioat-audio-seek:
    text: After AudioPacketSource.SeekKeyframe to targets across an AAC and an Opus track (0, 10 ms, 1.234
      s, 2.9 s, past the end), decoding from the returned position and cutting at the target gives the
      samples a decoding from the start has there (20 dB or more).
    scope:
      milestone: audio-audiotoolbox
      platform: darwin
    verified_by:
    - audioat-mp4-audio-tests
  audioat-headers-pure-go:
    text: The AudioSpecificConfig parser (AAC-LC, 960-sample frames, hierarchical and backward compatible
      HE-AAC signalling, explicit rates), the ADTS header reader and writer (byte-identical to ffmpeg's
      header for the same stream), the Opus TOC durations and OpusHead, the ADTS reader/writer round trip
      with ID3 skipping and truncation errors, Rescale and the AudioFrame views pass on any platform.
    scope:
      milestone: audio-audiotoolbox
      platform: &id001
      - darwin
      - ios
    verified_by:
    - audioat-header-unit-tests
  audioat-ios-simulator:
    text: The root package's test binary built for ios/arm64 against the iPhoneSimulator SDK and run with
      xcrun simctl spawn passes the tests that need no ffmpeg (round trip for AAC and Opus in S16 and
      F32, bitrate control, flush and reuse, errors, garbage input, Probe).
    scope:
      milestone: audio-audiotoolbox
      platform: ios
    verified_by:
    - audioat-simulator-test-run
  audioat-iphone-run:
    text: The same audio tests, or an app that decodes and encodes AAC and Opus, run on an iPhone.
    scope:
      milestone: audio-audiotoolbox
      platform: ios
    verified_by:
    - audioat-iphone-audio-run
  audioat-existing-suites:
    text: go test ./... in the core module, go build and go vet in ebitenvideo, examples and net/webrtc,
      scripts/crossbuild.sh and scripts/mobilebuild.sh pass after the change.
    scope:
      milestone: audio-audiotoolbox
      platform: *id001
    verified_by:
    - audioat-existing-suites
  audiolx-containers:
    text: 'scripts/linux_audio_test.sh passes on Debian 12 and 13, Ubuntu 22.04 and 24.04 and Fedora (libavcodec
      59, 61, 58, 60 and 62; full and "free" FDK builds), each with every backend, with libopus,fdk-aac and
      with libopus,libavcodec: the audio tests of the root package, playback, mediacontainer/mp4, encoding/adts
      and internal/audioutil, HE-AAC included (files made by afconvert on the Mac).'
    scope:
      milestone: audio-linux
      platform: linux
    verified_by:
    - audiolx-container-run
  audiolx-amd64:
    text: The same tests pass on linux/amd64.
    scope:
      milestone: audio-linux
      platform: linux
    verified_by:
    - audiolx-amd64-run
  audiolx-no-libraries:
    text: On a system without the libraries Probe lists no audio, the constructors return ErrUnsupported
      naming the missing library, and the tests skip.
    scope:
      milestone: audio-linux
      platform: linux
    verified_by:
    - audiolx-bare-run
  audiolx-long-frame:
    text: One Send of a minute of PCM to the libopus and libfdk-aac encoders queues at most maxPending packets, a second Send gets ErrAgain, Receive encodes the rest without the queue passing the bound, and after Flush the packets cover every sample plus the delay.
    scope:
      platform: linux
    verified_by:
    - audiolx-long-frame-run
