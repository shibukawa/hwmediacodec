id: backend:mediacodec
type: backend
title: Android MediaCodec (NDK libmediandk.so)
summary: Android's one codec API. AMediaCodec is a full decoder/encoder (display-order output with the
  input timestamps attached, parameter sets in a codec-config buffer) behind which the vendor's hardware
  codecs sit; the NDK C API is driven synchronously through purego in internal/mediacodec. The same bindings
  decode and encode AAC and Opus (keys audiomc-).
lifecycle: active
authority: inferred
aliases:
- MediaCodec
- AMediaCodec
- libmediandk
- NDK MediaCodec
- Android backend
scope:
  platform: android
constraints:
- Android 14 (API 34) is the documented minimum, chosen by the author from endoflife.date; the NDK MediaCodec
  API has only grown since API 21 and every symbol the backend binds exists from API 28, so nothing is
  probed for presence at run time (Load fails as a whole on older systems).
- Builds need CGO_ENABLED=1 and the NDK clang (purego on Android); the backend has no cgo source. The
  build tag "android || mediacodec_typecheck" lets go vet check it on any host; layout.go, paramsets.go
  and names.go carry no tag and run under go test everywhere.
- Hardware versus software is decided from AMediaCodec_getName (c2.android.*, OMX.google.*, ".sw."); Probe
  lists hardware codecs only, NewDecoder/NewEncoder refuse software ones without WithSoftwareFallback.
- The decoder is configured when the picture size is known (SPS or AV1 sequence header parsed in Go);
  a size change runs the codec to end of stream, stops and reconfigures it. Output buffers are read through
  the layout the output format describes; an unknown layout is ErrUnsupported quoting the format.
- Encoder input is NV12 (colour format 21) or, when refused, I420 (19), converted while copying; forced
  keyframes go through AMediaCodec_setParameters request-sync; parameter sets from the codec-config buffer
  are prepended to keyframes that lack them. AV1 encoding is not offered.
- H.264 and HEVC frames go through the Go reorder layer (OutputsDisplayOrder false; MediaCodec orders
  output by input timestamps), AV1 is passed through; RGBA/BGRA go through pixconv as on the other NV12-only
  backends.
- 'Decoder: audio/mp4a-latm with csd-0 = AudioSpecificConfig; audio/opus with csd-0 = an OpusHead whose
  pre-skip is 0 and csd-1 and csd-2 (codec delay and seek pre-roll, in ns) = 8 zero bytes each, so that
  the decoder discards nothing and every packet yields all its samples. Output is PCM 16, converted to
  float in Go when asked for. Frames are matched to packets by order through audioutil.Frames.'
- 'Encoder: MediaCodec does not report the delay, so the first encoder for (codec, rate, channels) runs
  audioutil.MeasureDelay with an encoder and a decoder of its own; measured 2048 for AAC and 312 for Opus
  on the Android 14 emulator, which are also the assumed values when the trial fails. Default bitrates
  64 kbit/s per channel for AAC and 48 for Opus. AAC rates outside the table of the standard are refused
  (MediaCodec configures for them and codes something else).'
- 'Flush sends Delay + 2 frames of silence and the end-of-stream flag, drops the packets that start at
  or behind the last real sample (audioutil.PacketTimes) and releases the codec; the next signal gets
  a new one, so that it starts like the first.'
- 'internal/audioutil: TrialSignal, SignalDelay, LostLead, MeasureDelay (moved from the browser backend),
  Frames (Expect, Append, Skip, Pad, Scale, End, Reset), PacketTimes (packet k has PTS base + k*frame
  - delay, duration cut at the last sample), S16/F32 conversion.'
- 'cmd/hwmediacodec decode-audio writes every sample of an .aac file or an MP4 audio track as raw PCM;
  encode-audio turns raw PCM into .aac or MP4. internal/audiocmp makes the test signal on the host and
  compares PCM files (alignment and signal-to-noise ratio).'
