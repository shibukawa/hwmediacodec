id: backend:mediacodec
type: backend
title: Android MediaCodec (NDK libmediandk.so)
summary: Android's one codec API. AMediaCodec is a full decoder/encoder (display-order output with the
  input timestamps attached, parameter sets in a codec-config buffer) behind which the vendor's
  hardware codecs sit; the NDK C API is driven synchronously through purego in internal/mediacodec.
