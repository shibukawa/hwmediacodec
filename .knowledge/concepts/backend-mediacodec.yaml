facts:
  library: libmediandk.so (dlopen; part of every Android system image, public NDK API)
  api_model: full decoder/encoder; synchronous dequeue/queue with timeouts, no AMediaCodec_setAsyncNotifyCallback
  minimum: Android 14 (API 34) documented; every symbol used exists from API 28 (AMediaCodec_getName,
    AMediaCodec_getInputFormat, AMediaFormat_getRect are the newest); Load fails below and the backend
    is absent
  key_calls:
    common:
    - AMediaCodec_createDecoderByType / createEncoderByType (video/avc, video/hevc, video/av01)
    - AMediaCodec_getName (hardware vs software by name), AMediaCodec_configure, start, stop, flush, delete
    - AMediaCodec_dequeueInputBuffer, getInputBuffer, queueInputBuffer
    - AMediaCodec_dequeueOutputBuffer, getOutputBuffer, releaseOutputBuffer, getOutputFormat
    decode:
    - csd-0/csd-1 from the Go parameter-set store; width/height from the SPS or AV1 sequence header
      parsed in Go
    - 'output: COLOR_FormatYUV420Flexible byte buffers; layout from "image-data" (MediaImage2) or
      color-format 19/21 + stride + slice-height; crop from "crop" or crop-left/top/right/bottom'
    encode:
    - color-format 21 (NV12) then 19 (I420); layout from AMediaCodec_getInputFormat
    - bitrate, bitrate-mode (VBR 1, CBR 2, CQ 0 + quality), frame-rate, i-frame-interval, profile +
      level, latency/low-latency, max-bframes, color-standard/range/transfer, prepend-sps-pps-to-idr-frames
    - AMediaCodec_setParameters request-sync for forced keyframes
  software_names: c2.android.*, OMX.google.*, anything containing ".sw." (MediaCodecInfo.isSoftwareOnly
    logic); refused unless WithSoftwareFallback; emulators have nothing else
  display_order: H.264/HEVC through the Go reorder layer (OutputsDisplayOrder false) because MediaCodec
    orders output by the timestamps it is given - the Android 14 emulator's goldfish decoders returned
    decode-order packets with decode-order timestamps in decode order (2026-10-12); AV1 native (one
    shown frame per temporal unit, units in presentation order). Timestamps carried through
    presentationTimeUs in microseconds, kept unique per in-flight frame
  ffi_notes:
  - purego on Android needs CGO_ENABLED=1 (dlfcn_android.go uses internal/cgo); the NDK clang is the
    C compiler; ebitenmobile bind sets this up.
  - No callbacks are used, so purego.NewCallback is not exercised by this backend.
  - string parameters are passed as Go strings (purego converts), AMediaCodecBufferInfo as a 24-byte
    struct by pointer; layouts asserted in sys/types_test.go.
  - The backend compiles on any host with the mediacodec_typecheck build tag for go vet; the pure-Go
    layout code (layout.go, paramsets.go, names.go) carries no tag and is unit-tested everywhere.
  emulator_findings_2026-10-12:
  - The NDK output format does carry "image-data" (MediaImage2) for flexible output; its mType for YUV
    is 1 (the enum is sequential), not 0x100 - the first run rejected every frame until that was fixed.
  - With a 320x240 stream the MediaImage2 describes the whole 320x240 buffer with stride 320 and the
    crop rectangle (0,0,319,239); offsets relative to the buffer worked (BufferInfo.offset was 0).
  - 'The "prepend-sps-pps-to-idr-frames" key makes configure fail with BAD_VALUE on c2.android.avc.encoder
    (CCodec "Failed to set KEY_PREPEND_HEADER_TO_SYNC_FRAMES"); the key is no longer set. "max-bframes"
    and "color-format" are logged as having no C2 equivalent and are ignored.'
  - MediaCodec output order follows the input timestamps; the reorder layer now sorts H.264/HEVC, and
    the layer itself had to be fixed to drain the backend fully after Flush before releasing frames.
  - c2.goldfish.h264.decoder / c2.goldfish.hevc.decoder (host-side decoding) are classified as hardware
    by name and decode bit-exactly against ffmpeg; the software AV1 decoder and the software encoders
    are refused without WithSoftwareFallback, as designed.
  risks_until_a_device_run:
  - Vendor codecs whose MediaImage2 or crop semantics differ from the emulator's (buffers larger than
    the picture, BufferInfo.offset other than 0).
  - Whether configure needs "level" alongside "profile" on every vendor; both are set.
  - Whether a vendor hardware decoder keeps the input timestamp attached to the right picture (the
    reorder layer relies on it); the goldfish decoders do.
  - AV1 csd: none is set; the sequence header travels in-band and is re-inserted at key temporal units.
  alternative_if_needed: AImageReader (YUV_420_888 with AImage plane accessors) as the decoder's output
    surface, when a vendor codec's ByteBuffer layout turns out unreadable.
  support_tier: proposed (policy:support-tiers mobile_proposed)
