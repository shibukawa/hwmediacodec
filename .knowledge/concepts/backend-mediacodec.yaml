  audiomc-emulator-audio:
    text: 'scripts/android_device_check.sh on the Android 14 emulator: AAC from MP4 and ADTS and Opus from
      MP4 decode to ffmpeg''s samples in place; AAC and Opus encoded on the device decode with ffmpeg to
      the input in place; the tests that need no ffmpeg pass on the device.'
    scope:
      milestone: audio-mediacodec
      platform: android
    verified_by:
    - audiomc-emulator-audio-run
  audiomc-device-audio:
    text: The same script passes on a physical Android device.
    scope:
      milestone: audio-mediacodec
      platform: android
    verified_by:
    - audiomc-device-audio-run
  audiomc-long-frame:
    text: One Send of a minute of PCM to the MediaCodec AAC encoder hands the codec input only while fewer than maxPending packets wait (the queue passes the bound by at most what the codec's buffers in flight hold), Receive hands the rest over, and after Flush the packets cover every sample plus the delay.
    scope:
      platform: android
    verified_by:
    - audiomc-long-frame-run
