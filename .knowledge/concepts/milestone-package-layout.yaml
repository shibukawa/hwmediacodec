id: milestone:package-layout
type: milestone
title: Package layout of the core module - encoding/, mediacontainer/, image/, net/, capture
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:core-api (keys prefixed layout-). Original summary: With sample code promoted
  to supported packages, the core module was regrouped by what each package is: the root package stays
  the codec API; encoding/annexb (was annexb) is the H.264/HEVC byte stream format; mediacontainer/{mp4,ivf,hls}
  are the containers (ivf was at the root); image/heif is the still-image format; capture is the recorder.
  The author said compatibility with v0.1.0 import paths is not needed yet, so there are no forwarding
  packages.'
lifecycle: superseded
authority: authored
aliases:
- package layout
- import paths
- パッケージ構成
scope:
  milestone: package-layout
non_goals:
- Changing any API of annexb or ivf; the move is import paths only.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:mediacontainer-hls
- relation: superseded_by
  to: component:core-api
history:
  delivered-2026-10-10:
    summary: The author suggested moving annexb (as encoder/annexb or similar), said compatibility was
      not needed and asked for the best layout.
  superseded-2026-10-16:
    summary: Folded into component:core-api on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
