id: milestone:package-layout
type: milestone
title: Package layout of the core module - encoding/, mediacontainer/, image/, net/, capture
summary: 'With sample code promoted to supported packages, the core module was regrouped by what each
  package is: the root package stays the codec API; encoding/annexb (was annexb) is the H.264/HEVC byte
  stream format; mediacontainer/{mp4,ivf,hls} are the containers (ivf was at the root); image/heif is
  the still-image format; capture is the recorder. The author said compatibility with v0.1.0 import paths
  is not needed yet, so there are no forwarding packages.'
lifecycle: active
authority: authored
aliases:
- package layout
- import paths
- パッケージ構成
scope:
  milestone: package-layout
constraints:
- 'No compatibility shims: the author stated on 2026-10-10 that compatibility is not needed yet and asked
  for the best layout. Programs written against v0.1.0 must change hwmediacodec/annexb to hwmediacodec/encoding/annexb
  and hwmediacodec/ivf to hwmediacodec/mediacontainer/ivf.'
- 'annexb is under encoding/, in the sense of the standard library''s encoding/json and encoding/binary:
  a data format that is both read and written (decoders consume Annex-B access units, encoders produce them).
  It is not a container, so it is not under mediacontainer/. It was first moved to bitstream/annexb because
  the author''s "encoder/annexb" was read as the encoder side only; the author meant encoding/ and it was
  renamed the same day.'
- 'encoding/, mediacontainer/ and image/ are namespace directories without Go files, named after their
  standard-library counterparts where one exists (encoding, image).'
- 'ebitenvideo, net/webrtc (added 2026-10-10, milestone:net-webrtc) and examples are separate modules
  because of Ebitengine and pion; both import the new
  paths and, like the other moves, need a core release before their go.mod can require it.'
- 'HLS is under net/ (net/hls, first placed at mediacontainer/hls): it is an HTTP delivery protocol on
  top of the mp4 segments, not a container; the author asked for net/hls and net/webrtc.'
non_goals:
- Changing any API of annexb or ivf; the move is import paths only.
acceptance:
