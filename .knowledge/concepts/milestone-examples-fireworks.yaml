id: milestone:examples-fireworks
type: milestone
title: Examples - fireworks scene with a Kage post-process for record, hls and webrtc; browser auto-open
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:examples (keys prefixed exfw-). Original summary: The plain colour-bar demo behind
  the recording and streaming samples is replaced by a fireworks show (examples/internal/fireworks): additive
  star particles in a current layer plus a fading persistence buffer, a Kage shader for sky, stars, bloom,
  skyline and water reflection, six shell types on keys 1-6, a gopher-shaped shell on G (stars aimed at
  a gopher silhouette with deliberate distortion) that the automatic show also fires now and then, space/F/A
  for random, volley and auto. hls and webrtc open the player page with github.com/pkg/browser (-open=false
  to skip).'
lifecycle: superseded
authority: authored
