id: milestone:examples-fireworks
type: milestone
title: Examples - fireworks scene with a Kage post-process for record, hls and webrtc; browser auto-open
summary: 'The plain colour-bar demo behind the recording and streaming samples is replaced by a fireworks
  show (examples/internal/fireworks): additive star particles in a current layer plus a fading persistence
  buffer, a Kage shader for sky, stars, bloom, skyline and water reflection, six shell types on keys 1-6,
  a gopher-shaped shell on G (stars aimed at a gopher silhouette with deliberate distortion) that the
  automatic show also fires now and then, space/F/A for random, volley and auto. hls and webrtc open the
  player page with github.com/pkg/browser (-open=false to skip).'
lifecycle: active
authority: authored
aliases:
- fireworks sample
- gopher firework
- 花火サンプル
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-fireworks
constraints:
- 'Rendering: stars are 32 px radial sprites drawn with BlendLighter into cur (full brightness, cleared
  each frame); acc is faded by a SourceOver black at alpha 0.09 plus a ReverseSubtract of 2/255 (a pure
  multiplicative fade leaves permanent faint ghosts in 8-bit buffers) and then receives cur at 0.14; the
  shader reads cur, acc and the skyline mask (Images[0..2], all screen-sized as DrawRectShader requires).'
- 'The first version drew every frame at full brightness into one accumulating buffer and saturated to
  white blobs; the two-layer split and smaller sprites fixed it.'
- 'Gopher shell: silhouette from ellipses (body, ears, eyes with pupil holes, snout, nose, teeth, arms,
  feet) sampled at density 0.13 points per unit area with per-feature multipliers (body 0.55, eyes 1.3,
  teeth 1.6) and outlines; star velocity v0 = (target - gravityFall)/travel where travel and fall are
  integrated with the scene''s own particle.step at the scene TPS (a closed-form exponential was 2.5 % off
  the discrete integration); tilt +-0.15 rad, scale 0.92-1.08 per axis, 2.5-unit jitter; forms in 1.1 s,
  then sinks.'
- 'Shells: v = sqrt(2 g h) for a chosen apex, trail sparks every tick, burst when vy >= 0; Crackle stars
  carry splitAt and explode into six sparks; all sizes scale with height/720.'
- Scene cost at 720p on the M3 with the record sample capturing is about 5-7 ms per draw including ReadPixels;
  60 fps is kept.
- The window keeps the keyboard; browsers only watch. browser.OpenURL is called after the HTTP server starts;
  failures are printed, not fatal.
- 'Title screen (added on the author''s request): the scene starts idle with a centred "HANABI" title, a
  blinking "PRESS A FOR THE AUTO SHOW" and the key list, drawn with text/v2 and the Go Regular font from
  golang.org/x/image; A starts the automatic show, any other key starts manual play and is handled as a
  launch key when it is one; Scene.Start(auto) does the same from code. record skips the title (-auto
  defaults to true, -launch starts manual play), hls and webrtc show it unless -auto.'
- 'Screen-off streaming: Ebitengine needs a window to exist (no headless backend), but it keeps running
  Update/Draw while the window is minimized on macOS - measured 2026-10-09 with hls -auto -minimized: the
  window minimized 1 s after start and after 14 s the playlist held five 2.000 s segments at 60 fps. The
  -minimized flag does that; a truly windowless stream would render frames without Ebitengine and feed the
  same Recorder/Segmenter/Broadcaster, which never touch the display.'
non_goals:
- Sound, mouse aiming, perspective/3D bursts beyond the sphere projection, physically based smoke, multiple
  gopher poses.
