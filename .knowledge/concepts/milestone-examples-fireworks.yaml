    text: gopherPoints yields 500-1600 points inside the box, none inside the pupils, all colour classes
      present with at least 100 white (eye/teeth) points; after 1.1 s of integration at 60 TPS a burst at
      (600, 300) spans about 280x290 px centred within 25/40 px, white stars sitting in the upper half.
    scope:
      milestone: examples-fireworks
    verified_by:
    - fireworks-unit-test
  solver-exact:
    text: A star aimed with displacementForUnitVelocity lands within 1 px of its target after the formation
      time.
    scope:
      milestone: examples-fireworks
    verified_by:
    - fireworks-unit-test
  looks:
    text: Recorded through the record sample, frames show distinct shell types with trails, the skyline with
      lit windows and a rippled reflection, and the gopher shell forms a recognisable gopher (ears, round
      body, white eyes) that then fades.
    scope:
      milestone: examples-fireworks
    verified_by:
    - fireworks-record-run
