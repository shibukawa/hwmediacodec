id: milestone:audio-webcodecs
type: milestone
title: Audio codecs (AAC, Opus) in the browser through WebCodecs
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:webcodecs (keys prefixed audiowc-). Original summary: Requested on 2026-10-13 after
  the browser video backend was merged ("mainが更新されたのでrebaseして ください。ブラウザ向けの動画再生が入りました。音声側もブラウザ対応をお願いします"):
  the audio branch was rebased onto main and internal/webcodecs gained the audio half of the API on AudioDecoder,
  AudioEncoder, AudioData and EncodedAudioChunk, registered by backends_js.go. Same public API and the
  same timestamp rules as the AudioToolbox backend; the encoder delay, which WebCodecs does not report,
  is measured in the page. The root package''s audio tests run in the browser through scripts/browser_test.sh
  and pass in Chrome, Safari and Firefox on macOS with the limits each browser has.'
lifecycle: superseded
authority: authored
aliases:
- browser audio
- ブラウザ音声対応
- AudioDecoder
- AudioEncoder
- WebCodecs audio
- encoder delay calibration
scope:
  platform: js
  milestone: audio-webcodecs
non_goals:
- Synchronised playback with sound in the browser (the playback slice, see decision:audio-codecs).
- Chrome on Windows, Linux and Android, where the AAC encoder is another one or missing (not run; the
  delay measurement is what is meant to cover them).
- Changing Safari's Opus application or Chrome's handling of bitrates, which a page cannot.
- Compensating the 962-sample SBR delay of Chrome's HE-AAC decoder (the page cannot tell which decoder
  it has).
- Detecting a channel order from the stream instead of from the user agent for WebKit.
relations:
- relation: implements
  to: requirement:hwmediacodec
- relation: constrained_by
  to: decision:audio-codecs
- relation: extends
  to: milestone:browser-webcodecs
- relation: follows
  to: milestone:audio-audiotoolbox
- relation: extends
  to: backend:webcodecs
- relation: superseded_by
  to: backend:webcodecs
history:
  implemented-2026-10-13:
    summary: Branch rebased onto main (conflicts in the knowledge hash entries only), audio half of internal/webcodecs
      written and run in Chrome, Firefox and Safari; the browser differences found on the way are in the
      constraints.
  superseded-2026-10-16:
    summary: Folded into backend:webcodecs on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
