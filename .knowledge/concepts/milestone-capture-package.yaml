id: milestone:capture-package
type: milestone
title: capture - the screen recorder as a package of the core module
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:capture (keys prefixed capture-). Original summary: The recorder (screencast.Recorder
  in examples/screencast) moved from the examples module to the core module as github.com/shibukawa/hwmediacodec/capture,
  next to annexb and ivf, so that it is a supported feature with the core module''s version instead of
  sample code. The package depends on hwmediacodec only: Source is Bounds()+ReadPixels() (satisfied by
  *ebiten.Image without importing Ebitengine) and Sink is WritePacket+Close. The one sink that needed
  mp4ff, NewMP4File, became CreateVideoFile of the MP4 package, which followed into the core module as
  mediacontainer/mp4 (milestone:mediacontainer-mp4).'
lifecycle: superseded
authority: authored
aliases:
- capture package
- screencast package
- screen recorder
- 画面録画パッケージ
- capture 正式機能化
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: capture-package
non_goals:
- Capturing the operating system's screen or a window from outside the process (ScreenCaptureKit, DXGI,
  PipeWire); the recorder encodes pixels the caller hands it.
- Audio capture and container formats in the core module.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:examples-screencast-hls
- relation: uses_backend
  to: backend:videotoolbox
- relation: superseded_by
  to: component:capture
history:
  delivered-2026-10-09:
    summary: The author asked for the recorder to be a formal feature rather than a sample; it moved to
      the core module as a subpackage with its hardware tests, was renamed from screencast to capture
      on the author's request the same day, and the samples switched their imports.
  superseded-2026-10-16:
    summary: Folded into component:capture on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
