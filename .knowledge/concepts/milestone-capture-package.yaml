open_questions:
  examples-release:
    text: When is the core module tagged with the capture package, so that examples/go.mod can require
      it and the examples run by module path again?
    state: open
  more-sinks:
    text: Should the core module ship sinks that need no dependency (an Annex-B io.Writer sink, an IVF
      sink for AV1)?
    state: deferred
    resolution: Funcs covers them in three lines; add them when a user asks.
facts:
  api:
    capture: 'import github.com/shibukawa/hwmediacodec/capture; New(width, height, sink, Options{Codec,
      FPS, Bitrate, Quality, CBR, KeyframeInterval, LowLatency, Profile, Queue, Software, Extra}) -> Recorder{Capture(Source),
      CaptureAt, RequestKeyframe, Close, Err, Captured, Dropped, Encoded, Duration}; Source = Bounds()+ReadPixels();
      Sink = WritePacket+Close; Funcs{Write, Done}; TimeScale 90000'
    container: 'CreateVideoFile(path, codec, timeScale) -> *VideoFile{WritePacket, Close} (mediacontainer/mp4) replaces screencast.NewMP4File(path,
      codec)'
  result:
    status: delivered 2026-10-09
history:
  delivered-2026-10-09:
    summary: The author asked for the recorder to be a formal feature rather than a sample; it moved to
      the core module as a subpackage with its hardware tests, was renamed from screencast to capture on
      the author's request the same day, and the samples switched their imports.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:examples-screencast-hls
- relation: uses_backend
  to: backend:videotoolbox
