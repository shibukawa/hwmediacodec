id: component:display-order
type: component
title: 'Display-order decoding: the reorder layer driven by picture order counts'
summary: internal/reorder wraps every backend decoder that emits decode order (VideoToolbox, VA-API, NVDEC,
  MediaCodec, WebCodecs) and releases frames in display order by picture order count, holding back no
  more than the stream's reorder bound; WithDecodeOrder opts out; backends that reorder themselves (Media
  Foundation, Intel VPL) and AV1 (one frame per temporal unit) bypass it. Consolidated on 2026-10-16 from
  milestone:display-order-rgba.
lifecycle: active
authority: authored
aliases:
- reorder buffer
- 表示順デコード
- リオーダバッファ
- internal/reorder
- WithDecodeOrder
constraints:
- Display order is derived in Go from the bitstream (H.264/HEVC parameter sets and slice headers to picture
  order counts), so it works for any backend that emits decode order; VideoToolbox cannot be delegated
  the job (M1 experiment).
- Frames are held back no longer than the stream's reorder bound - num_reorder_frames (H.264 VUI) or sps_max_num_reorder_pics
  (HEVC), or for H.264 SPS without VUI bitstream_restriction the DPB size the level allows (clause A.3.1),
  which is 0 when the stream cannot reorder (pic_order_cnt_type 2, intra-only, constrained profiles with
  constraint_set3_flag).
- Display order is the default; WithDecodeOrder restores the hardware order for latency-sensitive callers.
- The reorder layer of the other backends keeps using head-only parsers (ParseSPSHead, ParsePPSHead, ParseSliceHead)
  so that a stream this package does not fully model cannot break reordering there.
acceptance:
  dor-display-order-exact:
    text: Decoding H.264 and HEVC streams with B-frames (b-pyramid, up to 8 consecutive) yields exactly
      ffmpeg's output sequence, frame for frame, including checksums.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-bframe-display-order-test
    - dor-reorder-oracle-test
  dor-reorder-bound:
    text: A stream that cannot reorder is never held back; otherwise at most num_reorder_frames frames
      wait, the buffer releases the lowest POC once it holds more than that, an IDR/BLA flushes the previous
      sequence first, and Flush releases everything in order before io.EOF.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-reorder-oracle-test
    - dor-reorder-buffer-unit-test
  dor-decode-order-option:
    text: WithDecodeOrder returns the same frame set in the order the hardware produces (not display order
      for a B-frame stream).
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-decode-order-test
