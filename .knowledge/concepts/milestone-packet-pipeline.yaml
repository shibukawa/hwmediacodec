id: milestone:packet-pipeline
type: milestone
title: Packet and frame pipeline in the root package - readers, writers, DecodeReader, EncodeWriter
summary: 'Asked what else would raise reusability, the review found the same shapes declared in several
  packages and the Send/Receive loop written out sixteen times. The root package now has PacketReader/PacketSeeker
  (replacing ebitenvideo.Source/Seeker), PacketWriter/PacketWriteCloser/PacketWriterFunc (replacing capture.Sink/Funcs),
  FrameReader/FrameWriter with DecodeReader, EncodeWriter and CopyFrames, plus HasHardware, Frame.RGBAImage,
  RGBAFrame and the annexb length-prefixed conversions. capture, mediacontainer/mp4, the image packages,
  playback, the samples and the command-line tool are built on them.'
lifecycle: active
authority: authored
aliases:
- PacketReader
- PacketWriter
- DecodeReader
- EncodeWriter
- CopyFrames
- パイプライン
- 再利用性
scope:
  milestone: packet-pipeline
constraints:
- 'PacketReader hands out hwmediacodec.Packet values and declares TimeScale(); the decoder is opened with
  WithTimeScale(src.TimeScale()) so Frame.PTS is in the reader''s units. Packet.PTS counts from the start
  of the presentation: mp4.PacketSource subtracts the edit-list offset (DTS can then be negative; decoders
  ignore it), while VideoTrack.Packet keeps the stored sample times. The converter moved to PacketSource
  and its timestamp tests pass unchanged.'
- 'DecodeReader calls Receive first and feeds one packet when the decoder asks (ErrAgain or, right after
  a Reset, io.EOF); a packet the decoder refuses with ErrAgain is kept and offered again. It treats
  the end as reached only after it flushed the decoder itself. Reset flushes and discards, for use after
  PacketSeeker.SeekKeyframe. It checks the context on every turn but, like the loops it replaces, does not
  sleep when a decoder answers ErrAgain on both calls.'
- 'EncodeWriter and DecodeReader own neither the codec nor the reader/writer; closing stays with the caller.
  CopyFrames releases each frame after writing it and does not flush.'
- 'Lazy construction is done by composition: the converter''s frame writer opens the encoder for the size
  of the first decoded picture and wraps an EncodeWriter; its packet writer interleaves the copied tracks.'
- 'capture.Recorder now returns the pixel buffer to its pool after the packets of that frame were written
  rather than right after Send; one buffer is held slightly longer.'
- 'internal/testutil and internal/mediatest stay two packages: the root package''s internal tests use
  testutil, which therefore cannot import the root package, while mediatest builds on the public API. mediatest
  now delegates the ffmpeg checks to testutil.'
- 'Publishing the parameter-set parsers (internal/h264, hevc, av1) as encoding/* was considered and left
  for when a user needs it: it would freeze a large internal API.'
non_goals:
- A filter graph, frame pools or a scheduler; the interfaces are the whole abstraction.
- Changing Decoder or Encoder.
acceptance:
  helpers:
    text: With fake codecs, DecodeReader returns every frame once and in order for one-in-one-out, reordering
      and full-queue decoders, flushes once, keeps EOF sticky, restarts after Reset and a seek, and passes
      reader errors and cancellation on; EncodeWriter writes every packet with and without look-ahead and
      stops on the writer's error; CopyFrames transcodes 40 frames.
    scope:
      milestone: packet-pipeline
    verified_by:
    - pipeline-test
  small-helpers:
    text: HasHardware agrees with Probe for every codec and direction; RGBAImage copies RGBA and BGRA frames
      with padded strides and refuses NV12; RGBAFrame shares an image's pixels, sub-images included; the
      length-prefixed conversions round-trip and reject bad lengths.
    scope:
      milestone: packet-pipeline
    verified_by:
    - pipeline-test
  users-follow:
    text: Every test of the four modules passes with capture, mp4, the image packages, the samples and
      ebitenvideo on the new types; the command-line tool decodes bit-exactly like ffmpeg, transcodes and
      encodes.
    scope:
      milestone: packet-pipeline
    verified_by:
    - all-tests
    - cli-run
