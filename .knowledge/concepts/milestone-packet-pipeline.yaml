facts:
  api:
    root: 'PacketReader{Codec, TimeScale, ReadPacket}; PacketSeeker{+SeekKeyframe, Length}; PacketWriter{WritePacket};
      PacketWriteCloser; PacketWriterFunc; FrameReader{ReadFrame}; FrameWriter{WriteFrame}; NewDecodeReader(dec,
      src) -> ReadFrame, Reset; NewEncodeWriter(enc, dst) -> WriteFrame, Flush, Packets; CopyFrames(ctx, dst,
      src); HasHardware(ctx, codec, dir); RGBAFrame(img, pts); Frame.RGBAImage()'
    annexb: 'AppendUnit(dst, nal); AppendLengthPrefixed(dst, nal); FromLengthPrefixed(dst, sample, lengthSize)'
    removed: 'capture.Sink, capture.Funcs, ebitenvideo.Source, ebitenvideo.Seeker'
  result:
    status: delivered 2026-10-10
history:
  delivered-2026-10-10:
    summary: The author asked whether other package changes would raise reusability and then for the
      recommended points in the recommended order - interfaces and small helpers, the loops, the playback
      core (milestone:playback).
