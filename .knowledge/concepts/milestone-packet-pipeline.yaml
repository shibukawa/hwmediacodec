id: milestone:packet-pipeline
type: milestone
title: Packet and frame pipeline in the root package - readers, writers, DecodeReader, EncodeWriter
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:core-api (keys prefixed pipe-). Original summary: Asked what else would raise
  reusability, the review found the same shapes declared in several packages and the Send/Receive loop
  written out sixteen times. The root package now has PacketReader/PacketSeeker (replacing ebitenvideo.Source/Seeker),
  PacketWriter/PacketWriteCloser/PacketWriterFunc (replacing capture.Sink/Funcs), FrameReader/FrameWriter
  with DecodeReader, EncodeWriter and CopyFrames, plus HasHardware, Frame.RGBAImage, RGBAFrame and the
  annexb length-prefixed conversions. capture, mediacontainer/mp4, the image packages, playback, the samples
  and the command-line tool are built on them.'
lifecycle: superseded
authority: authored
aliases:
- PacketReader
- PacketWriter
- DecodeReader
- EncodeWriter
- CopyFrames
- パイプライン
- 再利用性
scope:
  milestone: packet-pipeline
non_goals:
- A filter graph, frame pools or a scheduler; the interfaces are the whole abstraction.
- Changing Decoder or Encoder.
