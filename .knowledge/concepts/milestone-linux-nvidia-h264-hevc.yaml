id: milestone:linux-nvidia-h264-hevc
type: milestone
title: Linux NVIDIA - H.264/HEVC decode via NVDEC (cuvid parser) and encode via NVENC, without cgo
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:nvenc-nvdec (keys prefixed nvlinux-). Original summary: Linux slice requested by
  the author on 2026-10-09 ("Linux nvidiaの対応をお願いします"): the NVIDIA backend (internal/nvidia) loads libcuda,
  libnvcuvid and libnvidia-encode through purego. Decoding hands whole access units to the driver''s cuvid
  parser and NVDEC decoder and copies every picture to NV12 host memory; encoding drives an NVENC session
  started from the P4 preset. H.264 and HEVC in both directions. Written on a Mac: struct layouts and
  symbol binding are verified on the host and in a container, hardware conformance is the open step.'
lifecycle: superseded
authority: authored
aliases:
- Linux NVIDIA
- NVDEC backend
- NVENC backend
- nvidia backend
scope:
  platform: linux
  gpu: nvidia
  milestone: linux-nvidia
non_goals:
- RGBA/BGRA decode output (NVDEC emits NV12, P016 or YUV444; the Go NV12-to-RGBA converter is still not
  written), 10-bit and 4:4:4 streams, interlaced field pictures, AV1, zero-copy (CUDA device pointers
  as Frame.Native), lookahead and other NVENC extras outside the common API.
- Windows (nvcuvid.dll, nvEncodeAPI64.dll) was out of this slice; it followed the same day as milestone:windows-nvidia-nvdec-nvenc,
  which renamed the *_linux.go loaders to cuda.go, cuvid.go and nvenc.go and moved the platform part into
  lib_linux.go and lib_windows.go.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:nvenc-nvdec
- relation: tests_decision
  to: decision:ffi-strategy
- relation: follows
  to: milestone:linux-vaapi-h264-decode
- relation: followed_by
  to: milestone:windows-nvidia-nvdec-nvenc
- relation: superseded_by
  to: backend:nvenc-nvdec
history:
  requested-2026-10-09:
    summary: Author asked for Linux NVIDIA support.
  implemented-2026-10-09:
    summary: 'Code complete (commit 803a0ca on claude/linux-nvidia-support-59cccc): layouts verified against
      the SDK headers, symbols bound against driver 535 in a container, host suite and cross builds pass;
      hardware conformance pending.'
  shared-with-windows-2026-10-09:
    summary: The backend's build tag became linux || (windows && amd64) and the sys loaders were split
      per platform (milestone:windows-nvidia-nvdec-nvenc); the Linux layout, symbol-binding and no-driver
      checks were re-run and still pass.
  superseded-2026-10-16:
    summary: Folded into backend:nvenc-nvdec on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
