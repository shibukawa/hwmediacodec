facts:
  steps:
  - internal/nvidia/sys - constants, GUIDs and struct mirrors of the SDK 11.1 headers with the struct
    version tags computed in Go; one purego loader per library (LoadCUDA, LoadCuvid, LoadNVENC, the last
    one binding the NV_ENCODE_API_FUNCTION_LIST instance); layout and loader tests.
  - internal/nvidia/device.go - cuInit once, device by HWMEDIACODEC_NVIDIA_DEVICE ordinal, primary
    context retain/release, run() = LockOSThread + cuCtxPushCurrent/cuCtxPopCurrent, cuMemcpy2D helper.
  - internal/nvidia/decoder.go - cuvid parser with three purego callbacks created once and dispatched
    through a registry keyed by the user-data value; the sequence callback checks NVDEC caps and creates
    or recreates the decoder for the coded size (PreferCUVID, NV12, Weave, min_num_decode_surfaces + 2);
    the decode callback submits the picture, maps it and copies the display area with two cuMemcpy2D
    calls into pooled buffers tagged with the packet's PTS and reorder key; a keyframe gate in Go still
    feeds the parameter sets of skipped access units; Flush sends CUVID_PKT_ENDOFSTREAM and drops the
    parser so the next Send starts clean.
  - internal/nvidia/encoder.go - session on the primary context; codec GUID and caps checks (max/min
    size, max B-frames); P4 preset for HIGH_QUALITY or LOW_LATENCY tuning; GOP and IDR period;
    frameIntervalP 1, or 3 with WithBFrames; rate control CONSTQP (quality, or 26 by default), VBR with
    2x peak, or CBR; codec config with repeatSPSPPS, 4:2:0, CAVLC for Baseline and a BT.601 VUI tag for
    RGB input; input/bitstream buffer pairs created on demand and filled through nvEncLockInputBuffer;
    all in-flight pictures drained on NV_ENC_SUCCESS; DTS from the input PTS queue; SPS/PPS prepended
    from nvEncGetSequenceParams when a keyframe lacks them.
  - Root wiring (nvidia registered before vaapi), probe and RGB encode test adjustments, README status
    row and Linux notes.
  oracle_recipes:
    layout: a C program including dynlink_cuda.h, dynlink_nvcuvid.h and nvEncodeAPI.h prints sizeof and
      offsetof for every mirrored struct; the printed values become _Static_asserts compiled with clang
      -target x86_64-unknown-linux-gnu and -target aarch64-unknown-linux-gnu -fsyntax-only -ffreestanding
      (stub stdlib.h/stdio.h), then the Go layout test.
    symbols: docker build --platform linux/amd64 from debian:bookworm-slim with Components non-free and
      apt-get install libcuda1 libnvcuvid1 libnvidia-encode1, then run the CGO_ENABLED=0 linux/amd64
      test binaries; no kernel driver is needed for binding, cuInit then reports no device.
  design_choices:
  - The cuvid parser instead of the Go H.264 parser/DPB (internal/h264) - it gives HEVC immediately and
    keeps reference management in the driver, as ffmpeg's h264_cuvid does; the Go parser stays the
    VA-API path and the reorder tracker still derives POC for display order.
  - Synchronous host copy inside the decode callback - the parser recycles picture indexes on its own
    schedule, so copying at once is the only way to never read an overwritten surface without a second
    surface pool; throughput is bounded by per-picture decode latency.
  - SDK 11.1 as the struct version floor (driver 470+) rather than 12.x (520+ or 550+) so that the
    Debian 11 and Ubuntu 22.04 driver packages are covered.
  - NVIDIA registered before VA-API so that NVDEC/NVENC wins on mixed machines and so that
    nvidia-vaapi-driver (decode only) is never preferred over the native path.
  learned:
  - The NVDEC and NVENC headers can be validated without a GPU - a C program for sizes and offsets plus
    cross-target static assertions, and a Debian container with the non-free user-space libraries for
    symbol binding.
  - purego passes 16-byte structs by value on linux/amd64 and linux/arm64, which the NVENC calls that
    take a GUID need; purego callbacks are limited in number, so parser callbacks are created once per
    process and dispatched by key.
  - NVENC converts RGB input with the BT.601 matrix (ffmpeg tags such streams BT.470BG), unlike
    VideoToolbox which uses BT.709, so the RGB encode test accepts either tag and relies on the PSNR
    check against the reference decode with the declared matrix.
  next_candidates:
  - Run the decode and encode conformance tests on an NVIDIA Linux machine; record driver version, GPU
    and fps here and flip the verification states.
  - Cache the parameter-set NAL units in Go and replay them into the fresh parser after Flush, so that
    seeking to an IDR without in-band SPS/PPS works as on VA-API.
  - Linux-only unit tests for configureGOP, configureRateControl, configureCodec and packet (runnable in
    the container without a GPU).
  - A Windows loader for the same sys package (nvcuvid.dll, nvEncodeAPI64.dll) so NVIDIA on Windows can
    bypass Media Foundation.
  - Asynchronous decode (keep pictures on the device until Receive) with a second surface pool, pinned
    host memory for the copy, and RGBA output through a Go NV12-to-RGBA converter or a CUDA kernel.
