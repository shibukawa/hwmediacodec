id: milestone:linux-nvidia-h264-hevc
type: milestone
title: Linux NVIDIA - H.264/HEVC decode via NVDEC (cuvid parser) and encode via NVENC, without cgo
summary: 'Linux slice requested by the author on 2026-10-09 ("Linux nvidiaの対応をお願いします"): the NVIDIA
  backend (internal/nvidia) loads libcuda, libnvcuvid and libnvidia-encode through purego. Decoding hands
  whole access units to the driver''s cuvid parser and NVDEC decoder and copies every picture to NV12
  host memory; encoding drives an NVENC session started from the P4 preset. H.264 and HEVC in both
  directions. Written on a Mac: struct layouts and symbol binding are verified on the host and in a
  container, hardware conformance is the open step.'
lifecycle: active
authority: authored
aliases:
- Linux NVIDIA
- NVDEC backend
- NVENC backend
- nvidia backend
scope:
  platform: linux
  gpu: nvidia
  milestone: linux-nvidia
constraints:
- CGO_ENABLED=0; libcuda.so.1, libnvcuvid.so.1 and libnvidia-encode.so.1 are dlopened with purego and
  no module dependency is added. The structs mirror Video Codec SDK 11.1 (FFmpeg nv-codec-headers
  n11.1.5.3), the floor supported by driver 470.57 and newer; newer drivers accept the older struct
  version tags.
- Same public API and Send/Receive/Flush contract as the other backends; frames in decode order (the
  reorder layer provides display order), NV12 in CPU memory, 8-bit 4:2:0 progressive only.
- CUDA contexts are per thread and goroutines migrate, so every sequence of driver, NVDEC or NVENC calls
  runs on a locked OS thread between cuCtxPushCurrent and cuCtxPopCurrent of the device's primary
  context, which is retained per decoder or encoder and shared with other CUDA users of the process.
- Registered before the VA-API backend in backends_linux.go, so a discrete NVIDIA GPU wins over an
  integrated GPU's VA-API driver and HEVC is available on Linux.
non_goals:
- RGBA/BGRA decode output (NVDEC emits NV12, P016 or YUV444; the Go NV12-to-RGBA converter is still not
  written), 10-bit and 4:4:4 streams, interlaced field pictures, AV1, zero-copy (CUDA device pointers as
  Frame.Native), lookahead and other NVENC extras outside the common API.
- 'Windows (nvcuvid.dll, nvEncodeAPI64.dll): the sys package keeps its loaders in *_linux.go so a
  Windows loader can be added without touching the backend.'
acceptance:
  nv-struct-layout:
    text: Go mirrors of CUDA_MEMCPY2D, CUVIDEOFORMAT, CUVIDPARSERPARAMS, CUVIDDECODECAPS, CUVIDDECODECREATEINFO,
      CUVIDPICPARAMS, CUVIDPROCPARAMS, NV_ENC_CONFIG (with the H.264/HEVC and rate-control members),
      NV_ENC_INITIALIZE_PARAMS, NV_ENC_PRESET_CONFIG, NV_ENC_PIC_PARAMS, NV_ENC_LOCK_BITSTREAM,
      NV_ENC_LOCK_INPUT_BUFFER, NV_ENC_SEQUENCE_PARAM_PAYLOAD, NV_ENC_OPEN_ENCODE_SESSION_EX_PARAMS and
      NV_ENCODE_API_FUNCTION_LIST have the sizes and field offsets a C compiler measures for linux/amd64
      and linux/arm64, and the struct version tags computed in Go equal the header macros.
    scope:
      milestone: linux-nvidia
    verified_by:
    - layout-test
  symbols-bind:
    text: Every libcuda, libnvcuvid and libnvidia-encode entry point the backend uses binds against a
      real driver build, NvEncodeAPIGetMaxSupportedVersion reports at least 11.1 and
      NvEncodeAPICreateInstance fills the function table.
    scope:
      milestone: linux-nvidia
    verified_by:
    - symbol-binding-container
  graceful-without-hardware:
    text: Without the driver libraries, or with them but without a GPU, Probe returns an empty list and
      NewDecoder/NewEncoder return ErrUnsupported; nothing crashes and nothing is printed.
    scope:
      milestone: linux-nvidia
    verified_by:
    - container-smoke-test
    - symbol-binding-container
  decode-reference-linux:
    text: On a Linux machine with an NVIDIA GPU, TestDecodeH264MatchesReference, TestDecodeHEVCMatchesReference,
      the B-frame display-order tests, TestDecodeOrderOption, TestDecodeParameterSetChange and
      TestFlushResumesAtKeyframe pass (per-frame NV12 checksums equal ffmpeg's software decoder).
    scope:
      milestone: linux-nvidia
    verified_by:
    - hardware-decode
  encode-reference-linux:
    text: On the same machine the encode conformance tests (PSNR against the source, keyframe interval,
      forced keyframes, B-frames with monotonic DTS, CBR/VBR sizes, quality ordering, low latency,
      profiles, flush/reuse, RGBA/BGRA input tagged BT.601) and the transcode round trip pass.
    scope:
      milestone: linux-nvidia
    verified_by:
    - hardware-encode
  cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-nvidia
    verified_by:
    - cross-build-check
  host-suite-unaffected:
    text: The full macOS test suite still passes with the backend wired in; the test changes (the Linux
      probe list accepts the nvidia backend, the RGB encode test accepts a BT.601 colour matrix next to
      BT.709) keep the VideoToolbox expectations.
    scope:
      milestone: linux-nvidia
    verified_by:
    - host-suite
