facts:
  motivation: The author wants to call hardware video decode/encode engines from Go without shelling out
    to ffmpeg, and wants the same code to work on macOS, Linux and Windows.
  use_cases:
  - key: batch-transcode
    priority: 1
    description: Decode a file's elementary stream and re-encode it (format or bitrate change) as fast
      as the hardware allows.
    api_consequences:
    - Synchronous Send/Receive with ErrAgain backpressure is sufficient.
    - Throughput matters more than latency; B-frames and look-ahead may be enabled.
    - Needs encoder controls - bitrate, quality/CRF-like mode where the backend has one, GOP, profile/level.
  - key: playback
    priority: 2
    description: Decode for display with seeking.
    api_consequences:
    - Flush/Reset to drop the pipeline on seek; PTS passthrough and output reordering by PTS.
    - Decoder must tolerate starting at a keyframe mid-stream.
  - key: ebitengine-texture
    priority: 3
    description: Show decoded video as an Ebitengine image.
    api_consequences:
    - Output pixel format option (NV12 default; RGBA/BGRA where the backend converts cheaply) so frames
      can go straight to ebiten.Image.WritePixels.
    - CPU-side frames for now; see ebitengine-zero-copy.
    delivered_by: milestone:display-order-rgba (WithOutputFormat(RGBA) plus the ebitenvideo module's Player)
  - key: ebitengine-encode
    priority: 3
    description: Encode frames rendered by Ebitengine (ReadPixels gives RGBA).
    api_consequences:
    - Input pixel format option (RGBA/BGRA in addition to NV12); backend conversion where available, pure-Go
      fallback otherwise.
    - Fixed-rate timestamps generated by the caller; the encoder must honour them.
    delivered_by: milestone:display-order-rgba (WithInputFormat(RGBA) on VideoToolbox; no pure-Go fallback
      yet)
  - key: hls-streaming
    priority: 4
    description: Live or VOD HLS output from encoded H.264/HEVC.
    api_consequences:
    - Low-latency encode mode, CBR, fixed GOP aligned to segment length, forced keyframes at segment boundaries,
      in-band SPS/PPS.
    - Annex-B or AVCC output selectable; muxing to TS/fMP4 is a companion concern (hls-packaging).
  consumers:
  - The author's own tools (batch conversion, Ebitengine games/apps, streaming experiments).
  - External Go users once the API is stable.
  delivery:
    current_milestone: display-order-rgba
    outcome: 'M1 (Probe, H.264/HEVC decode), M2 (Encoder API, VideoToolbox encode with streaming controls,
      encode/transcode CLI) and the display-order-rgba slice: display-order decoding through a Go-side
      POC reorder layer, RGBA/BGRA frames in and out, and the ebitenvideo module; batch transcode, playback
      and both Ebitengine use cases work end to end on macOS.'
    later:
    - 'Windows backend: Media Foundation for Intel/AMD, NVENC/NVDEC for NVIDIA (in progress on a parallel
      branch).'
    - 'Linux full-API backends: Intel VPL and NVIDIA NVDEC/NVENC (in progress on a parallel branch).'
    - Go H.264/HEVC DPB on top of the existing parsers and VA-API backend for Linux AMD (and older Intel).
    - Then AVCC output, HLS prototype, AV1 where hardware exists, pure-Go NV12<->RGBA fallback when a
      backend needs it, Tier 2 backends.
    decisions:
      cgo-allowed:
        decision: Decided 2026-10-09 - no cgo; purego on darwin/linux, x/sys/windows on windows.
        escape_hatch: cgo for one backend only after a concrete blocker is documented in decision:ffi-strategy.
        change_boundary: Keep every FFI call inside internal/<backend>/sys packages so a cgo shim could
          replace a backend without touching the public API.
      frame-memory-model:
        provisional_choice: CPU-side planes owned by the library with an explicit Release(); the Frame
          type reserves a Native() accessor so a backend can later hand out a GPU surface handle without
          an API break.
        reason: Portable and testable (checksums); the Ebitengine path needs CPU pixels anyway.
        revisit_when: When a consumer measures the copy cost as a bottleneck, or when Ebitengine exposes
          native texture import.
      codec-priority:
        provisional_choice: H.264, then HEVC, then AV1.
        reason: H.264 is decodable by every target engine; AV1 hardware support is uneven across GPUs
          and OS versions.
        revisit_when: When a consumer needs AV1 or HEVC before H.264 encode is done.
      api-shape:
        provisional_choice: Synchronous pull style - Decoder.Send(packet) / Receive() / Flush(); Encoder.Send(frame)
          / Receive() / Flush(); ErrAgain for backpressure. Backends that are callback or event driven
          (VideoToolbox, async MFTs) are bridged with an internal queue.
        reason: Fits batch transcoding and playback directly; a streaming loop is a thin goroutine on
          top.
        revisit_when: When the HLS prototype shows the queue adds unacceptable latency, or when a push/callback
          API is requested.
      linux-backend-split:
        reason: Linux hardware access splits by vendor and by API model; M1 is macOS only.
        revisit_when: Before implementing the Linux backend.
        evidence_needed: Which GPUs the first Linux consumers actually run; whether a full-API backend
          (Intel VPL, NVDEC) covers them before the Go parser/DPB exists.
    roadmap_note: Milestone order beyond M1 is a stated assumption, not an agreed plan; each milestone
      is re-planned after the previous one ships.
    m1_result:
      delivered: '2026-10-09'
      outcome: Public API, Probe(), annexb reader, VideoToolbox H.264 and HEVC decode to NV12 via purego;
        CGO_ENABLED=0 on all six targets; conformance tests pass against ffmpeg.
      environment:
        host: Apple M3, macOS 27.0.1 (build 26A434)
        go: go1.27.0 darwin/arm64
        purego: github.com/ebitengine/purego v0.11.1
        oracle: ffmpeg 9.0.1 (libx264, libx265 available)
        date: '2026-10-09'
      measurements:
        h264_1080p_decode_fps: 834
        note: cmd/hwmediacodec decode, 300 frames, sync decode including NV12 copy, M3
      limitations:
      - decode-order output; VideoToolbox temporal processing does not reorder (see frame-reordering)
      - NV12 only
      - no encode
      - darwin Apple Silicon only
    next_candidates:
    - Linux backends (Intel VPL and NVDEC first, then the VA-API path for AMD).
    - AVCC/HVCC output and an MP4/fMP4 packaging companion for the HLS prototype.
    - Frame-rate detection from VUI so ebitenvideo.NewPlayer can default fps (needs the HEVC VUI parser).
    - A NV12<->RGBA converter in Go once a backend without hardware conversion exists.
    m3_result:
      started: '2026-10-09'
      outcome: Windows backend for H.264 and HEVC, decoding through Media Foundation synchronous decoder
        MFTs + Direct3D 11 DXVA (NV12 to Go memory in display order) and encoding through the vendor's
        asynchronous hardware encoder MFTs (NV12 in, Annex-B out, shared encoder controls via
        ICodecAPI); windows/amd64 and windows/arm64, hardware only. See milestone:windows-media-foundation
        and PR shibukawa/hwmediacodec#4.
      verification: cross-build, go vet and compile-time struct layout checks pass from macOS; unit
        tests for the pure-Go parts pass; the Windows conformance tests have not been run on hardware.
      notes:
      - The API needed no change for the second backend; the synchronous MFT model mapped directly to
        Send/Receive/Flush, and the asynchronous MFT model (vendor hardware encoders) fits it with an
        event pump inside Send/Receive/Flush.
      - annexb.ParameterSetID was factored out of the VideoToolbox backend and is shared.
    m2_result:
      delivered: '2026-10-09'
      outcome: Encoder interface + options, VideoToolbox VTCompressionSession backend via purego (struct-by-value
        CMTime, VT-thread callback), Annex-B conversion with in-band VPS/SPS/PPS, cmd encode/transcode;
        conformance against ffmpeg/ffprobe; CGO_ENABLED=0 and =1 both pass.
      environment:
        host: Apple M3, macOS 27.0.1 (build 26A434)
        go: go1.27.0 darwin/arm64
        purego: github.com/ebitengine/purego v0.11.1
        oracle: ffmpeg/ffprobe 9.0.1 (libx264, libx265 available)
        date: '2026-10-09'
      measurements:
        h264_1080p_encode_fps: 207
        hevc_1080p_encode_fps: 186
        transcode_h264_to_hevc_1080p_fps: 177
        note: cmd/hwmediacodec on an M3, VBR 8/6 Mbit/s, including the NV12 copy into the encoder pool
          buffer
      limitations:
      - NV12 input only
      - Annex-B output only
      - transcode re-encodes in decode order (inherits the M1 reordering gap)
      - Flush blocks without context cancellation
      - darwin Apple Silicon only
    display_order_rgba_result:
      delivered: '2026-10-09'
      outcome: Display-order decoding (internal/h264, internal/hevc, internal/reorder; default on, WithDecodeOrder
        opts out), RGBA/BGRA decode output and encode input on VideoToolbox, PixelFormat layout helpers,
        CLI -format/-decode-order flags, and the ebitenvideo module (Player with pacing, looping, example
        program); conformance against ffmpeg/ffprobe; CGO_ENABLED=0 and 1 and -race pass.
      environment:
        host: Apple M3, macOS 27.0.1 (build 26A434)
        go: go1.27.0 darwin/arm64
        purego: github.com/ebitengine/purego v0.11.1
        ebiten: github.com/hajimehoshi/ebiten/v2 v2.10.4 (ebitenvideo module only)
        oracle: ffmpeg/ffprobe 9.0.1 (libx264, libx265 available)
        date: '2026-10-09'
      measurements:
        h264_1080p_decode_fps_display_order: 782
        h264_1080p_decode_fps_bgra: 346
        h264_1080p_decode_fps_rgba: 254
        h264_1080p_encode_fps_rgba: 182
        note: see milestone:display-order-rgba facts.result.performance
      limitations:
      - H.264 streams without VUI bitstream_restriction (VideoToolbox's own) are held back by the level's
        DPB size
      - RGBA is BGRA swapped in Go; untagged-stream colour matrix is VideoToolbox's choice (BT.601 at SD)
      - no pure-Go pixel conversion; no frame-rate detection; hardware decoder rejects 64x48
      - darwin Apple Silicon only
  support_tiers: See policy:support-tiers; Tier 1 hardware must pass acceptance before release, Tier 2
    is best effort.
  capability_notes:
    decode/h264: implemented on darwin/apple-silicon (bit-exact against ffmpeg on 320x240 and 1080p
      test streams), on linux via VA-API (code complete 2026-10-09, parser/DPB verified against ffmpeg,
      hardware conformance pending) and on windows/amd64+arm64 via Media Foundation (unverified on hardware).
    decode/hevc: implemented on darwin/apple-silicon (bit-exact against ffmpeg, libx265 source) and on
      windows via Media Foundation when the HEVC Video Extensions are installed (unverified).
    backend/videotoolbox: decode and encode for H.264/HEVC in NV12/RGBA/BGRA; AV1 pending.
    api/display-order: implemented in Go for every decode-order backend (VideoToolbox and VA-API); verified
      against ffmpeg frame for frame and against MP4 timestamps without hardware. The reorder tracker uses
      the full H.264 parser (internal/h264) and so also honours memory_management_control_operation 5.
      The Media Foundation decoder reorders natively and reports it through codec.DisplayOrderer, so it
      is not wrapped; WithDecodeOrder has no effect on Windows.
    api/pixel-format-option: implemented on darwin/apple-silicon (backend conversion); VA-API and Media
      Foundation are NV12 only, so they are the candidates for a Go NV12<->RGBA converter.
    ebitengine/player: separate module ebitenvideo; verified headless on darwin/apple-silicon.
    encode/h264: implemented on darwin/apple-silicon (VBR/CBR/quality, GOP, forced keyframes, B-frames,
      low latency, profiles; verified against ffmpeg/ffprobe), on linux via VA-API (code complete
      2026-10-09, I/P only, header writer verified against ffmpeg, hardware verification pending) and on
      windows via vendor hardware encoder MFTs with the same control set (unverified on hardware; controls
      a driver rejects are ErrUnsupported).
    encode/hevc: implemented on darwin/apple-silicon (Main profile) and on windows via vendor hardware
      HEVC encoder MFTs (unverified).
