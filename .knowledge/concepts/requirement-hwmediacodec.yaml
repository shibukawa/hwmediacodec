id: requirement:hwmediacodec
type: requirement
title: Go hardware video codec library (hwmediacodec)
summary: A Go library that drives the operating system's or GPU driver's hardware video decode/encode
  engines (VideoToolbox, Media Foundation, VA-API/VPL, NVENC/NVDEC, V4L2, ...) through one common Go API
  on macOS, Linux and Windows, without cgo.
lifecycle: accepted
authority: authored
aliases:
- hwmediacodec
- ハードウェア動画コーデック
- HWエンコード
- HWデコード
- hardware video codec from Go
scope:
  platform:
  - darwin
  - linux
  - windows
constraints:
- One Go API whose behaviour does not depend on the backend; backend-specific details stay behind an internal
  interface.
- Report "unsupported" explicitly (codec, direction, profile, resolution) instead of silently falling
  back to software.
- The codec layer consumes and produces elementary-stream units (H.264/HEVC NAL units, AV1 OBUs) and raw
  frames; containers are outside the codec layer.
- Backends are discovered and loaded at runtime (dlopen / LoadLibrary / ioctl); a missing driver or library
  yields a clear error, never a crash or a link-time failure.
- CGO_ENABLED=0 builds must work for every target; native access goes through ebitengine/purego (darwin,
  linux) and golang.org/x/sys/windows (windows). cgo is allowed only after a concrete, documented blocker
  (see decision:ffi-strategy).
- Every backend call that blocks (session creation, flush) must respect context cancellation or a documented
  timeout.
- 'Encoders must expose the controls that streaming needs: target bitrate with CBR/VBR, GOP length / keyframe
  interval, forced keyframe, B-frame on/off, low-latency / realtime mode, and in-band SPS/PPS at every
  keyframe.'
non_goals:
- Software codec implementations (no pure-Go H.264/HEVC/AV1 decoder or encoder).
- Container formats (MP4/MKV/WebM/MPEG-TS/fMP4 demux and mux), HLS playlist generation, and audio codecs;
  these belong to companion packages or other libraries.
- Mobile targets (iOS/Android) in the first milestones; the design must not preclude them.
- Video filtering and scaling beyond what the backend already returns. Pixel-format conversion is limited
  to what the use cases need (see facts.use_cases).
- Intel Macs (VideoToolbox backend targets Apple Silicon only).
- Machines without a GPU (VMs, hosted CI) on Windows and Linux; software MFTs are not a target.
- Vulkan Video as a backend.
