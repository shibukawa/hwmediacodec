open_questions:
  m1-target:
    text: Which platform, direction and codec form the first usable slice?
    state: answered
    resolution: Answered 2026-10-09 by the author - macOS + decode + H.264 (milestone:m1-darwin-h264-decode).
  cgo-allowed:
    text: Is requiring cgo acceptable, or is CGO_ENABLED=0 cross-compilation from one host a hard requirement?
    state: answered
    resolution: Answered 2026-10-09 - use purego/syscall wherever possible; cgo only if a concrete blocker
      is hit and documented. Recorded in decision:ffi-strategy.
  primary-use-case:
    text: What is the main consumer of the library?
    state: answered
    resolution: Answered 2026-10-09 - several, in this order of priority - batch transcoding first, then
      playback, then Ebitengine video textures and encoding Ebitengine output, then HLS streaming. See
      facts.use_cases for the API consequences.
  frame-memory-model:
    text: Should decoded frames be copied into Go-owned buffers or exposed as GPU-resident surfaces?
    state: open
    resolution: 'Provisional - CPU copy. M1 evidence: 1080p H.264 decoded at ~830 fps including the NV12
      copy on an M3, so the copy is not the bottleneck for batch transcoding. Native() reserved for later
      zero-copy work.'
  pixel-format-conversion:
    text: The Ebitengine use cases need RGBA frames in and out, while hardware engines speak NV12 (and
      BGRA on VideoToolbox). Who converts - the backend where it can (VideoToolbox BGRA output, Media
      Foundation colour converter DSP, VA-API vpp), or a pure-Go NV12<->RGBA converter as a fallback?
      What throughput is acceptable for the Go fallback?
    state: open
  encoder-controls:
    text: Which encoder control set is mandatory across backends for batch transcoding and HLS - bitrate/CBR/VBR,
      GOP, forced keyframe, B-frames, low-latency, profile/level - and how are backend-specific extras
      exposed without leaking into the common API?
    state: open
  codec-priority:
    text: Which codec order?
    state: open
    resolution: Provisional - H.264, then HEVC, then AV1 (hardware AV1 availability is uneven; AV1 encode
      is absent on Apple Silicon).
  go-version-policy:
    text: Minimum Go version and architectures?
    state: open
    resolution: Provisional - the two most recent Go releases (host currently has go1.27.0) on amd64 and
      arm64.
  linux-backend-split:
    text: Tier 1 Linux covers Intel, AMD and NVIDIA. Intel (Gen12+, VPL) and NVIDIA (NVDEC/NVENC) have
      full-codec APIs; AMD only has slice-level VA-API, so the Go-side H.264/HEVC parser and DPB component
      is required for Tier 1. In which order are the Linux backends and the parser built?
    state: deferred
    resolution: Deferred until the Windows backend is done. Provisional order - Intel VPL and NVIDIA first
      (no parser), then the Go parser/DPB plus VA-API for AMD and older Intel.
  hls-packaging:
    text: HLS needs MPEG-TS or fMP4 segments and playlists. Companion package in this module, a separate
      module, or leave to existing Go libraries?
    state: deferred
    resolution: Outside the codec layer; revisit when the H.264 encoder works on one platform and a streaming
      prototype is attempted.
  ebitengine-zero-copy:
    text: Can decoded frames reach an Ebitengine texture without a CPU round trip (CVPixelBuffer -> Metal,
      D3D11 texture, DMA-BUF)?
    state: deferred
    resolution: Ebitengine has no public native-texture import today; revisit if Ebitengine gains one
      or if WritePixels throughput is measured as the bottleneck.
  software-fallback:
    text: Should the library offer a software path when no hardware is present?
    state: deferred
    resolution: Out of scope while hardware backends are being built; revisit when a consumer needs guaranteed
      decode on machines without hardware engines. Note that VideoToolbox and the Microsoft MFTs already
      fall back to software internally unless hardware is explicitly required.
  container-support:
    text: Will callers be expected to demux/mux themselves?
    state: deferred
    resolution: Non-goal for the codec layer; revisit together with hls-packaging.
  ci-hardware:
    text: GPU-less machines are out of scope, and hosted CI runners for Linux and Windows have no GPU.
      Where do Tier 1 hardware integration tests run - the author's machines, self-hosted runners, or
      both?
    state: deferred
    resolution: Still deferred. M1 runs on the author's Apple Silicon Mac. M3 (Windows) was written on
      macOS with cross-build, vet and compile-time layout checks only; its conformance tests skip
      without a hardware decoder and are to be run on the author's Intel Windows machine first.
  vendor-sdks:
    text: Are vendor SDKs (AMD AMF, Intel VPL/QSV) needed beyond the OS-level APIs?
    state: deferred
    resolution: Intel VPL is now a candidate full-API backend for Linux (see backend:intel-vpl). AMD AMF
      on Linux is de-emphasised by AMD itself (dropped from its Linux driver package in 2025; VA-API recommended).
      Revisit per backend.
  frame-reordering:
    text: 'Frames come back in decode order. Streams with B-frames decode correctly (frame set equals
      ffmpeg output) but arrive out of display order. Who reorders: a Go-side reorder buffer driven by
      caller PTS, a POC parser (also needed for VA-API later), or the caller?'
    state: open
    resolution: 'Experiment 2026-10-09 on M3: kVTDecodeFrame_EnableTemporalProcessing, with and without
      asynchronous decompression and with correct display-order PTS, still emitted decode order, so VideoToolbox
      cannot be delegated the job. Provisional: caller reorders by PTS; a PTS/POC reorder buffer joins
      the bitstream-parser milestone. Revisit before the playback use case ships.'
history:
  proposed-2026-10-08:
    summary: Requirements, backend landscape and feasibility analysis authored from the author's request
      (Go, hardware decode/encode, macOS/Linux/Windows).
  accepted-2026-10-09:
    summary: Author confirmed purego/syscall where possible, M1 = macOS H.264 decode, and the use-case
      list (batch transcoding, playback, Ebitengine textures and output encoding, HLS streaming). Requirement
      moved to accepted with open and deferred questions retained.
  scoped-2026-10-09:
    summary: 'Author set support tiers (policy:support-tiers): Tier 1 = Apple Silicon, Windows/Linux Intel/AMD/NVIDIA;
      Tier 2 = Raspberry Pi, Snapdragon X; out of scope = Intel Mac, GPU-less CI, Vulkan Video. First
      milestone confirmed on macOS.'
  m1-delivered-2026-10-09:
    summary: 'M1 implemented and verified: VideoToolbox H.264/HEVC decode via purego, bit-exact against
      ffmpeg, cross-builds with CGO_ENABLED=0.'
  m3-authored-2026-10-09:
    summary: Windows decode backend (Media Foundation + D3D11) written for Intel/AMD/NVIDIA on
      windows/amd64 and arm64; 32-bit excluded by the author; hardware verification pending.
facts:
  motivation: The author wants to call hardware video decode/encode engines from Go without shelling out
    to ffmpeg, and wants the same code to work on macOS, Linux and Windows.
  use_cases:
  - key: batch-transcode
    priority: 1
    description: Decode a file's elementary stream and re-encode it (format or bitrate change) as fast
      as the hardware allows.
    api_consequences:
    - Synchronous Send/Receive with ErrAgain backpressure is sufficient.
    - Throughput matters more than latency; B-frames and look-ahead may be enabled.
    - Needs encoder controls - bitrate, quality/CRF-like mode where the backend has one, GOP, profile/level.
  - key: playback
    priority: 2
    description: Decode for display with seeking.
    api_consequences:
    - Flush/Reset to drop the pipeline on seek; PTS passthrough and output reordering by PTS.
    - Decoder must tolerate starting at a keyframe mid-stream.
  - key: ebitengine-texture
    priority: 3
    description: Show decoded video as an Ebitengine image.
    api_consequences:
    - Output pixel format option (NV12 default; RGBA/BGRA where the backend converts cheaply) so frames
      can go straight to ebiten.Image.WritePixels.
    - CPU-side frames for now; see ebitengine-zero-copy.
  - key: ebitengine-encode
    priority: 3
    description: Encode frames rendered by Ebitengine (ReadPixels gives RGBA).
    api_consequences:
    - Input pixel format option (RGBA/BGRA in addition to NV12); backend conversion where available, pure-Go
      fallback otherwise.
    - Fixed-rate timestamps generated by the caller; the encoder must honour them.
  - key: hls-streaming
    priority: 4
    description: Live or VOD HLS output from encoded H.264/HEVC.
    api_consequences:
    - Low-latency encode mode, CBR, fixed GOP aligned to segment length, forced keyframes at segment boundaries,
      in-band SPS/PPS.
    - Annex-B or AVCC output selectable; muxing to TS/fMP4 is a companion concern (hls-packaging).
  consumers:
  - The author's own tools (batch conversion, Ebitengine games/apps, streaming experiments).
  - External Go users once the API is stable.
  delivery:
    current_milestone: m1
    outcome: Public API skeleton + Probe() + H.264 Annex-B elementary-stream decode to NV12 frames on
      macOS via VideoToolbox, built with CGO_ENABLED=0 and verified against an ffmpeg-produced reference.
    later:
    - M2 - H.264 encode on macOS (end-to-end batch transcode on one Tier 1 platform; Ebitengine encode
      path).
    - 'M3 - Windows backend: Media Foundation for Intel/AMD, NVENC/NVDEC for NVIDIA.'
    - 'M4 - Linux full-API backends: Intel VPL and NVIDIA NVDEC/NVENC.'
    - M5 - Go H.264/HEVC parser + DPB and VA-API backend for Linux AMD (and older Intel).
    - Then HEVC and AV1 where hardware exists, pixel-format options, HLS prototype, Tier 2 backends.
    decisions:
      cgo-allowed:
        decision: Decided 2026-10-09 - no cgo; purego on darwin/linux, x/sys/windows on windows.
        escape_hatch: cgo for one backend only after a concrete blocker is documented in decision:ffi-strategy.
        change_boundary: Keep every FFI call inside internal/<backend>/sys packages so a cgo shim could
          replace a backend without touching the public API.
      frame-memory-model:
        provisional_choice: CPU-side planes owned by the library with an explicit Release(); the Frame
          type reserves a Native() accessor so a backend can later hand out a GPU surface handle without
          an API break.
        reason: Portable and testable (checksums); the Ebitengine path needs CPU pixels anyway.
        revisit_when: When a consumer measures the copy cost as a bottleneck, or when Ebitengine exposes
          native texture import.
      codec-priority:
        provisional_choice: H.264, then HEVC, then AV1.
        reason: H.264 is decodable by every target engine; AV1 hardware support is uneven across GPUs
          and OS versions.
        revisit_when: When a consumer needs AV1 or HEVC before H.264 encode is done.
      api-shape:
        provisional_choice: Synchronous pull style - Decoder.Send(packet) / Receive() / Flush(); Encoder.Send(frame)
          / Receive() / Flush(); ErrAgain for backpressure. Backends that are callback or event driven
          (VideoToolbox, async MFTs) are bridged with an internal queue.
        reason: Fits batch transcoding and playback directly; a streaming loop is a thin goroutine on
          top.
        revisit_when: When the HLS prototype shows the queue adds unacceptable latency, or when a push/callback
          API is requested.
      linux-backend-split:
        reason: Linux hardware access splits by vendor and by API model; M1 is macOS only.
        revisit_when: Before implementing the Linux backend.
        evidence_needed: Which GPUs the first Linux consumers actually run; whether a full-API backend
          (Intel VPL, NVDEC) covers them before the Go parser/DPB exists.
    roadmap_note: Milestone order beyond M1 is a stated assumption, not an agreed plan; each milestone
      is re-planned after the previous one ships.
    m1_result:
      delivered: '2026-10-09'
      outcome: Public API, Probe(), annexb reader, VideoToolbox H.264 and HEVC decode to NV12 via purego;
        CGO_ENABLED=0 on all six targets; conformance tests pass against ffmpeg.
      environment:
        host: Apple M3, macOS 27.0.1 (build 26A434)
        go: go1.27.0 darwin/arm64
        purego: github.com/ebitengine/purego v0.11.1
        oracle: ffmpeg 9.0.1 (libx264, libx265 available)
        date: '2026-10-09'
      measurements:
        h264_1080p_decode_fps: 834
        note: cmd/hwmediacodec decode, 300 frames, sync decode including NV12 copy, M3
      limitations:
      - decode-order output; VideoToolbox temporal processing does not reorder (see frame-reordering)
      - NV12 only
      - no encode
      - darwin Apple Silicon only
    next_candidates:
    - M2 - H.264/HEVC encode on macOS (VTCompressionSession) with the streaming-oriented controls from
      the constraints; unlocks batch transcode end to end.
    - M3 - Windows backend (Media Foundation) to validate the API against an async MFT model.
    m3_result:
      started: '2026-10-09'
      outcome: Windows decode backend (Media Foundation synchronous decoder MFTs + Direct3D 11 DXVA) for
        H.264 and HEVC, NV12 to Go memory in display order, windows/amd64 and windows/arm64, hardware
        only. See milestone:m3-windows-mf-decode.
      verification: cross-build, go vet and compile-time struct layout checks pass from macOS; unit
        tests for the pure-Go parts pass; the Windows conformance tests have not been run on hardware.
      notes:
      - The API needed no change for the second backend; the synchronous MFT model mapped directly to
        Send/Receive/Flush. The async MFT model (vendor hardware MFTs) was deferred.
      - annexb.ParameterSetID was factored out of the VideoToolbox backend and is shared.
  support_tiers: See policy:support-tiers; Tier 1 hardware must pass acceptance before release, Tier 2
    is best effort.
  capability_notes:
    decode/h264: implemented on darwin/apple-silicon (bit-exact against ffmpeg on 320x240 and 1080p
      test streams) and on windows/amd64+arm64 via Media Foundation (unverified on hardware).
    decode/hevc: implemented on darwin/apple-silicon (bit-exact against ffmpeg, libx265 source) and on
      windows via Media Foundation when the HEVC Video Extensions are installed (unverified).
    backend/videotoolbox: decode only; encode is the next milestone candidate.
