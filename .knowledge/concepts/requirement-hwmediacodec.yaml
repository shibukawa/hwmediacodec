acceptance:
  probe-reports-hardware:
    text: Probe() lists every available backend with the codecs and directions it supports on the running
      machine, and returns an empty list (not an error) when no hardware engine is present.
    verified_by:
    - probe-test
  decode-matches-reference:
    text: Decoding a known H.264 Annex-B elementary stream yields the same frame count and per-frame NV12
      checksums as a reference decoder; the ffmpeg CLI is used only as a test oracle, never at runtime.
    scope:
      milestone: m1
    verified_by:
    - decode-reference-test
    - bframe-set-test
  unsupported-is-explicit:
    text: Requesting an unsupported codec or direction returns a typed ErrUnsupported carrying backend
      name and reason; no panic and no silent software fallback.
    verified_by:
    - unsupported-test
  no-cgo-cross-build:
    text: CGO_ENABLED=0 go build ./... succeeds for darwin, linux and windows from a single host.
    scope:
      milestone:
      - m1
      - m2
    verified_by:
    - cross-build-check
  encode-decodable:
    text: Encoding raw NV12 frames yields an Annex-B H.264/HEVC stream that a reference decoder (ffmpeg)
      turns back into the same number of frames at a luma PSNR of at least 30 dB, with parameter sets
      in band at every keyframe.
    scope:
      milestone: m2
    verified_by:
    - encode-reference-test
  encoder-controls:
    text: The encoder exposes bitrate with VBR/CBR, keyframe interval, forced keyframes, B-frames on/off,
      low-latency mode and in-band SPS/PPS, and each control has an observable effect on the stream.
    scope:
      milestone: m2
    verified_by:
    - encoder-controls-test
  transcode-roundtrip:
    text: A stream produced by the hardware encoder decodes on the hardware decoder back to the source
      frames (batch-transcode use case end to end).
    scope:
      milestone: m2
    verified_by:
    - transcode-test
