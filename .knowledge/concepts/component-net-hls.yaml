id: component:net-hls
type: component
title: 'net/hls: live HLS playlist and HTTP handler over fMP4 segments'
summary: hls.Playlist keeps a sliding window of the segments mp4.Segmenter produces in memory and serves
  index.m3u8, init.mp4 and seg_N.m4s as an http.Handler mountable under any prefix, with CORS headers,
  503 until the first segment and EXT-X-ENDLIST after End. Consolidated on 2026-10-16 from milestone:mediacontainer-hls
  and the HLS parts of milestone:examples-screencast-hls.
lifecycle: active
authority: authored
aliases:
- hls package
- HLS playlist
- HLS 配信パッケージ
constraints:
- Live playlist with EXT-X-VERSION 7, EXT-X-MAP, EXT-X-MEDIA-SEQUENCE, EXT-X-INDEPENDENT-SEGMENTS, a sliding
  window of N segments and EXT-X-ENDLIST once the game exits; 503 until the first segment exists.
- Standard library only (net/http) plus mediacontainer/mp4 for the Segment type; no new module dependency.
- 'The player page is not part of the package: it loads hls.js from a CDN, which a library handler should
  not serve by default. The sample wraps the Playlist (withPage) and serves the page at / itself; the
  package answers 404 there.'
- ServeHTTP goes by the last path element instead of the exact paths /index.m3u8, /init.mp4, /seg_N.m4s
  the sample used, so the handler can be mounted under a prefix (http.Handle("/live/", playlist)); the
  URIs in the playlist were already relative. This is the only behaviour change of the move.
- 'Access-Control-Allow-Origin: * is kept on every response: a player page on another origin has to fetch
  the playlist and the segments with CORS.'
acceptance:
  exscreen-hls-server:
    text: The playlist server answers 503 before the first segment, serves the m3u8 with the required
      tags, init.mp4 and seg_N.m4s with the right content types, keeps a sliding window, and after End
      ffprobe reads the whole stream over HTTP (150 frames); the live app plays in a browser.
    scope:
      milestone: examples-screencast-hls
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exscreen-hls-server-test
    - exscreen-hls-live-run
  hls-playlist-server:
    text: The handler answers 503 before the first segment, serves the m3u8 with the required tags, init.mp4
      and seg_N.m4s with the right content types, 404 for unknown paths, keeps a sliding window, and after
      End ffprobe reads the whole stream over HTTP (150 frames).
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - hls-playlist-test
  hls-mounted:
    text: Mounted under /live/cam1/ the playlist, the init segment and a media segment are served.
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - hls-playlist-test
  hls-sample-follows:
    text: The hls sample serves its page at / and the stream through the package; a live run is readable
      by ffprobe.
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - hls-page-test
    - hls-hls-live-run
