facts:
  api:
    hls: Playlist{SetInit, Add, End, M3U8, ServeHTTP} serving /, /index.m3u8, /init.mp4, /seg_N.m4s; flags
      -addr -codec -bitrate -fps -size -segment -window
    hls_hls: import github.com/shibukawa/hwmediacodec/net/hls; NewPlaylist(window, target) -> Playlist{SetInit([]byte),
      Add(mp4.Segment), End(), M3U8() string, ServeHTTP}
  delivery_results:
    milestone:mediacontainer-hls:
      result:
        status: delivered 2026-10-10
