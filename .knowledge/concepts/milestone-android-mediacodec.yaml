id: milestone:android-mediacodec
type: milestone
title: Android through the NDK MediaCodec backend
summary: 'Second half of the mobile request (2026-10-12, "Androidの方の実装もお願いします", Android 14
  as the minimum): a new backend internal/mediacodec on the NDK MediaCodec C API (libmediandk.so) through
  purego. H.264, HEVC and AV1 decoding and H.264 and HEVC encoding, synchronous dequeue/queue without
  callbacks, byte-buffer output whose layout is read from the output format (MediaImage2 "image-data" or
  colour format 19/21 with stride and slice height) and packed into NV12 in Go, software codecs refused
  by name unless WithSoftwareFallback, display order from the codec. Registered by backends_android.go.
  Written and type-checked on macOS with the mediacodec_typecheck tag; the layout code is unit-tested
  there; nothing has run on Android (no SDK/NDK on the Mac, emulator codecs are software). The
  examples/mobile Go package gained an Android Studio project.'
lifecycle: active
authority: authored
aliases:
- Android support
- Android対応
- MediaCodec backend
- GOOS=android
scope:
  platform: android
  milestone: android-mediacodec
constraints:
- Android 14 (API 34) is the documented minimum, chosen by the author from endoflife.date; the NDK
  MediaCodec API has only grown since API 21 and every symbol the backend binds exists from API 28,
  so nothing is probed for presence at run time (Load fails as a whole on older systems).
- Builds need CGO_ENABLED=1 and the NDK clang (purego on Android); the backend has no cgo source. The
  build tag "android || mediacodec_typecheck" lets go vet check it on any host; layout.go, paramsets.go
  and names.go carry no tag and run under go test everywhere.
- Hardware versus software is decided from AMediaCodec_getName (c2.android.*, OMX.google.*, ".sw.");
  Probe lists hardware codecs only, NewDecoder/NewEncoder refuse software ones without WithSoftwareFallback.
- The decoder is configured when the picture size is known (SPS or AV1 sequence header parsed in Go);
  a size change runs the codec to end of stream, stops and reconfigures it. Output buffers are read
  through the layout the output format describes; an unknown layout is ErrUnsupported quoting the format.
- Encoder input is NV12 (colour format 21) or, when refused, I420 (19), converted while copying; forced
  keyframes go through AMediaCodec_setParameters request-sync; parameter sets from the codec-config buffer
  are prepended to keyframes that lack them. AV1 encoding is not offered.
- H.264 and HEVC frames go through the Go reorder layer (OutputsDisplayOrder false; MediaCodec orders
  output by input timestamps), AV1 is passed through; RGBA/BGRA go through pixconv as on the other
  NV12-only backends.
non_goals:
- Running on a device from this session (the author has an Android tablet and will test both platforms
  together); the Android Studio project was not built here either.
- AImageReader / Surface output, asynchronous MediaCodec callbacks, zero-copy into Ebitengine.
- AV1 encoding (MediaCodec has hardware AV1 encoders on recent SoCs; a separate slice on every backend).
- 10-bit output; vendor-specific tiled colour formats (an unknown layout is reported, not decoded).
acceptance:
  typecheck-and-units:
    text: go vet -tags mediacodec_typecheck ./internal/mediacodec/... passes on macOS and the layout,
      name and structure-size unit tests pass under plain go test.
    scope:
      milestone: android-mediacodec
    verified_by:
    - typecheck
    - unit-tests
  android-deps:
    text: GOOS=android go list -deps . lists the mediacodec backend and no Linux backend; backends_other.go
      no longer covers android.
    scope:
      milestone: android-mediacodec
    verified_by:
    - android-deps
  aar-builds:
    text: ebitenmobile bind produces mobile.aar for android/arm64 and android/amd64 from the examples/mobile package,
      build-apk.sh turns it into an APK with the SDK tools alone, and the app plays the bundled clip on the
      Android 14 emulator through the mediacodec backend.
    scope:
      milestone: android-mediacodec
    verified_by:
    - aar-build
    - emulator-app-run
  emulator-probe-decode-encode:
    text: On the Android 14 emulator, scripts/android_device_check.sh with SOFTWARE=1 decodes B-frame
      H.264, HEVC and AV1 streams identically to ffmpeg in display order, encodes H.264 and HEVC that
      ffmpeg decodes, and transcodes.
    scope:
      milestone: android-mediacodec
    verified_by:
    - emulator-run
  device-probe-decode-encode:
    text: On an Android 14 device the examples/mobile app's top line names mediacodec with hardware h264
      and hevc decode and encode, the clip plays, and go test ./... (or the CLI with adb-pushed streams)
      decodes B-frame streams in display order matching ffmpeg and produces ffmpeg-decodable H.264 and
      HEVC.
    scope:
      milestone: android-mediacodec
    verified_by:
    - device-run
  existing-suites:
    text: go test ./..., CGO_ENABLED=0 go test ., scripts/crossbuild.sh and scripts/mobilebuild.sh pass
      on the Mac.
    scope:
      milestone: android-mediacodec
    verified_by:
    - existing-suites
