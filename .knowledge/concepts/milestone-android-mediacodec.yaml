id: milestone:android-mediacodec
type: milestone
title: Android through the NDK MediaCodec backend
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:mediacodec (keys prefixed android-). Original summary: Second half of the mobile
  request (2026-10-12, "Androidの方の実装もお願いします", Android 14 as the minimum): a new backend internal/mediacodec
  on the NDK MediaCodec C API (libmediandk.so) through purego. H.264, HEVC and AV1 decoding and H.264
  and HEVC encoding, synchronous dequeue/queue without callbacks, byte-buffer output whose layout is read
  from the output format (MediaImage2 "image-data" or colour format 19/21 with stride and slice height)
  and packed into NV12 in Go, software codecs refused by name unless WithSoftwareFallback, display order
  from the codec. Registered by backends_android.go. Written and type-checked on macOS with the mediacodec_typecheck
  tag; the layout code is unit-tested there; nothing has run on Android (no SDK/NDK on the Mac, emulator
  codecs are software). The examples/mobile Go package gained an Android Studio project.'
lifecycle: superseded
authority: authored
aliases:
- Android support
- Android対応
- MediaCodec backend
- GOOS=android
scope:
  platform: android
  milestone: android-mediacodec
non_goals:
- Running on a device from this session (the author has an Android tablet and will test both platforms
  together); the Android Studio project was not built here either.
- AImageReader / Surface output, asynchronous MediaCodec callbacks, zero-copy into Ebitengine.
- AV1 encoding (MediaCodec has hardware AV1 encoders on recent SoCs; a separate slice on every backend).
- 10-bit output; vendor-specific tiled colour formats (an unknown layout is reported, not decoded).
