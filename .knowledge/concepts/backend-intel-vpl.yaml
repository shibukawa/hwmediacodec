facts:
  libraries:
    linux:
    - libvpl.so.2 (dispatcher)
    - libmfx-gen.so.1.2 (Gen12+ runtime)
    - libmfxhw64.so.1 (legacy Media SDK runtime for Gen9/Gen11)
    windows:
    - libvpl.dll or direct runtime libmfx64-gen.dll shipped with the Intel graphics driver
  licence: MIT for both the dispatcher (intel/libvpl) and the GPU runtime (intel/vpl-gpu-rt).
  api_model: full decoder/encoder (MFXVideoDECODE_DecodeFrameAsync takes a bitstream; MFXVideoENCODE_EncodeFrameAsync
    emits a bitstream); mfxSession / mfxVideoParam / mfxFrameSurface1.
  dispatcher_behaviour: The dispatcher itself scans library folders and resolves MFXQueryImplsDescription
    at run time; a Go backend can skip the dispatcher and dlopen the runtime directly, or dlopen the dispatcher.
  hardware_floor:
    linux: Tiger Lake (Gen12) and newer for the VPL runtime; Gen9/Gen11 only through the deprecated Media
      SDK runtime.
    windows: Broad; the driver bundles the runtime.
  ffi_notes:
  - Plain C ABI with large versioned structs (mfxVideoParam unions); Go struct layouts must match the
    headers exactly.
  - Surfaces can be system memory (simplest, copies) or VA/D3D11 surfaces (zero-copy, later).
  - Depends on libva/libva-drm at run time on Linux; errors from the VA layer surface as mfxStatus codes.
  why_it_matters: Gives Intel GPUs on Linux a full-API path without the Go bitstream parser that raw VA-API
    needs; the same API works on Windows as an alternative to Media Foundation with richer controls (look-ahead,
    low-power encode).
  evidence:
  - url: https://github.com/nanazhan/vpl-gpu-rt
    claim: Intel VPL GPU Runtime is MIT licensed, depends on LibVA and supports platforms starting with
      Tiger Lake.
  - url: https://packages.debian.org/ja/sid/libmfx-gen1.2
    claim: Debian packages the runtime as libmfx-gen1.2 depending on libva2 and libva-drm2.
  - url: https://oneapi-spec.uxlfoundation.org/specifications/oneapi/v1.2-rev-1/elements/onevpl/source/programming_guide/vpl_prg_session
    claim: The dispatcher loads candidate runtime libraries at run time and resolves MFXQueryImplsDescription.
  support_tier: tier1 (Linux Intel Gen12+; optional on Windows)
  implementation:
    package: internal/vpl (doc.go, backend.go, session.go, decoder.go, encoder.go, encparam.go,
      pixels.go, paramsets.go) over internal/vpl/sys (purego loader for libvpl.so.2, struct mirrors of
      the API 2.8 headers checked by layout_test.go against gcc sizeof/offsetof for x86_64) and the
      libva bindings of internal/vaapi/sys for the display.
    api_level: only API 1.x calls (MFXVideoCORE_SetHandle/SyncOperation, MFXVideoDECODE_*,
      MFXVideoENCODE_* with application-allocated surfaces) plus the 2.x dispatcher entry points
      (MFXLoad, MFXCreateConfig, MFXSetConfigFilterProperty, MFXCreateSession), so both libmfx-gen and
      the legacy libmfxhw64 runtime are driven the same way.
    session: first /dev/dri/renderD128..143 whose sysfs PCI vendor is 0x8086 (or whose VA vendor
      string names Intel when sysfs is unreadable; HWMEDIACODEC_VPL_DEVICE overrides); open,
      vaGetDisplayDRM, vaInitialize with libva messages silenced; MFXLoad, one config with
      mfxImplDescription.Impl = MFX_IMPL_TYPE_HARDWARE (the mfxVariant passed by value as two uint64
      words), MFXCreateSession(index 0), MFXVideoCORE_SetHandle(MFX_HANDLE_VA_DISPLAY) tolerating
      MFX_ERR_UNDEFINED_BEHAVIOR; one session, loader, display and file descriptor per decoder or
      encoder; MFXVideoCORE_SyncOperation waits at most 60 s and MFX_WRN_DEVICE_BUSY is retried every
      millisecond for at most 5 s.
    probe: MFXVideoDECODE_Query and MFXVideoENCODE_Query for 1080p NV12 4:2:0 (High / Main profile,
      CQP for the encoder); an error or MFX_WRN_PARTIAL_ACCELERATION means not supported; no size
      limits are reported yet.
    decoder: a Go keyframe gate with a VPS/SPS/PPS cache by id (the first keyframe after start or
      Flush is prefixed with the cached sets when it lacks them); MFXVideoDECODE_DecodeHeader on that
      packet, 8-bit 4:2:0 NV12 check, MFXVideoDECODE_QueryIOSurf, MFXVideoDECODE_Init with
      MFX_IOPATTERN_OUT_SYSTEM_MEMORY and AsyncDepth 1; NumFrameSuggested surfaces up front, more on
      demand (64 at most), each an mfxFrameSurface1 plus a pixel buffer on the Go heap with a
      64-byte-aligned pitch; per access unit one mfxBitstream with the PTS plus 2^40 as TimeStamp (so
      that a negative PTS is neither MFX_TIMESTAMP_UNKNOWN nor damaged by the runtime's double-seconds
      arithmetic) and MFX_BITSTREAM_COMPLETE_FRAME when DecodeHeader reported a progressive sequence,
      DecodeFrameAsync repeated until MFX_ERR_MORE_DATA (MFX_ERR_MORE_SURFACE
      and MFX_WRN_VIDEO_PARAM_CHANGED continue, MFX_ERR_INCOMPATIBLE_VIDEO_PARAM drains, closes and
      re-initialises from the same access unit once); every output is synchronised at once and its
      CropX/Y/W/H rectangle copied into a pooled NV12 buffer; Flush drains with a NULL bitstream and
      calls MFXVideoDECODE_Reset (Close on failure).
    encoder: mfxVideoParam with coded size aligned to 16 and the picture as crop, NV12 4:2:0
      progressive, frame rate fraction (30/1 when unknown), TargetUsage 4, GopPicSize = keyframe
      interval (two seconds or 60 frames by default), MFX_GOP_CLOSED, IdrInterval 0 for H.264 and 1 for
      HEVC (every I-frame is IDR), GopRefDist 1 or 3 with WithBFrames (never with low latency or
      Baseline), rate control CQP (qp = round(51 - 45*quality), 26 by default), VBR with a 2x peak or
      CBR in kbit/s with BRCParamMultiplier above 65535, profiles Constrained Baseline/Main/High and
      HEVC Main, LowPower left to the runtime, AsyncDepth 1, MFX_IOPATTERN_IN_SYSTEM_MEMORY;
      mfxExtCodingOption (AUDelimiter off) and mfxExtCodingOption2 (AdaptiveI, AdaptiveB and RepeatPPS
      off, BRefType off with B-frames) and, for HEVC, mfxExtCodingOption3 with GPB off (plain P
      pictures instead of generalised B, which ffprobe reports as B-frames); when Init rejects the
      configuration it is retried without mfxExtCodingOption3 and then without any buffer;
      MFXVideoENCODE_GetVideoParam with mfxExtCodingOptionSPSPPS (+VPS) for the parameter sets, the
      real GopRefDist and BufferSizeInKB; a changed rate control method is ErrUnsupported; per frame
      the picture is copied into a free surface with edge replication, mfxEncodeCtrl.FrameType =
      I|REF|IDR forces a keyframe, EncodeFrameAsync then SyncOperation and a copy of the bitstream;
      MFX_ERR_NOT_ENOUGH_BUFFER doubles the buffer, MFX_WRN_DEVICE_BUSY and MFX_WRN_IN_EXECUTION are
      retried and any other warning counts as "frame taken" (as FFmpeg does); Flush drains with a NULL
      surface and the next Send closes and re-initialises the encoder (MFXVideoENCODE_Reset leaves it
      to the runtime whether a new sequence starts) and forces an IDR.
    output_contract: display-order NV12 frames with the packet's PTS (codec.DisplayOrderer, no Go
      reorder layer); Annex-B packets with Keyframe from the NAL types, VPS/SPS/PPS prepended from
      GetVideoParam when a keyframe lacks them, DTS = input PTS of the k-th frame minus
      (GopRefDist - 1) frame durations.
    limitations:
    - 8-bit 4:2:0 NV12 only in both directions (no RGBA/BGRA, no 10-bit); no AV1.
    - WithDecodeOrder has no effect; the runtime's own reorder delay applies.
    - Even picture dimensions for encoding; one synchronous operation per frame.
    - Needs libvpl (the legacy libmfx.so.1 dispatcher alone is not used); Linux only.
    - Probe reports no maximum picture size.
  host_verification_2026-10-09:
    layouts: 159 sizes/offsets and 13 constants equal the values gcc prints from Debian's libvpl-dev
      2023.1.1 headers for x86_64-linux-gnu.
    symbols: all 24 entry points bind against libvpl 2.8 in a Debian bookworm amd64 container with
      libmfx-gen1.2 22.6.4; the dispatcher accepts the hardware filter and refuses a mistyped variant;
      MFXCreateSession reports MFX_ERR_NOT_FOUND without a GPU and Probe returns an empty list.
    unit: encoder parameter mapping, bitstream sizing, surface upload/crop copies and the
      parameter-set cache are tested without the library.
    pending: decode and encode conformance on real Intel hardware (see milestone:linux-intel-vpl).
