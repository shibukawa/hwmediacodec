acceptance:
  vpl-mfx-struct-layout:
    text: Go mirrors of mfxFrameInfo, mfxInfoMFX, mfxVideoParam, mfxBitstream, mfxFrameData, mfxFrameSurface1,
      mfxFrameAllocRequest, mfxEncodeCtrl, mfxExtCodingOption, mfxExtCodingOption2, mfxExtCodingOptionSPSPPS,
      mfxExtCodingOptionVPS and mfxVersion have the sizes and field offsets a C compiler measures for
      x86_64-linux-gnu (several are declared with pragma pack(4) in C), and the FourCC identifiers and
      enumerators equal the header values.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-layout-test
  vpl-symbols-bind:
    text: Every libvpl entry point the backend uses binds against a real dispatcher build, and the dispatcher
      accepts the hardware filter whose mfxVariant is passed by value as two integer register words (and
      refuses the same property with a wrong variant type).
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-symbol-binding-container
  vpl-graceful-without-hardware:
    text: Without libvpl or libva, or with them but without an Intel GPU, Probe returns an empty list
      and NewDecoder/NewEncoder return ErrUnsupported; nothing crashes and nothing is printed.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-symbol-binding-container
  vpl-parameter-mapping:
    text: The public encoder controls map to mfxVideoParam as documented (coded size aligned to 16 with
      the picture as crop, GopPicSize, IdrInterval 0 for H.264 and 1 for HEVC so that every I-frame is
      IDR, GopRefDist 3 for B-frames, CQP/VBR/CBR with BRCParamMultiplier beyond 65535 kbit/s, profiles),
      unsupported combinations are ErrUnsupported, and the pixel copies (edge replication into the alignment
      padding, cropped copy out) and the parameter-set cache behave as specified.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-host-unit-tests
  vpl-decode-reference-linux:
    text: On a Linux machine with an Intel GPU and a VPL runtime, TestDecodeMatchesReference/h264-bf0,
      TestDecodeMatchesReference/hevc-bf0, the B-frame display-order tests, TestDecodeParameterSetChange,
      TestFlushResumesAtKeyframe and TestInvalidData pass (per-frame NV12 checksums equal ffmpeg's software
      decoder); TestDecodeOrderOption skips because the runtime reorders natively.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-hardware-decode
  vpl-encode-reference-linux:
    text: On the same machine the encode conformance tests (PSNR against the source, keyframe interval,
      forced keyframes, B-frames with monotonic DTS, CBR/VBR sizes, quality ordering, low latency, profiles,
      flush/reuse) and the transcode round trip pass; RGBA/BGRA input skips.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-hardware-encode
  vpl-backend-selection:
    text: HWMEDIACODEC_BACKENDS restricts and orders the backends Probe, NewDecoder and NewEncoder consult,
      so the VA-API and VPL backends can each be exercised on the same Intel GPU.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-host-unit-tests
  vpl-cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-cross-build-check
  vpl-host-suite-unaffected:
    text: The full macOS test suite still passes with the backend wired in.
    scope:
      milestone: linux-intel-vpl
      platform: linux
      gpu: intel
    verified_by:
    - vpl-host-suite
