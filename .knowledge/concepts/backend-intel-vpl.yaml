id: backend:intel-vpl
type: backend
title: Intel VPL (oneVPL / Quick Sync) - full codec API for Intel GPUs
summary: Intel's MIT-licensed video processing library. Unlike VA-API it accepts a compressed bitstream
  and parses it internally, so it is a full-decoder/encoder API. Linux runtime requires Tiger Lake (Gen12)
  or newer and runs on top of VA-API/iHD; the Windows runtime ships with the Intel graphics driver.
lifecycle: active
authority: inferred
aliases:
- oneVPL
- libvpl
- Quick Sync
- QSV
- Media SDK
scope:
  platform:
  - linux
  - windows
  gpu: intel
constraints:
- CGO_ENABLED=0; libvpl.so.2 is dlopened with purego and no module dependency is added. The structs mirror
  the VPL headers at API 2.8 (Debian libvpl-dev 2023.1.1); only the API 1.x call set is used (external
  system-memory surfaces, MFXVideoCORE_SyncOperation), so the legacy Media SDK runtime libmfxhw64 behind
  the same dispatcher is served by the same code.
- Same public API and Send/Receive/Flush contract as the other backends. The runtime emits display order,
  so the decoder implements codec.DisplayOrderer and is not wrapped in the Go reorder layer; WithDecodeOrder
  has no effect, as on Media Foundation.
- NV12 in CPU memory, 8-bit 4:2:0. The GPU runtime needs the application's VADisplay (MFXVideoCORE_SetHandle
  with MFX_HANDLE_VA_DISPLAY), so the backend reuses the libva bindings of internal/vaapi/sys and owns
  a DRM file descriptor and display per decoder or encoder.
- Registered after nvidia and before vaapi in backends_linux.go - on an Intel GPU with a VPL runtime it
  serves the request, and VA-API takes over through the ErrUnsupported chain when the runtime is missing
  or rejects a configuration.
- Hardware only - the dispatcher filter mfxImplDescription.Impl = MFX_IMPL_TYPE_HARDWARE is set and MFX_WRN_PARTIAL_ACCELERATION
  is reported as ErrUnsupported.
