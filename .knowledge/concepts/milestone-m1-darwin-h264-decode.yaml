id: milestone:m1-darwin-h264-decode
type: milestone
title: M1 - API skeleton, Probe() and H.264 decode on macOS via VideoToolbox
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:bitstream (keys prefixed m1-). Original summary: First usable
  slice (proposed as a stated assumption): a public Go API with Probe(), Decoder and Frame, one backend
  (VideoToolbox) that decodes an H.264 Annex-B elementary stream into NV12 frames, built with CGO_ENABLED=0
  and checked against an ffmpeg-produced reference.'
lifecycle: superseded
authority: authored
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: m1
non_goals:
- Encoding, HEVC/AV1, container demux, other platforms.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:videotoolbox
- relation: tests_decision
  to: decision:ffi-strategy
- relation: superseded_by
  to: backend:videotoolbox
- relation: superseded_by
  to: component:bitstream
history:
  accepted-2026-10-09:
    summary: Author confirmed M1 = macOS + decode + H.264 with purego.
  delivered-2026-10-09:
    summary: All M1 acceptance checks passed on the author's M3 Mac; HEVC decode and a flush/seek test
      were added beyond the original scope.
  reverified-2026-10-09:
    summary: M1 decode tests re-run and passing after the M2 API changes (option types became interfaces;
      ErrClosed/ErrInvalidData messages generalised); basis hashes refreshed.
  superseded-2026-10-16:
    summary: Folded into backend:videotoolbox, component:bitstream on 2026-10-16 so that the current state
      of each backend and package is read from one concept; this file keeps the slice's definition and
      timeline.
