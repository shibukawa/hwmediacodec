open_questions:
  annexb-parser-scope:
    text: Is a minimal Go Annex-B NAL splitter plus SPS/PPS extraction enough for M1, or should M1 already
      include a full SPS parser (needed later for VA-API)?
    state: answered
    resolution: 'Minimal parser was enough: NAL split, first_mb/first_slice flag, parameter-set ids (incl.
      HEVC profile_tier_level skip). A full SPS/slice parser is only needed for POC-based reordering and
      for VA-API; tracked as requirement open question frame-reordering.'
facts:
  provisional_api:
    note: Provisional shape to validate in M1; not an agreed final API.
    sketch: "package hwmediacodec\n\ntype Codec int // H264, HEVC, AV1\ntype Direction int // Decode,\
      \ Encode\n\ntype Capability struct {\n    Backend   string   // \"videotoolbox\", \"mediafoundation\"\
      , \"vaapi\", \"nvidia\"\n    Codec     Codec\n    Direction Direction\n    Profiles  []string\n\
      \    MaxWidth, MaxHeight int\n}\nfunc Probe(ctx context.Context) ([]Capability, error)\n\ntype Packet\
      \ struct { Data []byte; PTS, DTS int64; Keyframe bool }\ntype Frame struct {\n    Width, Height\
      \ int\n    Format        PixelFormat // NV12 in M1\n    Planes        [][]byte\n    Strides    \
      \   []int\n    PTS           int64\n}\nfunc (f *Frame) Release()\nfunc (f *Frame) Native() any //\
      \ reserved: backend surface handle, nil in M1\n\ntype Decoder interface {\n    Send(ctx context.Context,\
      \ p Packet) error   // ErrAgain when the queue is full\n    Receive(ctx context.Context) (*Frame,\
      \ error) // ErrAgain when nothing is ready; io.EOF after Flush drains\n    Flush(ctx context.Context)\
      \ error\n    Close() error\n}\nfunc NewDecoder(ctx context.Context, codec Codec, opts ...DecoderOption)\
      \ (Decoder, error)\n\nvar ErrUnsupported = errors.New(\"hwmediacodec: unsupported\")\n"
  steps:
  - Module layout; public types; ErrUnsupported; stub backends for non-darwin GOOS.
  - internal/videotoolbox/sys - purego bindings for VideoToolbox, CoreMedia, CoreVideo and CoreFoundation
    functions used by decode.
  - Annex-B splitter, SPS/PPS capture, AVCC conversion, CMVideoFormatDescriptionCreateFromH264ParameterSets.
  - VTDecompressionSession with a Go callback (purego.NewCallback); copy CVPixelBuffer planes into Frame;
    ordered output by PTS.
  - Test helper that generates testdata with ffmpeg (testsrc, libx264, h264_mp4toannexb) and computes
    reference checksums; skip when ffmpeg is absent.
  - Probe() for darwin via VTIsHardwareDecodeSupported / VTCopySupportedPropertyDictionaryForEncoder.
  known_risks:
  - VideoToolbox session creation uses global encoder/decoder registry state; serialize session creation.
  - purego callback ABI on arm64 vs amd64 must be covered by CI on both.
  - Intel Macs are out of scope, so tests may assume Apple Silicon hardware paths; still compare against
    the same machine's ffmpeg output rather than fixed golden hashes because hardware decoders are not
    required to be bit-exact.
  api_notes_from_use_cases:
  - Reserve a DecoderOption for output pixel format (NV12 default, BGRA later for Ebitengine) but verify
    only NV12 in M1.
  - Flush() must be usable as a seek reset (playback use case) - drop queued frames and allow restarting
    at a keyframe.
  - Keep Send/Receive synchronous with ErrAgain; the batch-transcode use case needs no callbacks.
  result:
    status: delivered 2026-10-09
    environment:
      host: Apple M3, macOS 27.0.1 (build 26A434)
      go: go1.27.0 darwin/arm64
      purego: github.com/ebitengine/purego v0.11.1
      oracle: ffmpeg 9.0.1 (libx264, libx265 available)
      date: '2026-10-09'
    tests:
    - TestDecodeH264MatchesReference
    - TestDecodeHEVCMatchesReference
    - TestDecodeParameterSetChange
    - TestFlushResumesAtKeyframe
    - TestInvalidData
    - TestProbe
    - TestUnsupportedCodec
    - TestUnsupportedOutputFormat
    - annexb and bitstream unit tests
    performance: 1080p H.264 (no B-frames) 300 frames in 360 ms = ~834 fps; with B-frames ~430 fps; B-frame
      frame set equals ffmpeg output but in decode order.
  learned:
  - 'purego handles every call needed: dlopen of system frameworks, CF constants via Dlsym + pointer deref,
    9-argument CoreMedia calls (stack args), and a NewCallback invoked by VideoToolbox; declaring only
    the first five callback parameters and ignoring the trailing CMTime values works on arm64.'
  - Synchronous VTDecompressionSessionDecodeFrame (flags 0) emits the output callback before returning,
    giving a deterministic Send/Receive contract without goroutines.
  - Hardware H.264/HEVC output is bit-exact with ffmpeg software decoding for 8-bit 4:2:0 (per-frame SHA-256
    equality), so checksums are a valid oracle.
  - go vet rejects uintptr->unsafe.Pointer conversions; returning *byte from purego-bound functions and
    unsafe.Add(nil, addr) for Dlsym constants keeps vet clean.
  - Session recreation on SPS/PPS change (drain, invalidate, create) loses no frames.
  - VideoToolbox requires AVCC (length-prefixed) samples; Annex-B conversion plus in-band parameter-set
    extraction is cheap and sufficient.
  - 'VideoToolbox does not reorder H.264/HEVC output into display order on this path: temporal processing
    (sync or async) with real PTS still yields decode order. A PTS/POC reorder buffer in Go is required
    for display order; a WithPresentationOrder option was prototyped and removed because it did not work.'
