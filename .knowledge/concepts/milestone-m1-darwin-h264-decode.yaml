id: milestone:m1-darwin-h264-decode
type: milestone
title: M1 - API skeleton, Probe() and H.264 decode on macOS via VideoToolbox
summary: 'First usable slice (proposed as a stated assumption): a public Go API with Probe(), Decoder
  and Frame, one backend (VideoToolbox) that decodes an H.264 Annex-B elementary stream into NV12 frames,
  built with CGO_ENABLED=0 and checked against an ffmpeg-produced reference.'
lifecycle: active
authority: authored
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: m1
constraints:
- CGO_ENABLED=0 for the library and tests; the ffmpeg CLI may be used only by test helpers to generate
  inputs and reference output.
- Annex-B input (start codes); the backend converts to AVCC and builds the CMVideoFormatDescription from
  in-band SPS/PPS.
- Output frames are NV12 ('420v') copied into Go-owned buffers with Release().
non_goals:
- Encoding, HEVC/AV1, container demux, other platforms.
acceptance:
  decode-reference:
    text: Decoding testdata/*.h264 produces the same frame count and per-frame NV12 checksums as ffmpeg
      -c:v h264 -f rawvideo -pix_fmt nv12 (software decode) within the tolerance of bit-exact output.
    scope:
      milestone: m1
    verified_by:
    - decode-reference-test
  probe-darwin:
    text: Probe() on an Apple Silicon Mac reports backend videotoolbox with decode h264 and hevc; on a
      machine without VideoToolbox the backend is absent and no error is returned.
    scope:
      milestone: m1
    verified_by:
    - probe-test
  parameter-set-change:
    text: A stream whose SPS/PPS change mid-way (resolution change) is decoded by recreating the session,
      with no frames lost before the change.
    scope:
      milestone: m1
    verified_by:
    - sps-change-test
  cross-build:
    text: GOOS=linux and GOOS=windows builds of the module succeed with CGO_ENABLED=0 (backends compile
      to stubs that report absent).
    scope:
      milestone: m1
    verified_by:
    - cross-build-check
