history:
  audiomf-restored-2026-10-16:
    summary: The content of milestone:audio-media-foundation (delivered 2026-10-14 but merged into a stacked branch instead
      of main) was re-applied onto main on 2026-10-16 and folded into this concept, keys prefixed audiomf-;
      the milestone file remains as a superseded stub with its timeline.
    supersedes:
    - milestone:audio-media-foundation
  decode-implemented-2026-10-09:
    summary: H.264/HEVC decode backend written (milestone:windows-media-foundation); lifecycle moved to
      active. Verification on Windows hardware pending.
  encode-implemented-2026-10-09:
    summary: H.264/HEVC encode through vendor hardware MFTs written on the same branch; verification on
      Windows hardware pending.
  nvidia-registered-first-2026-10-09:
    summary: Author asked whether this backend also covers AMD and NVIDIA (it does, vendor-agnostic) and
      then had NVDEC/NVENC driven directly on Windows; on amd64 this backend is now tried after the nvidia
      backend (milestone:windows-nvidia-nvdec-nvenc).
  mf-started-2026-10-09:
    summary: Author asked for Windows Intel support, decoder first ("Windows Intelの対応をお願いしたい。デコーダから").
      Media Foundation + Direct3D 11 chosen per policy:support-tiers (primary backend for Windows Intel/AMD,
      also covers NVIDIA decode); Intel VPL kept as an alternative.
  mf-authored-2026-10-09:
    summary: Decoder implementation, unit tests and Windows conformance tests written on macOS; cross-build
      and vet pass for windows/amd64 and windows/arm64; author excluded 32-bit Windows. Hardware verification
      pending. Opened as PR shibukawa/hwmediacodec#4 after merging main (M2 encode).
  mf-encoder-authored-2026-10-09:
    summary: Author asked for the encoder next, appended to the same PR ("次にエンコーダーもお願いします。このまま同じPRに追記で").
      Vendor asynchronous hardware encoder MFTs driven through the event model; Codec API mapping of the
      shared encoder controls; conformance tests mirror the macOS ones. Hardware verification pending.
  mf-nvidia-direct-2026-10-09:
    summary: After the merge the author asked whether the backend distinguishes GPU vendors (it does not)
      and requested NVDEC/NVENC directly for NVIDIA; milestone:windows-nvidia-nvdec-nvenc registers that
      backend ahead of this one on windows/amd64. backends_windows.go changed for it and TestDecodeOrderOption
      now skips by serving backend, not by operating system.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:windows-media-foundation, milestone:av1-decode-linux-windows
      was folded into this concept (keys prefixed with the milestone's tag; dated measurements kept as
      evidence notes); the milestone files remain as superseded stubs with their timelines.
    supersedes:
    - milestone:windows-media-foundation
    - milestone:av1-decode-linux-windows
