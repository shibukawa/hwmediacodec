acceptance:
  mf-decode-reference-windows:
    text: Decoding a 320x240 H.264 stream on a Windows machine with a DXVA-capable GPU yields the same
      frame count and per-frame NV12 checksums as ffmpeg software decode, in display order.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-decode-reference-test-windows
  mf-hevc-reference-windows:
    text: Same as decode-reference-windows for HEVC (needs the HEVC Video Extensions package).
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-hevc-reference-test-windows
  mf-bframes-display-order:
    text: Streams with B-frames come back in display order (Media Foundation reorders internally), bit-exact
      against ffmpeg.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-bframe-order-test-windows
  mf-parameter-set-change-windows:
    text: A resolution change mid-stream is handled through MF_E_TRANSFORM_STREAM_CHANGE with no frames
      lost.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-sps-change-test-windows
  mf-flush-resume-windows:
    text: Flush drains every frame (MFT_MESSAGE_COMMAND_DRAIN); the decoder restarts at the next keyframe
      with stored parameter sets prefixed when the keyframe lacks them.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-flush-seek-test-windows
  mf-probe-windows:
    text: Probe reports backend mediafoundation decode h264 (and hevc when the extension is installed)
      with Hardware=true on a GPU machine and nothing on a GPU-less VM; no error either way.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-probe-test-windows
  mf-encode-matches-source-windows:
    text: Encoding 60 synthetic NV12 frames with a vendor hardware MFT yields one Annex-B packet per frame,
      the first a keyframe with in-band parameter sets, PTS passthrough, luma PSNR above 30 dB after ffmpeg
      decode, and ffprobe keyframe flags that agree with Packet.Keyframe.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-encode-reference-test-windows
  mf-encode-controls-windows:
    text: Keyframe interval and forced keyframes are honoured; B-frames, CBR, constant quality, low latency
      and profiles work when the vendor MFT accepts them and otherwise return ErrUnsupported (the tests
      skip in that case and report which control was refused).
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-encode-controls-test-windows
  mf-transcode-roundtrip-windows:
    text: Hardware encode followed by hardware decode of the result reproduces the source above 30 dB
      luma PSNR, frame for frame.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-transcode-test-windows
  mf-cross-build-m3:
    text: CGO_ENABLED=0 builds for windows/amd64, windows/arm64 and windows/386 (no backend) from macOS;
      go vet passes for windows/amd64 and windows/arm64; struct layouts match the SDK at compile time.
    scope:
      milestone: m3
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
    verified_by:
    - mf-cross-build-check-m3
    - mf-layout-check-m3
    - mf-unit-tests-m3
  audiomf-builds:
    text: The module and its tests compile for windows/amd64 and windows/arm64 with CGO_ENABLED=0 and
      go vet is clean.
    scope:
      milestone: audio-media-foundation
      platform: windows
    verified_by:
    - audiomf-cross-build
  audiomf-windows-audio:
    text: go test -run 'Audio|TestProbe' . on a Windows machine with ffmpeg passes - AAC decoding against
      ffmpeg in place, AAC encoding decoded by ffmpeg to the input in place, round trips, flush, errors.
    scope:
      milestone: audio-media-foundation
      platform: windows
    verified_by:
    - audiomf-windows-run
  audiomf-long-frame:
    text: One Send of a minute of PCM to the Media Foundation AAC encoder queues at most maxAudioPending packets, Receive encodes the rest without the queue passing the bound, and after Flush the packets cover every sample plus the delay.
    scope:
      platform: windows
    verified_by:
    - audiomf-long-frame-run
