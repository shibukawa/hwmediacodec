id: backend:media-foundation
type: backend
title: Media Foundation MFTs (Windows)
summary: Windows' COM-based media pipeline. Hardware encoders/decoders are exposed as asynchronous Media
  Foundation Transforms (MFTs) bound to a D3D11 device through IMFDXGIDeviceManager. Audio (AAC decode
  and encode, Opus decode where installed) goes through software MFTs (keys audiomf-; never run on Windows).
lifecycle: active
authority: inferred
aliases:
- Media Foundation
- MFT
- IMFTransform
- mfplat
- DXVA
scope:
  platform: windows
  gpu:
  - intel
  - amd
  - nvidia
  - qualcomm
constraints:
- CGO_ENABLED=0; native access through golang.org/x/sys/windows (LoadLibraryEx with system32 search) and
  raw COM vtable calls via syscall.SyscallN. No cgo, no third-party COM library.
- Hardware only. Probe reports a codec when the GPU exposes the DXVA profile with NV12 output (ID3D11VideoDevice)
  and a synchronous decoder MFT exists; NewDecoder returns ErrUnsupported otherwise. WithSoftwareFallback
  is not implemented on Windows.
- Annex-B input, one access unit per Packet, passed to the MFT unchanged (MFVideoFormat_H264 / MFVideoFormat_HEVC
  accept start codes with in-band parameter sets).
- Output NV12 copied to Go memory through a staging texture (CopySubresourceRegion + Map); the visible
  picture is cropped with MF_MT_MINIMUM_DISPLAY_APERTURE.
- Encoder input is NV12 in system memory (tightly packed, MF_MT_DEFAULT_STRIDE = width); output is Annex-B
  with VPS/SPS/PPS guaranteed in front of every keyframe (prepended from the stream or MF_MT_MPEG_SEQUENCE_HEADER
  when the MFT omits them). Hardware encoder MFTs only; WithSoftwareFallback admits the synchronous Microsoft
  H.264 encoder.
- Encoder controls map to ICodecAPI before SetOutputType (rate control mode, mean bitrate, quality, GOP
  size, B-picture count, low latency) plus MF_MT_AVG_BITRATE / MF_MT_FRAME_RATE / MF_MT_MPEG2_PROFILE
  on the output type; AVEncVideoForceKeyFrame per forced frame. A control the MFT rejects is ErrUnsupported
  naming the control and the MFT.
- 'windows/amd64 and windows/arm64 only (author decision 2026-10-09: 32-bit Windows is out of scope).
  windows/386 still builds with no backend.'
- 'Transforms are found with MFTEnumEx in MFT_CATEGORY_AUDIO_DECODER / MFT_CATEGORY_AUDIO_ENCODER for
  MFAudioFormat_AAC and MFAudioFormat_Opus (synchronous, local; a second try with MFT_ENUM_FLAG_UNTRUSTED_STOREMFT
  for codecs from the Store). No Direct3D device is involved. The audio GUIDs were checked against mfapi.h
  (Wine''s copy) on 2026-10-14.'
- 'AAC decoder input type: MFAudioFormat_AAC, rate and channels of the output, 16 bits, MF_MT_AAC_PAYLOAD_TYPE
  0 (raw access units), profile and level 0xFE, MF_MT_USER_DATA = the twelve bytes of HEAACWAVEINFO behind
  its WAVEFORMATEX followed by the AudioSpecificConfig. Opus decoder input type: MFAudioFormat_Opus at
  48 kHz with an OpusHead without pre-skip as user data (a guess: the transform is not documented).'
- 'Output type: of the types the decoder lists, 16-bit PCM before 32-bit float, the channel count of
  the stream before a downmix; chosen again on MF_E_TRANSFORM_STREAM_CHANGE. Frames are matched to packets
  by order through audioutil.Frames. Flush drains and then sends MFT_MESSAGE_COMMAND_FLUSH.'
- 'AAC encoder: 44100 or 48000 Hz, mono or stereo, 96, 128, 160 or 192 kbit/s (what the documentation
  of the system''s encoder lists; default 96 for mono and 128 for stereo), anything else is ErrUnsupported;
  one rate control for VBR and CBR. Output type set before the input type, the other order tried on failure.
  Input goes in one packet''s worth (1024 samples) at a time. The AudioSpecificConfig is read from the
  user data of the output type. The delay is measured with audioutil.MeasureDelay (assumed 1024 when
  that fails); a new transform per signal.'
