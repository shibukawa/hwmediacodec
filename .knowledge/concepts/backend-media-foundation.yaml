open_questions:
  mf-hardware-verification:
    text: Does the implementation work on real Intel hardware? The riskiest unverified points are (1)
      DXGI sample readback through CopySubresourceRegion/Map on decoder-bound texture arrays, (2) whether
      the Microsoft decoders attach the input sample time to the matching output frame when input timestamps
      are in decode order, (3) HEVC extension discovery through MFTEnumEx (first without, then with MFT_ENUM_FLAG_UNTRUSTED_STOREMFT),
      (4) the HEVC input type without MF_MT_VIDEO_PROFILE. For the encoder, (5) whether the vendor MFT
      accepts tightly packed system-memory NV12 without a D3D manager (ffmpeg's mfenc does this), (6)
      whether ICodecAPI settings are accepted before SetOutputType on Intel/AMD/NVIDIA MFTs, (7) whether
      output keyframes carry SPS/PPS inline or only via MF_MT_MPEG_SEQUENCE_HEADER, (8) whether MFSampleExtension_DecodeTimestamp
      is set without B-frames (DTS must equal PTS then).
    state: open
    resolution: Run go test ./... on the author's Windows Intel machine with ffmpeg; record results in
      verification and flip the capability states.
    scope:
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
  mf-async-hardware-mfts:
    text: Should vendor asynchronous hardware decoder MFTs be supported, for codecs the Microsoft decoders
      do not cover (VP9 on Intel) or for drivers that register their own H.264/HEVC decoders?
    state: deferred
    resolution: Not needed for H.264/HEVC on Intel/AMD/NVIDIA, which all go through the Microsoft decoders
      with DXVA. The event-driven model now exists in the encoder (pump/needInput/haveOutput bookkeeping)
      and could be lifted into the decoder. Revisit if a target machine reports only async decoder candidates
      or when VP9/AV1 decode is requested.
    scope:
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
  mf-encoder-event-wait:
    text: Send blocks in IMFMediaEventGenerator::GetEvent while waiting for METransformNeedInput (ffmpeg
      does the same) and Flush blocks until METransformDrainComplete; neither observes context cancellation
      once blocked. Should the wait be bounded or moved to a polling loop?
    state: deferred
    resolution: Bound it or poll with MF_EVENT_FLAG_NO_WAIT if a driver is observed to stall; the VideoToolbox
      encoder's Flush has the same limitation.
    scope:
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
  mf-software-fallback-windows:
    text: WithSoftwareFallback is accepted by the API but the Windows backend returns ErrUnsupported for
      it. Implement the memory-buffer output path (16-row padded NV12 from the Microsoft decoders) for
      GPU-less CI?
    state: deferred
    resolution: GPU-less machines are out of scope (policy:support-tiers); revisit if CI coverage of the
      Send/Receive logic on hosted Windows runners becomes valuable.
    scope:
      platform: windows
      gpu:
      - intel
      - amd
      - nvidia
  av1lw-media-foundation-av1-mft:
    text: The Microsoft AV1 decoder MFT is assumed to be synchronous and Direct3D 11 aware like the H.264
      and HEVC ones, to need MF_MT_FRAME_SIZE in the input type, and to take temporal units without temporal
      delimiters with the sequence header in band. The DXVA profile GUID b8be4ccb-cf53-46ba-8d59-d6b8a6da5d2a
      is written from memory of dxva.h, not checked against an SDK here.
    state: open
    resolution: Run the AV1 tests on Windows with the AV1 Video Extension installed; if the MFT turns
      out asynchronous the backend reports why in the UnsupportedError (candidate.usable).
    scope:
      platform: windows
facts:
  libraries:
  - mfplat.dll
  - mf.dll
  - mfreadwrite.dll
  - d3d11.dll
  - ole32.dll
  api_model: full decoder/encoder MFTs; hardware MFTs are asynchronous (METransformNeedInput / METransformHaveOutput
    events)
  key_calls:
    setup:
    - MFStartup
    - CoInitializeEx
    - D3D11CreateDevice
    - MFCreateDXGIDeviceManager
    enumerate:
    - MFTEnumEx with MFT_ENUM_FLAG_HARDWARE
    - MFT_CATEGORY_VIDEO_DECODER / MFT_CATEGORY_VIDEO_ENCODER
    transform:
    - IMFTransform::SetInputType
    - SetOutputType
    - ProcessMessage
    - ProcessInput
    - ProcessOutput
    - IMFMediaEventGenerator
    buffers:
    - MFCreateSample
    - MFCreateMemoryBuffer
    - MFCreateDXGISurfaceBuffer
  input_format: NV12 for encoders; H.264 Annex-B (MFVideoFormat_H264) or AVC1 for decoders.
  output_format: Encoders emit Annex-B H.264 with in-band SPS/PPS; decoders emit NV12 samples, in D3D11
    textures when a device manager is set.
  ffi_notes:
  - No cgo needed; golang.org/x/sys/windows LazyDLL for flat functions, raw vtable calls for COM interfaces
    (same technique as go-ole).
  - Async MFTs require the caller to implement IMFAsyncCallback or poll IMFMediaEventGenerator::GetEvent;
    a Go-side COM object needs a hand-built vtable with syscall.NewCallback.
  - COM apartment and thread affinity: pin the MFT-driving goroutine with runtime.LockOSThread.
  quirks:
  - Whether a hardware H.264 encoder MFT exists depends on the vendor driver; some NVIDIA/Intel driver
    versions register none, so Probe() must not assume.
  - Microsoft's software H.264/HEVC decoder MFTs can use DXVA acceleration when given a D3D device manager;
    this is a possible non-vendor path to verify.
  - Hosted CI runners have no GPU; only software MFTs are available there.
  evidence:
  - url: https://learn.microsoft.com/en-ie/Windows/Win32/medfound/hardware-mfts
    claim: Hardware MFTs must use the asynchronous processing model and handle format changes.
  - url: https://docs.rs/crate/mediaway-encoder/0.1.3/source/docs/windows/benchmarks.md
    claim: On a test host neither the NVIDIA driver nor Intel UHD 770 registered a working hardware H.264
      encoder MFT.
  - url: https://learn.microsoft.com/en-us/windows/win32/medfound/h-265---hevc-video-decoder
    claim: The H.265/HEVC decoder MFT accepts Annex-B input and outputs NV12/P010.
  - url: https://learn.microsoft.com/en-us/answers/a/7631145
    claim: The free HEVC Video Extensions variant targets devices with HEVC hardware.
  - url: https://www.neowin.net/news/microsofts-wddm-32-makes-windows-11-24h2-video-encoding-even-better-with-av1-support/
    claim: Windows 11 24H2 / WDDM 3.2 adds AV1 to D3D12 video encoding.
  decoder_availability:
    h264: Microsoft H.264 decoder MFT ships with Windows; uses DXVA/D3D11 when an IMFDXGIDeviceManager
      is set.
    hevc: Microsoft H.265/HEVC decoder MFT (Annex-B input, NV12/P010 output) is delivered through the
      "HEVC Video Extensions" Store package (free OEM variant on hardware-capable devices, otherwise paid);
      absence must be detected by Probe().
    av1: Microsoft AV1 decoder comes from the "AV1 Video Extension" Store package (dav1d-based software
      with hardware tiers); absence must be detected by Probe().
    vendor_decoder_mfts: Some drivers also register vendor hardware decoder MFTs; enumerate rather than
      assume.
  encoder_availability:
    h264: Vendor hardware encoder MFTs (Intel, AMD, NVIDIA, Qualcomm) when the driver registers one; Microsoft
      software H.264 encoder MFT as a non-hardware fallback.
    hevc: Vendor hardware encoder MFTs; no Microsoft software HEVC encoder.
    av1: Windows 11 24H2 (WDDM 3.2) adds AV1 to the Direct3D 12 video encode path; MFT exposure depends
      on the driver.
  arm64: Windows on ARM (Qualcomm Snapdragon X) exposes hardware codecs through the same MFT model; purego/x/sys
    windows/arm64 is tier 1. Codec coverage unverified.
  support_tier: tier1 for Intel/AMD/NVIDIA; tier2 for Qualcomm Snapdragon X
  implementation:
    status: decode and encode implemented 2026-10-09 (milestone:windows-media-foundation), unverified
      on hardware
    package: internal/mediafoundation (+ sys for bindings)
    ffi: golang.org/x/sys/windows NewLazySystemDLL for mfplat.dll/d3d11.dll flat functions; COM interfaces
      through hand-written vtable structs and syscall.SyscallN; MFTEnumEx's by-value GUID has per-architecture
      wrappers (pointer-to-copy on amd64, two registers on arm64).
    model: decode uses the synchronous Microsoft decoder MFTs + IMFDXGIDeviceManager (vendor async hardware
      decoder MFTs are enumerated but skipped); encode uses the vendor asynchronous hardware encoder MFTs
      through IMFMediaEventGenerator with system-memory NV12 input, and the synchronous Microsoft H.264
      encoder only with WithSoftwareFallback.
    arch: windows/amd64 and windows/arm64; 32-bit excluded by the author (2026-10-09).
    vendor_handling: The backend does not tell GPU vendors apart - decode goes through DXVA on the default
      Direct3D 11 adapter and encode through whichever hardware encoder MFT MFTEnumEx lists first, so
      Intel, AMD and NVIDIA share one code path and a machine with two GPUs cannot choose. On windows/amd64
      the nvidia backend (backend:nvenc-nvdec) is registered first since milestone:windows-nvidia-nvdec-nvenc,
      so with the NVIDIA driver installed Media Foundation is only the fallback.
    not_yet: software decode fallback, P010/10-bit, AV1, zero-copy textures, D3D texture input for encoders.
  milestone_notes:
    mf:
      design:
        decoder_selection: MFTEnumEx(MFT_CATEGORY_VIDEO_DECODER, SYNCMFT|ASYNCMFT|HARDWARE|LOCALMFT|SORTANDFILTER,
          input {MFMediaType_Video, subtype}) then take the first candidate whose MF_TRANSFORM_FLAGS_Attribute
          is synchronous and not hardware, whose MF_SA_D3D11_AWARE is TRUE and that accepts MFT_MESSAGE_SET_D3D_MANAGER.
          Async/hardware candidates are skipped and named in the error reason.
        hardware_gate: D3D11CreateDevice(HARDWARE, VIDEO_SUPPORT|BGRA_SUPPORT) + ID3D10Multithread protection;
          ID3D11VideoDevice::GetVideoDecoderProfile must list D3D11_DECODER_PROFILE_H264_VLD_NOFGT / HEVC_VLD_MAIN
          and CheckVideoDecoderFormat(NV12) must be TRUE. This is the only hardware signal; the Microsoft
          decoders can still fall back to software internally above 1920x1088.
        input: MFCreateMemoryBuffer + MFCreateSample per access unit, sample time = PTS converted to 100
          ns (toHNS); MFSampleExtension_CleanPoint on keyframes, MFSampleExtension_Discontinuity on the
          first sample after start/flush. ProcessInput; MF_E_NOTACCEPTING maps to ErrAgain.
        output: ProcessOutput with MFT-provided samples (MFT_OUTPUT_STREAM_PROVIDES_SAMPLES; a system-memory
          sample is allocated otherwise). MF_E_TRANSFORM_STREAM_CHANGE renegotiates NV12 and re-reads
          MF_MT_FRAME_SIZE / MF_MT_MINIMUM_DISPLAY_APERTURE. MF_E_TRANSFORM_NEED_MORE_INPUT maps to ErrAgain
          (io.EOF after Flush).
        readback: IMFDXGIBuffer::GetResource(ID3D11Texture2D) + GetSubresourceIndex; a cached staging
          texture (USAGE_STAGING, CPU_ACCESS_READ) receives CopySubresourceRegion; Map gives RowPitch
          and DepthPitch; the CbCr plane starts at RowPitch * texture height; copyNV12 crops the aperture.
          IMF2DBuffer2::Lock2DSize is the fallback for non-DXGI buffers.
        timestamps: inflight map from 100 ns sample time to the caller's PTS gives exact round trips;
          fromHNS rounds to nearest otherwise.
        display_order: the Microsoft decoders reorder natively; the decoder implements codec.DisplayOrderer
          so the public API does not wrap it in internal/reorder (milestone:display-order-rgba). Decode
          order cannot be requested, so WithDecodeOrder has no effect on Windows. The backend's output
          is NV12 only; RGBA/BGRA frames come from the conversion in Go (milestone:decoder-rgb-conversion).
        flush: MFT_MESSAGE_COMMAND_DRAIN, drain every frame into a pending queue, then NOTIFY_START_OF_STREAM
          before the next input, which is prefixed with stored VPS/SPS/PPS when it lacks them (annexb.ParameterSetID,
          shared with the VideoToolbox store).
        threading: runtime.LockOSThread + CoInitializeEx(MTA) only around enumeration/activation; vtable
          calls are free-threaded. No dedicated COM goroutine.
        encoder_selection: MFTEnumEx(MFT_CATEGORY_VIDEO_ENCODER, SYNCMFT|ASYNCMFT|HARDWARE|SORTANDFILTER,
          in {Video, NV12}, out {Video, subtype}); keep candidates whose MF_TRANSFORM_FLAGS_Attribute
          has HARDWARE; with AllowSoftware and no hardware candidate, enumerate without HARDWARE for the
          Microsoft software encoder. Candidates are tried in order until one configures.
        encoder_setup: GetStreamIDs; if MF_TRANSFORM_ASYNC then set MF_TRANSFORM_ASYNC_UNLOCK and QI IMFMediaEventGenerator;
          QI ICodecAPI; apply controls; SetOutputType (first type with the subtype from GetOutputAvailableType
          or a fresh one, with FRAME_SIZE, FRAME_RATE, PAR 1:1, progressive, AVG_BITRATE, MPEG2_PROFILE);
          SetInputType (NV12, DEFAULT_STRIDE = width); read stream infos; read MF_MT_MPEG_SEQUENCE_HEADER;
          NOTIFY_BEGIN_STREAMING; NOTIFY_START_OF_STREAM before the first frame and after every Flush.
        encoder_io: Send waits for a METransformNeedInput credit (serving METransformHaveOutput into a
          pending queue meanwhile, ErrAgain when 64 packets wait), packs the frame into an aligned memory
          buffer with sample time/duration, sets AVEncVideoForceKeyFrame for forced frames, ProcessInput.
          Receive pumps events without waiting and ProcessOutputs per HaveOutput. Flush sends COMMAND_DRAIN
          and pumps until METransformDrainComplete. Synchronous MFTs use ProcessInput / ProcessOutput-until-NEED_MORE_INPUT
          instead.
        encoder_output: ConvertToContiguousBuffer; PTS from the inflight sample-time map; DTS from MFSampleExtension_DecodeTimestamp
          when present; keyframes from NAL unit types; parameter sets recorded and prepended when a keyframe
          lacks them.
      files:
      - internal/mediafoundation/sys (guid.go, sys.go, com.go, d3d11.go, encode.go, mftenumex_{amd64,arm64}.go)
      - internal/mediafoundation (backend.go, decoder.go, encoder.go, encodeutil.go, frame.go, time.go,
        paramsets.go)
      - backends_windows.go, decode_test.go, encode_test.go, decode_test.go and encode_test.go (helpers
        shared with the macOS tests)
      - annexb/paramsets.go (ParameterSetID moved out of the VideoToolbox backend)
    av1lw:
      implementation:
        mediafoundation: mfCodec maps AV1 to MFVideoFormat_AV1 and the AV1 profile 0 DXVA GUID; configure(width,
          height) is deferred to the first sequence header for AV1 and sets MF_MT_FRAME_SIZE; sendAV1
          strips temporal delimiters and makes one sample per unit.
  known_risks:
  - Everything above the compile-time checks is unverified on real hardware; see open_questions.hardware-verification.
  - The Microsoft H.264 decoder silently uses software above 1920x1088 when DXVA cannot; Probe reports
    Hardware=true regardless.
  - MF_TRANSFORM_FLAGS_Attribute may be absent on some activation objects; it is then treated as synchronous
    and the MF_TRANSFORM_ASYNC attribute of the activated object is checked instead.
  - 'Encoder defaults when the caller gives none: 0.1 bit per pixel per frame (floor 200 kbit/s) and 30
    fps, because MF_MT_AVG_BITRATE and MF_MT_FRAME_RATE are required on encoder types.'
  - Some drivers register no hardware H.264 encoder MFT at all (see the quirks of backend:media-foundation);
    Probe then reports no encode capability and NewEncoder returns ErrUnsupported.
  delivery_results:
    milestone:windows-media-foundation:
      environment:
        authored_on: macOS 27.0.1 (Apple M3), go1.27.0, mingw-w64 14.0.0 headers for SDK constants
        date: '2026-10-09'
