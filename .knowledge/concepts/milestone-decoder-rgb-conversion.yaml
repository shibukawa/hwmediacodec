id: milestone:decoder-rgb-conversion
type: milestone
title: RGBA/BGRA decoder output on the NV12-only backends (conversion in Go)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:pixel-conversion (keys prefixed decrgb-). Original summary: WithOutputFormat(RGBA|BGRA)
  works on every backend: where the backend decoder returns NV12 only (VA-API, NVDEC, Intel VPL, Media
  Foundation) NewDecoder opens it for NV12 and puts pixconv.Decoder on top, which converts every frame
  in Go with the matrix and range the stream declares. This is the mirror of milestone:encoder-rgb-conversion
  and what ebitenvideo and the player, texture, thumbnails and heif samples need outside macOS.'
lifecycle: superseded
authority: authored
aliases:
- pixconv decoder
- NV12 to RGB conversion
- output format rgba is not supported; use NV12
- RGBA出力のソフトウェア変換
scope:
  milestone: decoder-rgb-conversion
non_goals:
- Bilinear chroma interpolation, SIMD or GPU conversion, a public option to override the matrix.
- 10-bit output.
- Per-picture tracking of the colour description across a mid-stream change.
relations:
