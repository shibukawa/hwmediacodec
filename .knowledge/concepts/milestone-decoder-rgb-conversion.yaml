id: milestone:decoder-rgb-conversion
type: milestone
title: RGBA/BGRA decoder output on the NV12-only backends (conversion in Go)
summary: 'WithOutputFormat(RGBA|BGRA) works on every backend: where the backend decoder returns NV12
  only (VA-API, NVDEC, Intel VPL, Media Foundation) NewDecoder opens it for NV12 and puts pixconv.Decoder
  on top, which converts every frame in Go with the matrix and range the stream declares. This is the
  mirror of milestone:encoder-rgb-conversion and what ebitenvideo and the player, texture, thumbnails
  and heif samples need outside macOS.'
lifecycle: active
authority: authored
aliases:
- pixconv decoder
- NV12 to RGB conversion
- output format rgba is not supported; use NV12
- RGBA出力のソフトウェア変換
scope:
  milestone: decoder-rgb-conversion
constraints:
- 'Selection (hwmediacodec.newDecoder): every backend is asked with the caller''s format first; one
  that answers ErrUnsupported for RGBA/BGRA is asked again for NV12. The stack is backend decoder,
  then internal/reorder (unless the backend reorders itself or WithDecodeOrder was given), then
  pixconv.Decoder outermost, so only frames that leave are converted. Backend order is kept;
  VideoToolbox converts itself and is never wrapped.'
- 'Colour (pixconv.ColorFor): the wrapper parses every new SPS it is sent (H.264 and HEVC, byte-compared
  with the previous one) and takes matrix_coeffs and video_full_range_flag from the VUI: 1 and 7 are
  BT.709, 4/5/6 BT.601, 9/10 BT.2020. A stream that names no matrix gets BT.709 when the picture is
  wider than 704 or taller than 576 pixels and BT.601 otherwise - the rule VideoToolbox applies, so
  that every backend shows the same colours.'
- 'VideoToolbox rule, measured on an M3 on 2026-10-10 by comparing its RGBA output with all six
  matrix/range conversions of its NV12 output: untagged 704x576, 704x480, 640x480 and 320x576 are BT.601;
  708x480, 720x240, 720x480, 320x600, 320x720 and everything larger are BT.709; a named matrix (bt709,
  smpte170m, bt2020nc) is followed at any size. VideoToolbox hands out video-range NV12 even for
  full-range streams (it rescales), so its NV12 never needs the full-range path; the other backends
  return the decoded samples as they are.'
- 'Conversion (pixconv.NV12ToRGB): five 256-entry tables per matrix and range in 16.16 fixed point,
  a clamp table instead of branches, every chroma sample colours its 2x2 block (nearest neighbour,
  the dual of the encoder side''s 2x2 average), alpha 255, rows split into bands across GOMAXPROCS
  goroutines for pictures of 256 rows or more.'
- Converted frames live in Go memory taken from a sync.Pool inside the wrapper; Release returns the
  buffer, also after Close and from any goroutine. The backend frame is released as soon as it is
  converted.
- Frames still inside the decoder when the stream switches to parameter sets with another colour description
  are converted with the new one (the description is not tracked per picture).
non_goals:
- Bilinear chroma interpolation, SIMD or GPU conversion, a public option to override the matrix.
- AV1 (only VideoToolbox decodes it and converts itself), 10-bit output.
- Per-picture tracking of the colour description across a mid-stream change.
acceptance:
  conversion-exact:
    text: The table conversion is within 1 of the floating-point equations for BT.601, BT.709 and BT.2020
      in video and full range, for even and odd sizes, padded rows and pictures split across goroutines;
      range ends and primaries map as expected; RGB to NV12 and back agrees within 2 for flat colours.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - pixconv-unit-test
  stream-colour:
    text: The wrapper follows the colour description of H.264 and HEVC parameter sets as they arrive,
      falls back to the size rule without one, ignores broken parameter sets and other codecs, releases
      the backend frame, and returns independent frames that outlive Close.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - pixconv-unit-test
  selection:
    text: An NV12-only backend gets the conversion outside the reorder layer (directly on the backend
      for WithDecodeOrder or a backend that reorders itself); a backend with RGB output and NV12 requests
      are passed through; backend order wins; an unavailable backend is skipped; a backend failure
      is returned as is.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - selection-test
  hardware-comparison:
    text: Frames decoded by the hardware decoder to NV12 and converted in Go match the backend's own
      RGBA output and ffmpeg's conversion within 30 dB 8x8-block PSNR, in the same display order,
      for a stream that names its matrix and for untagged small and large pictures; RGBA is the exact
      mirror of BGRA with alpha 255.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - videotoolbox-comparison-test
  vaapi-path:
    text: Through the real VA-API backend RGBA and BGRA frames are the BT.601 conversion of the NV12 frame
      at the same place in display order, including a cropped HEVC stream.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - vaapi-fake-driver-test
  windows-samples:
    text: examples/player, texture and thumbnails run on Windows (Media Foundation or NVDEC) and on
      Linux hardware with correct colours.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - hardware-run
