facts:
  libraries:
  - libva.so.2
  - libva-drm.so.2
  - libdrm.so.2
  device: DRM render node (/dev/dri/renderD128) via vaGetDisplayDRM; no X11/Wayland needed.
  api_model: slice-level accelerator; application supplies VAPictureParameterBuffer, VASliceParameterBuffer,
    VAIQMatrixBuffer and manages the DPB and reference lists.
  key_calls:
  - vaInitialize
  - vaQueryConfigProfiles
  - vaQueryConfigEntrypoints
  - vaCreateConfig
  - vaCreateSurfaces
  - vaCreateContext
  - vaCreateBuffer
  - vaBeginPicture
  - vaRenderPicture
  - vaEndPicture
  - vaSyncSurface
  - vaDeriveImage / vaGetImage
  - vaMapBuffer
  required_go_components:
  - H.264 bitstream parser (SPS, PPS, slice header), POC computation, reference list construction, DPB
    management.
  - HEVC equivalents (VPS/SPS/PPS, RPS) for HEVC decode.
  - Encoder-side packed header writers (SPS/PPS) and rate-control parameter buffers.
  vendor_coverage:
    intel: iHD (media-driver, Gen8+) and legacy i965; on Gen12+ the Intel VPL runtime sits on top of VA-API
      and offers a full-codec API instead (backend:intel-vpl).
    amd: Mesa radeonsi; the official AMD path on Linux since 2025 (AMD dropped AMF from its Linux driver
      package and recommends VA-API/Mesa Multimedia).
    nvidia: not covered by the proprietary driver; third-party nvidia-vaapi-driver provides decode only
  ffi_notes:
  - Plain C API; purego.Dlopen works; structs are passed by pointer through vaCreateBuffer, so Go struct
    layouts must match the libva headers exactly.
  - Surfaces are mapped via vaDeriveImage or exported as DMA-BUF (vaExportSurfaceHandle) for zero-copy.
  quirks:
  - The amount of codec-standard logic that must live in Go is the main cost; it is the same work FFmpeg's
    h264dec does before calling the hwaccel.
  - Hosted CI has no GPU; libva has no software fallback driver suitable for conformance tests.
  alternatives_on_linux:
  - NVDEC/NVENC for NVIDIA (full decoder with parser).
  - V4L2 memory-to-memory codecs on ARM SoCs (Raspberry Pi, Rockchip); also a full decoder style API.
  - Vulkan Video (slice-level, cross-vendor).
  - FFmpeg/GStreamer as a Linux-only dependency if the parser/DPB work is not wanted.
  full_api_alternatives_on_linux:
  - backend:intel-vpl (Intel Gen12+)
  - backend:nvenc-nvdec (NVIDIA)
  - backend:v4l2-m2m stateful devices (some ARM SoCs)
  evidence:
  - url: https://www.amd.com/en/resources/support-articles/release-notes/RN-AMDGPU-UNIFIED-LINUX-25-10-2.html
    claim: AMF will no longer be included in the Radeon Software for Linux release; AMF users are advised
      to transition to VA-API / Mesa Multimedia.
  support_tier: tier1 (Linux AMD, and Intel generations below Gen12)
  implementation:
    package: internal/vaapi (backend.go, display.go, decoder.go, h264fill.go) over internal/vaapi/sys
      (purego bindings, struct layouts checked by layout_test.go against clang offsetof output) and
      internal/h264 (SPS/PPS/slice-header parser, POC, frame_num gaps, reference marking, reference
      list construction).
    device: opens /dev/dri/renderD128..143 (or HWMEDIACODEC_VAAPI_DEVICE) with syscall.Open, vaGetDisplayDRM,
      vaInitialize; one VADisplay per decoder; libva info/error callbacks installed so nothing is printed
      to stderr.
    sequence: vaCreateConfig(profile, VLD, RT_FORMAT_YUV420) + vaCreateSurfaces(NV12) + vaCreateContext(VA_PROGRESSIVE)
      per SPS; pool = max_num_ref_frames + 1 + 4 output slack + 1 shared dummy surface for non-existing
      (frame_num gap) frames; recreated when size, profile or reference count changes (at an IDR).
    per_picture: VAPictureParameterBufferH264 + VAIQMatrixBufferH264 (raster-order lists with fall-back
      rules A/B resolved in Go) + one VASliceParameterBufferH264/VASliceDataBufferH264 pair per slice
      (raw NAL incl. header, slice_data_bit_offset in the unescaped domain, as ffmpeg does); vaBeginPicture/vaRenderPicture/vaEndPicture;
      buffers destroyed after vaEndPicture.
    output: decode order; Receive does vaSyncSurface, then vaDeriveImage (if it yields NV12) or vaCreateImage+vaGetImage,
      vaMapBuffer, crop per SPS frame_cropping, copy into pooled Go buffers.
    backpressure: Send returns ErrAgain when no free surface or when a sequence change finds frames still
      pending Receive.
    profile_mapping: profile_idc 66 -> ConstrainedBaseline/Main/High, 77 -> Main/High, else High; first
      profile with a VLD entrypoint wins.
    limitations:
    - H.264 only (HEVC parser/RPS and VA HEVC buffers are the next step).
    - Progressive frames only; field_pic_flag=1 is rejected with ErrUnsupported (MBAFF frames are fine).
    - 8-bit 4:2:0 only (NV12); no FMO, no data partitioning, redundant slices are dropped.
  host_verification_2026-10-09:
    parser: every SPS/PPS/slice-header syntax element equals ffmpeg trace_headers on six x264 streams
      (CAVLC/CABAC, POC types 0 and 2, B-pyramid, 16 refs, weighted prediction, cqm=jvt, 3 slices,
      ref list modification, MMCO 1, short GOPs, open GOP); slice_data_bit_offset equals ffmpeg's header
      end.
    dpb: reference sets after every reference picture equal ffmpeg -debug mmco; POC equals ffmpeg -debug
      pict (up to ffmpeg's constant 65536 offset).
    linux: CGO_ENABLED=0 linux/arm64 test binaries run in a Debian bookworm container; with libva2 2.17
      installed every symbol binds (TestLoad) and Probe returns an empty list without a render node;
      without libva Probe returns an empty list and NewDecoder returns ErrUnsupported.
    pending: conformance (checksum) test on real AMD hardware; Intel iHD is expected to work but is
      also unverified.
