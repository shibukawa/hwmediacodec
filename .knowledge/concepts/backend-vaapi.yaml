history:
  hevc-implemented-2026-10-09:
    summary: HEVC decode and encode added (milestone:linux-vaapi-hevc) with a fake VA driver that runs
      the backend through libva; hardware verification pending.
  decode-implemented-2026-10-09:
    summary: H.264 decode implemented (Go parser/DPB + purego libva bindings) at the author's request
      ("Linux AMD, decoder first"); host-side oracle tests pass, hardware conformance pending.
  encode-implemented-2026-10-09:
    summary: H.264 encode added (Go header writer + VA encode buffers + packed headers) at the author's
      request ("next the encoder, same PR"); host tests pass, hardware verification pending.
  vah264-requested-2026-10-09:
    summary: Author asked for Linux AMD support, decoder first.
  vah264-implemented-2026-10-09:
    summary: Code complete with host-side oracle tests and a Linux container smoke test; hardware conformance
      pending.
  vah264-encoder-added-2026-10-09:
    summary: VA-API H.264 encoder added to the same PR at the author's request; header writer verified
      on the host, hardware encode pending.
  vah264-merged-display-order-2026-10-09:
    summary: Merged main after the display-order/RGBA milestone; the reorder tracker now runs on the full
      H.264 parser of this slice (the lightweight parser was removed), so MMCO 5 resets are honoured,
      and VA-API decoders are wrapped by the reorder layer like VideoToolbox. RGBA/BGRA stay VideoToolbox-only.
  vah264-hevc-followed-2026-10-09:
    summary: milestone:linux-vaapi-hevc generalised the decoder and encoder plumbing for a second codec
      and exercised the H.264 paths end to end against the fake VA driver (decode incl. B-pyramids, six
      references, three slices, cropping, sequence change and seek; encode in CQP, CBR and VBR with and
      without packed slice headers). No H.264 defect was found.
  vahevc-requested-2026-10-09:
    summary: Author asked for "Linux AMD support" again after H.264 had merged; HEVC on VA-API, the documented
      next VA-API step, was taken as the slice (stated assumption).
  vahevc-implemented-2026-10-09:
    summary: HEVC decode and encode code complete; parser, DPB, VA buffers and encoder headers verified
      against ffmpeg and x265 on the host; the backend run end to end through libva against the fake driver;
      hardware conformance pending.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:linux-vaapi-h264-decode, milestone:linux-vaapi-hevc,
      milestone:av1-decode-linux-windows was folded into this concept (keys prefixed with the milestone's
      tag; dated measurements kept as evidence notes); the milestone files remain as superseded stubs
      with their timelines.
    supersedes:
    - milestone:linux-vaapi-h264-decode
    - milestone:linux-vaapi-hevc
    - milestone:av1-decode-linux-windows
