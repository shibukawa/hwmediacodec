open_questions:
  av1lw-vaapi-on-hardware:
    text: The buffers equal ffmpeg's, so a driver sees what it sees from ffmpeg; what remains unobserved
      is the surface handling around them - surfaces created at the sequence maximum for smaller frames,
      vaGetImage/vaDeriveImage of a surface that is still a reference, and the surface count (8 slots
      + 6, or 17 + 6 with film grain).
    state: open
    resolution: Run HWMEDIACODEC_BACKENDS=vaapi go test -count=1 . on AMD (radeonsi) and Intel (iHD) hardware;
      film grain output cannot be bit-exact with dav1d unless both apply the same grain, so compare a
      film-grain stream by PSNR.
    scope:
      platform: linux
facts:
  libraries:
  - libva.so.2
  - libva-drm.so.2
  - libdrm.so.2
  device: DRM render node (/dev/dri/renderD128) via vaGetDisplayDRM; no X11/Wayland needed.
  api_model: slice-level accelerator; application supplies VAPictureParameterBuffer, VASliceParameterBuffer,
    VAIQMatrixBuffer and manages the DPB and reference lists.
  key_calls:
  - vaInitialize
  - vaQueryConfigProfiles
  - vaQueryConfigEntrypoints
  - vaCreateConfig
  - vaCreateSurfaces
  - vaCreateContext
  - vaCreateBuffer
  - vaBeginPicture
  - vaRenderPicture
  - vaEndPicture
  - vaSyncSurface
  - vaDeriveImage / vaGetImage
  - vaMapBuffer
  required_go_components:
  - H.264 bitstream parser (SPS, PPS, slice header), POC computation, reference list construction, DPB
    management.
  - HEVC equivalents (VPS/SPS/PPS, RPS) for HEVC decode.
  - Encoder-side packed header writers (SPS/PPS) and rate-control parameter buffers.
  vendor_coverage:
    intel: iHD (media-driver, Gen8+) and legacy i965; on Gen12+ the Intel VPL runtime sits on top of VA-API
      and offers a full-codec API instead (backend:intel-vpl).
    amd: Mesa radeonsi; the official AMD path on Linux since 2025 (AMD dropped AMF from its Linux driver
      package and recommends VA-API/Mesa Multimedia).
    nvidia: not covered by the proprietary driver; third-party nvidia-vaapi-driver provides decode only
  ffi_notes:
  - Plain C API; purego.Dlopen works; structs are passed by pointer through vaCreateBuffer, so Go struct
    layouts must match the libva headers exactly.
  - Surfaces are mapped via vaDeriveImage or exported as DMA-BUF (vaExportSurfaceHandle) for zero-copy.
  quirks:
  - The amount of codec-standard logic that must live in Go is the main cost; it is the same work FFmpeg's
    h264dec does before calling the hwaccel.
  - Hosted CI has no GPU; libva has no software fallback driver suitable for conformance tests.
  alternatives_on_linux:
  - NVDEC/NVENC for NVIDIA (full decoder with parser).
  - V4L2 memory-to-memory codecs on ARM SoCs (Raspberry Pi, Rockchip); also a full decoder style API.
  - Vulkan Video (slice-level, cross-vendor).
  - FFmpeg/GStreamer as a Linux-only dependency if the parser/DPB work is not wanted.
  full_api_alternatives_on_linux:
  - backend:intel-vpl (Intel Gen12+)
  - backend:nvenc-nvdec (NVIDIA)
  - backend:v4l2-m2m stateful devices (some ARM SoCs)
  evidence:
  - url: https://www.amd.com/en/resources/support-articles/release-notes/RN-AMDGPU-UNIFIED-LINUX-25-10-2.html
    claim: AMF will no longer be included in the Radeon Software for Linux release; AMF users are advised
      to transition to VA-API / Mesa Multimedia.
  support_tier: tier1 (Linux AMD, and Intel generations below Gen12)
  implementation:
    package: internal/vaapi (backend.go, display.go, decoder.go, h264fill.go) over internal/vaapi/sys
      (purego bindings, struct layouts checked by layout_test.go against clang offsetof output) and internal/h264
      (SPS/PPS/slice-header parser, POC, frame_num gaps, reference marking, reference list construction).
    device: opens /dev/dri/renderD128..143 (or HWMEDIACODEC_VAAPI_DEVICE) with syscall.Open, vaGetDisplayDRM,
      vaInitialize; one VADisplay per decoder; libva info/error callbacks installed so nothing is printed
      to stderr.
    sequence: vaCreateConfig(profile, VLD, RT_FORMAT_YUV420) + vaCreateSurfaces(NV12) + vaCreateContext(VA_PROGRESSIVE)
      per SPS; pool = max_num_ref_frames + 1 + 4 output slack + 1 shared dummy surface for non-existing
      (frame_num gap) frames; recreated when size, profile or reference count changes (at an IDR).
    per_picture: VAPictureParameterBufferH264 + VAIQMatrixBufferH264 (raster-order lists with fall-back
      rules A/B resolved in Go) + one VASliceParameterBufferH264/VASliceDataBufferH264 pair per slice
      (raw NAL incl. header, slice_data_bit_offset in the unescaped domain, as ffmpeg does); vaBeginPicture/vaRenderPicture/vaEndPicture;
      buffers destroyed after vaEndPicture.
    output: decode order; Receive does vaSyncSurface, then vaDeriveImage (if it yields NV12) or vaCreateImage+vaGetImage,
      vaMapBuffer, crop per SPS frame_cropping, copy into pooled Go buffers.
    backpressure: Send returns ErrAgain when no free surface or when a sequence change finds frames still
      pending Receive.
    profile_mapping: profile_idc 66 -> ConstrainedBaseline/Main/High, 77 -> Main/High, else High; first
      profile with a VLD entrypoint wins.
    limitations:
    - H.264 and HEVC Main; no 10-bit, range extension or screen content streams.
    - Progressive frames only; field_pic_flag=1 is rejected with ErrUnsupported (MBAFF frames are fine).
    - 8-bit 4:2:0 only (NV12); no FMO, no data partitioning, redundant slices are dropped.
  encoder_implementation:
    entrypoint: VAEntrypointEncSlice (VAEntrypointEncSliceLP as fallback) on H264 High > Main > ConstrainedBaseline,
      or the requested profile; config attributes RTFormat, RateControl and EncPackedHeaders.
    structure: I and P pictures with one short-term reference (ping-pong of two reconstructed surfaces),
      POC type 0 with 8-bit lsb, frame_num 8 bits, IDR every KeyframeInterval frames (default two seconds
      or 60 frames), Frame.ForceKeyframe and Flush force an IDR; no B-frames yet.
    headers: SPS/PPS/slice headers written by internal/h264/write.go (bitstream.Writer + emulation prevention);
      sent as packed headers (sequence = SPS+PPS, slice) when the driver's EncPackedHeaders attribute
      lists them, like ffmpeg; the coded output is scanned and the SPS/PPS prepended to keyframes if the
      driver wrote none.
    rate_control: Quality -> CQP (qp = round(51 - 45*q)), Bitrate -> VBR (peak 2x target, 50%) or CBR
      (100%) with VAEncMiscParameterRateControl/HRD (1 s buffer, frame skip disabled) and FrameRate misc
      params at every IDR; default CQP 26 (or VBR at 0.1 bit/pixel when CQP is unsupported).
    io: input uploaded through vaDeriveImage when it yields NV12, else vaCreateImage + vaPutImage, with
      edge replication into the macroblock padding; one coded buffer (3 bytes/pixel) mapped after vaSyncBuffer
      (vaSyncSurface fallback); synchronous per picture inside Send.
    limitations:
    - H.264 and HEVC Main; no B-frames; even width/height required; one slice per picture; no SEI; Intel
      HEVC encoders without P-frames (generalised-B only) are reported as unsupported.
  hevc_implementation:
    see: milestone:linux-vaapi-hevc (facts.design)
    decode: hevcdec.go parses the access unit with internal/hevc, keeps the DPB there, and submits VAPictureParameterBufferHEVC,
      VAIQMatrixBufferHEVC (when scaling lists are enabled) and one VASliceParameterBufferHEVC plus slice
      data per slice segment; pool = sps_max_dec_pic_buffering + output slack + one stand-in surface for
      missing references; RASL pictures after the random access point are dropped.
    encode: hevcenc.go/hevcparams.go build VPS/SPS/PPS from the driver's block size and feature attributes,
      send VAEncSequence/Picture/SliceParameterBufferHEVC with the same rate control misc buffers as H.264,
      and check the SPS in the first keyframe against the requested size.
  fake_driver:
    path: internal/vaapi/testdata/fakedriver (fake_drv_video.c, fake_drm.c, Dockerfile); scripts/vaapi_fake_driver_test.sh
    purpose: runs the backend through libva without a GPU; validates buffers through the libva C headers
      and reports each picture in a log; decoded surfaces carry a pattern that names their POC.
    personalities: FAKE_VA_PACKED (packed header mask), FAKE_VA_HEVC_ATTRS, FAKE_VA_DERIVE; PLATFORM=linux/amd64
      runs it through emulation.
  host_verification_2026-10-09:
    parser: every SPS/PPS/slice-header syntax element equals ffmpeg trace_headers on six x264 streams
      (CAVLC/CABAC, POC types 0 and 2, B-pyramid, 16 refs, weighted prediction, cqm=jvt, 3 slices, ref
      list modification, MMCO 1, short GOPs, open GOP); slice_data_bit_offset equals ffmpeg's header end.
    dpb: reference sets after every reference picture equal ffmpeg -debug mmco; POC equals ffmpeg -debug
      pict (up to ffmpeg's constant 65536 offset).
    linux: CGO_ENABLED=0 linux/arm64 test binaries run in a Debian bookworm container; with libva2 2.17
      installed every symbol binds (TestLoad) and Probe returns an empty list without a render node; without
      libva Probe returns an empty list and NewDecoder returns ErrUnsupported.
    pending: conformance (checksum) test on real AMD hardware; Intel iHD is expected to work but is also
      unverified.
  milestone_notes:
    vah264:
      steps:
      - internal/vaapi/sys - purego bindings for 30 libva entry points, struct mirrors, message callbacks.
      - internal/vaapi - display/device selection, Probe, decoder (sequence setup, per-picture buffers,
        output copy via derive/getimage, surface pool with ErrAgain backpressure).
      - Root wiring (backends_linux.go), platform-independent conformance tests, CLI ErrAgain handling,
        README.
      - Encoder (same PR, at the author's request) - internal/bitstream Writer + Escape, internal/h264/write.go
        (SPS/PPS/slice-header writer), VA encode struct mirrors, internal/vaapi/encoder.go (I/P, one reference,
        CQP/CBR/VBR, packed headers, synchronous per picture), encode tests made platform independent.
    vahevc:
      steps:
      - internal/vaapi/sys - Go mirrors of VAPictureHEVC, the HEVC decode and encode parameter buffers
        and the HEVC capability attribute words, with layout and bit-field tests.
      - internal/vaapi - hevcdec.go (access unit handling), hevcfill.go (parameter buffers, platform independent),
        hevcenc.go and hevcparams.go (encoder; the libva-free part is platform independent), shared decoder/encoder
        plumbing generalised for a second codec.
      - Conformance tests widened to both codecs (parameter set change, flush, transcode) and two HEVC
        tests added (coding tools, open GOP); all validated on VideoToolbox.
      - A fake VA driver (C) plus a libdrm shim and a script that runs the backend through libva in a
        container.
      design:
        reference_frames_order: ReferenceFrames lists the DPB in reference picture set order (StCurrBefore,
          StCurrAfter, LtCurr, then pictures kept for later), so a driver that rebuilds the sets from
          the flags (Mesa) sees them in the order of the specification; ffmpeg lists DPB slot order.
        slice_offsets: slice_data_byte_offset counts unescaped bytes from the NAL header (as ffmpeg and
          GStreamer do) and slice_data_num_emu_prevn_bytes carries the emulation prevention bytes of the
          header (as GStreamer does; ffmpeg leaves it 0). st_rps_bits is the size of a set coded in the
          slice header, which AMD's firmware needs to skip it.
        scaling_lists: kept in coded (up-right diagonal) order end to end, which is what VAIQMatrixBufferHEVC
          wants; no scan tables are needed.
        encoder_structure: IDR and P pictures, one reference; one short-term reference picture set {-1}
          in the SPS selected by short_term_ref_pic_set_sps_flag (the structure Mesa's own VCN header
          writer uses); 12-bit POC lsb; coding tree block size, minimum coding block and coding tools
          from VAConfigAttribEncHEVCBlockSizes and VAConfigAttribEncHEVCFeatures (AMP and SAO when offered,
          tools a driver marks as required), else ffmpeg's guess of 32x32 / 16x16; VPS+SPS+PPS as one
          packed sequence header and the slice header as a packed slice header where the driver accepts
          them.
        output_check: on the first keyframe the SPS in the coded data is parsed; a driver-written SPS
          whose conformance window is not the requested size is an error.
    av1lw:
      implementation:
        vaapi: internal/vaapi/av1fill.go (platform neutral) fills the picture parameters and appends tile
          parameters; av1dec.go walks the OBUs of a unit, drops OBUs outside operating point 0, begins
          a picture at a frame header, collects tile groups until the last tile, submits (picture parameters,
          then per tile group one parameter buffer with an element per tile and one data buffer), updates
          the slots and copies a shown picture at once. sequence/surface pool is reused from H.264/HEVC
          with maxRefs 8 (17 with film grain).
        fake_driver: decode_av1 in fake_drv_video.c checks sizes, the two surfaces, reference slots, superres
          denominator, that tile sizes add up to the coded frame, tile order/offsets/groups, and logs
          the normalised picture parameters and tile parameters in hex; contexts without render targets
          (ffmpeg) are accepted; AV1 has a VLD entrypoint only.
  learned:
  - A sequence change while frames are pending must not tear down surfaces; returning ErrAgain from Send
    until the caller drains keeps the memory model simple.
  - Non-existing frames only need any valid surface id; one shared dummy surface avoids pool pressure.
  - A fake VA driver is cheap (about 1,400 lines of C) and turns "never executed" backend code into code
    that ran through libva. libva loads any driver named by LIBVA_DRIVER_NAME; vaGetDisplayDRM only needs
    drmGetNodeTypeFromFd to accept the descriptor, which an LD_PRELOAD shim provides (the purego binary
    is dynamically linked even with CGO_ENABLED=0).
  - os.Setenv in a cgo-free binary does not reach C getenv, so the driver's personality is chosen by the
    process environment, one test run per personality.
  - Docker Desktop bind mounts can serve a stale file length right after an edit on the host; rerun before
    believing a compile error at "end of input".
  - VA_PICTURE_H264_NON_EXISTING (0x20), which the H.264 path sets for frame_num gap frames, is not defined
    by libva 2.22; drivers ignore the bit.
  - libva can succeed in vaInitialize after reporting an error through the message callback; the message
    is dropped so that it is not attached to the first real failure.
  - ffmpeg's VA-API AV1 decoder renders into current_frame (the reference picture) and names the grained
    picture in current_display_picture; rendering into the display surface is the natural reading of the
    libva comment and is wrong by that precedent.
  - A fake VA driver doubles as a differential oracle - run ffmpeg -hwaccel vaapi -c:v av1 against it
    (LD_PRELOAD shim, /dev/null as the DRM device, a context without render targets) and compare the logged
    buffers. Everything a header trace cannot show (reference slots, inherited loop filter/segmentation/global
    motion state, set_frame_refs) is covered that way.
  next_candidates:
  - Run the decode and encode conformance tests on the author's AMD machine; then record vendor string,
    Mesa version and fps in this file.
  - B-frames in the VA-API encoder (needs reordering, L1 lists and DTS) where VAConfigAttribEncMaxRefFrames
    reports L1 references; async pipelining of uploads and coded-buffer reads.
  - Field (PAFF) pictures if a consumer needs interlaced content.
  - Run the H.264 and HEVC conformance tests on the author's AMD machine (HWMEDIACODEC_BACKENDS=vaapi
    go test -count=1 -v .) and record vendor string, Mesa version and results here.
  - B-frames in the VA-API encoders; generalised-B for Intel HEVC encoders without P-frames.
  - Main 10 (P010 surfaces) decode once a 10-bit frame format exists in the public API.
