id: backend:vaapi
type: backend
title: VA-API / libva (Linux, Intel and AMD)
summary: 'The Linux hardware video acceleration API for Intel (iHD) and AMD (Mesa radeonsi) drivers. Slice-level:
  the application parses the bitstream and manages reference frames; the driver accelerates decoding/encoding
  of slices.'
lifecycle: active
authority: inferred
aliases:
- VA-API
- libva
- vaapi
scope:
  platform: linux
  gpu:
  - intel
  - amd
constraints:
- CGO_ENABLED=0; libva and libva-drm are dlopened with purego; no new module dependencies.
- Same public API and Send/Receive/Flush contract as M1; frames in decode order, NV12 in CPU memory.
- Progressive frames only; field pictures are reported as ErrUnsupported rather than decoded wrongly.
- Same public API and Send/Receive/Flush contract as the H.264 path; frames reach the caller in display
  order through the existing reorder layer.
- 8-bit 4:2:0 (HEVC Main) only; everything else is reported as ErrUnsupported, never decoded wrongly.
- VA-API - the render target of vaBeginPicture is the reference picture (current_frame); with film grain
  the picture to show is a second surface named in current_display_picture. This is what ffmpeg does and
  the fake driver now requires.
- VA-API - shown pictures are copied to CPU memory inside Send, because a surface stays with the reference
  slots and may be shown again by show_existing_frame; Send returns ErrAgain when four frames wait for
  Receive.
