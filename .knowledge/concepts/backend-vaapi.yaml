acceptance:
  vah264-va-struct-layout:
    text: Go mirrors of VAPictureParameterBufferH264, VASliceParameterBufferH264, VAIQMatrixBufferH264,
      VAImage, VASurfaceAttrib and friends have the sizes and field offsets measured with a C compiler
      against the libva headers.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vah264-layout-test
  vah264-graceful-without-hardware:
    text: Without libva, or without a usable render node, Probe returns an empty list and NewDecoder returns
      ErrUnsupported; nothing is printed to stderr and nothing crashes.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vah264-container-smoke-test
  vah264-decode-reference-linux:
    text: On a Linux machine with a VA-API driver, TestDecodeMatchesReference/h264-bf0, the B-frame set
      test, the SPS-change test and the flush/seek test pass (per-frame NV12 checksums equal ffmpeg's
      software decoder).
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vah264-hardware-conformance
  vah264-encode-reference-linux:
    text: On a Linux machine with a VA-API encoder, the encode conformance tests (PSNR against the source,
      keyframe placement, forced keyframes, CBR/VBR sizes, CQP ordering, profiles, flush/reuse) and the
      transcode round trip pass.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vah264-hardware-encode
  vah264-cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vah264-cross-build-check
  vahevc-hevc-va-buffers:
    text: The VAPictureParameterBufferHEVC, VASliceParameterBufferHEVC and VAIQMatrixBufferHEVC built
      for x265 streams agree with x265 (reference frames resolve to the lists it used) and ffmpeg (slice_data_byte_offset,
      st_rps_bits, flags, prediction weights), and the Go mirrors of the VA HEVC structures have the sizes,
      offsets and bit-field positions measured with gcc.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vahevc-hevc-va-buffer-test
    - vahevc-hevc-layout-test
  vahevc-hevc-encoder-headers:
    text: The VPS, SPS, PPS and slice segment headers the encoder writes parse back identically, are accepted
      element by element by ffmpeg's trace_headers, are seen by ffprobe as the requested profile, level,
      size and frame rate, and drive a decoder-side DPB so that every P picture references exactly the
      picture before it, across the wrap of the picture order count.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vahevc-hevc-encoder-header-test
  vahevc-backend-runs-through-libva:
    text: Without a GPU, the vaapi backend decodes and encodes H.264 and HEVC end to end through the real
      libva against a driver that checks every buffer through the libva C headers; frames come back cropped
      and in display order from the surface each picture was decoded into.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vahevc-fake-driver-test
  vahevc-hevc-conformance-linux:
    text: On a Linux machine with a VA-API driver, the HEVC decode tests (reference, B-frames, coding
      tools, open GOP, parameter set change, flush) match ffmpeg's software decoder frame for frame and
      the HEVC encode tests (PSNR, keyframes, rate control, profile, flush, transcode) pass.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vahevc-hevc-hardware-decode
    - vahevc-hevc-hardware-encode
  vahevc-cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu:
      - amd
      - intel
    verified_by:
    - vahevc-cross-build-check
  av1lw-vaapi-buffers-equal-ffmpeg:
    text: For 22 stream configurations (hidden frames, show_existing_frame, forward key frames, tiles,
      three tile groups, film grain from SVT-AV1 and libaom, super-resolution, random reference scaling,
      S-frames with frame numbers, screen content, lossless, segmentation, delta q/lf, quantiser matrices,
      128x128 superblocks with loop restoration, global motion) the picture parameter buffer, the tile
      parameters and the tile data the backend submits for every frame equal those ffmpeg's VA-API AV1
      decoder submits to the same driver, with surfaces compared by the number of the picture they hold.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
      platform: linux
    verified_by:
    - av1lw-fake-vaapi-av1-test
  av1lw-vaapi-short-signaling:
    text: For two streams rewritten to use frame_refs_short_signaling the references the backend derives
      (set_frame_refs) equal ffmpeg's for every frame, including frames whose derived references differ
      from the ones the encoder signalled.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
      platform: linux
    verified_by:
    - av1lw-fake-vaapi-av1-short-signaling-test
  av1lw-vaapi-output:
    text: Through the fake driver every temporal unit yields one frame with its PTS that shows the right
      picture (the grained surface where film grain applies) at the frame's own size; reference slots
      match a simulation of the stream; a second sequence of another size rebuilds the surfaces; after
      Flush non-key units are skipped and decoding resumes at a key frame; 10-bit, 4:4:4 and monochrome
      streams report ErrUnsupported before anything reaches the driver; Probe lists av1 decode and no
      av1 encode.
    scope:
      milestone: av1-decode-linux-windows
      backend: vaapi
      platform: linux
    verified_by:
    - av1lw-fake-vaapi-av1-test
    - av1lw-fake-vaapi-av1-sequence-test
  av1lw-struct-layouts:
    text: The Go mirrors of VASegmentationStructAV1, VAFilmGrainStructAV1, VAWarpedMotionParamsAV1, VADecPictureParameterBufferAV1
      (1160 bytes) and VASliceParameterBufferAV1 (40 bytes) have the sizes and offsets gcc reports for
      libva 2.22 on x86-64 and arm64, and MFX_CODEC_AV1 / MFX_PROFILE_AV1_MAIN have the header values.
    scope:
      milestone: av1-decode-linux-windows
      platform: linux
    verified_by:
    - av1lw-av1-layout-test
