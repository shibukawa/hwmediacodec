open_questions:
  encoder-dts-semantics:
    text: Should the VideoToolbox encoder (and the Encoder contract in general) guarantee DTS <= PTS
      by shifting decode times itself, instead of leaving it to the muxer? ffmpeg's videotoolbox
      encoder does such a shift.
    state: open
    resolution: Left in the muxer for now because the shift needs the whole stream's largest lag (or
      the encoder's reorder depth) and the current packets are still internally consistent; revisit
      if a second consumer of DTS appears (fMP4/HLS segmenter in the next slice).
facts:
  api:
    container: Open/NewDemuxer -> Demuxer{Video() *VideoTrack, Others() []*Track, Duration()};
      Track{ID, Handler, TimeScale, MediaTimeOffset, SampleCount, Sample(i), Info(i), TimeOf,
      PresentationTime}; VideoTrack{Codec, Width, Height, FrameRate, Keyframes, KeyframeAtOrBefore,
      AccessUnit(i), Packet(i)}; Create/NewMuxer -> Muxer{AddVideoTrack(codec, timeScale) *VideoWriter,
      AddPassthroughTrack(*Track) *TrackWriter, Close}; VideoWriter.WritePacket(hwmediacodec.Packet);
      TrackWriter.WriteSample(Sample)
    convert: 'flags -codec h264|hevc -bitrate 6M|2500k -cbr -quality -gop -bframes -profile -software -q'
    thumbnails: 'flags -every 10s -all -width -format jpg|png -quality -o -software'
  implementation:
    demux: mp4.DecodeFile with DecModeLazyMdat; sample offsets expanded from stsc/stco/co64, times
      from stts/ctts, sync from stss; Mdat.ReadData per sample
    mux: ftyp + 64-bit-size mdat written up front and patched at Close, moov last; stbl built from
      mp4ff box structs (stts/ctts/stss/stsc/stsz/stco|co64); passthrough tracks reuse the source
      stsd, hdlr, media header, language and edit list
    testutil: examples/internal/testutil drives ffmpeg/ffprobe (GenerateMP4, Streams, Frames as JSON,
      FrameMD5, PSNR, ExtractFrame, CheckDecodes)
  result:
    status: delivered 2026-10-09
    performance: 1080p H.264 (bf=2) -> HEVC 8 Mbit/s with B-frames at 162 fps on an M3 including demux,
      mux and audio copy
history:
  accepted-2026-10-09:
    summary: Author asked for usage samples (file converter, keyframe thumbnails, HEIC/HEIF and AVIF
      conversion, Ebitengine playback, playback as a texture, screen recording with HLS/WebRTC viewing)
      and agreed to the proposed order - converter and thumbnails first, then recording and HLS, texture
      playback, WebRTC, HEIF/AVIF last.
  delivered-2026-10-09:
    summary: Examples module with the container bridge, convert and thumbnails; container tests pass with
      ffmpeg alone, convert and thumbnails tests and a 1080p run pass on the author's M3.
