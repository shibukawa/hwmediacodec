id: milestone:examples-mp4-tools
type: milestone
title: Examples module - MP4 container bridge, file converter and keyframe thumbnails
summary: 'First slice of the usage samples: a third Go module (examples/, own go.mod, replace ../)
  with a small MP4 demuxer/muxer on top of mp4ff (examples/container), a video file converter that
  re-encodes the video track with the hardware codecs while keeping sample timestamps and copying
  audio (examples/convert), and a keyframe thumbnail extractor that decodes sync samples only
  (examples/thumbnails). The container package is the shared piece the later samples (recording,
  HLS, texture playback, WebRTC) build on.'
lifecycle: active
authority: authored
aliases:
- examples module
- MP4 converter sample
- サムネイル抽出
- 動画ファイルコンバーター
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-mp4-tools
constraints:
- The core module stays free of container code and of new dependencies; container handling lives
  in the examples module, which depends on github.com/Eyevinn/mp4ff (pure Go). Inside the repository
  examples/go.mod uses replace ../ like ebitenvideo.
- 'Timestamps pass through unchanged. Both decoder and encoder are opened with WithTimeScale(track
  time scale), so frame PTS are MP4 sample times and encoder packets carry PTS/DTS in the same unit;
  the muxer stores them as given, apart from a constant DTS shift.'
- VideoToolbox with B-frames numbers decode times from the first PTS, so reordered pictures carry
  DTS > PTS (observed - the first P has pts 2048 / dts 512, a pyramid B has pts 512 / dts 1536 at
  15360 Hz). MP4 requires DTS <= PTS, so the muxer shifts every DTS back by the largest lag and
  writes an edit list (elst media_time = first presentation time) that hides the start delay; ffprobe
  then reports presentation times identical to the source.
- Demuxed access units are Annex-B with the parameter sets from avcC/hvcC prepended to every sync
  sample, so decoding can start at any keyframe; the muxer learns VPS/SPS/PPS from the packets and
  strips them from the samples (avc1/hvc1 sample entries).
- Track.MediaTimeOffset exposes the edit-list offset; thumbnails are named with presentation time
  (PTS minus that offset), and KeyframeAtOrBefore works in presentation time.
- 'Thumbnails decode with WithDecodeOrder() and WithOutputFormat(RGBA): a sequence of keyframes has
  decode order equal to display order, so each picture comes out immediately instead of waiting in
  the reorder buffer, and the plane maps onto image.RGBA without copying.'
non_goals:
- Fragmented MP4 input, MKV, MPEG-TS; faststart (moov first) output; AV1 muxing (no encoder exists
  on Apple Silicon). Demuxing av01 tracks is wired (temporal units passed through) but untested
  until the AV1 decoder lands.
- Audio transcoding (other tracks are copied); subtitle handling beyond passthrough.
- Contact sheets or scene detection in the thumbnail tool.
acceptance:
  demux-matches-ffprobe:
    text: For H.264 (B-frames) and HEVC (hvc1 and hev1) files written by ffmpeg, the demuxer reports
      the same sample count, the same normalised presentation-time sequence and the same number of
      keyframes as ffprobe, and the Annex-B access units it emits decode with ffmpeg to the same
      per-frame MD5s as the MP4 itself.
    scope:
      milestone: examples-mp4-tools
    verified_by:
    - container-demux-test
  mux-round-trip:
    text: Remuxing the demuxed access units plus the audio track yields a file that ffmpeg decodes
      without errors, with the same codecs, packet counts, size, has_b_frames, hvc1 tag, per-frame
      MD5s, presentation times and duration (within 50 ms) as the source.
    scope:
      milestone: examples-mp4-tools
    verified_by:
    - container-mux-test
  convert-end-to-end:
    text: convert produces an MP4 whose video has the target codec, the source frame count and size,
      PSNR >= 30 dB against the source, B-frames when requested, identical presentation times as
      reported by ffprobe, and the audio track copied with the same codec and packet count.
    scope:
      milestone: examples-mp4-tools
    verified_by:
    - convert-test
    - convert-1080p-run
  thumbnails-end-to-end:
    text: With -all the tool writes one image per keyframe named by presentation time, each within
      30 dB (8x8 block PSNR) of ffmpeg's decode of the same frame; -every picks the keyframe at or
      before each instant; -width scales with the aspect ratio kept.
    scope:
      milestone: examples-mp4-tools
    verified_by:
    - thumbnails-test
