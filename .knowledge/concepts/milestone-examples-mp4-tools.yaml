id: milestone:examples-mp4-tools
type: milestone
title: Examples module - MP4 container bridge, file converter and keyframe thumbnails
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:examples, component:mediacontainer (keys prefixed exmp4-). Original summary: First
  slice of the usage samples: a third Go module (examples/, own go.mod, replace ../) with a small MP4
  demuxer/muxer on top of mp4ff (examples/container), a video file converter that re-encodes the video
  track with the hardware codecs while keeping sample timestamps and copying audio (examples/convert),
  and a keyframe thumbnail extractor that decodes sync samples only (examples/thumbnails). The container
  package is the shared piece the later samples (recording, HLS, texture playback, WebRTC) build on.'
lifecycle: superseded
authority: authored
aliases:
- examples module
- MP4 converter sample
- サムネイル抽出
- 動画ファイルコンバーター
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-mp4-tools
non_goals:
- Fragmented MP4 input, MKV, MPEG-TS; faststart (moov first) output; AV1 muxing (no encoder exists on
  Apple Silicon). Demuxing av01 tracks is wired (temporal units passed through) but untested until the
  AV1 decoder lands.
- Audio transcoding (other tracks are copied); subtitle handling beyond passthrough.
- Contact sheets or scene detection in the thumbnail tool.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:videotoolbox
- relation: follows
  to: milestone:display-order-rgba
- relation: superseded_by
  to: component:examples
- relation: superseded_by
  to: component:mediacontainer
history:
  accepted-2026-10-09:
    summary: Author asked for usage samples (file converter, keyframe thumbnails, HEIC/HEIF and AVIF conversion,
      Ebitengine playback, playback as a texture, screen recording with HLS/WebRTC viewing) and agreed
      to the proposed order - converter and thumbnails first, then recording and HLS, texture playback,
      WebRTC, HEIF/AVIF last.
  delivered-2026-10-09:
    summary: Examples module with the container bridge, convert and thumbnails; container tests pass with
      ffmpeg alone, convert and thumbnails tests and a 1080p run pass on the author's M3.
  superseded-2026-10-16:
    summary: Folded into component:examples, component:mediacontainer on 2026-10-16 so that the current
      state of each backend and package is read from one concept; this file keeps the slice's definition
      and timeline.
