id: milestone:linux-intel-vpl
type: milestone
title: Linux Intel - H.264/HEVC decode and encode via Intel VPL (Quick Sync), without cgo
summary: 'Linux slice requested by the author on 2026-10-09 ("Linux Intel対応を願いします"): the Intel
  backend (internal/vpl) loads the VPL dispatcher libvpl through purego, binds a hardware session to
  the VADisplay of the Intel render node and drives MFXVideoDECODE and MFXVideoENCODE with
  system-memory NV12 surfaces. H.264 and HEVC in both directions; the runtime parses the bitstream
  and reorders frames itself. Written on a Mac: struct layouts, symbol binding and the dispatcher
  filter are verified on the host and in a container, hardware conformance is the open step.'
lifecycle: active
authority: authored
aliases:
- Linux Intel
- Intel VPL backend
- Quick Sync backend
- vpl backend
- QSV
scope:
  platform: linux
  gpu: intel
  milestone: linux-intel-vpl
constraints:
- CGO_ENABLED=0; libvpl.so.2 is dlopened with purego and no module dependency is added. The structs
  mirror the VPL headers at API 2.8 (Debian libvpl-dev 2023.1.1); only the API 1.x call set is used
  (external system-memory surfaces, MFXVideoCORE_SyncOperation), so the legacy Media SDK runtime
  libmfxhw64 behind the same dispatcher is served by the same code.
- Same public API and Send/Receive/Flush contract as the other backends. The runtime emits display
  order, so the decoder implements codec.DisplayOrderer and is not wrapped in the Go reorder layer;
  WithDecodeOrder has no effect, as on Media Foundation.
- NV12 in CPU memory, 8-bit 4:2:0. The GPU runtime needs the application's VADisplay
  (MFXVideoCORE_SetHandle with MFX_HANDLE_VA_DISPLAY), so the backend reuses the libva bindings of
  internal/vaapi/sys and owns a DRM file descriptor and display per decoder or encoder.
- Registered after nvidia and before vaapi in backends_linux.go - on an Intel GPU with a VPL runtime
  it serves the request, and VA-API takes over through the ErrUnsupported chain when the runtime is
  missing or rejects a configuration.
- Hardware only - the dispatcher filter mfxImplDescription.Impl = MFX_IMPL_TYPE_HARDWARE is set and
  MFX_WRN_PARTIAL_ACCELERATION is reported as ErrUnsupported.
non_goals:
- RGBA/BGRA frames (needs MFXVideoVPP or a Go converter), 10-bit and 4:2:2/4:4:4 streams, AV1 and
  VP9, video-memory (VASurface / DMA-BUF) surfaces as Frame.Native, look-ahead, low-power selection
  and other VPL extras outside the common API.
- The legacy dispatcher libmfx.so.1 (Media SDK without libvpl installed) and Windows (libvpl.dll /
  libmfx64-gen.dll); Media Foundation already reaches Quick Sync there.
acceptance:
  mfx-struct-layout:
    text: Go mirrors of mfxFrameInfo, mfxInfoMFX, mfxVideoParam, mfxBitstream, mfxFrameData,
      mfxFrameSurface1, mfxFrameAllocRequest, mfxEncodeCtrl, mfxExtCodingOption, mfxExtCodingOption2,
      mfxExtCodingOptionSPSPPS, mfxExtCodingOptionVPS and mfxVersion have the sizes and field offsets a
      C compiler measures for x86_64-linux-gnu (several are declared with pragma pack(4) in C), and the FourCC
      identifiers and enumerators equal the header values.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - layout-test
  symbols-bind:
    text: Every libvpl entry point the backend uses binds against a real dispatcher build, and the
      dispatcher accepts the hardware filter whose mfxVariant is passed by value as two integer
      register words (and refuses the same property with a wrong variant type).
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - symbol-binding-container
  graceful-without-hardware:
    text: Without libvpl or libva, or with them but without an Intel GPU, Probe returns an empty list
      and NewDecoder/NewEncoder return ErrUnsupported; nothing crashes and nothing is printed.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - symbol-binding-container
  parameter-mapping:
    text: The public encoder controls map to mfxVideoParam as documented (coded size aligned to 16
      with the picture as crop, GopPicSize, IdrInterval 0 for H.264 and 1 for HEVC so that every
      I-frame is IDR, GopRefDist 3 for B-frames, CQP/VBR/CBR with BRCParamMultiplier beyond 65535
      kbit/s, profiles), unsupported combinations are ErrUnsupported, and the pixel copies (edge
      replication into the alignment padding, cropped copy out) and the parameter-set cache behave as
      specified.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - host-unit-tests
  decode-reference-linux:
    text: On a Linux machine with an Intel GPU and a VPL runtime, TestDecodeH264MatchesReference,
      TestDecodeHEVCMatchesReference, the B-frame display-order tests, TestDecodeParameterSetChange,
      TestFlushResumesAtKeyframe and TestInvalidData pass (per-frame NV12 checksums equal ffmpeg's
      software decoder); TestDecodeOrderOption skips because the runtime reorders natively.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - hardware-decode
  encode-reference-linux:
    text: On the same machine the encode conformance tests (PSNR against the source, keyframe
      interval, forced keyframes, B-frames with monotonic DTS, CBR/VBR sizes, quality ordering, low
      latency, profiles, flush/reuse) and the transcode round trip pass; RGBA/BGRA input skips.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - hardware-encode
  backend-selection:
    text: HWMEDIACODEC_BACKENDS restricts and orders the backends Probe, NewDecoder and NewEncoder
      consult, so the VA-API and VPL backends can each be exercised on the same Intel GPU.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - host-unit-tests
  cross-build:
    text: CGO_ENABLED=0 builds succeed for all six targets with the new packages.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - cross-build-check
  host-suite-unaffected:
    text: The full macOS test suite still passes with the backend wired in.
    scope:
      milestone: linux-intel-vpl
    verified_by:
    - host-suite
