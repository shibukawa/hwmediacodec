id: milestone:linux-intel-vpl
type: milestone
title: Linux Intel - H.264/HEVC decode and encode via Intel VPL (Quick Sync), without cgo
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:intel-vpl (keys prefixed vpl-). Original summary: Linux slice requested by the author
  on 2026-10-09 ("Linux Intel対応を願いします"): the Intel backend (internal/vpl) loads the VPL dispatcher libvpl
  through purego, binds a hardware session to the VADisplay of the Intel render node and drives MFXVideoDECODE
  and MFXVideoENCODE with system-memory NV12 surfaces. H.264 and HEVC in both directions; the runtime
  parses the bitstream and reorders frames itself. Written on a Mac: struct layouts, symbol binding and
  the dispatcher filter are verified on the host and in a container, hardware conformance is the open
  step.'
lifecycle: superseded
authority: authored
aliases:
- Linux Intel
- Intel VPL backend
- Quick Sync backend
- vpl backend
- QSV
scope:
  platform: linux
  gpu: intel
  milestone: linux-intel-vpl
non_goals:
- RGBA/BGRA frames (needs MFXVideoVPP or a Go converter), 10-bit and 4:2:2/4:4:4 streams, AV1 and VP9,
  video-memory (VASurface / DMA-BUF) surfaces as Frame.Native, look-ahead, low-power selection and other
  VPL extras outside the common API.
- The legacy dispatcher libmfx.so.1 (Media SDK without libvpl installed) and Windows (libvpl.dll / libmfx64-gen.dll);
  Media Foundation already reaches Quick Sync there.
