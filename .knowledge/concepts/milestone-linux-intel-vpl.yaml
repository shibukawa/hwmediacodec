facts:
  steps:
  - internal/vpl/sys - status codes, FourCC identifiers and struct mirrors of the VPL headers
    (types.go, no build constraint), a purego loader for libvpl.so.2 with 24 entry points
    (sys_linux.go), layout/constant tests and a dispatcher test that runs without a GPU.
  - internal/vpl/session.go - Intel render node selection (sysfs PCI vendor 0x8086, else the VA
    vendor string; HWMEDIACODEC_VPL_DEVICE overrides), vaGetDisplayDRM/vaInitialize through
    internal/vaapi/sys, MFXLoad + MFXCreateConfig + MFXSetConfigFilterProperty(Impl = hardware) +
    MFXCreateSession, MFXVideoCORE_SetHandle(VA display), bounded SyncOperation and busy waits.
  - internal/vpl/decoder.go - keyframe gate with a parameter-set cache in Go; DecodeHeader on the
    first keyframe, QueryIOSurf, Init with system-memory output and AsyncDepth 1; a
    DecodeFrameAsync loop per access unit (MFX_BITSTREAM_COMPLETE_FRAME for progressive sequences)
    that synchronises every output at once and copies the crop rectangle into pooled NV12 buffers;
    the PTS travels as TimeStamp with a 2^40 bias (stamp.go); surfaces grow on demand; MFX_ERR_INCOMPATIBLE_VIDEO_PARAM drains, closes and
    re-initialises from the same access unit; Flush drains with a NULL bitstream and resets.
  - internal/vpl/encparam.go, encoder.go - mfxVideoParam from the public controls (see
    backend:intel-vpl facts.implementation.encoder), Init with staged retries without extension buffers,
    GetVideoParam for the real GopRefDist, buffer size and the SPS/PPS/VPS; one EncodeFrameAsync +
    SyncOperation per frame; forced IDR through mfxEncodeCtrl; DTS from the input PTS queue; drain
    with a NULL surface at Flush, Close + Init before the next frame.
  - Root wiring (vpl registered between nvidia and vaapi), HWMEDIACODEC_BACKENDS backend selection,
    probe and decode-order test adjustments, README status row and Linux notes.
  oracle_recipes:
    layout: docker build --platform linux/amd64 with apt-get install libvpl-dev gcc; a C program
      including vpl/mfx.h prints sizeof and offsetof for every mirrored struct and the enumerators the
      Go code hard-codes; a script turns the output into internal/vpl/sys/layout_test.go.
    symbols: the same image with libvpl2, libmfx-gen1.2, libva2 and libva-drm2; run the CGO_ENABLED=0
      linux/amd64 test binaries (go test -c). The dispatcher loads and validates the filter without a
      GPU; MFXCreateSession then reports MFX_ERR_NOT_FOUND.
    headers: the doc comments in vpl/mfxvideo.h and vpl/mfxstructures.h are the API contract
      (DecodeFrameAsync status codes, IdrInterval per codec, SetHandle's MFX_ERR_UNDEFINED_BEHAVIOR,
      drain with NULL).
  design_choices:
  - VPL instead of extending the VA-API backend for Intel - it gives HEVC and B-frame encoding at
    once and keeps parsing, reference management and rate control in the runtime (as NVDEC/NVENC do
    for NVIDIA); VA-API stays the fallback for Intel GPUs without a runtime and for H.264 on AMD.
  - The dispatcher (libvpl) rather than dlopening libmfx-gen directly - MFXInitialize takes a large
    struct by value, the dispatcher also finds the legacy runtime, and its filter API needs only one
    16-byte by-value argument, passed as two uint64 words.
  - External system-memory surfaces (API 1.x model) rather than the 2.x internal allocation
    (MFXMemory_GetSurfaceForDecode + FrameInterface function pointers) - no callbacks, works with
    the legacy runtime, and frames are copied to Go memory anyway.
  - Synchronise every operation immediately (AsyncDepth 1, one bitstream buffer) - the simplest
    correct mapping to Send/Receive; throughput is bounded by per-picture latency.
  - Surface and bitstream structures keep buffer addresses as uintptr and live on the Go heap, so
    the garbage collector never scans memory the runtime's threads write to.
  - A HWMEDIACODEC_BACKENDS environment variable instead of a public option - two backends now cover
    the same Intel GPU and the conformance suite has to run against each without an API change.
  learned:
  - The VPL dispatcher can be exercised without a GPU far enough to prove the by-value mfxVariant
    convention - it checks the variant type against the property name.
  - Several mfx structs are declared with pragma pack(4); their mirrors need no manual padding as long as no
    64-bit member sits at a 4-byte offset in the fields used (the Width/Height arm of the mfxFrameInfo
    union instead of the BufferSize arm).
  - MFXVideoDECODE_Query and MFXVideoENCODE_Query select the codec by the output structure's CodecId
    (runtime behaviour recalled from the Media SDK sources, not stated in the headers).
  review_2026-10-09:
    method: An independent read of internal/vpl against the doc comments of the VPL headers, with the
      conformance tests walked through by hand, since nothing can run without an Intel GPU.
    fixed:
    - The encoder queued a frame's PTS after the call that may already return its access unit, so
      every DTS lagged one frame (DTS != PTS without B-frames).
    - HEVC P pictures default to generalised B (GPB); mfxExtCodingOption3.GPB is now off.
    - A warning without a sync point no longer resubmits the same surface; only device-busy and
      in-execution are retried.
    - Flush is followed by Close + Init instead of MFXVideoENCODE_Reset, whose effect on the coded
      sequence is left to the runtime.
    - MFX_BITSTREAM_COMPLETE_FRAME is set for progressive sequences only; MFX_ERR_MORE_SURFACE with an
      unlocked work surface counts as a stalled call; time stamps carry a bias so that negative PTS
      values survive.
    open:
    - With two Intel GPUs the dispatcher's implementation 0 is paired with the first Intel render
      node; a second node is not tried when that pair cannot serve the codec.
  next_candidates:
  - Run the decode and encode conformance tests on an Intel Linux machine (HWMEDIACODEC_BACKENDS=vpl
    and =vaapi); record GPU generation, runtime version and fps here and flip the verification
    states.
  - RGBA/BGRA through MFXVideoVPP (NV12 to RGB4 after decode, RGB4 to NV12 before encode), which
    would make ebitenvideo work on Linux Intel.
  - Maximum picture size per codec in Probe from the dispatcher's mfxImplDescription.
  - AV1 (decode Gen12+, encode Arc/DG2+) and 10-bit HEVC (P010).
  - Batch throughput with AsyncDepth > 1 and a ring of bitstream buffers.
  - Share the parameter-set cache with internal/mediafoundation (the two copies are identical).
