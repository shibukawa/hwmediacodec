history:
  started-2026-10-09:
    summary: Author asked for Windows Intel support, decoder first ("Windows Intelの対応をお願いしたい。デコーダから").
      Media Foundation + Direct3D 11 chosen per policy:support-tiers (primary backend for Windows
      Intel/AMD, also covers NVIDIA decode); Intel VPL kept as an alternative.
  authored-2026-10-09:
    summary: Decoder implementation, unit tests and Windows conformance tests written on macOS; cross-build
      and vet pass for windows/amd64 and windows/arm64; author excluded 32-bit Windows. Hardware
      verification pending. Opened as PR shibukawa/hwmediacodec#4 after merging main (M2 encode).
  encoder-authored-2026-10-09:
    summary: Author asked for the encoder next, appended to the same PR ("次にエンコーダーもお願いします。このまま同じPRに追記で").
      Vendor asynchronous hardware encoder MFTs driven through the event model; Codec API mapping of the
      shared encoder controls; conformance tests mirror the macOS ones. Hardware verification pending.
  nvidia-direct-2026-10-09:
    summary: After the merge the author asked whether the backend distinguishes GPU vendors (it does
      not) and requested NVDEC/NVENC directly for NVIDIA; milestone:windows-nvidia-nvdec-nvenc
      registers that backend ahead of this one on windows/amd64. backends_windows.go changed for it
      and TestDecodeOrderOption now skips by serving backend, not by operating system.
