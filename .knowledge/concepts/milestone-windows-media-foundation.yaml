id: milestone:windows-media-foundation
type: milestone
title: Windows backend - H.264/HEVC decode (Media Foundation + D3D11 DXVA) and encode (vendor hardware MFTs)
summary: Second backend, delivered in two slices on one branch (PR shibukawa/hwmediacodec#4). Decode
  drives the synchronous Microsoft decoder MFTs (H.264 in Msmpeg2vdec.dll, HEVC from the HEVC Video
  Extensions package) with a Direct3D 11 device attached through IMFDXGIDeviceManager, so the GPU's
  DXVA engine decodes regardless of vendor. Encode drives the vendor's asynchronous hardware encoder
  MFT (Intel Quick Sync, AMD, NVIDIA) through the IMFMediaEventGenerator event model with
  system-memory NV12 input. Written and cross-compiled on macOS against the Windows SDK headers;
  hardware verification on the author's Intel Windows machine is pending.
lifecycle: active
authority: authored
aliases:
- Windows Intel decode
- Windows Intel encode
- Media Foundation decoder
- Media Foundation encoder
- M3
scope:
  platform: windows
  gpu:
  - intel
  - amd
  - nvidia
  milestone: m3
constraints:
- CGO_ENABLED=0; native access through golang.org/x/sys/windows (LoadLibraryEx with system32
  search) and raw COM vtable calls via syscall.SyscallN. No cgo, no third-party COM library.
- Hardware only. Probe reports a codec when the GPU exposes the DXVA profile with NV12 output
  (ID3D11VideoDevice) and a synchronous decoder MFT exists; NewDecoder returns ErrUnsupported
  otherwise. WithSoftwareFallback is not implemented on Windows.
- Annex-B input, one access unit per Packet, passed to the MFT unchanged (MFVideoFormat_H264 /
  MFVideoFormat_HEVC accept start codes with in-band parameter sets).
- Output NV12 copied to Go memory through a staging texture (CopySubresourceRegion + Map); the
  visible picture is cropped with MF_MT_MINIMUM_DISPLAY_APERTURE.
- Encoder input is NV12 in system memory (tightly packed, MF_MT_DEFAULT_STRIDE = width); output
  is Annex-B with VPS/SPS/PPS guaranteed in front of every keyframe (prepended from the stream or
  MF_MT_MPEG_SEQUENCE_HEADER when the MFT omits them). Hardware encoder MFTs only; WithSoftwareFallback
  admits the synchronous Microsoft H.264 encoder.
- Encoder controls map to ICodecAPI before SetOutputType (rate control mode, mean bitrate, quality,
  GOP size, B-picture count, low latency) plus MF_MT_AVG_BITRATE / MF_MT_FRAME_RATE / MF_MT_MPEG2_PROFILE
  on the output type; AVEncVideoForceKeyFrame per forced frame. A control the MFT rejects is
  ErrUnsupported naming the control and the MFT.
- "windows/amd64 and windows/arm64 only (author decision 2026-10-09: 32-bit Windows is out of
  scope). windows/386 still builds with no backend."
non_goals:
- Vendor asynchronous hardware decoder MFTs, AV1, 10-bit (P010), software decode fallback,
  zero-copy texture hand-off, Direct3D texture input for the encoder.
acceptance:
  decode-reference-windows:
    text: Decoding a 320x240 H.264 stream on a Windows machine with a DXVA-capable GPU yields the
      same frame count and per-frame NV12 checksums as ffmpeg software decode, in display order.
    scope:
      milestone: m3
    verified_by:
    - decode-reference-test-windows
  hevc-reference-windows:
    text: Same as decode-reference-windows for HEVC (needs the HEVC Video Extensions package).
    scope:
      milestone: m3
    verified_by:
    - hevc-reference-test-windows
  bframes-display-order:
    text: Streams with B-frames come back in display order (Media Foundation reorders internally),
      bit-exact against ffmpeg.
    scope:
      milestone: m3
    verified_by:
    - bframe-order-test-windows
  parameter-set-change-windows:
    text: A resolution change mid-stream is handled through MF_E_TRANSFORM_STREAM_CHANGE with no
      frames lost.
    scope:
      milestone: m3
    verified_by:
    - sps-change-test-windows
  flush-resume-windows:
    text: Flush drains every frame (MFT_MESSAGE_COMMAND_DRAIN); the decoder restarts at the next
      keyframe with stored parameter sets prefixed when the keyframe lacks them.
    scope:
      milestone: m3
    verified_by:
    - flush-seek-test-windows
  probe-windows:
    text: Probe reports backend mediafoundation decode h264 (and hevc when the extension is
      installed) with Hardware=true on a GPU machine and nothing on a GPU-less VM; no error either
      way.
    scope:
      milestone: m3
    verified_by:
    - probe-test-windows
  encode-matches-source-windows:
    text: Encoding 60 synthetic NV12 frames with a vendor hardware MFT yields one Annex-B packet per
      frame, the first a keyframe with in-band parameter sets, PTS passthrough, luma PSNR above 30 dB
      after ffmpeg decode, and ffprobe keyframe flags that agree with Packet.Keyframe.
    scope:
      milestone: m3
    verified_by:
    - encode-reference-test-windows
  encode-controls-windows:
    text: Keyframe interval and forced keyframes are honoured; B-frames, CBR, constant quality,
      low latency and profiles work when the vendor MFT accepts them and otherwise return
      ErrUnsupported (the tests skip in that case and report which control was refused).
    scope:
      milestone: m3
    verified_by:
    - encode-controls-test-windows
  transcode-roundtrip-windows:
    text: Hardware encode followed by hardware decode of the result reproduces the source above 30 dB
      luma PSNR, frame for frame.
    scope:
      milestone: m3
    verified_by:
    - transcode-test-windows
  cross-build-m3:
    text: CGO_ENABLED=0 builds for windows/amd64, windows/arm64 and windows/386 (no backend) from
      macOS; go vet passes for windows/amd64 and windows/arm64; struct layouts match the SDK at
      compile time.
    scope:
      milestone: m3
    verified_by:
    - cross-build-check-m3
    - layout-check-m3
    - unit-tests-m3
