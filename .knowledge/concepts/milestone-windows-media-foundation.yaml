id: milestone:windows-media-foundation
type: milestone
title: Windows backend - H.264/HEVC decode (Media Foundation + D3D11 DXVA) and encode (vendor hardware
  MFTs)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:media-foundation (keys prefixed mf-). Original summary: Second backend, delivered
  in two slices on one branch (PR shibukawa/hwmediacodec#4). Decode drives the synchronous Microsoft decoder
  MFTs (H.264 in Msmpeg2vdec.dll, HEVC from the HEVC Video Extensions package) with a Direct3D 11 device
  attached through IMFDXGIDeviceManager, so the GPU''s DXVA engine decodes regardless of vendor. Encode
  drives the vendor''s asynchronous hardware encoder MFT (Intel Quick Sync, AMD, NVIDIA) through the IMFMediaEventGenerator
  event model with system-memory NV12 input. Written and cross-compiled on macOS against the Windows SDK
  headers; hardware verification on the author''s Intel Windows machine is pending.'
lifecycle: superseded
authority: authored
aliases:
- Windows Intel decode
- Windows Intel encode
- Media Foundation decoder
- Media Foundation encoder
- M3
scope:
  platform: windows
  gpu:
  - intel
  - amd
  - nvidia
  milestone: m3
non_goals:
- Vendor asynchronous hardware decoder MFTs, AV1, 10-bit (P010), software decode fallback, zero-copy texture
  hand-off, Direct3D texture input for the encoder.
