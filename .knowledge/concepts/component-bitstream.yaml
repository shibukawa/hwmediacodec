open_questions:
  m1-annexb-parser-scope:
    text: Is a minimal Go Annex-B NAL splitter plus SPS/PPS extraction enough for M1, or should M1 already
      include a full SPS parser (needed later for VA-API)?
    state: answered
    resolution: 'Minimal parser was enough: NAL split, first_mb/first_slice flag, parameter-set ids (incl.
      HEVC profile_tier_level skip). A full SPS/slice parser is only needed for POC-based reordering and
      for VA-API; tracked as requirement open question frame-reordering.'
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  milestone_notes:
    dor:
      implementation:
        parsers: internal/h264 (SPS incl. VUI bitstream_restriction and timing, PPS, slice header up to
          the POC fields, POC types 0/1/2 incl. fields, MaxReorderFrames with the level table) and internal/hevc
          (SPS up to sps_max_num_reorder_pics, PPS, first slice segment header, POC with NoRaslOutputFlag);
          both skip scaling lists / profile_tier_level correctly
    av1mac:
      implementation:
        parser: internal/av1 - Split (OBU framing, leb128, extension headers, size-less last OBU), ParseSequenceHeader
          (whole sequence_header_obu incl. timing/decoder model info, operating points, color_config),
          ParseFrameHeader (show_existing_frame, frame_type, show_frame), ParseTemporalUnit (classification
          - HasFrame, Keyframe, ShowExistingFrame), CodecConfigurationRecord (av1C, re-framing the sequence
          header OBU with obu_has_size_field=1), StripTemporalDelimiters
    vah264:
      steps:
      - internal/bitstream - lazy emulation-prevention removal (slice headers no longer copy the slice)
        and more_rbsp_data().
      - internal/h264 - scaling lists (zigzag, defaults, fall-back rules), SPS incl. VUI/HRD, PPS (lazy
        parse against its SPS), slice header incl. modification/pred-weight/MMCO, DPB (POC 8.2.1, gaps
        8.2.5.2, marking 8.2.5, lists 8.2.4) with a Surfaces callback for backend storage.
      oracle_recipes:
        headers: ffmpeg -i x.h264 -c copy -bsf:v trace_headers -f null - (prints every syntax element
          with bit position; the Extradata copy before the first Packet line is skipped).
        dpb: ffmpeg -threads 1 -loglevel debug -debug mmco (short/long term lists after each picture;
          ffmpeg logs an empty state when an IDR slice starts, emulate it; pick the codec context with
          most lines because ffmpeg decodes once for probing).
        poc: ffmpeg -threads 1 -loglevel debug -debug pict (per slice "frame:N poc:T/B"; ffmpeg adds 65536
          at each IDR for POC type 0).
        display_order: not available from raw .h264 via ffprobe (pts/pkt_dts are N/A); POC equality with
          ffmpeg is used instead.
    vahevc:
      steps:
      - internal/hevc - full parsers (profile_tier_level, SPS incl. scaling lists, short- and long-term
        reference picture sets, VUI, HRD skipped, range extension; PPS incl. tiles and range extension;
        slice segment header incl. dependent segments, list modification, prediction weights, entry points),
        ParameterSets, DPB (POC 8.3.1, reference picture set 8.3.2, lists 8.3.4, RASL skipping, stand-ins
        for missing references), writers for VPS/SPS/PPS/slice segment headers. The earlier lightweight
        parsers became ParseSPSHead/ParsePPSHead/ParseSliceHead and still serve the reorder tracker.
      oracle_recipes:
        headers: ffmpeg -f hevc -i x.hevc -c copy -bsf:v trace_headers -f null - (positions count from
          the NAL header, after emulation prevention removal; the trace ends with the byte_alignment()
          bits).
        reference_lists: x265 --csv f.csv --csv-log-level 1 writes "List 0" / "List 1" columns with the
          POCs of each frame's lists in encode order; POC restarts at IDR pictures.
        sps_reference_sets: x265 two-pass with --multi-pass-opt-rps moves the sets into the SPS (short_term_ref_pic_set_idx);
          it never uses inter RPS prediction.
        weights: a fade (ffmpeg fade filter on testsrc2) makes x265 code luma and chroma weights.
    av1lw:
      implementation:
        parser: internal/av1/header.go - State (sequence header plus eight RefFrame slots), State.ParseHeader
          (whole uncompressed_header - frame size with superres and frame_size_with_refs, set_frame_refs,
          tile info, quantisation, segmentation, delta q/lf, loop filter, CDEF, loop restoration, tx mode,
          skip mode, global motion with the previous parameters of the primary reference frame and the
          shear validity check, film grain incl. load from a reference), State.Update (reference frame
          update, and the reload of a key frame shown by show_existing_frame), Header.ParseTileGroup (tile
          sizes and offsets). seqhdr.go now keeps the decoder model lengths and every operating point.
        tests: testutil.GenerateAV1With (any ffmpeg AV1 encoder) and GenerateAV1Aomenc (aomenc via y4m);
          the fake driver image now installs aom-tools.
  learned:
  - The av1C ffmpeg writes into MP4 is 0x81, profile/level, the flags byte and 0x00 followed by the sequence
    header OBU; a parser built from the specification reproduces it byte for byte.
  - SVT-AV1 at preset 10 with -g 25 produces temporal units with up to four hidden frames in front of
    a shown one and show_existing_frame units of 5 bytes, which is enough to exercise the hidden-frame
    path.
  - The whole slice-level stack can be validated on a machine without the target GPU by using ffmpeg's
    debug logs as oracles; only the final pixel comparison needs hardware.
  - ffmpeg's POC values carry an internal +65536 offset (prev_poc_msb = 1<<16 at IDR); compare differences,
    not absolute values.
  - Debian trixie's libx265 4.1 writes corrupt streams (or crashes) with slices > 1; it produced slice
    segments without slice data, which the decoder now rejects as ErrInvalidData.
  - ffmpeg's libaom wrapper has no option for super-resolution, reference scaling or S-frames (aom-params
    rejects them); aomenc has. No available encoder writes frame_refs_short_signaling, so the test rewrites
    headers bit by bit; a rewritten header is kept only if it parses to exactly its new length, because
    skip_mode_present exists only when the derived references allow skip mode.
  - ffmpeg 7.1's trace prints the coded force_integer_mv bit for intra frames, where the specification
    (and the value sent to VA-API) is 1.
  - trace_headers prints dotted names (delta_q_y_dc.delta_coded); the trace parser's name pattern needed
    the dot.
