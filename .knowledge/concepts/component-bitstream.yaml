id: component:bitstream
type: component
title: 'Bitstream code in Go: H.264/HEVC/AV1 parsers, DPB and reference lists, header writers, Annex-B'
summary: 'internal/bitstream, internal/h264, internal/hevc, internal/av1 and encoding/annexb: the parsers
  of parameter sets, slice and frame headers, the H.264 decoded picture buffer (POC, marking, lists),
  the HEVC reference picture sets and lists, the AV1 frame header parser with its reference state, the
  VPS/SPS/PPS and slice header writers, and the Annex-B access unit splitter. Shared by the VA-API backend
  (slice-level), the display-order layer (POC), the NV12-only backends (parameter-set caches, picture
  size) and the browser backend (codec strings). Checked against ffmpeg''s trace_headers and debug logs,
  x265''s reference lists and libdav1d. Consolidated on 2026-10-16 from the parser parts of the VA-API
  and AV1 milestones.'
lifecycle: active
authority: authored
aliases:
- internal/h264
- internal/hevc
- internal/av1
- encoding/annexb
- parser oracle
- ビットストリームパーサ
acceptance:
  av1mac-av1-parser-oracle:
    text: Split, ParseSequenceHeader, ParseFrameHeader and CodecConfigurationRecord agree with ffmpeg's
      trace_headers (OBU types and sizes, every sequence header field, show_existing_frame/frame_type/show_frame)
      and with the av1C ffmpeg writes into an MP4 of the same stream, on 8-bit and 10-bit SVT-AV1 streams;
      the synthetic unit tests cover the branches SVT-AV1 never takes.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-parser-oracle-test
    - av1mac-av1-parser-unit-test
  vah264-parser-matches-ffmpeg:
    text: Every SPS, PPS and slice-header syntax element the parser exposes equals ffmpeg's trace_headers
      output, and the computed slice_data() bit offset equals the end of ffmpeg's header trace, on streams
      covering CAVLC/CABAC, POC types 0 and 2, B-pyramids, 16 references, weighted prediction, explicit
      scaling matrices, multiple slices, reference list modification and MMCO.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu: &id001
      - amd
      - intel
    verified_by:
    - vah264-parser-oracle-test
  vah264-dpb-matches-ffmpeg:
    text: After every reference picture the set of short- and long-term references (frame_num, LongTermFrameIdx)
      equals ffmpeg's -debug mmco log, and every picture's POC equals ffmpeg's -debug pict value up to
      ffmpeg's constant offset.
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu: *id001
    verified_by:
    - vah264-dpb-oracle-test
  vah264-header-writer-matches-parser:
    text: SPS, PPS and slice headers written by the encoder's writer parse back identically with the package's
      own parser and element by element with ffmpeg's trace_headers, and the writer's bit count equals
      the parser's header length (needed for packed slice headers).
    scope:
      milestone: linux-vaapi-decode
      platform: linux
      gpu: *id001
    verified_by:
    - vah264-writer-roundtrip-test
  vahevc-hevc-parser-matches-ffmpeg:
    text: Every SPS, PPS and slice segment header syntax element the parser exposes equals ffmpeg's trace_headers
      output, and the computed start of slice_segment_data() equals the end of ffmpeg's header trace,
      on x265 streams covering B-pyramids, several references, weighted prediction with real weights,
      default scaling lists, several slices, wavefront entry points, open GOPs, HRD parameters, temporal
      sub-layers, a conformance window, 10-bit and field coding, and on two-pass streams whose reference
      picture sets live in the SPS.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu: &id002
      - amd
      - intel
    verified_by:
    - vahevc-hevc-parser-oracle
  vahevc-hevc-reference-lists-match-x265:
    text: The picture order count and both reference picture lists of every picture equal what the x265
      encoder reports it used, no picture misses a reference, the DPB never holds more than sps_max_dec_pic_buffering_minus1
      references, and decoding from a CRA picture skips exactly its RASL pictures.
    scope:
      milestone: linux-vaapi-hevc
      platform: linux
      gpu: *id002
    verified_by:
    - vahevc-hevc-dpb-oracle
  av1lw-frame-header-oracle:
    text: Every syntax element of every frame header that ffmpeg's trace_headers prints equals the parser's
      value, and every header has the length ffmpeg read, for 32 stream configurations written by SVT-AV1,
      libaom (through ffmpeg and through aomenc) and rav1e, with headers parsed against the reference
      state the parser maintains itself.
    scope:
      milestone: av1-decode-linux-windows
      platform: &id003
      - linux
      - windows
    verified_by:
    - av1lw-frame-header-trace-test
