id: milestone:audio-media-foundation
type: milestone
title: Audio codecs on Windows through Media Foundation (AAC decode and encode, Opus decode)
summary: 'Requested on 2026-10-14 ("つぎはWindows/Linux/Android対応をお願いします"). internal/mediafoundation gained
  an audio half that drives the system''s synchronous software transforms: the AAC decoder, the AAC encoder
  and, where one is registered, an Opus decoder (Media Foundation has no Opus encoder). Registered by
  backends_windows.go. Written on a Mac against the documentation and cross-compiled for windows/amd64
  and windows/arm64; it has not been run on Windows.'
lifecycle: active
authority: authored
aliases:
- Windows audio
- Windows音声対応
- Media Foundation audio
- AAC MFT
- MFAudioFormat_AAC
scope:
  platform: windows
  milestone: audio-media-foundation
constraints:
- 'Transforms are found with MFTEnumEx in MFT_CATEGORY_AUDIO_DECODER / MFT_CATEGORY_AUDIO_ENCODER for
  MFAudioFormat_AAC and MFAudioFormat_Opus (synchronous, local; a second try with MFT_ENUM_FLAG_UNTRUSTED_STOREMFT
  for codecs from the Store). No Direct3D device is involved. The audio GUIDs were checked against mfapi.h
  (Wine''s copy) on 2026-10-14.'
- 'AAC decoder input type: MFAudioFormat_AAC, rate and channels of the output, 16 bits, MF_MT_AAC_PAYLOAD_TYPE
  0 (raw access units), profile and level 0xFE, MF_MT_USER_DATA = the twelve bytes of HEAACWAVEINFO behind
  its WAVEFORMATEX followed by the AudioSpecificConfig. Opus decoder input type: MFAudioFormat_Opus at
  48 kHz with an OpusHead without pre-skip as user data (a guess: the transform is not documented).'
- 'Output type: of the types the decoder lists, 16-bit PCM before 32-bit float, the channel count of
  the stream before a downmix; chosen again on MF_E_TRANSFORM_STREAM_CHANGE. Frames are matched to packets
  by order through audioutil.Frames. Flush drains and then sends MFT_MESSAGE_COMMAND_FLUSH.'
- 'AAC encoder: 44100 or 48000 Hz, mono or stereo, 96, 128, 160 or 192 kbit/s (what the documentation
  of the system''s encoder lists; default 96 for mono and 128 for stereo), anything else is ErrUnsupported;
  one rate control for VBR and CBR. Output type set before the input type, the other order tried on failure.
  Input goes in one packet''s worth (1024 samples) at a time. The AudioSpecificConfig is read from the
  user data of the output type. The delay is measured with audioutil.MeasureDelay (assumed 1024 when
  that fails); a new transform per signal.'
non_goals:
- Opus encoding on Windows (no system encoder exists).
- HE-AAC encoding, 5.1 encoding, ADTS input to the decoder.
- Third-party audio transforms and DirectShow or ACM codecs.
