id: milestone:examples-player-assets
type: milestone
title: Examples - bundled sample clip, player sample, aspect-aware box and gentler shader
summary: 'The author added examples/assets/waterfall-720p-hevc.mp4 (own footage, 720x1280 portrait HEVC
  with AAC, 29.67 fps, 293 frames) because the generated test patterns were too harsh to look at. It is
  embedded (examples/assets package) and is the default input of the new examples/player (plain video
  player with seeking and a progress bar, window in the video''s aspect) and of examples/texture, whose
  cube became a box with the video''s aspect ratio and whose Kage shader was toned down for real footage.'
lifecycle: active
authority: authored
aliases:
- sample clip
- waterfall clip
- player sample
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-player-assets
constraints:
- 'The clip is embedded with go:embed (1.4 MB) so that go run ./player and go run ./texture work from any
  directory; container.NewDemuxer takes the bytes.Reader. The ebitenvideo module cannot import examples
  (it would make the two modules depend on each other), so the MP4-capable player lives in examples/player
  and ebitenvideo/example stays a raw-stream demo.'
- 'texture box: half-extents (1, aspect, 1) with aspect = clamp(h/w, 0.5, 2), so the four side faces keep
  the video''s aspect; top and bottom are square. Camera focal 0.75*h, distance 4.2 to fit a 2:1 box.'
- 'Shader amounts for real footage: barrel 0.05*r2, ripple 0.002, scanline 0.93 +- 0.07, vignette 0.25*r2
  (were 0.10 / 0.004 / 0.85 +- 0.15 / 0.45).'
- Audio tracks are ignored by the players (no AAC decoder in Ebitengine); the clip's AAC track is copied
  by convert and listed by the container tests.
non_goals:
- Audio playback, playlists, subtitles, a landscape sample clip.
acceptance:
  clip-demuxes:
    text: The embedded clip demuxes to an HEVC 720x1280 track of 293 samples at 29.6-29.7 fps with one audio
      track, PacketSource.Length 9.8-9.9 s, keyframe 0 first, and every access unit converts to Annex-B.
    scope:
      milestone: examples-player-assets
    verified_by:
    - assets-container-test
  player-plays-clip:
    text: The player opens the clip the way main does, reports 720x1280 and a length of about 9.88 s, shows
      a frame and seeks to 5 s.
    scope:
      milestone: examples-player-assets
    verified_by:
    - player-test
  box-aspect:
    text: boxMesh with aspect 2 projects a front face twice as tall as wide; aspect 1 keeps the earlier cube
      checks.
    scope:
      milestone: examples-player-assets
    verified_by:
    - mesh-test
  looks:
    text: Recorded through the texture sample, the clip appears pillarboxed in flat mode, on a tall box in
      box mode and with a barely visible curve and scanlines in shader mode.
    scope:
      milestone: examples-player-assets
    verified_by:
    - texture-clip-run
