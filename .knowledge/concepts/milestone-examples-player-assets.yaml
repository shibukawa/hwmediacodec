id: milestone:examples-player-assets
type: milestone
title: Examples - bundled sample clip, player sample, aspect-aware box and gentler shader
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:examples (keys prefixed explayer-). Original summary: The author added examples/assets/waterfall-720p-hevc.mp4
  (own footage, 720x1280 portrait HEVC with AAC, 29.67 fps, 293 frames) because the generated test patterns
  were too harsh to look at. It is embedded (examples/assets package) and is the default input of the
  new examples/player (plain video player with seeking and a progress bar, window in the video''s aspect)
  and of examples/texture, whose cube became a box with the video''s aspect ratio and whose Kage shader
  was toned down for real footage.'
lifecycle: superseded
authority: authored
aliases:
- sample clip
- waterfall clip
- player sample
