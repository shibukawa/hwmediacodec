id: milestone:examples-webrtc
type: milestone
title: Examples - Ebitengine game streamed to browsers over WebRTC (pion)
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:capture, component:examples, component:net-webrtc (keys prefixed exwebrtc-). Original
  summary: Fourth usage-sample slice: examples/webrtc fans the screencast recorder''s H.264 packets out
  to one pion TrackLocalStaticSample per browser viewer, signals with a single HTTP POST of the SDP offer
  (answer after ICE gathering, no trickle), turns viewer joins and RTCP PLI/FIR into Recorder.RequestKeyframe
  calls and starts each viewer at a keyframe. Verified with pion as the viewer in tests and with a Chromium
  browser pane playing the live 1280x720 stream.'
lifecycle: superseded
authority: authored
