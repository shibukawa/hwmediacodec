id: milestone:examples-webrtc
type: milestone
title: Examples - Ebitengine game streamed to browsers over WebRTC (pion)
summary: 'Fourth usage-sample slice: examples/webrtc fans the screencast recorder''s H.264 packets out
  to one pion TrackLocalStaticSample per browser viewer, signals with a single HTTP POST of the SDP offer
  (answer after ICE gathering, no trickle), turns viewer joins and RTCP PLI/FIR into Recorder.RequestKeyframe
  calls and starts each viewer at a keyframe. Verified with pion as the viewer in tests and with a Chromium
  browser pane playing the live 1280x720 stream.'
lifecycle: active
authority: authored
aliases:
- WebRTC sample
- pion broadcast
- WebRTC 配信
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: examples-webrtc
constraints:
- 'pion''s H.264 payloader takes Annex-B access units as they come from hwmediacodec: it splits on start
  codes, packs SPS/PPS into STAP-A, fragments large NAL units into FU-A and drops AUD and filler NAL units.'
- 'The track is offered as H.264 Constrained Baseline, packetization-mode 1 (profile-level-id 42e01f);
  the encoder is opened with ProfileBaseline, WithLowLatency and no B-frames; the keyframe interval is
  4 s because joiners get a keyframe on demand.'
- 'Recorder.RequestKeyframe sets ForceKeyframe on the next captured frame (atomic flag); the broadcaster
  calls it when a peer registers and when the RTP sender reads a PictureLossIndication or FullIntraRequest.'
- 'Sample.Duration is the PTS gap at 90 kHz (first sample 1/fps), which is how TrackLocalStaticSample advances
  the RTP timestamp; peers that fail, disconnect or close are removed, a failed WriteSample removes the peer.'
- 'Capture counts a frame only once it is queued (a frame that found a free buffer but no queue slot used to
  be counted as both captured and dropped); VideoToolbox may still skip frames under bursts, so packets <=
  captured.'
non_goals:
- Audio, simulcast, TURN relays, data channels, HEVC/AV1 over WebRTC, trickle ICE, authentication.
acceptance:
  loopback-delivery:
    text: A pion viewer that posts an offer to /offer and receives the track gets, through pion's sample
      builder, access units equal NAL unit by NAL unit (ignoring AUD/filler) to the ones written, in
      order, all but possibly the last; written out as a raw stream they decode with ffmpeg to the source's
      frame MD5s; joining triggers a keyframe request and a PLI from the viewer triggers another.
    scope:
      milestone: examples-webrtc
    verified_by:
    - broadcaster-test
  start-at-keyframe:
    text: A viewer connected while the stream is in the middle of a GOP receives nothing until the next
      keyframe, which is its first access unit.
    scope:
      milestone: examples-webrtc
    verified_by:
    - broadcaster-test
  keyframe-request:
    text: RequestKeyframe makes the next captured frame a keyframe (keyframes at 0, 10, 20 for requests
      before captures 10 and 20 with a 300-frame interval).
    scope:
      milestone: examples-webrtc
    verified_by:
    - recorder-keyframe-test
  browser-playback:
    text: A Chromium browser connects through the page at /, receives 1280x720 H.264 at the game's frame
      rate with no packet loss, and the decoded picture shows the scene.
    scope:
      milestone: examples-webrtc
    verified_by:
    - webrtc-live-run
