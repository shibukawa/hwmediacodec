id: backend:webcodecs
type: backend
title: Browser WebCodecs (syscall/js)
summary: The one codec API a web page has. VideoDecoder and VideoEncoder are full codecs behind which
  the browser puts the platform's engine (VideoToolbox, Media Foundation, VA-API, MediaCodec); the
  backend in internal/webcodecs drives them through syscall/js in a GOOS=js GOARCH=wasm build, the
  target Ebitengine builds for the web.
lifecycle: proposed
authority: inferred
aliases:
- WebCodecs
- VideoDecoder
- VideoEncoder
- browser backend
- ブラウザ対応
- GOOS=js
- wasm
scope:
  platform: js
