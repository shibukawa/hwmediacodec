id: milestone:screencast-package
type: milestone
title: screencast - the screen recorder as a package of the core module
summary: 'screencast.Recorder moved from the examples module (examples/screencast) to the core module
  as github.com/shibukawa/hwmediacodec/screencast, next to annexb and ivf, so that it is a supported feature
  with the core module''s version instead of sample code. The package depends on hwmediacodec only: Source
  is Bounds()+ReadPixels() (satisfied by *ebiten.Image without importing Ebitengine) and Sink is WritePacket+Close.
  The one sink that needed mp4ff, NewMP4File, stayed in the examples module as container.CreateVideoFile.'
lifecycle: active
authority: authored
aliases:
- screencast package
- screen recorder
- 画面録画パッケージ
- screencast 正式機能化
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: screencast-package
constraints:
- 'The core module keeps its two dependencies (purego, x/sys): nothing in screencast imports Ebitengine,
  mp4ff or pion. Container and transport sinks live with their dependencies (examples/container.VideoFile
  and Segmenter, examples/webrtc.Broadcaster) and satisfy screencast.Sink structurally.'
- 'A subpackage, not the root package: the root package is the codec API (Decoder, Encoder, Probe) and
  the recorder is a consumer of it, like annexb and ivf are helpers around it. Recorder, Options and Sink
  in package hwmediacodec would have needed prefixed names (NewRecorder, RecorderOptions).'
- 'Packets go from the encoder goroutine straight into Sink.WritePacket in memory; no file is involved
  unless the sink is one. The WebRTC sample hands each access unit to pion''s TrackLocalStaticSample and
  the HLS sample segments in memory.'
- 'The package tests cannot use an MP4 muxer, so TestRecorderEncodes collects the packets through Funcs,
  checks PTS steps on the packets themselves and lets ffmpeg decode the concatenated Annex-B stream; the
  MP4-level check (ffprobe frame count, duration, PTS steps) is TestVideoFileRecordsScreencast in examples/container.'
- 'examples/go.mod still requires hwmediacodec v0.1.0, which has no screencast package: the workspace
  (go.work) hides that in a clone, but go run ...examples/record@latest needs a core release that contains
  the package, then the require line bumped and an examples tag.'
non_goals:
- Capturing the operating system's screen or a window from outside the process (ScreenCaptureKit, DXGI,
  PipeWire); the recorder encodes pixels the caller hands it.
- Audio capture and container formats in the core module.
acceptance:
  recorder-core:
    text: Sixty frames of a synthetic screen captured at 30 fps (two captures per slot) reach the sink
      as 60 packets starting with a keyframe, PTS steps of 3000 at 90 kHz, 2 s duration, no drops, the
      sink closed; ffmpeg decodes the Annex-B stream to 60 pictures and the first matches the first captured
      image within 30 dB (8x8-block PSNR).
    scope:
      milestone: screencast-package
    verified_by:
    - recorder-core-test
  recorder-keyframe-drops:
    text: RequestKeyframe yields keyframes exactly at the requested captures, and with a queue of two frames
      every capture is either encoded or counted as dropped.
    scope:
      milestone: screencast-package
    verified_by:
    - recorder-core-test
  no-new-dependencies:
    text: The core module builds on its own (GOWORK=off) with an unchanged go.mod, and go list -deps ./screencast
      shows only the standard library, purego, x/sys and packages of the module; go vet passes for linux
      and windows.
    scope:
      milestone: screencast-package
    verified_by:
    - deps-check
  samples-follow:
    text: record, texture, hls and webrtc build against the moved package; the MP4 sink test passes in
      examples/container and the record app still writes a playable 1280x720 file.
    scope:
      milestone: screencast-package
    verified_by:
    - videofile-test
    - record-run
