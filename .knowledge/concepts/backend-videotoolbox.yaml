open_questions:
  m2-pixel-buffer-copy-cost:
    text: Input frames are copied into a pool CVPixelBuffer (about 3 MB per 1080p frame). Is the copy
      or the hardware the limit at ~200 fps 1080p, and is a zero-copy path (CVPixelBufferCreateWithPlanarBytes
      or IOSurface) worth it?
    state: deferred
    resolution: 'Deferred: 200 fps exceeds the batch-transcode need today. Revisit when a profile shows
      the copy dominating or when the Ebitengine path needs RGBA input.'
    scope:
      platform: darwin
      gpu: apple-silicon
  m2-avcc-output:
    text: Should the encoder offer AVCC/HVCC output and expose the parameter sets separately for MP4/fMP4
      muxing?
    state: deferred
    resolution: Deferred to the HLS/packaging prototype; the Annex-B output plus annexb.Split is enough
      until a muxer consumer exists.
    scope:
      platform: darwin
      gpu: apple-silicon
  dor-untagged-hd-colour-matrix:
    text: VideoToolbox converted untagged 320x240 streams to RGB with BT.601. Which matrix it assumes
      for untagged HD streams (and whether ffmpeg agrees) is not measured.
    state: answered
    resolution: 'Measured on 2026-10-10 (milestone:decoder-rgb-conversion): VideoToolbox converts untagged
      pictures wider than 704 or taller than 576 with BT.709 and smaller ones with BT.601, and follows
      a named matrix at any size; internal/pixconv applies the same rule on the other backends.'
    scope:
      platform: darwin
      gpu: apple-silicon
  av1mac-software-av1-on-m1-m2:
    text: On an M1 or M2, NewDecoder(AV1, WithSoftwareFallback()) runs av1SessionAvailable, which on the
      M3 with hardware decoding disabled fails with kVTCouldNotFindVideoDecoderErr. The M1/M2 behaviour
      itself is inferred from that measurement, not observed.
    state: open
    resolution: Run TestUnsupportedCodec and NewDecoder(AV1, WithSoftwareFallback()) on an M1 or M2 Mac;
      if VideoToolbox does hand out its software AV1 decoder there, the decoder works unchanged and only
      the README sentence needs a correction.
    scope:
      platform: darwin
      gpu: apple-silicon
  av1mac-av1-colour-tags:
    text: Only untagged streams were measured for RGB conversion (VideoToolbox assumed BT.601, as for
      H.264 at 320x240). Whether it reads color_config from av1C for tagged streams (BT.709, BT.2020)
      is not measured.
    state: open
    resolution: Encode a tagged stream (-color_primaries bt709 -color_trc bt709 -colorspace bt709) and
      compare RGB output with ffmpeg's BT.709 conversion; if VideoToolbox ignores the tags, add the kCMFormatDescriptionExtension_ColorPrimaries/TransferFunction/YCbCrMatrix
      extensions from the parsed sequence header.
    scope:
      platform: darwin
      gpu: apple-silicon
  av1mac-film-grain:
    text: What VideoToolbox does with film_grain_params_present streams (grain synthesis in hardware,
      and whether output is then deterministic) is not measured; the tests encode with film-grain=0.
    state: deferred
    resolution: Deferred until a consumer needs film grain; libdav1d applies grain by default, so a comparison
      would need -filmgrain 0 on the ffmpeg side or a PSNR check.
    scope:
      platform: darwin
      gpu: apple-silicon
  exheif-encoder-odd-sizes:
    text: Should the VideoToolbox encoder (and the Encoder contract) handle odd picture sizes itself,
      by padding and writing the conformance window / clean aperture, instead of silently rounding down?
    state: open
    resolution: Observed on the M3 with the HEVC encoder (321x203 -> SPS 320x202). Left to the consumer
      for now and documented in the README; a library fix would pad the pixel buffer and set kVTCompressionPropertyKey_CleanAperture
      or write the SPS conformance window.
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  libraries:
  - /System/Library/Frameworks/VideoToolbox.framework/VideoToolbox
  - /System/Library/Frameworks/CoreMedia.framework/CoreMedia
  - /System/Library/Frameworks/CoreVideo.framework/CoreVideo
  - /System/Library/Frameworks/CoreFoundation.framework/CoreFoundation
  api_model: full decoder/encoder (no application-side DPB management)
  key_calls:
    decode:
    - CMVideoFormatDescriptionCreateFromH264ParameterSets
    - CMVideoFormatDescriptionCreateFromHEVCParameterSets
    - CMVideoFormatDescriptionCreate ('av01' for AV1, with the av1C record under the SampleDescriptionExtensionAtoms
      extension)
    - VTDecompressionSessionCreate
    - VTDecompressionSessionDecodeFrame
    - VTDecompressionSessionWaitForAsynchronousFrames
    - VTDecompressionSessionInvalidate
    encode:
    - VTCompressionSessionCreate
    - VTSessionSetProperty
    - VTCompressionSessionPrepareToEncodeFrames
    - VTCompressionSessionEncodeFrame
    - VTCompressionSessionCompleteFrames
    probe:
    - VTIsHardwareDecodeSupported
    - VTCopySupportedPropertyDictionaryForEncoder
    - VTCopyVideoEncoderList
  input_format: AVCC/HVCC length-prefixed NAL units in a CMSampleBuffer; Annex-B must be converted; parameter
    sets go in the format description.
  output_format: CVPixelBuffer, typically NV12 ('420v'/'420f') or BGRA on request ('RGBA' is accepted
    at session creation but fails at decode time with -6680); encoder returns CMSampleBuffer with AVCC
    data and parameter sets in the format description.
  ffi_notes:
  - Plain C functions plus CoreFoundation types; purego.Dlopen + RegisterLibFunc work; callbacks via purego.NewCallback.
  - CFRelease discipline for every returned CF object; use CFRetain when a buffer outlives the callback.
  - Output callback runs on a VideoToolbox thread; copy or retain inside the callback and hand off to
    a Go channel.
  - purego v0.11.1 passes CMTime by value (24-byte struct) to VTCompressionSessionEncodeFrame and CompleteFrames
    on darwin/arm64 and amd64.
  - The compression callback is invoked on a VideoToolbox thread; purego.NewCallback + fakecgo handle
    it with CGO_ENABLED=0 (verified 2026-10-09).
  quirks:
  - Encoder buffers frames; a forced-keyframe property must be set until output appears.
  - Session must be recreated when SPS/PPS change.
  - Global registry state makes concurrent session creation racy; serialize creation.
  - Hardware availability differs between Apple Silicon and Intel Macs; software fallback exists inside
    VideoToolbox unless kVTVideoDecoderSpecification_RequireHardwareAcceleratedVideoDecoder is set.
  - Temporal processing flag did not produce display-order output for H.264/HEVC with correct PTS (sync
    and async tried, 2026-10-09, M3); reorder in Go.
  - Encoder output samples never contain parameter sets; fetch them from the format description with CMVideoFormatDescriptionGet{H264,HEVC}ParameterSetAtIndex
    (verified 2026-10-09).
  - EnableLowLatencyRateControl implies an infinite GOP, no reordering and High profile; enforce a GOP
    from the application with ForceKeyFrame.
  - RealTime=true did not reduce throughput on an M3 (2026-10-09); it is a scheduling hint, not a pacing
    control.
  - A forced keyframe after VTCompressionSessionCompleteFrames keeps a reused session decodable from the
    first new packet.
  - Pixel buffers of type 'RGBA' are rejected at use (kCVReturnInvalidPixelFormat -6680) both as decompression
    destination and as CVPixelBufferCreate format; use BGRA and swap in Go (verified 2026-10-09).
  - VTCompressionSessionGetPixelBufferPool must be called per frame - with BGRA source attributes the
    pool is replaced after the first frame and a cached pool crashes. Buffers created with CVPixelBufferCreate
    need kCVPixelBufferIOSurfacePropertiesKey, otherwise the encoder's pixel transfer fails with -12905.
  - The encoder converts BGRA input with BT.709 and writes no colour description unless kVTCompressionPropertyKey_ColorPrimaries/TransferFunction/YCbCrMatrix
    are set; the decoder converts untagged 320x240 output with BT.601 (verified 2026-10-09).
  - The hardware H.264 encoder writes no VUI bitstream_restriction (pic_order_cnt_type 0), so a spec-exact
    reorder buffer holds its streams back by the DPB size; the HEVC encoder writes sps_max_num_reorder_pics.
  - The hardware decoder rejects 64x48 pictures with kVTVideoDecoderMalfunctionErr (-12911); 96x64 works.
  - AV1 needs a format description built with CMVideoFormatDescriptionCreate('av01', w, h, extensions),
    where extensions maps kCMFormatDescriptionExtension_SampleDescriptionExtensionAtoms to a dictionary
    whose "av1C" entry is the ISOBMFF AV1CodecConfigurationRecord (CFData) with the sequence header OBU
    as configOBUs. A whole temporal unit is one sample; temporal delimiter OBUs may stay in or be stripped
    (same output, M3, 2026-10-09).
  - VTIsHardwareDecodeSupported('av01') is 1 on the M3 without VTRegisterSupplementalVideoDecoderIfAvailable,
    and that call changes nothing for AV1 (VP9 stays 0 even after registering it).
  - macOS 26 lists "SW AV1 Decoder" (com.apple.videotoolbox.videodecoder.av1.sw) in VTCopyVideoDecoderList
    but a session with EnableHardwareAcceleratedVideoDecoder=false fails with -12906, as does naming the
    DecoderID, so WithSoftwareFallback cannot deliver AV1 on M1/M2.
  - The AV1 decoder converts Main profile 10-bit pictures to '420v' (8-bit) itself, within 53.5 dB of
    ffmpeg's conversion; 8-bit AV1 output is bit-exact with libdav1d, and one temporal unit yields exactly
    one frame in presentation order (show_existing_frame units output the hidden frame).
  evidence:
  - url: https://pkg.go.dev/github.com/go-macos/videotoolbox
    claim: Pure Go purego-based H.264/HEVC hardware decoding on macOS.
  - url: https://pkg.go.dev/github.com/tmc/apple/videotoolbox
    claim: Go bindings exposing VTCompressionSession and VTDecompressionSession.
  - url: https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/apple
    claim: Hardware AV1 decoding on Apple Silicon starts with the M3 generation.
  - url: https://searchfox.org/mozilla-central/source/dom/media/platforms/apple/AppleDecoderModule.cpp
    claim: Firefox calls VTRegisterSupplementalVideoDecoderIfAvailable (macOS 11+) before probing VP9/AV1
      hardware decode.
  codec_support_by_hardware:
    note: Inferred from public sources; confirm with VTIsHardwareDecodeSupported / VTCopyVideoEncoderList
      on the target machine.
    apple-silicon-m1-m2:
      decode_hw:
      - h264
      - hevc
      - vp9 (after VTRegisterSupplementalVideoDecoderIfAvailable, macOS 11+)
      - prores (Pro/Max/Ultra)
      encode_hw:
      - h264
      - hevc
      - prores
      av1: software decode only; no hardware encode
    apple-silicon-m3-and-later:
      decode_hw:
      - h264
      - hevc
      - vp9 (same registration call; VTIsHardwareDecodeSupported('vp09') stayed 0 on the author's M3 even
        after it)
      - av1 (verified 2026-10-09 on the author's M3, milestone:darwin-av1-decode)
      - prores
      encode_hw:
      - h264
      - hevc
      - prores
      av1_encode: none in hardware
    intel-mac:
      decode_hw:
      - h264
      - hevc (2017+ Macs, Kaby Lake or newer)
      encode_hw:
      - h264
      - hevc (2017+)
      av1_vp9: no hardware
      note: VideoToolbox abstracts the Intel iGPU/AMD dGPU; same API. macOS 26 is reported as the last
        release supporting Intel Macs.
  ios:
    build: GOOS=ios with CGO_ENABLED=1 and Xcode's clang (purego has no cgo-free mode on iOS); the darwin
      build constraint covers ios so the same files compile; frameworks dlopen from the same /System/Library/Frameworks
      paths (verified in the Simulator, iOS 26).
    optional_symbols:
      kVTVideoDecoderSpecification_RequireHardwareAcceleratedVideoDecoder: ios 17.0
      kVTVideoDecoderSpecification_EnableHardwareAcceleratedVideoDecoder: ios 17.0
      kVTVideoEncoderSpecification_RequireHardwareAcceleratedVideoEncoder: ios 17.4
      kVTVideoEncoderSpecification_EnableHardwareAcceleratedVideoEncoder: ios 17.4
      kVTVideoEncoderSpecification_EnableLowLatencyRateControl: ios 14.5
      kVTCompressionPropertyKey_ConstantBitRate: ios 16.0
      VTRegisterSupplementalVideoDecoderIfAvailable: ios 26.2
      note: bound with optPtrConst; an absent hardware key leaves the specification empty (every iOS codec
        is hardware). Everything else the backend binds is iOS 11 or older (iOS 27.0 SDK headers, 2026-10-11).
    background: iOS invalidates the sessions of a background application (kVTInvalidSessionErr -12903
      from every call); internal/videotoolbox/invalidation.go reopens the session - the decoder resumes
      at the next keyframe (or the triggering packet when it is one), the encoder forces a keyframe. Tested
      on macOS by invalidating by hand.
    simulator: no hardware decoder (VTIsHardwareDecodeSupported is 0, WithSoftwareFallback needed); the
      encoders accept RequireHardwareAcceleratedVideoEncoder and are listed as hardware; output valid
      (ffmpeg, about 49 dB PSNR). CLI decode output bit-identical to the Mac's hardware decode.
    hardware_status: not yet run on an iPhone (milestone:ios-videotoolbox, iphone-run not_run).
  support_tier: tier1
  scope_note: Intel Macs are out of scope; the Intel Mac facts remain as reference only.
  implementation:
    package: internal/videotoolbox (backend.go, decoder.go, paramsets.go) and internal/videotoolbox/sys
      (purego bindings)
    decode_mode: synchronous (VTDecodeFrameFlags = 0); output callback runs on the calling thread before
      DecodeFrame returns; frames in decode order
    output: CVPixelBuffer '420v' (NV12) or 'BGRA' (BGRA, and RGBA after an R/B swap in Go) copied into
      Go-owned planes with tight rows; buffers pooled and returned via Frame.Release; display order comes
      from the backend-independent internal/reorder layer (the backend only carries codec.Order through
      sourceFrameRefCon)
    callback: one purego.NewCallback shared by all decoders; decoders found via integer refcon; CFRetain
      inside the callback, CFRelease after copy
    session_policy: RequireHardwareAcceleratedVideoDecoder unless WithSoftwareFallback; recreate session
      when any SPS/PPS/VPS changes; skip until keyframe after creation and after Flush
    performance: ~834 fps for 1080p H.264 (no B-frames) on M3 including the CPU copy
    encode_mode: VTCompressionSessionEncodeFrame is asynchronous; the output callback runs on a VideoToolbox
      thread, retains the CMSampleBuffer and Receive converts it to an Annex-B Packet on the caller goroutine
    encode_input: NV12 ('420v') or BGRA CVPixelBuffers from VTCompressionSessionGetPixelBufferPool (looked
      up per frame) or, when the pool is exhausted, IOSurface-backed CVPixelBufferCreate; filled by a
      row copy from the caller's planes, swapping R/B for RGBA input; RGB input sets the 709 colour properties
    encode_properties: RealTime (true in low-latency mode), AllowFrameReordering (B-frames), ProfileLevel,
      ExpectedFrameRate, AverageBitRate or ConstantBitRate (macOS 13+), Quality (float), MaxKeyFrameInterval;
      ForceKeyFrame per frame
    encode_performance: ~207 fps H.264 and ~186 fps HEVC at 1080p on M3 including the input copy; low-latency
      rate control ~25-40% slower
    encode_probe: VTCopySupportedPropertyDictionaryForEncoder with RequireHardwareAcceleratedVideoEncoder
    av1_decode: internal/videotoolbox/av1.go - sendAV1 parses the temporal unit with internal/av1, builds
      av1C and the format description on a new sequence header, waits for a shown key frame after creation
      and Flush, passes the unit unchanged to decodePacket; OutputsDisplayOrder() is true for AV1 so the
      public API skips the reorder layer; Probe uses VTIsHardwareDecodeSupported('av01'); NewDecoder with
      WithSoftwareFallback probes a session (av1SessionAvailable) and reports ErrUnsupported when none
      can be made
    av1_performance: ~820 fps for 1080p AV1 to NV12, ~310 to BGRA, ~220 to RGBA on an M3 (SVT-AV1 preset
      10 stream, 300 frames, 2026-10-09)
  milestone_notes:
    m1:
      steps:
      - Module layout; public types; ErrUnsupported; stub backends for non-darwin GOOS.
      - internal/videotoolbox/sys - purego bindings for VideoToolbox, CoreMedia, CoreVideo and CoreFoundation
        functions used by decode.
      - Annex-B splitter, SPS/PPS capture, AVCC conversion, CMVideoFormatDescriptionCreateFromH264ParameterSets.
      - VTDecompressionSession with a Go callback (purego.NewCallback); copy CVPixelBuffer planes into
        Frame; ordered output by PTS.
      - Test helper that generates testdata with ffmpeg (testsrc, libx264, h264_mp4toannexb) and computes
        reference checksums; skip when ffmpeg is absent.
      - Probe() for darwin via VTIsHardwareDecodeSupported / VTCopySupportedPropertyDictionaryForEncoder.
    m2:
      implementation:
        package: internal/videotoolbox/encoder.go plus bindings in internal/videotoolbox/sys/sys_encode.go
        session: VTCompressionSessionCreate with Require/EnableHardwareAcceleratedVideoEncoder and optional
          EnableLowLatencyRateControl; properties RealTime, AllowFrameReordering, ProfileLevel, ExpectedFrameRate,
          AverageBitRate or ConstantBitRate, Quality, MaxKeyFrameInterval; PrepareToEncodeFrames; pixel
          buffers from VTCompressionSessionGetPixelBufferPool
        callback: one purego.NewCallback shared by all encoders; encoders found by integer refcon; sourceFrameRefCon
          carries the input PTS; samples CFRetained in the callback and converted in Receive
        conversion: CMBlockBufferCopyDataBytes -> walk NAL length prefixes (size from CMVideoFormatDescriptionGet*ParameterSetAtIndex)
          -> Annex-B; keyframe detected from NAL types; parameter sets cached per format description (retained)
        keyframes: kVTEncodeFrameOptionKey_ForceKeyFrame on Frame.ForceKeyframe, on the first frame after
          Flush and on every KeyframeInterval-th frame counted from start/Flush (so low-latency mode,
          whose GOP is infinite, still honours the interval)
        backpressure: Send returns ErrAgain when 64 packets are waiting; Flush = VTCompressionSessionCompleteFrames(kCMTimeInvalid),
          blocking
        probe: 'VTCopySupportedPropertyDictionaryForEncoder(1920, 1080, codec, {RequireHardwareAcceleratedVideoEncoder:
          true}) == noErr'
    dor:
      implementation:
        videotoolbox_decode: destination pixel format from the requested output format; RGBA is decoded
          as BGRA and swapped in Go (swapRB) because 'RGBA' destinations fail at decode time with -6680;
          copyFrame is generic over PlaneLayout via bufferPlanes
        videotoolbox_encode: source pixel buffer attributes from the input format; RGBA input is swapped
          into BGRA buffers; the session's pixel buffer pool is looked up on every frame (VideoToolbox
          replaces it after the first RGB frame) and exhausted pools fall back to IOSurface-backed CVPixelBufferCreate;
          ColorPrimaries/TransferFunction/YCbCrMatrix set to ITU-R 709 for RGB input
    av1mac:
      implementation:
        videotoolbox: internal/videotoolbox/av1.go - sendAV1 parses the unit, rebuilds the session on
          a new sequence header (CMVideoFormatDescriptionCreate with 'av01', max_frame_width/height and
          an extensions dictionary whose SampleDescriptionExtensionAtoms entry holds the av1C record as
          CFData), skips until a shown key frame after creation and Flush, and hands the whole unit (temporal
          delimiters included) to VTDecompressionSessionDecodeFrame; decoder.go now branches Send by codec
          (sendAnnexB / sendAV1) and shares decodePacket; OutputsDisplayOrder() returns true for AV1
        probe: backend.go lists AV1 decode from VTIsHardwareDecodeSupported('av01'), never asks the encoder
          property dictionary for 'av01'; NewDecoder(AV1) without hardware returns UnsupportedError, with
          WithSoftwareFallback only after av1SessionAvailable(true) fails
        sys: CFDataCreate, CMVideoFormatDescriptionCreate and kCMFormatDescriptionExtension_SampleDescriptionExtensionAtoms
          added; CFData helper
        tests: testutil.GenerateAV1 (ffmpeg -f lavfi testsrc2 -c:v libsvtav1 -preset 10 -g 25 -svtav1-params
          film-grain=0 -f ivf), HasDecoder, containerFormat/decoderArgs (ivf + libdav1d); decode_test.go
          splits packets with splitStream (annexb or ivf) and joins streams with concatStreams (ivf.Writer
          for AV1)
  known_risks:
  - VideoToolbox session creation uses global encoder/decoder registry state; serialize session creation.
  - purego callback ABI on arm64 vs amd64 must be covered by CI on both.
  - Intel Macs are out of scope, so tests may assume Apple Silicon hardware paths; still compare against
    the same machine's ffmpeg output rather than fixed golden hashes because hardware decoders are not
    required to be bit-exact.
