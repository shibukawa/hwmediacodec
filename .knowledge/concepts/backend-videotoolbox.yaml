acceptance:
  m1-decode-reference:
    text: Decoding testdata/*.h264 produces the same frame count and per-frame NV12 checksums as ffmpeg
      -c:v h264 -f rawvideo -pix_fmt nv12 (software decode) within the tolerance of bit-exact output.
    scope:
      milestone: m1
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m1-decode-reference-test
  m1-probe-darwin:
    text: Probe() on an Apple Silicon Mac reports backend videotoolbox with decode h264 and hevc; on a
      machine without VideoToolbox the backend is absent and no error is returned.
    scope:
      milestone: m1
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m1-probe-test
  m1-parameter-set-change:
    text: A stream whose SPS/PPS change mid-way (resolution change) is decoded by recreating the session,
      with no frames lost before the change.
    scope:
      milestone: m1
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m1-sps-change-test
  m1-cross-build:
    text: GOOS=linux and GOOS=windows builds of the module succeed with CGO_ENABLED=0 (backends compile
      to stubs that report absent).
    scope:
      milestone: m1
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m1-cross-build-check
  m2-encode-decodable:
    text: ffmpeg decodes the encoded stream to the same frame count as the source and every frame has
      luma PSNR of at least 30 dB against the source.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-encode-reference-test
  m2-inband-parameter-sets:
    text: Every keyframe packet carries SPS/PPS (and VPS for HEVC) in band and Packet.Keyframe agrees
      with ffprobe key_frame.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-encode-reference-test
  m2-keyframe-control:
    text: WithKeyframeInterval(n) produces a keyframe at every n-th frame; Frame.ForceKeyframe produces
      a keyframe at that frame and nowhere else.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-keyframe-interval-test
    - m2-force-keyframe-test
  m2-rate-control:
    text: A higher VBR bitrate yields a proportionally larger stream, CBR holds the target bitrate, and
      quality mode trades size for PSNR.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-bitrate-test
    - m2-quality-test
  m2-bframes-and-low-latency:
    text: WithBFrames yields B-frames delivered in decode order with monotonic DTS; WithLowLatency yields
      no B-frames, honours the keyframe interval and decodes correctly.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-bframes-test
    - m2-low-latency-test
  m2-profiles:
    text: WithProfile selects Baseline/Main/High for H.264 and Main for HEVC as reported by ffprobe; undefined
      combinations report ErrUnsupported.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-profile-test
  m2-transcode-roundtrip:
    text: Hardware decode of a hardware-encoded stream reproduces the source frames (luma PSNR of at least
      30 dB).
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-transcode-test
  m2-probe-encode:
    text: Probe() on Apple Silicon reports videotoolbox encode for h264 and hevc with hardware=true.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-probe-test
  m2-cross-build:
    text: CGO_ENABLED=0 go build ./... succeeds for darwin, linux and windows on amd64 and arm64.
    scope:
      milestone: m2
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - m2-cross-build-check
  dor-rgba-output:
    text: WithOutputFormat(RGBA|BGRA) returns one tightly packed plane, alpha 255, RGBA the exact byte
      mirror of BGRA, within 30 dB (8x8-block PSNR) of ffmpeg's conversion for H.264 and HEVC.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-rgba-decode-test
  dor-rgb-input:
    text: WithInputFormat(RGBA|BGRA) encodes packed frames; the stream declares the BT.709 matrix the
      hardware converted with, and ffmpeg's RGB decode of it is within 35 dB (8x8-block PSNR) of the source.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-rgb-encode-test
  av1mac-av1-bit-exact:
    text: Decoding an SVT-AV1 8-bit 4:2:0 IVF stream (320x240, 60 frames, keyframe every 25, hidden alternate
      reference frames shown later through show_existing_frame) to NV12 yields exactly libdav1d's frames,
      one frame per temporal unit in order, each carrying its packet's PTS, and the frame count equals
      ffmpeg's.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-reference-test
  av1mac-av1-temporal-delimiters-optional:
    text: The same kind of stream with the temporal delimiter OBUs removed from every unit decodes to
      identical frames.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-no-td-test
  av1mac-av1-rgba:
    text: WithOutputFormat(RGBA|BGRA) on AV1 returns tightly packed frames within 30 dB (8x8-block PSNR)
      of ffmpeg's BT.601 conversion, alpha 255, RGBA the exact mirror of BGRA.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-rgba-test
  av1mac-av1-sequence-change:
    text: Two IVF streams of different sizes (320x240 then 160x120) written into one IVF file decode as
      60 frames of the right sizes matching ffmpeg's frames; the session is recreated at the new sequence
      header.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-sequence-change-test
  av1mac-av1-flush-resume:
    text: After Flush, Receive returns io.EOF; a non-key temporal unit is then skipped without error and
      decoding resumes at a key temporal unit; garbage input is ErrInvalidData; WithDecodeOrder returns
      the same frames in the same order.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-flush-resume-test
    - av1mac-av1-decode-order-noop-test
  av1mac-av1-ten-bit:
    text: A Main profile 10-bit stream decodes with NV12 requested - VideoToolbox converts to 8-bit, every
      frame within 45 dB PSNR of ffmpeg's conversion, and BGRA output works as well.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-av1-ten-bit-test
  av1mac-probe-and-unsupported:
    text: Probe lists videotoolbox av1 decode hardware=true on the M3; NewEncoder(AV1) and NewDecoder
      of an unknown codec return *UnsupportedError, as does NewDecoder(AV1) where Probe lists no AV1 hardware.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-probe-test
  av1mac-builds:
    text: go test ./... and CGO_ENABLED=0 go test ./... pass, scripts/crossbuild.sh builds every target,
      and the ebitenvideo module still builds.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-build-check
  ios-ios-builds:
    text: The module builds for ios/arm64 (device), ios/arm64 and ios/amd64 (Simulator) with CGO_ENABLED=1
      through scripts/mobilebuild.sh, and go vet passes on the videotoolbox packages for ios/arm64.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-mobilebuild-script
  ios-android-excludes-linux-backends:
    text: GOOS=android go list -deps of the root package lists no vaapi, vpl or nvidia package; the only
      remaining Android build error is purego's own cgo requirement.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-android-deps-check
  ios-simulator-probe-decode-encode:
    text: The hwmediacodec CLI built for the Simulator, run with xcrun simctl spawn, lists h264 and hevc
      encode (hardware) and no decoder; decodes a 30-frame B-frame H.264 stream with -software to NV12
      and RGBA with per-frame SHA-256 and display order identical to the Mac's hardware decode; encodes
      10 NV12 frames to H.264 (ffprobe reads 10 frames, luma PSNR about 49.6 dB) and HEVC (10 frames);
      transcodes the H.264 stream to HEVC (30 frames).
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-simulator-cli-run
  ios-session-invalidation-recovery:
    text: With the live session invalidated by hand after 30 of 60 packets, Send keeps returning nil,
      frames 0-29 and 50-59 match ffmpeg's and frames 30-49 are skipped; invalidated right before a keyframe,
      all 30 frames come out; an encoder invalidated after 20 of 40 frames emits every frame, the frame
      that hit the error as a keyframe, and ffmpeg decodes the resulting stream in full.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-invalidation-tests
  ios-mobile-sample:
    text: examples/mobile binds with ebitenmobile into Mobile.xcframework (device and Simulator slices),
      the Xcode project builds for the Simulator with xcodebuild, installs and launches there showing
      the clip, and go test ./mobile opens the bundled clip on the Mac.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-mobile-sample-build
  ios-iphone-run:
    text: On an iPhone the app's top line reads ios/arm64 videotoolbox with h264/hevc decode and encode
      (av1 decode from the A17 Pro on), the clip plays in hardware, and it keeps playing after the app
      is sent to the background and brought back.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-iphone-run
  ios-existing-suites:
    text: go test ./... (whole workspace), CGO_ENABLED=0 go test . and scripts/crossbuild.sh pass on the
      Mac after the change.
    scope:
      milestone: ios-videotoolbox
      platform:
      - ios
      - darwin
      gpu: apple-silicon
    verified_by:
    - ios-existing-suites
