  learned:
  - 'purego handles every call needed: dlopen of system frameworks, CF constants via Dlsym + pointer deref,
    9-argument CoreMedia calls (stack args), and a NewCallback invoked by VideoToolbox; declaring only
    the first five callback parameters and ignoring the trailing CMTime values works on arm64.'
  - Synchronous VTDecompressionSessionDecodeFrame (flags 0) emits the output callback before returning,
    giving a deterministic Send/Receive contract without goroutines.
  - Hardware H.264/HEVC output is bit-exact with ffmpeg software decoding for 8-bit 4:2:0 (per-frame SHA-256
    equality), so checksums are a valid oracle.
  - go vet rejects uintptr->unsafe.Pointer conversions; returning *byte from purego-bound functions and
    unsafe.Add(nil, addr) for Dlsym constants keeps vet clean.
  - Session recreation on SPS/PPS change (drain, invalidate, create) loses no frames.
  - VideoToolbox requires AVCC (length-prefixed) samples; Annex-B conversion plus in-band parameter-set
    extraction is cheap and sufficient.
  - 'VideoToolbox does not reorder H.264/HEVC output into display order on this path: temporal processing
    (sync or async) with real PTS still yields decode order. A PTS/POC reorder buffer in Go is required
    for display order; a WithPresentationOrder option was prototyped and removed because it did not work.'
  - purego v0.11.1 passes a 24-byte CMTime by value on darwin/arm64 (copied to memory, pointer in a register
    per AAPCS64) and on amd64 (stack); declaring sys.CMTime parameters in the Go signature is enough.
  - The compression output callback runs on a VideoToolbox thread; purego.NewCallback handles it with
    CGO_ENABLED=1 and, through fakecgo, with CGO_ENABLED=0, and the mutex split (mu vs outMu) is race-detector
    clean.
  - VideoToolbox samples are AVCC/HVCC with 4-byte length prefixes and never contain parameter sets; CMVideoFormatDescriptionGetH264/HEVCParameterSetAtIndex
    supplies SPS/PPS/VPS for Annex-B keyframes.
  - kVTCompressionPropertyKey_RealTime=true does not throttle to the frame rate on an M3 (same fps as
    false), so WithLowLatency keeps it on as Apple advises for live sources.
  - EnableLowLatencyRateControl makes the GOP infinite and disables reordering; a Go-side ForceKeyFrame
    every N frames restores a fixed GOP for HLS. It costs roughly 25-40% throughput at 720p.
  - VTCopySupportedPropertyDictionaryForEncoder with RequireHardwareAcceleratedVideoEncoder is a cheap,
    session-free hardware probe.
  - VBR AverageBitRate undershoots on simple content (2 Mbit/s target gave 1.37 Mbit/s); ConstantBitRate
    (macOS 13+) lands within 5% of the target.
  - CMSampleBufferGetSampleTimingInfo returns a valid DTS only when frame reordering is on; otherwise
    DTS is set equal to PTS by the backend.
  - Hardware H.264/HEVC at 1 Mbit/s 320x240 reaches ~50 dB luma PSNR against the testsrc2 source, so a
    30 dB threshold is a safe conformance gate.
  - VideoToolbox accepts 'RGBA' as a decompression destination and as CVPixelBufferCreate format at creation
    time but fails later with kCVReturnInvalidPixelFormat (-6680); BGRA is the packed format to use.
  - VTCompressionSessionGetPixelBufferPool must not be cached - with BGRA source attributes the pool is
    replaced after the first frame and the stale pool crashes (SIGSEGV) or stops delivering; non-IOSurface
    CVPixelBuffers then fail with kVTPixelTransferNotSupportedErr (-12905), so fallback buffers need kCVPixelBufferIOSurfacePropertiesKey.
  - The VideoToolbox encoder converts untagged BGRA input with BT.709 but writes no colour description
    unless the ColorPrimaries/TransferFunction/YCbCrMatrix properties are set; the decoder converts untagged
    320x240 streams with BT.601 (ffmpeg's default too).
  - VideoToolbox's hardware H.264 encoder writes no VUI bitstream_restriction and uses pic_order_cnt_type
    0, so its own streams decode with the DPB-size reorder latency; its HEVC output carries sps_max_num_reorder_pics
    (0 without B-frames, 2 with).
  - The hardware decoder rejects 64x48 pictures with kVTVideoDecoderMalfunctionErr (-12911); 96x64 works.
  - ffmpeg's RGB conversion of the same frames differs from VideoToolbox's by about 28 dB plain PSNR (chroma
    interpolation at sharp edges); averaging 8x8 blocks lifts the agreement to 35 dB while a wrong matrix
    stays at 25 dB and swapped channels at 4 dB.
  - VTIsHardwareDecodeSupported('av01') is 1 on the M3 before any registration call; VTRegisterSupplementalVideoDecoderIfAvailable('av01')
    changes nothing for AV1 (and VP9 stays 0 after registering it), so it is not called.
  - VideoToolbox accepts an AV1 temporal unit as one sample buffer with or without the leading temporal
    delimiter OBU and outputs the same frames; a unit holding hidden frames plus a shown frame yields
    one frame, and a 5-byte show_existing_frame unit yields the previously decoded hidden frame.
  - The hardware AV1 decoder runs synchronously under VTDecodeFrameFlags 0 like H.264/HEVC - the output
    callback fires before DecodeFrame returns - and its 8-bit output is bit-exact with libdav1d.
  - Main profile 10-bit input is accepted with a '420v' destination; VideoToolbox converts to 8-bit itself
    (53.5 dB against ffmpeg's conversion, no frame exact).
  - macOS 26 registers "SW AV1 Decoder" (com.apple.videotoolbox.videodecoder.av1.sw) in VTCopyVideoDecoderList
    next to the AVD hardware entry, but a session with EnableHardwareAcceleratedVideoDecoder=false fails
    with -12906, as does naming the DecoderID; applications cannot use it.
  - VideoToolbox rejects constant bitrate for H.264 on the author's M3 ("ConstantBitRate is not supported
    by this encoder"), so the HLS sample uses VBR; WithRateControl(CBR) is left to the user.
