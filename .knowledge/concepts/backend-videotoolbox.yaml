history:
  decode-implemented-2026-10-09:
    summary: H.264 and HEVC decoding implemented and verified bit-exact against ffmpeg.
  encode-implemented-2026-10-09:
    summary: H.264 and HEVC encoding implemented and verified against ffmpeg/ffprobe (M2).
  pixel-formats-and-display-order-2026-10-09:
    summary: BGRA/RGBA decode output and encode input added; display order supplied by the Go reorder
      layer on top of the backend's decode-order output (milestone:display-order-rgba).
  av1-decode-2026-10-09:
    summary: AV1 decoding added for Apple M3 and newer (av1C format description, temporal units as packets,
      native display order); verified bit-exact against libdav1d (milestone:darwin-av1-decode). No AV1
      encoder exists on Apple Silicon.
  ios-2026-10-12:
    summary: Runs on iOS through the same code - hardware-only specification keys made optional (iOS 17
      / 17.4), kVTInvalidSessionErr recovery for background/foreground, cgo-enabled ios builds (milestone:ios-videotoolbox);
      verified in the Simulator, iPhone pending.
  m1-accepted-2026-10-09:
    summary: Author confirmed M1 = macOS + decode + H.264 with purego.
  m1-delivered-2026-10-09:
    summary: All M1 acceptance checks passed on the author's M3 Mac; HEVC decode and a flush/seek test
      were added beyond the original scope.
  m1-reverified-2026-10-09:
    summary: M1 decode tests re-run and passing after the M2 API changes (option types became interfaces;
      ErrClosed/ErrInvalidData messages generalised); basis hashes refreshed.
  m2-accepted-2026-10-09:
    summary: Author asked for macOS encode as the slice after M1 ("つぎはmacのencode").
  m2-delivered-2026-10-09:
    summary: Encoder API, VideoToolbox VTCompressionSession backend, encode/transcode CLI and ffmpeg/ffprobe-based
      conformance tests delivered; all acceptance checks passed on the author's M3 Mac with CGO_ENABLED=1
      and 0.
  av1mac-accepted-2026-10-09:
    summary: Author asked for AV1 decoding on the VideoToolbox backend (Apple M3), with an IVF package
      and CLI support; encoding out of scope since no Apple chip has an AV1 encoder.
  av1mac-delivered-2026-10-09:
    summary: internal/av1 parser, VideoToolbox AV1 session via av1C, DisplayOrderer bypass of the reorder
      layer, ivf package, CLI, ffmpeg-oracle tests; all acceptance checks passed on the author's M3 with
      CGO_ENABLED=1 and 0.
  ios-planned-2026-10-11:
    summary: Assessment for the author - iPhone needs the optional keys, background recovery and a cgo-enabled
      build; Android needs a new NDK MediaCodec backend (AImageReader output, synchronous dequeue, getName
      for the software check, API 28). The author confirmed an iPhone and an Android tablet are available.
  ios-ios-implemented-2026-10-12:
    summary: Optional hardware keys, session invalidation recovery with tests, Android build-tag exclusion,
      mobilebuild.sh, examples/mobile with the Xcode project; Simulator CLI run and app launch verified;
      iPhone run pending.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:m1-darwin-h264-decode, milestone:m2-darwin-encode,
      milestone:display-order-rgba, milestone:darwin-av1-decode, milestone:ios-videotoolbox, milestone:examples-screencast-hls,
      milestone:examples-heif-avif was folded into this concept (keys prefixed with the milestone's tag;
      dated measurements kept as evidence notes); the milestone files remain as superseded stubs with
      their timelines.
