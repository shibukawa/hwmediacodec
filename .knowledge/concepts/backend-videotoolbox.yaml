id: backend:videotoolbox
type: backend
title: VideoToolbox (macOS / iOS)
summary: Apple's C-level hardware video codec API. Full decoder/encoder sessions that accept AVCC NAL
  units and return CVPixelBuffers; the simplest target for M1.
lifecycle: active
authority: inferred
aliases:
- VideoToolbox
- VTDecompressionSession
- VTCompressionSession
scope:
  platform:
  - darwin
  - ios
  gpu: apple-silicon
constraints:
- Annex-B input (start codes); the backend converts to AVCC and builds the CMVideoFormatDescription from
  in-band SPS/PPS.
- Output frames are NV12 ('420v') copied into Go-owned buffers with Release().
- CGO_ENABLED=0; CMTime arguments of VTCompressionSessionEncodeFrame/CompleteFrames are passed by value
  through purego struct support.
- Input frames are NV12 owned by the caller and copied into a CVPixelBuffer from the session pool before
  Send returns.
- Output is Annex-B with VPS/SPS/PPS prepended to every keyframe; packets are returned in decode order
  with PTS and DTS.
- Unsupported controls (profile not defined for the codec, CBR before macOS 13, quality mode rejected
  by the encoder) are reported as ErrUnsupported, never silently ignored.
- RGBA/BGRA frames are one plane with rows of exactly 4*Width bytes so that Planes[0] feeds ebiten.Image.WritePixels
  as is; the conversion stays in the backend, never in the public API.
- CGO_ENABLED=0; every framework call goes through internal/videotoolbox/sys via purego; ffmpeg (libsvtav1
  as the encoder, libdav1d as the reference decoder) is a test oracle only.
- The AV1 decoder implements codec.DisplayOrderer returning true, so NewDecoder does not wrap it in the
  reorder layer; WithDecodeOrder is a no-op; Frame.PTS equals Packet.PTS; one Receive per temporal unit.
- Probe lists av1 decode only when VTIsHardwareDecodeSupported('av01') is non-zero; NewDecoder returns
  *UnsupportedError otherwise, also with WithSoftwareFallback, because VideoToolbox does not let applications
  instantiate its software AV1 decoder (checked with a probe session at NewDecoder time).
- Streams outside Main profile 4:2:0 (High and Professional profiles, monochrome) report ErrUnsupported
  from Send before a session is created; a different sequence header replaces the session.
- iOS builds use CGO_ENABLED=1 with Xcode's clang (purego's is_ios.go rejects CGO_ENABLED=0; purego Tier
  1 lists iOS and Android as cgo-only). The library has no cgo source; the desktop targets stay CGO_ENABLED=0
  (scripts/crossbuild.sh unchanged, scripts/mobilebuild.sh added for ios and android).
- Every VideoToolbox symbol the backend binds must exist on iOS 11, or be optional. Optional on iOS (checked
  in the iOS 27.0 SDK headers on 2026-10-11) are kVTVideoDecoderSpecification_{Require,Enable}HardwareAcceleratedVideoDecoder
  (iOS 17.0), kVTVideoEncoderSpecification_{Require,Enable}HardwareAcceleratedVideoEncoder (iOS 17.4),
  kVTVideoEncoderSpecification_EnableLowLatencyRateControl (iOS 14.5), kVTCompressionPropertyKey_ConstantBitRate
  (iOS 16.0) and VTRegisterSupplementalVideoDecoderIfAvailable (iOS 26.2). When a hardware key is absent
  the specification dictionary stays empty, which is correct because every iOS codec is hardware.
- kVTInvalidSessionErr (-12903) from VTDecompressionSessionDecodeFrame, VTCompressionSessionEncodeFrame,
  VTCompressionSessionCompleteFrames or an output callback is recovered inside the backend, never reported
  from Send or Flush. Decoder - new session on the same format description, frames in flight lost, resume
  at the next keyframe (the triggering packet itself when it is one). Encoder - new session with the same
  properties, next frame forced to a keyframe; Flush on a dead session just reopens it.
