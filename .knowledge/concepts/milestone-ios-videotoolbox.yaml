id: milestone:ios-videotoolbox
type: milestone
title: iOS (iPhone, iPad) through the VideoToolbox backend
summary: 'Mobile slice, requested on 2026-10-11 ("android, iphone対応には何が必要か？", then "iPhone実機、
  Androidタブレット実機はあります"): the macOS VideoToolbox backend made to run on iOS. The darwin
  build constraint already covers ios; what changed is that the hardware-only specification keys
  (iOS 17 / 17.4) are bound as optional and left out when absent, that a session iOS invalidates
  behind the application''s back (background) is reopened at the next keyframe by both the decoder
  and the encoder, that the Linux backends are excluded from GOOS=android builds (android satisfies
  the linux tag), and that the build itself needs CGO_ENABLED=1 because purego has no cgo-free mode
  on iOS. Verified in the iOS 26 Simulator with the CLI (decode bit-identical to the Mac, encode
  decodable by ffmpeg); examples/mobile is the Ebitengine mobile game plus Xcode project for the
  iPhone run, which is pending. Android (NDK MediaCodec) is the next slice.'
lifecycle: active
authority: authored
aliases:
- iOS support
- iPhone対応
- ios/arm64
- ebitenmobile
- kVTInvalidSessionErr
scope:
  platform:
  - ios
  - darwin
  gpu: apple-silicon
  milestone: ios-videotoolbox
constraints:
- iOS builds use CGO_ENABLED=1 with Xcode's clang (purego's is_ios.go rejects CGO_ENABLED=0; purego
  Tier 1 lists iOS and Android as cgo-only). The library has no cgo source; the desktop targets stay
  CGO_ENABLED=0 (scripts/crossbuild.sh unchanged, scripts/mobilebuild.sh added for ios and android).
- Every VideoToolbox symbol the backend binds must exist on iOS 11, or be optional. Optional on iOS
  (checked in the iOS 27.0 SDK headers on 2026-10-11) are kVTVideoDecoderSpecification_{Require,Enable}HardwareAcceleratedVideoDecoder
  (iOS 17.0), kVTVideoEncoderSpecification_{Require,Enable}HardwareAcceleratedVideoEncoder (iOS 17.4),
  kVTVideoEncoderSpecification_EnableLowLatencyRateControl (iOS 14.5), kVTCompressionPropertyKey_ConstantBitRate
  (iOS 16.0) and VTRegisterSupplementalVideoDecoderIfAvailable (iOS 26.2). When a hardware key is
  absent the specification dictionary stays empty, which is correct because every iOS codec is hardware.
- kVTInvalidSessionErr (-12903) from VTDecompressionSessionDecodeFrame, VTCompressionSessionEncodeFrame,
  VTCompressionSessionCompleteFrames or an output callback is recovered inside the backend, never
  reported from Send or Flush. Decoder - new session on the same format description, frames in flight
  lost, resume at the next keyframe (the triggering packet itself when it is one). Encoder - new session
  with the same properties, next frame forced to a keyframe; Flush on a dead session just reopens it.
- 'GOOS=android compiles only the backend-independent packages: vaapi, vpl and nvidia carry the
  constraint "linux && !android", files picked by the _linux suffix carry "!android", and backends_other.go
  covers android. Probe is empty there until the MediaCodec backend exists.'
- The public API, the ebitenvideo and playback packages and the examples are unchanged in behaviour;
  the Ebitengine mobile sample exports only a Dummy function because gobind cannot bind ebiten.Game
  method signatures.
non_goals:
- The Android backend (NDK MediaCodec through libmediandk.so) - the next slice; see the plan in
  requirement:hwmediacodec history.
- Running on an iPhone from this session (the author has the device; examples/mobile/ios is the app
  to run). Hardware verification state is recorded as not_run.
- Metal or IOSurface zero-copy output into Ebitengine; frames still go through CPU memory as on macOS.
- tvOS and visionOS (the same frameworks exist; nothing was checked).
acceptance:
  ios-builds:
    text: The module builds for ios/arm64 (device), ios/arm64 and ios/amd64 (Simulator) with CGO_ENABLED=1
      through scripts/mobilebuild.sh, and go vet passes on the videotoolbox packages for ios/arm64.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - mobilebuild-script
  android-excludes-linux-backends:
    text: GOOS=android go list -deps of the root package lists no vaapi, vpl or nvidia package; the
      only remaining Android build error is purego's own cgo requirement.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - android-deps-check
  simulator-probe-decode-encode:
    text: The hwmediacodec CLI built for the Simulator, run with xcrun simctl spawn, lists h264 and
      hevc encode (hardware) and no decoder; decodes a 30-frame B-frame H.264 stream with -software
      to NV12 and RGBA with per-frame SHA-256 and display order identical to the Mac's hardware decode;
      encodes 10 NV12 frames to H.264 (ffprobe reads 10 frames, luma PSNR about 49.6 dB) and HEVC
      (10 frames); transcodes the H.264 stream to HEVC (30 frames).
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - simulator-cli-run
  session-invalidation-recovery:
    text: With the live session invalidated by hand after 30 of 60 packets, Send keeps returning nil,
      frames 0-29 and 50-59 match ffmpeg's and frames 30-49 are skipped; invalidated right before a
      keyframe, all 30 frames come out; an encoder invalidated after 20 of 40 frames emits every frame,
      the frame that hit the error as a keyframe, and ffmpeg decodes the resulting stream in full.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - invalidation-tests
  mobile-sample:
    text: examples/mobile binds with ebitenmobile into Mobile.xcframework (device and Simulator slices),
      the Xcode project builds for the Simulator with xcodebuild, installs and launches there showing
      the clip, and go test ./mobile opens the bundled clip on the Mac.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - mobile-sample-build
  iphone-run:
    text: On an iPhone the app's top line reads ios/arm64 videotoolbox with h264/hevc decode and encode
      (av1 decode from the A17 Pro on), the clip plays in hardware, and it keeps playing after the app
      is sent to the background and brought back.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - iphone-run
  existing-suites:
    text: go test ./... (whole workspace), CGO_ENABLED=0 go test . and scripts/crossbuild.sh pass on the
      Mac after the change.
    scope:
      milestone: ios-videotoolbox
    verified_by:
    - existing-suites
