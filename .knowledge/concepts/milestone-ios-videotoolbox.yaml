id: milestone:ios-videotoolbox
type: milestone
title: iOS (iPhone, iPad) through the VideoToolbox backend
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:core-api, component:examples (keys prefixed ios-). Original
  summary: Mobile slice, requested on 2026-10-11 ("android, iphone対応には何が必要か？", then "iPhone実機、 Androidタブレット実機はあります"):
  the macOS VideoToolbox backend made to run on iOS. The darwin build constraint already covers ios; what
  changed is that the hardware-only specification keys (iOS 17 / 17.4) are bound as optional and left
  out when absent, that a session iOS invalidates behind the application''s back (background) is reopened
  at the next keyframe by both the decoder and the encoder, that the Linux backends are excluded from
  GOOS=android builds (android satisfies the linux tag), and that the build itself needs CGO_ENABLED=1
  because purego has no cgo-free mode on iOS. Verified in the iOS 26 Simulator with the CLI (decode bit-identical
  to the Mac, encode decodable by ffmpeg); examples/mobile is the Ebitengine mobile game plus Xcode project
  for the iPhone run, which is pending. Android (NDK MediaCodec) is the next slice.'
lifecycle: superseded
authority: authored
aliases:
- iOS support
- iPhone対応
- ios/arm64
- ebitenmobile
- kVTInvalidSessionErr
scope:
  platform:
  - ios
  - darwin
  gpu: apple-silicon
  milestone: ios-videotoolbox
non_goals:
- The Android backend (NDK MediaCodec through libmediandk.so) - the next slice; see the plan in requirement:hwmediacodec
  history.
- Running on an iPhone from this session (the author has the device; examples/mobile/ios is the app to
  run). Hardware verification state is recorded as not_run.
- Metal or IOSurface zero-copy output into Ebitengine; frames still go through CPU memory as on macOS.
- tvOS and visionOS (the same frameworks exist; nothing was checked).
