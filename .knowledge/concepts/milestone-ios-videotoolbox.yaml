history:
  planned-2026-10-11:
    summary: Assessment for the author - iPhone needs the optional keys, background recovery and a cgo-enabled
      build; Android needs a new NDK MediaCodec backend (AImageReader output, synchronous dequeue, getName
      for the software check, API 28). The author confirmed an iPhone and an Android tablet are available.
  ios-implemented-2026-10-12:
    summary: Optional hardware keys, session invalidation recovery with tests, Android build-tag exclusion,
      mobilebuild.sh, examples/mobile with the Xcode project; Simulator CLI run and app launch verified;
      iPhone run pending.
