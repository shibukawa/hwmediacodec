id: milestone:playback
type: milestone
title: playback - the player core without Ebitengine
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:playback (keys prefixed playback-). Original summary: The decoding goroutine,
  the timeline (pacing, frame skipping), seeking and looping of ebitenvideo moved to the core module as
  github.com/shibukawa/hwmediacodec/playback. A playback.Player is driven with Advance(dt), which returns
  the frame that became due; where the picture goes is the caller''s business. ebitenvideo is now about
  180 lines: it drives a playback.Player from the game loop and uploads the frames to an *ebiten.Image,
  with its API unchanged.'
lifecycle: superseded
authority: authored
aliases:
