id: component:playback
type: component
title: 'playback and ebitenvideo: decoding against a clock, pacing, seeking, looping; frames into an *ebiten.Image'
summary: playback.Player decodes on a background goroutine a few frames ahead, in display order and as
  RGBA by default, and Advance(dt) returns the frame that is due; a PacketSeeker gives Seek, Length and
  looping, raw Annex-B streams are timed by output order and scanned once for keyframes. ebitenvideo (a
  separate module) drives a playback.Player from the game loop and uploads the frames into an *ebiten.Image.
  WithAudio decodes the audio track into an AudioStream laid out on the pictures' time line, and an attached
  AudioDevice (Ebitengine's audio player in ebitenvideo) is the clock; keys sound-. Consolidated on 2026-10-16 from milestone:playback, milestone:ebitenvideo-seek and the player parts
  of milestone:display-order-rgba, and from milestone:playback-sound.
lifecycle: active
authority: authored
aliases:
- playback package
- ebitenvideo
- Player
- 再生コア
- シーク対応
constraints:
- The core module never imports Ebitengine. ebitenvideo is a separate module (own go.mod) that depends
  on both hwmediacodec and Ebitengine; inside the repository a replace directive binds it to the working
  tree.
- Only ebitenvideo/player.go imported Ebitengine; source.go (551 lines) and timeline.go did not, so the
  split is a move plus a new Player type. The seek protocol, the loop rebase and the raw-stream timing
  (frames of an untimed Annex-B stream are timed by output order) are as before; see milestone:ebitenvideo-seek.
- 'The decode loop is hwmediacodec.DecodeReader now: seek and stop requests are looked at once per frame
  instead of once per packet, a seek calls Reset before repositioning the reader, and a loop iteration
  calls Reset after rewinding because the reader had reached its end.'
- Advance returns at most one frame per call (the latest one due; earlier ones are skipped and counted)
  and nil between frames; the caller releases it. Frames are RGBA unless WithOutputFormat says otherwise;
  ebitenvideo pins RGBA because WritePixels needs it.
- ebitenvideo.Option is an alias of playback.Option and ErrNotSeekable is the same value, so existing
  callers compile unchanged.
- Length of a raw stream is 0 until the first seek scanned it; the new ebitenvideo test first asserted
  it too early.
- 'Packet sources carry presentation times: PacketReader{Codec(), TimeScale(), ReadPacket()} and PacketSeeker{SeekKeyframe(t),
  Length()} (the root package''s interfaces since milestone:packet-pipeline; first ebitenvideo.Source/Seeker
  with microsecond times). The decoder is opened with WithTimeScale(src.TimeScale()) so presentation times
  round-trip through Packet.PTS and Frame.PTS.'
- 'Raw elementary streams are timed after decoding: frame k out of the decoder (display order) is at k/fps,
  counting from the keyframe index a seek landed on (a keyframe''s decode-order index equals its display-order
  index). Timing packets by decode-order index was wrong for B-frame streams (the first attempt did that
  and frame 1 came out at 2/fps).'
- 'Seek protocol: Player.Seek bumps a generation counter, posts a request (newest wins), resets the timeline
  clock to the target and stops it until the first frame of the new generation arrives; the decode goroutine
  flushes and discards, calls SeekKeyframe, then decodes and drops frames before the target (precise seek).
  Items carry gen/loop/rebase; the player releases items of older generations. An end marker item (no
  frame) tells the player a generation finished; with a Seeker the goroutine then waits for the next seek
  instead of exiting, so seeking after the end resumes playback.'
- annexb.Reader.Offset reports the stream offset of the three-byte start code of the last access unit
  (one byte into a four-byte start code); the stream source scans the whole file once (annexb.Split +
  IsKeyframe) to build index->offset pairs and Length = count/fps.
- PacketSource.Length is the presentation length (max PTS+duration minus the edit-list offset), not the
  decode-time duration, which is one B-frame delay shorter.
- NewPlayer still handles H.264/HEVC Annex-B only; AV1 plays through a Source (MP4 demuxer).
- 'AudioStream is strict about time: byte offset n is the sample of time n / BytesPerSecond on the time
  line of the pictures, whatever was read before. Decoded frames are placed by their PTS (track time
  scale, edit list applied), cut before 0 (encoder delay), at the audio track''s own length (padding)
  and at the length of a pass; where nothing is decoded in time the stream is silence. So the position
  a device reports (bytes read less bytes buffered) is a time on the time line with no bookkeeping, and
  sound and picture agree by construction.'
- 'Read never returns io.EOF (a device that sees the end stops, and with it the clock) and never blocks
  for long: with nothing buffered it waits up to 30 ms for the decoder, then hands out 10 ms of silence;
  otherwise it returns what is decoded, short reads included. A signal left in the ready channel by samples
  that a Seek has since thrown away is drained before waiting (found by the tests: without that a jump
  cost the first 10 ms).'
- 'Seek(offset) is how a device flushes and jumps: the decoding goroutine restarts at the sample of the
  offset (SeekKeyframe of the audio source, which backs up by the decoder''s run-in; decoder Flush).
  Only SeekStart and SeekCurrent exist. Ebitengine''s resampler seeks its source to 4096-sample block
  boundaries after a jump and otherwise reads sequentially, which this serves.'
- 'One pass through the presentation is as long as the longer track (Player.Length returns it); with
  WithLoop the audio stream carries pass after pass on a time line that runs on, and the video source''s
  loop length is set to the same value, so both restart together. The clock of the timeline is (pass,
  position); timeline.sync sets it from outside, timeline.advance still moves it by dt.'
- 'With an AudioDevice attached, Player.Advance takes the device''s Position as the clock while Ready
  reports true, clamped so that it never steps back (Ebitengine''s estimate did, by up to 2.7 ms). A
  device that has just come up, and one after Seek, is paused, placed with SetPosition at the clock
  and started when the timeline has a frame of the new position (or after 500 ms): sound and picture
  start together. While the device is not ready the player holds the first picture for 500 ms once
  and then runs on dt. Play, Pause, Seek, the end of the stream and Close pause or place the device.'
- 'A film goes on without its sound: when NewAudioDecoder fails Player.Audio is nil and AudioErr holds
  the error; when the decoder fails later the stream is silent from then on.'
- 'WithAudioChannels mixes to mono or stereo in the stream (centre and surrounds at -3 dB into both sides,
  LFE dropped, scaled by 1/(1+sqrt 2) so that it cannot clip); the stream decodes in F32 and hands out
  F32 (default) or S16. No resampling in playback.'
- 'ebitenvideo: audio.CurrentContext or a new context at the track''s rate (Ebitengine allows one per
  process); another rate goes through audio.ResampleReaderF32; NewPlayerF32 on the stream; the device
  wraps Player.Position, SetPosition, Play, Pause and Context.IsReady. Ebitengine''s Position is bytes
  read less bytes buffered, interpolated with a stopwatch between buffer updates, updated once per tick.
  It leaves out the output latency of the operating system. Close calls PauseAndStopReading before the
  stream is closed.'
- 'mediacontainer/mp4: an empty edit in front of a track is taken off Track.MediaTimeOffset (converted
  from the movie time scale), so packet times of all tracks count from the start of the presentation;
  AudioFormat.Delay keeps using the media time of the first real edit. Demuxer sample reads are serialised
  by a mutex (video and audio packet sources read the same io.ReadSeeker from two goroutines; the device
  test found NAL lengths of garbage without it).'
- 'examples/go.sum carried hashes for ebitenvideo v0.1.0 that differ from the public checksum database
  (the tag was moved after the proxy had fetched it). With a fresh module cache every build in the workspace
  failed with a checksum mismatch on 2026-10-14; the two lines were set to the database''s values.'
acceptance:
  dor-ebitenvideo-player:
    text: The player shows frame k at k/fps on the game clock, starts its clock at the first decoded frame,
      skips frames when behind, reports the end, loops over an io.ReadSeeker without shortening the last
      frame, and delivers RGBA frames in display order from the decode goroutine.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-timeline-unit-test
    - dor-player-hardware-test
  dor-module-split:
    text: The core module has no Ebitengine dependency (go.mod unchanged apart from purego) and ebitenvideo
      builds with CGO_ENABLED=1 and 0 on darwin/arm64.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-module-build-check
  playback-core:
    text: A playback.Player ticked at 60 Hz shows all 12 frames of a 30 fps stream and ends, loops without
      ending, returns NV12 frames when asked, seeks (position right after Seek, clock resuming just above
      the target, seeking past the end ends, seeking back resumes) and refuses to seek or loop a non-seekable
      reader; the decode source delivers a B-frame stream in display order matching ffmpeg.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-playback-test
  playback-ebitengine:
    text: An ebitenvideo.Player driven with Update fills an image of the stream's size, ends, resumes
      after Seek and reports the length once the stream was scanned.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-ebitenvideo-test
  playback-samples:
    text: The player and texture samples play the bundled clip; a recording of the texture sample's window
      shows the picture.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-texture-run
  seek-source-seek-exact:
    text: On a 90-frame H.264 B-frame stream (keyframes every 25) the first frame after a seek to 2 s
      is frame 60 (keyframe 50 decoded from, 50..59 dropped) and matches ffmpeg's frame 60 within 30 dB
      block PSNR; a seek between frames gives the first frame at or after the target; a seek onto a keyframe
      gives it; a seek past the end gives only the end marker; a later seek resumes; Length is 3 s after
      the scan.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-source-seek-test
  seek-player-seek:
    text: Player.Seek sets Position to the target at once, the clock resumes with the first frame after
      it, Length reports 3 s, seeking past the end ends playback and seeking back resumes it, and a non-seekable
      reader reports ErrNotSeekable and Length 0.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-player-seek-test
  seek-timeline-reset:
    text: After reset the clock sits at the target and does not run until a frame of the new generation
      arrives; frames then show relative to the target.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-timeline-unit-test
  seek-packet-source:
    text: PacketSource delivers every sample with presentation times starting at 0, Length 2 s for a 60-frame
      30 fps track, and SeekKeyframe lands on the sync sample at or before the target (1.5 s -> 1.333
      s sample 40; past the end -> the last keyframe) with that sample read next.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-packet-source-test
  seek-annexb-offset:
    text: Offset points at the start code of the returned access unit and re-reading from it yields the
      same access unit, also through a one-byte-at-a-time reader.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-annexb-offset-test
  sound-stream-time-line:
    text: Reading an AudioStream of an ffmpeg-made AAC track gives the encoded signal in place from offset
      0 (shift 0, 15 dB or more as for every lossy round trip), exact silence behind the end of the track,
      the signal of the target after jumps to five positions, pass after pass with silence between the
      end of the track and the end of the pass when looping, and the right pass after a jump into the
      sixth; a mono track comes out on both sides of a stereo stream; the mix weights are as documented.
    scope:
      milestone: playback-sound
      platform:
      - darwin
      - ios
      - js
    verified_by:
    - sound-playback-stream-tests
    - sound-playback-stream-browser
  sound-pictures-follow-device:
    text: With a device the test drives at 60 ticks a second, every picture returned is the one for the
      device's position (never ahead, at most two frames and a tick behind); the device is placed at
      0 and started when it comes up, paused by Pause, placed at the target of Seek and started with
      the first picture of the target, and paused at the end; the samples the device read are the signal
      of its positions, from the start and after the jump.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-playback-device-tests
  sound-late-device:
    text: A device that is not ready holds the first picture for half a second, then the film runs on
      the clock of Advance; when the device comes up it is placed where the pictures are (within two
      ticks) and the samples it then reads are the signal of that position.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-playback-device-tests
  sound-loop-with-sound:
    text: With WithLoop the pictures of every pass are shown at the device's position within the pass
      for three passes and the sound of the second pass starts where the pass does.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-playback-device-tests
  sound-ebitenvideo-sound:
    text: An ebitenvideo player with WithAudio reports HasAudio and its volume, plays to the end and through
      a seek without a running audio device, and its stream read through Ebitengine's resampler (48 to
      44.1 kHz) is the signal at the new rate in place, from the start and after a seek.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-ebitenvideo-tests
  sound-real-device-run-macos:
    text: The bundled clip with sound in a real Ebitengine game loop on macOS (CoreAudio) follows the
      audio player's position through a start, a seek and a loop, without an audio error and with at
      most a frame or two skipped.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-live-run-macos
  sound-real-device-run-browser:
    text: The same in headless Chrome (WebCodecs for both tracks, WebAudio for the output), with the
      film on the tick clock until the page's first input event and on the audio's from then on.
    scope:
      milestone: playback-sound
      platform: js
    verified_by:
    - sound-live-run-chrome
  sound-track-offsets-read-back:
    text: Files written with a later start for one track read back with that offset between the first
      presented picture and the first presented sample (within 2 ms), one of them at 0.
    scope:
      milestone: playback-sound
      platform: darwin
    verified_by:
    - sound-mp4-offset-tests
  sound-listening:
    text: A person hears the sound of the player sample in step with the picture on a Mac, an iPhone and
      in a browser.
    scope:
      milestone: playback-sound
      platform:
      - darwin
      - ios
      - js
    verified_by:
    - sound-listening-run
  sound-existing-suites:
    text: go test in all four modules, scripts/crossbuild.sh, scripts/mobilebuild.sh and scripts/browser_test.sh
      . ./internal/webcodecs ./playback pass after the change.
    scope:
      milestone: playback-sound
      platform:
      - darwin
      - ios
      - js
    verified_by:
    - sound-existing-suites
