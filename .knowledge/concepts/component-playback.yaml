id: component:playback
type: component
title: 'playback and ebitenvideo: decoding against a clock, pacing, seeking, looping; frames into an *ebiten.Image'
summary: playback.Player decodes on a background goroutine a few frames ahead, in display order and as
  RGBA by default, and Advance(dt) returns the frame that is due; a PacketSeeker gives Seek, Length and
  looping, raw Annex-B streams are timed by output order and scanned once for keyframes. ebitenvideo (a
  separate module) drives a playback.Player from the game loop and uploads the frames into an *ebiten.Image.
  Consolidated on 2026-10-16 from milestone:playback, milestone:ebitenvideo-seek and the player parts
  of milestone:display-order-rgba.
lifecycle: active
authority: authored
aliases:
- playback package
- ebitenvideo
- Player
- 再生コア
- シーク対応
constraints:
- The core module never imports Ebitengine. ebitenvideo is a separate module (own go.mod) that depends
  on both hwmediacodec and Ebitengine; inside the repository a replace directive binds it to the working
  tree.
- Only ebitenvideo/player.go imported Ebitengine; source.go (551 lines) and timeline.go did not, so the
  split is a move plus a new Player type. The seek protocol, the loop rebase and the raw-stream timing
  (frames of an untimed Annex-B stream are timed by output order) are as before; see milestone:ebitenvideo-seek.
- 'The decode loop is hwmediacodec.DecodeReader now: seek and stop requests are looked at once per frame
  instead of once per packet, a seek calls Reset before repositioning the reader, and a loop iteration
  calls Reset after rewinding because the reader had reached its end.'
- Advance returns at most one frame per call (the latest one due; earlier ones are skipped and counted)
  and nil between frames; the caller releases it. Frames are RGBA unless WithOutputFormat says otherwise;
  ebitenvideo pins RGBA because WritePixels needs it.
- ebitenvideo.Option is an alias of playback.Option and ErrNotSeekable is the same value, so existing
  callers compile unchanged.
- Length of a raw stream is 0 until the first seek scanned it; the new ebitenvideo test first asserted
  it too early.
- 'Packet sources carry presentation times: PacketReader{Codec(), TimeScale(), ReadPacket()} and PacketSeeker{SeekKeyframe(t),
  Length()} (the root package''s interfaces since milestone:packet-pipeline; first ebitenvideo.Source/Seeker
  with microsecond times). The decoder is opened with WithTimeScale(src.TimeScale()) so presentation times
  round-trip through Packet.PTS and Frame.PTS.'
- 'Raw elementary streams are timed after decoding: frame k out of the decoder (display order) is at k/fps,
  counting from the keyframe index a seek landed on (a keyframe''s decode-order index equals its display-order
  index). Timing packets by decode-order index was wrong for B-frame streams (the first attempt did that
  and frame 1 came out at 2/fps).'
- 'Seek protocol: Player.Seek bumps a generation counter, posts a request (newest wins), resets the timeline
  clock to the target and stops it until the first frame of the new generation arrives; the decode goroutine
  flushes and discards, calls SeekKeyframe, then decodes and drops frames before the target (precise seek).
  Items carry gen/loop/rebase; the player releases items of older generations. An end marker item (no
  frame) tells the player a generation finished; with a Seeker the goroutine then waits for the next seek
  instead of exiting, so seeking after the end resumes playback.'
- annexb.Reader.Offset reports the stream offset of the three-byte start code of the last access unit
  (one byte into a four-byte start code); the stream source scans the whole file once (annexb.Split +
  IsKeyframe) to build index->offset pairs and Length = count/fps.
- PacketSource.Length is the presentation length (max PTS+duration minus the edit-list offset), not the
  decode-time duration, which is one B-frame delay shorter.
- NewPlayer still handles H.264/HEVC Annex-B only; AV1 plays through a Source (MP4 demuxer).
acceptance:
  dor-ebitenvideo-player:
    text: The player shows frame k at k/fps on the game clock, starts its clock at the first decoded frame,
      skips frames when behind, reports the end, loops over an io.ReadSeeker without shortening the last
      frame, and delivers RGBA frames in display order from the decode goroutine.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-timeline-unit-test
    - dor-player-hardware-test
  dor-module-split:
    text: The core module has no Ebitengine dependency (go.mod unchanged apart from purego) and ebitenvideo
      builds with CGO_ENABLED=1 and 0 on darwin/arm64.
    scope:
      milestone: display-order-rgba
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - dor-module-build-check
  playback-core:
    text: A playback.Player ticked at 60 Hz shows all 12 frames of a 30 fps stream and ends, loops without
      ending, returns NV12 frames when asked, seeks (position right after Seek, clock resuming just above
      the target, seeking past the end ends, seeking back resumes) and refuses to seek or loop a non-seekable
      reader; the decode source delivers a B-frame stream in display order matching ffmpeg.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-playback-test
  playback-ebitengine:
    text: An ebitenvideo.Player driven with Update fills an image of the stream's size, ends, resumes
      after Seek and reports the length once the stream was scanned.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-ebitenvideo-test
  playback-samples:
    text: The player and texture samples play the bundled clip; a recording of the texture sample's window
      shows the picture.
    scope:
      milestone: playback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - playback-texture-run
  seek-source-seek-exact:
    text: On a 90-frame H.264 B-frame stream (keyframes every 25) the first frame after a seek to 2 s
      is frame 60 (keyframe 50 decoded from, 50..59 dropped) and matches ffmpeg's frame 60 within 30 dB
      block PSNR; a seek between frames gives the first frame at or after the target; a seek onto a keyframe
      gives it; a seek past the end gives only the end marker; a later seek resumes; Length is 3 s after
      the scan.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-source-seek-test
  seek-player-seek:
    text: Player.Seek sets Position to the target at once, the clock resumes with the first frame after
      it, Length reports 3 s, seeking past the end ends playback and seeking back resumes it, and a non-seekable
      reader reports ErrNotSeekable and Length 0.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-player-seek-test
  seek-timeline-reset:
    text: After reset the clock sits at the target and does not run until a frame of the new generation
      arrives; frames then show relative to the target.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-timeline-unit-test
  seek-packet-source:
    text: PacketSource delivers every sample with presentation times starting at 0, Length 2 s for a 60-frame
      30 fps track, and SeekKeyframe lands on the sync sample at or before the target (1.5 s -> 1.333
      s sample 40; past the end -> the last keyframe) with that sample read next.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-packet-source-test
  seek-annexb-offset:
    text: Offset points at the start code of the returned access unit and re-reading from it yields the
      same access unit, also through a one-byte-at-a-time reader.
    scope:
      milestone: ebitenvideo-seek
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - seek-annexb-offset-test
