facts:
  api:
    ebitenvideo: NewPlayer(r io.Reader, codec, fps, WithLoop|WithSoftwareFallback|WithPrefetch) -> Player{Play,
      Pause, IsPlaying, Update, Image, Size, Position, Skipped, Ended, Err, Close}; module github.com/shibukawa/hwmediacodec/ebitenvideo
    playback: import github.com/shibukawa/hwmediacodec/playback; New(src PacketReader, opts...) / NewStream(r,
      codec, fps, opts...) -> Player{Play, Pause, IsPlaying, Ended, Err, Position, Length, Seekable, Seek,
      Skipped, Size, Advance(dt) (*Frame, error), Close}; WithLoop, WithSoftwareFallback, WithPrefetch,
      WithOutputFormat; ErrNotSeekable
    ebitenvideo_seek: Source, Seeker, ErrNotSeekable, NewPlayerFromSource(src, opts...), Player.Seek(t)
      error, Player.Length(), Player.Seekable(); NewPlayer unchanged (seeks when r is an io.ReadSeeker)
    container: VideoTrack.PacketSource() *PacketSource{Codec, ReadPacket, SeekKeyframe, Length}; Track.PresentationLength()
    annexb: Reader.Offset() int64
  milestone_notes:
    dor:
      implementation:
        ebitenvideo: source.go decodes on a goroutine into a bounded channel (prefetch) in display order
          as RGBA; timeline.go paces by display index (clock starts at the first frame, loop rebases by
          the previous iteration's duration, late frames are skipped); player.go uploads with WritePixels
          into an Unmanaged ebiten.Image created lazily
    browser:
      zero_copy:
        state: 'tried and taken out on 2026-10-13 (commit 543e25b has the implementation, the one after
          it removes it): the core keeps the Native frame format, ebitenvideo is back to RGBA frames and
          WritePixels in the browser too'
        why_removed: the author's decision after the measurements and the memory model of the other backends
          were on the table - the upload had to find Ebitengine's texture from outside, it paid only from
          1080p up in Chrome, it was slower in Firefox, and no native backend can do the same. Revisit
          when Ebitengine offers a way to write an image source into an image's texture.
        core: hwmediacodec.Native output format; see backend:webcodecs facts.native_frames_2026-10-13
        ebitengine_internals: Ebitengine 2.10.4 on js creates a WebGL2 context on its canvas, copies the
          context's functions with bind when it starts, allocates one texture per unmanaged image with
          texImage2D(TEXTURE_2D, 0, RGBA, w, h, 0, RGBA, UNSIGNED_BYTE, null) at the next power of two
          (16 at least), no padding, and writes pixels with texSubImage2D at flush time. It exposes none
          of it.
        how_it_worked: an init function wrapped texImage2D on WebGL2RenderingContext.prototype (before
          Ebitengine binds it) and recorded allocations; the player wrote its first frames with WritePixels
          (read back through an OffscreenCanvas), then took the allocation of the right size that read
          those pixels back (temporary framebuffer + readPixels), and from then on called texSubImage2D(TEXTURE_2D,
          0, 0, 0, RGBA, UNSIGNED_BYTE, videoFrame) with the previous texture binding restored. When the
          texture was not found it reopened the source with RGBA frames at the same position. It worked
          in Chrome and Safari (the image read back was identical to the RGBA path in Chrome); Firefox
          was left on RGBA frames.
        measurements_m3: 'time per frame on the page''s one thread, inside ebiten.RunGame (Chrome with
          a window): RGBA path = copy into Go memory + WritePixels + texSubImage2D at flush = 0.9 ms at
          720p, 1.7 ms at 1080p, 9.4 ms at 4K; direct upload 1.1-1.7 ms at every size; a VideoFrame read
          back through a canvas 5.6-9 ms at 720p, 12 ms at 1080p, 50 ms at 4K. Firefox 720p - RGBA 1.9
          ms, direct 4.5 ms. Safari 720p - RGBA 1.3-1.7 ms plus the Go YUV-to-RGB conversion in the decoder,
          direct 3.8-5.4 ms. The RGBA path additionally makes the browser read every frame back from the
          GPU, off the page''s thread.'
        colour_caveat: with a direct upload the browser converts the frame; for untagged SD streams Safari
          and Firefox take BT.709 where the RGBA path follows the library's rule (BT.601).
  learned:
  - Ebitengine v2.10 builds with CGO_ENABLED=0 on darwin/arm64, and ebiten.NewImageWithOptions/WritePixels
    work before RunGame, so the player has headless tests.
  delivery_results:
    milestone:playback:
      result:
        status: delivered 2026-10-10
    milestone:ebitenvideo-seek:
      result:
        status: delivered 2026-10-09
