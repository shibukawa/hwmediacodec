id: milestone:display-order-rgba
type: milestone
title: Display-order decoding, RGBA/BGRA frames and the ebitenvideo player
summary: 'Third slice: decoded frames come back in display order through a Go-side reorder layer driven
  by picture order counts parsed from the bitstream; decoders emit and encoders accept RGBA/BGRA next
  to NV12 (VideoToolbox converts, Go swaps R/B where VideoToolbox cannot); and a separate Go module,
  ebitenvideo, plays elementary streams in Ebitengine with frame pacing. Serves the playback and both
  Ebitengine use cases from the requirement.'
lifecycle: active
authority: authored
aliases:
- reorder buffer
- 表示順デコード
- リオーダバッファ
- Ebitengine RGBA/BGRA
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: display-order-rgba
constraints:
- Display order is derived in Go from the bitstream (H.264/HEVC parameter sets and slice headers to
  picture order counts), so it works for any backend that emits decode order; VideoToolbox cannot be
  delegated the job (M1 experiment).
- Frames are held back no longer than the stream's reorder bound - num_reorder_frames (H.264 VUI) or
  sps_max_num_reorder_pics (HEVC), or for H.264 SPS without VUI bitstream_restriction the DPB size the
  level allows (clause A.3.1), which is 0 when the stream cannot reorder (pic_order_cnt_type 2, intra-only,
  constrained profiles with constraint_set3_flag).
- RGBA/BGRA frames are one plane with rows of exactly 4*Width bytes so that Planes[0] feeds ebiten.Image.WritePixels
  as is; the conversion stays in the backend, never in the public API.
- The core module never imports Ebitengine. ebitenvideo is a separate module (own go.mod) that depends
  on both hwmediacodec and Ebitengine; inside the repository a replace directive binds it to the working
  tree.
- Display order is the default; WithDecodeOrder restores the hardware order for latency-sensitive callers.
non_goals:
- Pure-Go NV12<->RGBA conversion (no backend needs it yet; the VideoToolbox backend converts).
- Frame-rate detection from VUI timing (the H.264 SPS parser reads it, the player takes fps as a parameter).
- Zero-copy textures (see requirement open question ebitengine-zero-copy).
- H.264 memory_management_control_operation 5, HEVC pic_output_flag 0, field-coded (interlaced) streams.
- Other platforms.
acceptance:
  display-order-exact:
    text: Decoding H.264 and HEVC streams with B-frames (b-pyramid, up to 8 consecutive) yields exactly
      ffmpeg's output sequence, frame for frame, including checksums.
    scope:
      milestone: display-order-rgba
    verified_by:
    - bframe-display-order-test
    - reorder-oracle-test
  reorder-bound:
    text: A stream that cannot reorder is never held back; otherwise at most num_reorder_frames frames
      wait, the buffer releases the lowest POC once it holds more than that, an IDR/BLA flushes the previous
      sequence first, and Flush releases everything in order before io.EOF.
    scope:
      milestone: display-order-rgba
    verified_by:
    - reorder-oracle-test
    - reorder-buffer-unit-test
  decode-order-option:
    text: WithDecodeOrder returns the same frame set in the order the hardware produces (not display
      order for a B-frame stream).
    scope:
      milestone: display-order-rgba
    verified_by:
    - decode-order-test
  rgba-output:
    text: WithOutputFormat(RGBA|BGRA) returns one tightly packed plane, alpha 255, RGBA the exact byte
      mirror of BGRA, within 30 dB (8x8-block PSNR) of ffmpeg's conversion for H.264 and HEVC.
    scope:
      milestone: display-order-rgba
    verified_by:
    - rgba-decode-test
  rgb-input:
    text: WithInputFormat(RGBA|BGRA) encodes packed frames; the stream declares the BT.709 matrix the
      hardware converted with, and ffmpeg's RGB decode of it is within 35 dB (8x8-block PSNR) of the source.
    scope:
      milestone: display-order-rgba
    verified_by:
    - rgb-encode-test
  ebitenvideo-player:
    text: The player shows frame k at k/fps on the game clock, starts its clock at the first decoded
      frame, skips frames when behind, reports the end, loops over an io.ReadSeeker without shortening
      the last frame, and delivers RGBA frames in display order from the decode goroutine.
    scope:
      milestone: display-order-rgba
    verified_by:
    - timeline-unit-test
    - player-hardware-test
  module-split:
    text: The core module has no Ebitengine dependency (go.mod unchanged apart from purego) and ebitenvideo
      builds with CGO_ENABLED=1 and 0 on darwin/arm64.
    scope:
      milestone: display-order-rgba
    verified_by:
    - module-build-check
