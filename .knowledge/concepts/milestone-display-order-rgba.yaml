history:
  accepted-2026-10-09:
    summary: Author asked for display-order decoding (reorder buffer) and RGBA/BGRA for Ebitengine, proposing
      that the Ebitengine-specific package live in its own go.mod depending on both; the proposal was
      adopted.
  delivered-2026-10-09:
    summary: Reorder layer, RGBA/BGRA on VideoToolbox decode and encode, ebitenvideo module with player
      and example, CLI flags, ffmpeg-oracle tests; all acceptance checks passed on the author's M3 with
      CGO_ENABLED=1 and 0.
  flush-drain-2026-10-12:
    summary: The reorder layer released buffered frames one by one as soon as Flush was called, so frames
      a backend hands over only after Flush (MediaCodec keeps a few in flight) came out unsorted at the
      end of the stream; Receive now drains the backend to io.EOF before releasing, found on the Android
      14 emulator (milestone:android-mediacodec).
  superseded-2026-10-16:
    summary: Folded into backend:videotoolbox, component:bitstream, component:core-api, component:display-order,
      component:playback on 2026-10-16 so that the current state of each backend and package is read from
      one concept; this file keeps the slice's definition and timeline.
