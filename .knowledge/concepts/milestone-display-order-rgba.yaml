open_questions:
  vui-less-h264-latency:
    text: H.264 streams without VUI bitstream_restriction (VideoToolbox's own encoder writes none) are
      held back by the level's DPB size (4 frames at 1080p level 4.0, 7 at 320x240) although they may
      have no B-frames. ffmpeg instead guesses a small bound and grows it when it sees out-of-order POCs,
      dropping frames at that moment. Should hwmediacodec adopt a heuristic, or stay spec-exact with WithDecodeOrder
      as the escape hatch?
    state: deferred
    resolution: 'Spec-exact for now: the latency only matters for live decoding of such streams, and
      a heuristic loses frames. Revisit if a live consumer needs display order from an untagged stream;
      the encoder side could also be asked for VUI (VideoToolbox has no such property).'
  untagged-hd-colour-matrix:
    text: VideoToolbox converted untagged 320x240 streams to RGB with BT.601. Which matrix it assumes for
      untagged HD streams (and whether ffmpeg agrees) is not measured.
    state: open
    resolution: Measure with a 1080p untagged stream before relying on RGB output colour accuracy in a
      consumer; the encoder tags its RGB-input streams with BT.709, so round trips through hwmediacodec
      are consistent either way.
  frame-rate-from-stream:
    text: The H.264 SPS parser already reads VUI timing_info; should the decoder expose the frame rate
      so that ebitenvideo.NewPlayer can default fps from the stream?
    state: deferred
    resolution: Deferred until the HEVC VUI parser exists (its timing info sits behind the short-term
      reference picture sets); an explicit fps parameter is enough for the author's streams.
facts:
  api:
    decoder: NewDecoder returns display order by default (reorder.Wrap around the backend unless it implements
      codec.DisplayOrderer); WithDecodeOrder() disables it; WithOutputFormat(NV12|RGBA|BGRA)
    encoder: WithInputFormat(NV12|RGBA|BGRA)
    pixel_formats: PixelFormat.PlaneCount(), PlaneLayout(i, w, h) (rows, rowBytes), FrameSize(w, h); RGBA/BGRA
      are one plane, 4 bytes per pixel, stride == 4*Width, alpha 255 out / ignored in
    order_keys: codec.Order{Seq, POC, Reorder} travels from Packet (SetPacketOrder) through the backend
      to Frame (SetFrameOrder); backends copy it blindly
    ebitenvideo: NewPlayer(r io.Reader, codec, fps, WithLoop|WithSoftwareFallback|WithPrefetch) -> Player{Play,
      Pause, IsPlaying, Update, Image, Size, Position, Skipped, Ended, Err, Close}; module github.com/shibukawa/hwmediacodec/ebitenvideo
    cli: decode -format nv12|rgba|bgra -decode-order; encode -format nv12|rgba|bgra; transcode now re-encodes
      in display order
  implementation:
    parsers: internal/h264 (SPS incl. VUI bitstream_restriction and timing, PPS, slice header up to the
      POC fields, POC types 0/1/2 incl. fields, MaxReorderFrames with the level table) and internal/hevc
      (SPS up to sps_max_num_reorder_pics, PPS, first slice segment header, POC with NoRaslOutputFlag);
      both skip scaling lists / profile_tier_level correctly
    tracker: internal/reorder.Tracker classifies each access unit - new sequence at IDR (H.264) or IRAP
      with NoRaslOutputFlag (HEVC IDR/BLA, CRA after reset or EOS), drops RASL pictures of such a CRA, unparseable
      pictures get a sequence of their own so they cannot block others
    buffer: internal/reorder.buffer releases the lowest POC of the oldest sequence when a newer sequence
      exists, when more than Reorder frames wait, or when draining after Flush
    videotoolbox_decode: destination pixel format from the requested output format; RGBA is decoded
      as BGRA and swapped in Go (swapRB) because 'RGBA' destinations fail at decode time with -6680; copyFrame
      is generic over PlaneLayout via bufferPlanes
    videotoolbox_encode: source pixel buffer attributes from the input format; RGBA input is swapped
      into BGRA buffers; the session's pixel buffer pool is looked up on every frame (VideoToolbox replaces
      it after the first RGB frame) and exhausted pools fall back to IOSurface-backed CVPixelBufferCreate;
      ColorPrimaries/TransferFunction/YCbCrMatrix set to ITU-R 709 for RGB input
    ebitenvideo: source.go decodes on a goroutine into a bounded channel (prefetch) in display order as
      RGBA; timeline.go paces by display index (clock starts at the first frame, loop rebases by the previous
      iteration's duration, late frames are skipped); player.go uploads with WritePixels into an Unmanaged
      ebiten.Image created lazily
  result:
    status: delivered 2026-10-09
    environment:
      host: Apple M3, macOS 27.0.1 (build 26A434)
      go: go1.27.0 darwin/arm64
      purego: github.com/ebitengine/purego v0.11.1
      ebiten: github.com/hajimehoshi/ebiten/v2 v2.10.4
      oracle: ffmpeg/ffprobe 9.0.1 (libx264, libx265 available)
      date: '2026-10-09'
    tests:
    - TestDecodeBFramesMatchesReference (h264 bf3/bf8, hevc bf3/bf6, exact order)
    - TestDecodeOrderOption
    - TestDecodeRGBA (h264/hevc x rgba/bgra)
    - TestEncodeRGBAInput (rgba, bgra)
    - TestTranscodeRoundTrip (now collects the frames the reorder buffer releases at Flush)
    - TestPixelFormatLayout
    - internal/reorder TestDisplayOrderMatchesTimestamps (6 streams), buffer unit tests, TestFlushResetsSequence
    - internal/h264 and internal/hevc parser tests
    - ebitenvideo timeline unit tests, TestSourceDeliversDisplayOrderRGBA, TestPlayerPlaysAndLoops
    - M1/M2 suites unchanged; all pass with CGO_ENABLED=1, CGO_ENABLED=0 and -race
    performance:
      h264_1080p_decode_fps_nv12_display_order: 782
      h264_1080p_decode_fps_bgra: 346
      h264_1080p_decode_fps_rgba: 254
      h264_1080p_decode_fps_nv12_decode_order: 796
      h264_1080p_encode_fps_nv12: 199
      h264_1080p_encode_fps_rgba: 182
      h264_1080p_encode_fps_bgra: 181
      note: cmd/hwmediacodec on an M3; decode of a 300-frame libx264 stream with 3 B-frames, encode of
        60 raw frames at 8 Mbit/s; the RGBA decode cost over BGRA is the Go R/B swap (about 1 ms per frame)
  learned:
  - VideoToolbox accepts 'RGBA' as a decompression destination and as CVPixelBufferCreate format at creation
    time but fails later with kCVReturnInvalidPixelFormat (-6680); BGRA is the packed format to use.
  - VTCompressionSessionGetPixelBufferPool must not be cached - with BGRA source attributes the pool is
    replaced after the first frame and the stale pool crashes (SIGSEGV) or stops delivering; non-IOSurface
    CVPixelBuffers then fail with kVTPixelTransferNotSupportedErr (-12905), so fallback buffers need kCVPixelBufferIOSurfacePropertiesKey.
  - The VideoToolbox encoder converts untagged BGRA input with BT.709 but writes no colour description
    unless the ColorPrimaries/TransferFunction/YCbCrMatrix properties are set; the decoder converts untagged
    320x240 streams with BT.601 (ffmpeg's default too).
  - VideoToolbox's hardware H.264 encoder writes no VUI bitstream_restriction and uses pic_order_cnt_type
    0, so its own streams decode with the DPB-size reorder latency; its HEVC output carries sps_max_num_reorder_pics
    (0 without B-frames, 2 with).
  - libx264 uses pic_order_cnt_type 2 without B-frames (no latency) and bitstream_restriction with num_reorder_frames
    2 for bframes=3 (b-pyramid); libx265 writes sps_max_num_reorder_pics 2 for bframes=3.
  - The hardware decoder rejects 64x48 pictures with kVTVideoDecoderMalfunctionErr (-12911); 96x64 works.
  - ffmpeg cannot be used as a timestamp oracle on raw elementary streams (pts N/A, and a -c copy remux
    fakes pts == dts); encoding straight to MP4 and extracting the Annex-B stream with h264_mp4toannexb/hevc_mp4toannexb
    gives real pts per access unit in decode order.
  - ffmpeg's RGB conversion of the same frames differs from VideoToolbox's by about 28 dB plain PSNR (chroma
    interpolation at sharp edges); averaging 8x8 blocks lifts the agreement to 35 dB while a wrong matrix
    stays at 25 dB and swapped channels at 4 dB.
  - Ebitengine v2.10 builds with CGO_ENABLED=0 on darwin/arm64, and ebiten.NewImageWithOptions/WritePixels
    work before RunGame, so the player has headless tests.
