id: milestone:display-order-rgba
type: milestone
title: Display-order decoding, RGBA/BGRA frames and the ebitenvideo player
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:bitstream, component:core-api, component:display-order,
  component:playback (keys prefixed dor-). Original summary: Third slice: decoded frames come back in
  display order through a Go-side reorder layer driven by picture order counts parsed from the bitstream;
  decoders emit and encoders accept RGBA/BGRA next to NV12 (VideoToolbox converts, Go swaps R/B where
  VideoToolbox cannot); and a separate Go module, ebitenvideo, plays elementary streams in Ebitengine
  with frame pacing. Serves the playback and both Ebitengine use cases from the requirement.'
lifecycle: superseded
authority: authored
aliases:
- reorder buffer
- 表示順デコード
- リオーダバッファ
- Ebitengine RGBA/BGRA
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: display-order-rgba
non_goals:
- Pure-Go NV12<->RGBA conversion (no backend needs it yet; the VideoToolbox backend converts).
- Frame-rate detection from VUI timing (the H.264 SPS parser reads it, the player takes fps as a parameter).
- Zero-copy textures (see requirement open question ebitengine-zero-copy).
- H.264 memory_management_control_operation 5, HEVC pic_output_flag 0, field-coded (interlaced) streams.
- Other platforms.
