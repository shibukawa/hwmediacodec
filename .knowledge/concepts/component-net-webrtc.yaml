id: component:net-webrtc
type: component
title: 'net/webrtc: one H.264 stream broadcast to browsers over WebRTC (pion), a module of its own'
summary: webrtc.Broadcaster is a hwmediacodec.PacketWriteCloser that hands every H.264 access unit to
  a pion track per viewer, signals with one HTTP POST of the SDP offer, starts each viewer at a keyframe
  and turns joins and RTCP PLI/FIR into keyframe requests. It is a separate Go module so that pion stays
  out of the core module. Consolidated on 2026-10-16 from milestone:net-webrtc and milestone:examples-webrtc.
lifecycle: active
authority: authored
aliases:
- webrtc package
- Broadcaster
- WebRTC 配信パッケージ
- pion
constraints:
- 'pion''s H.264 payloader takes Annex-B access units as they come from hwmediacodec: it splits on start
  codes, packs SPS/PPS into STAP-A, fragments large NAL units into FU-A and drops AUD and filler NAL units.'
- The track is offered as H.264 Constrained Baseline, packetization-mode 1 (profile-level-id 42e01f);
  the encoder is opened with ProfileBaseline, WithLowLatency and no B-frames; the keyframe interval is
  4 s because joiners get a keyframe on demand.
- Sample.Duration is the PTS gap at 90 kHz (first sample 1/fps), which is how TrackLocalStaticSample advances
  the RTP timestamp; peers that fail, disconnect or close are removed, a failed WriteSample removes the
  peer.
- Asked on 2026-10-10 where the pion dependency should live (core module, nested module, or not moving),
  the author chose the nested module. The import path is the same either way; go.work lists ./net/webrtc.
- 'ServeHTTP is the signalling endpoint only: any POST with a JSON session description is answered, other
  methods get 405, the path is not inspected. The sample mounts it at POST /offer and serves its page
  at /. The package no longer logs: a rejected offer is the HTTP error, a failing track drops the viewer.'
- Packet times are taken as 90 kHz units (capture.TimeScale) for the sample durations.
acceptance:
  exwebrtc-loopback-delivery:
    text: A pion viewer that posts an offer to /offer and receives the track gets, through pion's sample
      builder, access units equal NAL unit by NAL unit (ignoring AUD/filler) to the ones written, in order,
      all but possibly the last; written out as a raw stream they decode with ffmpeg to the source's frame
      MD5s; joining triggers a keyframe request and a PLI from the viewer triggers another.
    scope:
      milestone: examples-webrtc
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exwebrtc-broadcaster-test
  exwebrtc-start-at-keyframe:
    text: A viewer connected while the stream is in the middle of a GOP receives nothing until the next
      keyframe, which is its first access unit.
    scope:
      milestone: examples-webrtc
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exwebrtc-broadcaster-test
  webrtc-broadcaster:
    text: A pion viewer that posts an offer receives the access units of an ffmpeg-made stream, identical
      NAL unit by NAL unit and decodable by ffmpeg to the source's frame checksums; a late viewer starts
      at a keyframe; a PLI reaches the keyframe callback; a GET is answered 405.
    scope:
      milestone: net-webrtc
    verified_by:
    - webrtc-broadcaster-test
  webrtc-sample-follows:
    text: The webrtc sample serves its page at /, passes POST /offer to the broadcaster and answers 404
      elsewhere; it starts and answers over HTTP.
    scope:
      milestone: net-webrtc
    verified_by:
    - webrtc-page-test
    - webrtc-webrtc-boot-run
