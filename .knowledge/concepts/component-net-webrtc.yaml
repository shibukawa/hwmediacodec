open_questions:
  exwebrtc-latency-measurement:
    text: End-to-end glass-to-glass latency was not measured (the pane could not be filmed); jitter buffer
      and decode add about 10 ms, the encoder's low-latency path and display refresh the rest.
    state: open
    resolution: Measure with a timestamp overlay captured by a second camera or with the frame counter
      in the scene when a visible browser is available.
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  api:
    webrtc: NewBroadcaster(fps, iceServers, requestKeyframe) -> Broadcaster{ServeHTTP (/, POST /offer),
      Accept(offer) (*SessionDescription, error), WritePacket, Close, Viewers}; flags -addr -bitrate -fps
      -size -stun
    webrtc_webrtc: import github.com/shibukawa/hwmediacodec/net/webrtc; NewBroadcaster(fps, iceServers,
      requestKeyframe) -> Broadcaster{WritePacket, Close, ServeHTTP (POST offer), Accept(offer), Viewers}
  delivery_results:
    milestone:net-webrtc:
      result:
        status: delivered 2026-10-10
