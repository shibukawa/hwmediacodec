history:
  reworked-with-browser-2026-10-13:
    summary: While the browser slice (milestone:audio-webcodecs) was added on the same branch - the tests
      that take the codecs through MP4 files moved from mediacontainer/mp4 to the root package (audio_mp4_test.go,
      files through testutil so that they run in a browser); the ES_Descriptor parser moved to internal/aac
      for the browser backend; decoding was limited to 5.1 (3.0, 4.0, 5.0 and 5.1 are tested against ffmpeg;
      7.1 was mapped but never tested, and its AAC form has front pairs where common 7.1 has rear ones).
  planned-2026-10-13:
    summary: The author asked whether audio decoding and encoding could be added, then about AAC licensing
      and about how far the library should go with sound; the scope in decision:audio-codecs was agreed
      and this slice (core audio on macOS and iOS plus MP4 tracks) started on "それでお願いします".
  implemented-2026-10-13:
    summary: Public audio API, AudioToolbox backend for AAC (LC and HE decode, LC encode) and Opus, encoding/adts,
      MP4 audio tracks with edit lists, ffmpeg and afconvert based tests, iOS Simulator run. Found on
      the way - the Opus encoder's VoIP default, the HE-AAC decoder's 962-sample lag, the Opus decoder's
      missing first 120 samples, ffmpeg's handling of edit ends for Opus and behind empty edits.
  superseded-2026-10-16:
    summary: Folded into component:audio on 2026-10-16 so that the current state of each backend and package
      is read from one concept; this file keeps the slice's definition and timeline.
