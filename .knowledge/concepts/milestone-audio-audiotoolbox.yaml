id: milestone:audio-audiotoolbox
type: milestone
title: Audio codecs (AAC, Opus) on macOS and iOS through AudioToolbox, with MP4 audio tracks
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:audio (keys prefixed audioat-). Original summary: First audio slice, requested
  on 2026-10-13 and scoped by decision:audio-codecs: NewAudioDecoder and NewAudioEncoder in the root package
  with AudioFormat and AudioFrame, an AudioToolbox backend (AudioConverter through purego) for AAC and
  Opus on darwin, encoding/adts, and audio tracks in mediacontainer/mp4 (AudioTrack and AudioPacketSource
  for reading, AddAudioTrack for encoder packets, with the encoder delay in the edit list and empty edits
  for tracks that start later). Verified against ffmpeg in both directions on an Apple M3 and by round
  trips in the iOS Simulator. Synchronised playback with sound is the next slice.'
lifecycle: superseded
authority: authored
aliases:
- audio support
- 音声対応
- AAC
- Opus
- AudioToolbox
- AudioConverter
- NewAudioDecoder
- NewAudioEncoder
- AudioFormat
scope:
  platform:
  - darwin
  - ios
  milestone: audio-audiotoolbox
non_goals:
- Synchronised playback, sound output and the playback/ebitenvideo changes (the next audio slice, see
  decision:audio-codecs).
- Audio on Android, Windows, Linux and in the browser (ErrUnsupported there until their slices).
- Resampling, channel mixing, microphone capture, audio devices.
- Encoding more than two channels, HE-AAC encoding, Opus encoding at rates other than 48 kHz, Opus with
  channel mapping family 1 (surround).
- Reading the encoder delay from iTunes metadata (iTunSMPB); only the edit list is read, so afconvert's
  files report Delay 0.
- The 'roll' sample group that the Opus-in-ISOBMFF mapping recommends (ffmpeg and this package's own demuxer
  do not need it).
- Audio in the fMP4 segmenter and in HLS, and Opus for the WebRTC broadcaster.
- Applying an empty edit when demuxing (deferred question demux-empty-edit in decision:audio-codecs).
