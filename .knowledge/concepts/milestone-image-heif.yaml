id: milestone:image-heif
type: milestone
title: image/heif and image/avif - HEIC and AVIF as image format packages of the core module
summary: 'The HEIF reader and writer of the samples (examples/heif) moved to the core module as github.com/shibukawa/hwmediacodec/image/heif
  and gained the conventions of the standard image packages: Decode(io.Reader) (image.Image, error), DecodeConfig(io.Reader)
  (image.Config, error), Encode(w, img, *Options) and registration with image.RegisterFormat, so a blank
  import makes image.Decode read HEIC and AVIF. The former Decode(data, opts...) is DecodeBytes; DecodeInfo
  describes a file without decoding.'
lifecycle: active
revision_note: 'Split the same day into image/heif (HEVC only) and image/avif (AV1 only) over internal/imageitem;
  see the split-2026-10-10 history entry. The summary describes the first, combined form.'
authority: authored
aliases:
- heif package
- HEIC
- AVIF
- image.Decode HEIC
- image 互換
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: image-heif
constraints:
- 'The author made the image/heif path conditional on the package being usable like a standard image
  format, not only a parser; hence Decode/DecodeConfig/RegisterFormat and the *Options argument of Encode
  (nil means defaults, as jpeg.Encode).'
- 'Formats are registered by major brand after "????ftyp": image/heif registers heic, heix, hevc, hevx,
  heim, heis, hevm, hevs as "heic"; image/avif registers avif, avis as "avif". The generic mif1 and msf1
  do not name the codec: internal/imageitem registers them once as "heif" when either package is linked
  and dispatches by the primary item''s type, answering with an error that names the missing package when
  the codec''s package is not linked.'
- 'Each package reads only its codec: heif.Decode of an AVIF file (and the reverse) fails with an error
  naming the other package, checked from the boxes before a decoder is opened. Info and Options are declared
  in both packages (no Codec field any more); the shared code is internal/imageitem.'
- 'Colours: the hardware decoder converts to RGB from what the bitstream declares. An HEVC item whose SPS
  has no video_signal_type while the item has a colr nclx property (gen2brain/h265 writes full-range BT.601
  that way) is decoded to NV12 and converted in Go with the nclx matrix and range; before this such files
  came out with stretched contrast (220 read as 234). Found by letting the hardware decoder read the pure-Go
  encoder''s files in the imgconv tests.'
- 'Decode has no context or option parameter (the image package signature): it uses context.Background
  and hardware codecs only. DecodeBytes takes hwmediacodec.DecoderOption values (software fallback).'
- 'DecodeConfig and DecodeInfo use only the boxes: ispe of the primary item or the grid descriptor,
  then clap and irot in their stored order, so they need no decoder. The tests require them to predict
  exactly what DecodeBytes returns for every file decoded.'
- 'Decoding needs a hardware HEVC or AV1 decoder, so image.Decode fails on machines without one (the
  error wraps hwmediacodec.ErrUnsupported). Output is opaque *image.RGBA; alpha (auxiliary items), 10-bit
  and 4:4:4 pictures are not handled.'
non_goals:
- Alpha planes, 10-bit/HDR photos, image sequences, Exif/XMP items, thumbnails.
- A software decoder of its own.
acceptance:
  image-package:
    text: For every HEIC and AVIF file the tests decode (written by this package as single, odd-sized,
      grid, rotated and rotated-grid pictures, written by ImageIO, written by ffmpeg with libsvtav1), image.DecodeConfig
      reports the format and the size of the decoded picture, image.Decode returns the same pixels as
      DecodeBytes, and DecodeInfo equals the Info DecodeBytes returns.
    scope:
      milestone: image-heif
    verified_by:
    - heif-test
  encode-defaults:
    text: Encode with nil options writes a HEIC file that image.Decode reads back within 30 dB of the
      source.
    scope:
      milestone: image-heif
    verified_by:
    - heif-test
  garbage:
    text: Empty, text and zero input is rejected by DecodeBytes, Decode, DecodeConfig and image.Decode.
    scope:
      milestone: image-heif
    verified_by:
    - heif-test
  heifconv:
    text: heifconv writes a tiled, rotated HEIC from a PNG, prints its structure with -info without decoding
      and converts it back to a PNG of the rotated size.
    scope:
      milestone: image-heif
    verified_by:
    - heifconv-run
