open_questions:
  real-phone-photos:
    text: iPhone photos are 10-bit HDR by default on recent models and carry auxiliary items; how far
      should the decoder go (tone-mapped 8-bit output, alpha)?
    state: open
facts:
  api:
    heif: 'import github.com/shibukawa/hwmediacodec/image/heif (blank import registers heic, avif, heif);
      Decode(io.Reader) (image.Image, error); DecodeConfig(io.Reader) (image.Config, error); DecodeBytes(data,
      ...hwmediacodec.DecoderOption) (*image.RGBA, *Info, error); DecodeInfo(data) (*Info, error); Encode(w,
      img, *Options{Codec, Quality, TileSize, Rotation, Software}) error; Info{Codec, Width, Height, Tiles,
      Rotation, Mirror}'
  result:
    status: delivered 2026-10-10
history:
  delivered-2026-10-10:
    summary: The author proposed image/heif provided the package offers image-compatible use rather than
      a parser only, then asked for the image compatibility.
