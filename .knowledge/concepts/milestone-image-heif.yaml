id: milestone:image-heif
type: milestone
title: image/heif and image/avif - HEIC and AVIF as image format packages of the core module
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:image (keys prefixed heif-). Original summary: The HEIF reader and writer of the
  samples (examples/heif) moved to the core module as github.com/shibukawa/hwmediacodec/image/heif and
  gained the conventions of the standard image packages: Decode(io.Reader) (image.Image, error), DecodeConfig(io.Reader)
  (image.Config, error), Encode(w, img, *Options) and registration with image.RegisterFormat, so a blank
  import makes image.Decode read HEIC and AVIF. The former Decode(data, opts...) is DecodeBytes; DecodeInfo
  describes a file without decoding. Revision note: Split the same day into image/heif (HEVC only) and
  image/avif (AV1 only) over internal/imageitem; see the split-2026-10-10 history entry. The summary describes
  the first, combined form.'
lifecycle: superseded
authority: authored
aliases:
- heif package
- HEIC
- AVIF
- image.Decode HEIC
- image 互換
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: image-heif
non_goals:
- Alpha planes, 10-bit/HDR photos, image sequences, Exif/XMP items, thumbnails.
- A software decoder of its own.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:examples-heif-avif
- relation: follows
  to: milestone:package-layout
- relation: superseded_by
  to: component:image
history:
  delivered-2026-10-10:
    summary: The author proposed image/heif provided the package offers image-compatible use rather than
      a parser only, then asked for the image compatibility.
  split-2026-10-10:
    summary: The author asked for image/avif and image/heif to be separate packages; the code moved to
      internal/imageitem with a codec filter, and the colr-only colour signalling fix followed from the
      imgconv fallback tests (milestone:imgconv-fallback).
  superseded-2026-10-16:
    summary: Folded into component:image on 2026-10-16 so that the current state of each backend and package
      is read from one concept; this file keeps the slice's definition and timeline.
