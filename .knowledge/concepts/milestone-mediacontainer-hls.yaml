id: milestone:mediacontainer-hls
type: milestone
title: net/hls - the live HLS playlist server as a package of the core module
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:net-hls (keys prefixed hls-). Original summary: The sliding-window playlist of
  the HLS sample (examples/hls/server.go, package main) moved to the core module as github.com/shibukawa/hwmediacodec/net/hls:
  Playlist is fed by mp4.Segmenter (SetInit, Add), renders the media playlist and is an http.Handler for
  index.m3u8, init.mp4 and seg_N.m4s, all from memory. The hls.js player page stayed in the sample (examples/hls/page.go).'
lifecycle: superseded
authority: authored
aliases:
- hls package
- HLS playlist
- HLS 配信パッケージ
scope:
  milestone: mediacontainer-hls
non_goals:
- Low-latency HLS (partial segments, blocking playlist reload), multi-variant playlists, DASH, writing
  segments to disk.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:mediacontainer-mp4
- relation: follows
  to: milestone:examples-screencast-hls
- relation: superseded_by
  to: component:net-hls
history:
  delivered-2026-10-10:
    summary: The author asked for the HLS code to move as net/hls after the MP4 package.
  moved-2026-10-10:
    summary: Moved from mediacontainer/hls to net/hls the same day at the author's request; the milestone
      id keeps the first path.
  superseded-2026-10-16:
    summary: Folded into component:net-hls on 2026-10-16 so that the current state of each backend and
      package is read from one concept; this file keeps the slice's definition and timeline.
