id: milestone:mediacontainer-hls
type: milestone
title: net/hls - the live HLS playlist server as a package of the core module
summary: 'The sliding-window playlist of the HLS sample (examples/hls/server.go, package main) moved
  to the core module as github.com/shibukawa/hwmediacodec/net/hls: Playlist is fed by mp4.Segmenter
  (SetInit, Add), renders the media playlist and is an http.Handler for index.m3u8, init.mp4 and seg_N.m4s,
  all from memory. The hls.js player page stayed in the sample (examples/hls/page.go).'
lifecycle: active
authority: authored
aliases:
- hls package
- HLS playlist
- HLS 配信パッケージ
scope:
  milestone: mediacontainer-hls
constraints:
- 'Standard library only (net/http) plus mediacontainer/mp4 for the Segment type; no new module dependency.'
- 'The player page is not part of the package: it loads hls.js from a CDN, which a library handler should
  not serve by default. The sample wraps the Playlist (withPage) and serves the page at / itself; the
  package answers 404 there.'
- 'ServeHTTP goes by the last path element instead of the exact paths /index.m3u8, /init.mp4, /seg_N.m4s
  the sample used, so the handler can be mounted under a prefix (http.Handle("/live/", playlist)); the
  URIs in the playlist were already relative. This is the only behaviour change of the move.'
- 'Access-Control-Allow-Origin: * is kept on every response: a player page on another origin has to fetch
  the playlist and the segments with CORS.'
non_goals:
- Low-latency HLS (partial segments, blocking playlist reload), multi-variant playlists, DASH, writing
  segments to disk.
acceptance:
  playlist-server:
    text: The handler answers 503 before the first segment, serves the m3u8 with the required tags, init.mp4
      and seg_N.m4s with the right content types, 404 for unknown paths, keeps a sliding window, and after
      End ffprobe reads the whole stream over HTTP (150 frames).
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - playlist-test
  mounted:
    text: Mounted under /live/cam1/ the playlist, the init segment and a media segment are served.
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - playlist-test
  sample-follows:
    text: The hls sample serves its page at / and the stream through the package; a live run is readable
      by ffprobe.
    scope:
      milestone: mediacontainer-hls
    verified_by:
    - page-test
    - hls-live-run
