open_questions:
  pixel-buffer-copy-cost:
    text: Input frames are copied into a pool CVPixelBuffer (about 3 MB per 1080p frame). Is the copy
      or the hardware the limit at ~200 fps 1080p, and is a zero-copy path (CVPixelBufferCreateWithPlanarBytes
      or IOSurface) worth it?
    state: deferred
    resolution: 'Deferred: 200 fps exceeds the batch-transcode need today. Revisit when a profile shows
      the copy dominating or when the Ebitengine path needs RGBA input.'
  avcc-output:
    text: Should the encoder offer AVCC/HVCC output and expose the parameter sets separately for MP4/fMP4
      muxing?
    state: deferred
    resolution: Deferred to the HLS/packaging prototype; the Annex-B output plus annexb.Split is enough
      until a muxer consumer exists.
facts:
  api:
    encoder: NewEncoder(ctx, codec, width, height, opts...) -> Encoder{Send(ctx, *Frame) error; Receive(ctx)
      (Packet, error); Flush(ctx) error; Close() error}
    options: WithFrameRate, WithBitrate, WithRateControl(VBR|CBR), WithQuality, WithKeyframeInterval,
      WithBFrames, WithLowLatency, WithProfile, WithInputFormat; shared WithSoftwareFallback and WithTimeScale
      (Option satisfies DecoderOption and EncoderOption)
    frame: Frame.ForceKeyframe is an encoder input; caller-owned frames may be reused after Send returns
    packet: Packet{Data (Annex-B AU), PTS, DTS, Keyframe}; DTS == PTS without B-frames
    option_types: DecoderOption/EncoderOption changed from func types to interfaces (ApplyDecoder/ApplyEncoder)
      so that one option value can serve both constructors
  implementation:
    package: internal/videotoolbox/encoder.go plus bindings in internal/videotoolbox/sys/sys_encode.go
    session: VTCompressionSessionCreate with Require/EnableHardwareAcceleratedVideoEncoder and optional
      EnableLowLatencyRateControl; properties RealTime, AllowFrameReordering, ProfileLevel, ExpectedFrameRate,
      AverageBitRate or ConstantBitRate, Quality, MaxKeyFrameInterval; PrepareToEncodeFrames; pixel buffers
      from VTCompressionSessionGetPixelBufferPool
    callback: one purego.NewCallback shared by all encoders; encoders found by integer refcon; sourceFrameRefCon
      carries the input PTS; samples CFRetained in the callback and converted in Receive
    conversion: CMBlockBufferCopyDataBytes -> walk NAL length prefixes (size from CMVideoFormatDescriptionGet*ParameterSetAtIndex)
      -> Annex-B; keyframe detected from NAL types; parameter sets cached per format description (retained)
    keyframes: kVTEncodeFrameOptionKey_ForceKeyFrame on Frame.ForceKeyframe, on the first frame after
      Flush and on every KeyframeInterval-th frame counted from start/Flush (so low-latency mode, whose
      GOP is infinite, still honours the interval)
    backpressure: Send returns ErrAgain when 64 packets are waiting; Flush = VTCompressionSessionCompleteFrames(kCMTimeInvalid),
      blocking
    probe: 'VTCopySupportedPropertyDictionaryForEncoder(1920, 1080, codec, {RequireHardwareAcceleratedVideoEncoder:
      true}) == noErr'
  result:
    status: delivered 2026-10-09
    environment:
      host: Apple M3, macOS 27.0.1 (build 26A434)
      go: go1.27.0 darwin/arm64
      purego: github.com/ebitengine/purego v0.11.1
      oracle: ffmpeg/ffprobe 9.0.1 (libx264, libx265 available)
      date: '2026-10-09'
    tests:
    - TestEncodeMatchesSource (h264, hevc)
    - TestTranscodeRoundTrip
    - TestEncodeKeyframeInterval
    - TestEncodeForceKeyframe
    - TestEncodeBFrames (h264, hevc)
    - TestEncodeBitrateControl
    - TestEncodeQuality
    - TestEncodeLowLatency
    - TestEncodeProfiles
    - TestEncodeFlushAndReuse
    - TestEncodeInvalidInput
    - TestProbe
    - TestUnsupportedCodec
    - TestUnsupportedInputFormat
    - TestEncoderOptionValidation
    - TestSharedOptions
    - M1 decode tests unchanged and passing
    performance:
      h264_1080p_encode_fps: 207
      hevc_1080p_encode_fps: 186
      transcode_h264_to_hevc_1080p_fps: 177
      note: cmd/hwmediacodec encode/transcode, 120 (encode) and 300 (transcode) frames of testsrc2, 8/6
        Mbit/s VBR, M3, including the NV12 copy into the pool buffer and reading the raw input from disk
      low_latency_720p: 'EnableLowLatencyRateControl: 245 fps (RealTime false) / 306 fps (RealTime true)
        vs 399 fps default; RealTime alone does not change throughput'
  learned:
  - purego v0.11.1 passes a 24-byte CMTime by value on darwin/arm64 (copied to memory, pointer in a register
    per AAPCS64) and on amd64 (stack); declaring sys.CMTime parameters in the Go signature is enough.
  - The compression output callback runs on a VideoToolbox thread; purego.NewCallback handles it with
    CGO_ENABLED=1 and, through fakecgo, with CGO_ENABLED=0, and the mutex split (mu vs outMu) is race-detector
    clean.
  - VideoToolbox samples are AVCC/HVCC with 4-byte length prefixes and never contain parameter sets; CMVideoFormatDescriptionGetH264/HEVCParameterSetAtIndex
    supplies SPS/PPS/VPS for Annex-B keyframes.
  - kVTCompressionPropertyKey_RealTime=true does not throttle to the frame rate on an M3 (same fps as
    false), so WithLowLatency keeps it on as Apple advises for live sources.
  - EnableLowLatencyRateControl makes the GOP infinite and disables reordering; a Go-side ForceKeyFrame
    every N frames restores a fixed GOP for HLS. It costs roughly 25-40% throughput at 720p.
  - VTCopySupportedPropertyDictionaryForEncoder with RequireHardwareAcceleratedVideoEncoder is a cheap,
    session-free hardware probe.
  - VBR AverageBitRate undershoots on simple content (2 Mbit/s target gave 1.37 Mbit/s); ConstantBitRate
    (macOS 13+) lands within 5% of the target.
  - CMSampleBufferGetSampleTimingInfo returns a valid DTS only when frame reordering is on; otherwise
    DTS is set equal to PTS by the backend.
  - Hardware H.264/HEVC at 1 Mbit/s 320x240 reaches ~50 dB luma PSNR against the testsrc2 source, so a
    30 dB threshold is a safe conformance gate.
