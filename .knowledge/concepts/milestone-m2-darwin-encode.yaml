id: milestone:m2-darwin-encode
type: milestone
title: M2 - H.264/HEVC encode on macOS via VideoToolbox
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in backend:videotoolbox, component:core-api (keys prefixed m2-). Original summary: Second slice:
  an Encoder API (Send/Receive/Flush, mirroring the Decoder) and a VideoToolbox VTCompressionSession backend
  that turns caller-owned NV12 frames into Annex-B H.264/HEVC access units with the streaming controls
  from the requirement (bitrate VBR/CBR, constant quality, keyframe interval, forced keyframes, B-frames
  on/off, low-latency mode, profile, in-band parameter sets). Unlocks batch transcode end to end on one
  Tier 1 platform.'
lifecycle: superseded
authority: authored
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: m2
non_goals:
- AVCC/HVCC output
- RGBA/BGRA input (Ebitengine path)
- AV1
- display-order decoding
- other platforms
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: uses_backend
  to: backend:videotoolbox
- relation: tests_decision
  to: decision:ffi-strategy
- relation: follows
  to: milestone:m1-darwin-h264-decode
- relation: superseded_by
  to: backend:videotoolbox
- relation: superseded_by
  to: component:core-api
history:
  accepted-2026-10-09:
    summary: Author asked for macOS encode as the slice after M1 ("つぎはmacのencode").
  delivered-2026-10-09:
    summary: Encoder API, VideoToolbox VTCompressionSession backend, encode/transcode CLI and ffmpeg/ffprobe-based
      conformance tests delivered; all acceptance checks passed on the author's M3 Mac with CGO_ENABLED=1
      and 0.
  superseded-2026-10-16:
    summary: Folded into backend:videotoolbox, component:core-api on 2026-10-16 so that the current state
      of each backend and package is read from one concept; this file keeps the slice's definition and
      timeline.
