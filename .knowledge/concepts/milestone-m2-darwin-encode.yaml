id: milestone:m2-darwin-encode
type: milestone
title: M2 - H.264/HEVC encode on macOS via VideoToolbox
summary: 'Second slice: an Encoder API (Send/Receive/Flush, mirroring the Decoder) and a VideoToolbox
  VTCompressionSession backend that turns caller-owned NV12 frames into Annex-B H.264/HEVC access units
  with the streaming controls from the requirement (bitrate VBR/CBR, constant quality, keyframe interval,
  forced keyframes, B-frames on/off, low-latency mode, profile, in-band parameter sets). Unlocks batch
  transcode end to end on one Tier 1 platform.'
lifecycle: active
authority: authored
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: m2
constraints:
- CGO_ENABLED=0; CMTime arguments of VTCompressionSessionEncodeFrame/CompleteFrames are passed by value
  through purego struct support.
- Input frames are NV12 owned by the caller and copied into a CVPixelBuffer from the session pool before
  Send returns.
- Output is Annex-B with VPS/SPS/PPS prepended to every keyframe; packets are returned in decode order
  with PTS and DTS.
- Unsupported controls (profile not defined for the codec, CBR before macOS 13, quality mode rejected
  by the encoder) are reported as ErrUnsupported, never silently ignored.
non_goals:
- AVCC/HVCC output
- RGBA/BGRA input (Ebitengine path)
- AV1
- display-order decoding
- other platforms
acceptance:
  encode-decodable:
    text: ffmpeg decodes the encoded stream to the same frame count as the source and every frame has
      luma PSNR of at least 30 dB against the source.
    scope:
      milestone: m2
    verified_by:
    - encode-reference-test
  inband-parameter-sets:
    text: Every keyframe packet carries SPS/PPS (and VPS for HEVC) in band and Packet.Keyframe agrees
      with ffprobe key_frame.
    scope:
      milestone: m2
    verified_by:
    - encode-reference-test
  keyframe-control:
    text: WithKeyframeInterval(n) produces a keyframe at every n-th frame; Frame.ForceKeyframe produces
      a keyframe at that frame and nowhere else.
    scope:
      milestone: m2
    verified_by:
    - keyframe-interval-test
    - force-keyframe-test
  rate-control:
    text: A higher VBR bitrate yields a proportionally larger stream, CBR holds the target bitrate, and
      quality mode trades size for PSNR.
    scope:
      milestone: m2
    verified_by:
    - bitrate-test
    - quality-test
  bframes-and-low-latency:
    text: WithBFrames yields B-frames delivered in decode order with monotonic DTS; WithLowLatency yields
      no B-frames, honours the keyframe interval and decodes correctly.
    scope:
      milestone: m2
    verified_by:
    - bframes-test
    - low-latency-test
  profiles:
    text: WithProfile selects Baseline/Main/High for H.264 and Main for HEVC as reported by ffprobe; undefined
      combinations report ErrUnsupported.
    scope:
      milestone: m2
    verified_by:
    - profile-test
  transcode-roundtrip:
    text: Hardware decode of a hardware-encoded stream reproduces the source frames (luma PSNR of at least
      30 dB).
    scope:
      milestone: m2
    verified_by:
    - transcode-test
  probe-encode:
    text: Probe() on Apple Silicon reports videotoolbox encode for h264 and hevc with hardware=true.
    scope:
      milestone: m2
    verified_by:
    - probe-test
  cross-build:
    text: CGO_ENABLED=0 go build ./... succeeds for darwin, linux and windows on amd64 and arm64.
    scope:
      milestone: m2
    verified_by:
    - cross-build-check
