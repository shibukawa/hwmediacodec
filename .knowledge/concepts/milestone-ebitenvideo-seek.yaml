id: milestone:ebitenvideo-seek
type: milestone
title: ebitenvideo - packet sources with timestamps, seeking and length
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:playback (keys prefixed seek-). Original summary: ebitenvideo gains a Source interface
  (access units with presentation times) and a Seeker interface (keyframe seek, length), NewPlayerFromSource,
  Player.Seek/Length/Seekable, and an end marker so a seekable player can be resumed after the end. NewPlayer
  keeps its signature: a raw stream becomes a streamSource whose frames are timed by output order (B-frames!)
  and which seeks when the reader is an io.ReadSeeker by scanning once for keyframe offsets, using the
  new annexb.Reader.Offset. examples/container.VideoTrack.PacketSource implements both interfaces for
  MP4; the texture sample and the ebitenvideo example seek with the arrow keys.'
lifecycle: superseded
authority: authored
aliases:
- ebitenvideo seek
- Source interface
- シーク対応
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: ebitenvideo-seek
non_goals:
- Keyframe-only (fast) seeking mode, trick play, audio, frame-accurate seeking inside open GOPs beyond
  what dropping frames before the target gives, seeking raw AV1/IVF streams.
