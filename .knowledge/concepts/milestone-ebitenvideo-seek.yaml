id: milestone:ebitenvideo-seek
type: milestone
title: ebitenvideo - packet sources with timestamps, seeking and length
summary: 'ebitenvideo gains a Source interface (access units with presentation times) and a Seeker
  interface (keyframe seek, length), NewPlayerFromSource, Player.Seek/Length/Seekable, and an end
  marker so a seekable player can be resumed after the end. NewPlayer keeps its signature: a raw stream
  becomes a streamSource whose frames are timed by output order (B-frames!) and which seeks when the
  reader is an io.ReadSeeker by scanning once for keyframe offsets, using the new annexb.Reader.Offset.
  examples/container.VideoTrack.PacketSource implements both interfaces for MP4; the texture sample and
  the ebitenvideo example seek with the arrow keys.'
lifecycle: active
authority: authored
aliases:
- ebitenvideo seek
- Source interface
- シーク対応
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: ebitenvideo-seek
constraints:
- 'Source{Codec(), ReadPacket() (data, pts time.Duration, error)}; Seeker{SeekKeyframe(t) (keyframe
  time, error), Length()}; the decoder runs with WithTimeScale(1e6) so presentation times round-trip through
  Packet.PTS / Frame.PTS in microseconds.'
- 'Raw elementary streams are timed after decoding: frame k out of the decoder (display order) is at
  k/fps, counting from the keyframe index a seek landed on (a keyframe''s decode-order index equals its
  display-order index). Timing packets by decode-order index was wrong for B-frame streams (the first
  attempt did that and frame 1 came out at 2/fps).'
- 'Seek protocol: Player.Seek bumps a generation counter, posts a request (newest wins), resets the timeline
  clock to the target and stops it until the first frame of the new generation arrives; the decode goroutine
  flushes and discards, calls SeekKeyframe, then decodes and drops frames before the target (precise seek).
  Items carry gen/loop/rebase; the player releases items of older generations. An end marker item (no
  frame) tells the player a generation finished; with a Seeker the goroutine then waits for the next
  seek instead of exiting, so seeking after the end resumes playback.'
- 'annexb.Reader.Offset reports the stream offset of the three-byte start code of the last access unit
  (one byte into a four-byte start code); the stream source scans the whole file once (annexb.Split +
  IsKeyframe) to build index->offset pairs and Length = count/fps.'
- 'PacketSource.Length is the presentation length (max PTS+duration minus the edit-list offset), not the
  decode-time duration, which is one B-frame delay shorter.'
- NewPlayer still handles H.264/HEVC Annex-B only; AV1 plays through a Source (MP4 demuxer).
non_goals:
- Keyframe-only (fast) seeking mode, trick play, audio, frame-accurate seeking inside open GOPs beyond
  what dropping frames before the target gives, seeking raw AV1/IVF streams.
acceptance:
  source-seek-exact:
    text: On a 90-frame H.264 B-frame stream (keyframes every 25) the first frame after a seek to 2 s is
      frame 60 (keyframe 50 decoded from, 50..59 dropped) and matches ffmpeg's frame 60 within 30 dB block
      PSNR; a seek between frames gives the first frame at or after the target; a seek onto a keyframe
      gives it; a seek past the end gives only the end marker; a later seek resumes; Length is 3 s after
      the scan.
    scope:
      milestone: ebitenvideo-seek
    verified_by:
    - source-seek-test
  player-seek:
    text: Player.Seek sets Position to the target at once, the clock resumes with the first frame after
      it, Length reports 3 s, seeking past the end ends playback and seeking back resumes it, and a
      non-seekable reader reports ErrNotSeekable and Length 0.
    scope:
      milestone: ebitenvideo-seek
    verified_by:
    - player-seek-test
  timeline-reset:
    text: After reset the clock sits at the target and does not run until a frame of the new generation
      arrives; frames then show relative to the target.
    scope:
      milestone: ebitenvideo-seek
    verified_by:
    - timeline-unit-test
  packet-source:
    text: PacketSource delivers every sample with presentation times starting at 0, Length 2 s for a
      60-frame 30 fps track, and SeekKeyframe lands on the sync sample at or before the target (1.5 s ->
      1.333 s sample 40; past the end -> the last keyframe) with that sample read next.
    scope:
      milestone: ebitenvideo-seek
    verified_by:
    - packet-source-test
  annexb-offset:
    text: Offset points at the start code of the returned access unit and re-reading from it yields the
      same access unit, also through a one-byte-at-a-time reader.
    scope:
      milestone: ebitenvideo-seek
    verified_by:
    - annexb-offset-test
