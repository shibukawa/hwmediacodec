open_questions:
  next-candidates:
    text: Which other sample code should follow - the HLS playlist server (examples/hls/server.go, standard
      library only, depends on mp4.Segment), the HEIC/AVIF codec (examples/heif, mp4ff) or the WebRTC broadcaster
      (pion)?
    state: open
    resolution: The HLS playlist followed on 2026-10-10 (milestone:mediacontainer-hls); heif is discussed
      as image/heif, pending a standard-library-style API (delivered, milestone:image-heif).
  ivf-annexb-placement:
    text: annexb and ivf sit at the module root while MP4 is under mediacontainer; should ivf move or
      be aliased there for consistency?
    state: resolved
    resolution: Moved without aliases on 2026-10-10 (milestone:package-layout) - ivf to mediacontainer/ivf,
      annexb to encoding/annexb.
facts:
  api:
    mp4: 'import github.com/shibukawa/hwmediacodec/mediacontainer/mp4; Open(path) / NewDemuxer(io.ReadSeeker)
      -> Demuxer{Video, Others, Duration, Close}; VideoTrack{Packet, AccessUnit, Keyframes, KeyframeAtOrBefore,
      FrameRate, PacketSource, ElementaryStream}; Create(path) / NewMuxer(io.WriteSeeker) -> Muxer{AddVideoTrack,
      AddPassthroughTrack, Close}; CreateVideoFile(path, codec, timeScale); NewSegmenter(codec, timeScale,
      target, onInit, onSegment)'
  result:
    status: delivered 2026-10-10
history:
  delivered-2026-10-10:
    summary: After capture, the author asked what else in the samples was generally useful, accepted the
      mp4ff dependency and proposed the mediacontainer/mp4 path; the package moved with its tests.
