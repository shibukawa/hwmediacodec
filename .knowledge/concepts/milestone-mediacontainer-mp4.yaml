id: milestone:mediacontainer-mp4
type: milestone
title: mediacontainer/mp4 - the MP4 demuxer, muxer and fMP4 segmenter as a package of the core module
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:mediacontainer (keys prefixed mp4-). Original summary: The MP4 glue of the samples
  (examples/container: demuxer handing out Annex-B access units, progressive muxer fed with encoder packets,
  passthrough tracks, PacketSource for ebitenvideo, VideoFile sink, CMAF/fMP4 Segmenter) moved to the
  core module as github.com/shibukawa/hwmediacodec/mediacontainer/mp4, package mp4. The core module now
  requires github.com/Eyevinn/mp4ff; the author decided that this dependency is acceptable. The code is
  unchanged apart from the package name, the mp4ff import alias and the error prefix.'
lifecycle: superseded
authority: authored
aliases:
- mp4 package
- mediacontainer
- MP4 demuxer
- MP4 muxer
- container パッケージの正式機能化
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: mediacontainer-mp4
non_goals:
- Fragmented MP4 input, MKV, MPEG-TS.
- Moving examples/hls.Playlist, examples/webrtc.Broadcaster or examples/heif in this step.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:capture-package
- relation: follows
  to: milestone:examples-mp4-tools
- relation: superseded_by
  to: component:mediacontainer
history:
  delivered-2026-10-10:
    summary: After capture, the author asked what else in the samples was generally useful, accepted the
      mp4ff dependency and proposed the mediacontainer/mp4 path; the package moved with its tests.
  superseded-2026-10-16:
    summary: Folded into component:mediacontainer on 2026-10-16 so that the current state of each backend
      and package is read from one concept; this file keeps the slice's definition and timeline.
