id: milestone:mediacontainer-mp4
type: milestone
title: mediacontainer/mp4 - the MP4 demuxer, muxer and fMP4 segmenter as a package of the core module
summary: 'The MP4 glue of the samples (examples/container: demuxer handing out Annex-B access units,
  progressive muxer fed with encoder packets, passthrough tracks, PacketSource for ebitenvideo, VideoFile
  sink, CMAF/fMP4 Segmenter) moved to the core module as github.com/shibukawa/hwmediacodec/mediacontainer/mp4,
  package mp4. The core module now requires github.com/Eyevinn/mp4ff; the author decided that this dependency
  is acceptable. The code is unchanged apart from the package name, the mp4ff import alias and the error
  prefix.'
lifecycle: active
authority: authored
aliases:
- mp4 package
- mediacontainer
- MP4 demuxer
- MP4 muxer
- container パッケージの正式機能化
scope:
  platform: darwin
  gpu: apple-silicon
  milestone: mediacontainer-mp4
constraints:
- 'The earlier "two dependencies" wording (purego and golang.org/x/sys only) was a description in the READMEs,
  not a requirement of the author: asked on 2026-10-10, the author said a dependency on mp4ff is fine. Ebitengine
  and pion still stay out of the core module (ebitenvideo and examples are separate modules for that).'
- 'mp4ff is pure Go, so CGO_ENABLED=0 and the cross builds are unaffected. Programs that do not import
  mediacontainer/mp4 do not link it; it only shows in go.mod and go.sum (mp4ff itself requires go-test/deep
  for its tests).'
- 'Path mediacontainer/mp4, package name mp4: mediacontainer is a namespace directory without Go files,
  leaving room for other formats. Inside the package github.com/Eyevinn/mp4ff/mp4 is imported as mp4ff;
  a program that uses both needs the same alias.'
- 'The tests need ffmpeg helpers that lived in examples/internal/testutil, which the core module cannot
  import (and the examples module cannot import a core internal package), so internal/mp4test is a copy
  of that file. The bundled-clip test needs examples/assets and stayed in the examples module (examples/assets/assets_test.go).'
- 'As with capture, examples/go.mod still requires hwmediacodec v0.1.0: the workspace covers a clone,
  running the examples by module path needs a core release first.'
non_goals:
- Fragmented MP4 input, MKV, MPEG-TS.
- Moving examples/hls.Playlist, examples/webrtc.Broadcaster or examples/heif in this step.
acceptance:
  tests-follow:
    text: The demuxer, muxer, elementary-stream, packet-source, segmenter and recorder-to-MP4 tests pass
      in the core module unchanged apart from imports.
    scope:
      milestone: mediacontainer-mp4
    verified_by:
    - mp4-tests
  builds:
    text: The core module builds on its own (GOWORK=off), with CGO_ENABLED=0 and for linux and windows;
      examples and ebitenvideo build against it.
    scope:
      milestone: mediacontainer-mp4
    verified_by:
    - build-check
  samples-follow:
    text: Every examples test passes with the samples importing mediacontainer/mp4.
    scope:
      milestone: mediacontainer-mp4
    verified_by:
    - examples-tests
