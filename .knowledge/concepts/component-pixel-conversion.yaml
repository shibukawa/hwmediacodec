open_questions:
  decrgb-full-range-nv12:
    text: Do Media Foundation (DXVA), NVDEC, VA-API and Intel VPL return full-range streams as full-range
      NV12? The wrapper assumes so; VideoToolbox is the one backend known to rescale.
    state: open
  encrgb-mft-colour-tags-in-vui:
    text: Do the Intel, AMD and NVIDIA encoder MFTs copy MF_MT_YUV_MATRIX and friends into the VUI? If
      not, streams from Windows stay untagged and players guess (BT.709 for HD in browsers, BT.601 in
      ffmpeg).
    state: open
