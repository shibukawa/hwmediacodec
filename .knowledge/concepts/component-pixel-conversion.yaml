id: component:pixel-conversion
type: component
title: RGBA/BGRA conversion in Go for the NV12-only backends (internal/pixconv)
summary: 'WithOutputFormat(RGBA|BGRA) and WithInputFormat(RGBA|BGRA) work on every backend: where the
  backend takes or returns NV12 only (VA-API, NVDEC decode, Intel VPL, Media Foundation, MediaCodec, WebCodecs
  where copyTo does not convert) the root package wraps it in pixconv.Decoder or pixconv.Encoder, which
  convert in Go with the matrix and range the stream declares (decode) or BT.709 video range (encode)
  and ask the backend to tag the stream. VideoToolbox and NVENC convert themselves. Consolidated on 2026-10-16
  from milestone:decoder-rgb-conversion and milestone:encoder-rgb-conversion.'
lifecycle: active
authority: authored
aliases:
- pixconv
- RGB conversion
- NV12 to RGBA
- 色変換
constraints:
- 'Selection (hwmediacodec.newDecoder): every backend is asked with the caller''s format first; one that
  answers ErrUnsupported for RGBA/BGRA is asked again for NV12. The stack is backend decoder, then internal/reorder
  (unless the backend reorders itself or WithDecodeOrder was given), then pixconv.Decoder outermost, so
  only frames that leave are converted. Backend order is kept; VideoToolbox converts itself and is never
  wrapped.'
- 'Colour (pixconv.ColorFor): the wrapper parses every new SPS it is sent (H.264 and HEVC, byte-compared
  with the previous one) and takes matrix_coeffs and video_full_range_flag from the VUI; for AV1 (decoded
  on these backends since milestone:av1-decode-linux-windows) it takes matrix_coefficients and color_range
  from the color_config of every new sequence header OBU. 1 and 7 are BT.709, 4/5/6 BT.601, 9/10 BT.2020.
  A stream that names no matrix gets BT.709 when the picture is wider than 704 or taller than 576 pixels
  and BT.601 otherwise - the rule VideoToolbox applies, so that every backend shows the same colours.'
- 'VideoToolbox rule, measured on an M3 on 2026-10-10 by comparing its RGBA output with all six matrix/range
  conversions of its NV12 output: untagged 704x576, 704x480, 640x480 and 320x576 are BT.601; 708x480,
  720x240, 720x480, 320x600, 320x720 and everything larger are BT.709; a named matrix (bt709, smpte170m,
  bt2020nc) is followed at any size. VideoToolbox hands out video-range NV12 even for full-range streams
  (it rescales), so its NV12 never needs the full-range path; the other backends return the decoded samples
  as they are.'
- 'Conversion (pixconv.NV12ToRGB): five 256-entry tables per matrix and range in 16.16 fixed point, a
  clamp table instead of branches, every chroma sample colours its 2x2 block (nearest neighbour, the dual
  of the encoder side''s 2x2 average), alpha 255, rows split into bands across GOMAXPROCS goroutines for
  pictures of 256 rows or more.'
- Converted frames live in Go memory taken from a sync.Pool inside the wrapper; Release returns the buffer,
  also after Close and from any goroutine. The backend frame is released as soon as it is converted.
- Frames still inside the decoder when the stream switches to parameter sets with another colour description
  are converted with the new one (the description is not tracked per picture).
- 'Selection (hwmediacodec.newEncoder): every backend is asked with the caller''s format first; one that
  answers ErrUnsupported for RGBA/BGRA is asked again with InputFormat NV12 and BT709 set, and when that
  succeeds the encoder is wrapped in pixconv.Encoder. Backend order is kept (the first backend that can
  serve the request wins, converted or not); backends with their own RGB input (VideoToolbox, NVENC) are
  never wrapped. When both attempts fail the NV12 attempt''s error is reported, which names the real obstacle
  instead of the pixel format.'
- 'Conversion (pixconv.RGBToNV12): BT.709, video range (Y 16..235, CbCr 16..240), 16.16 fixed point with
  coefficients chosen so that white is 235 and greys have CbCr 128 exactly; chroma is the matrix applied
  to the sum of each 2x2 block; odd sizes repeat the last column/row; pictures of 256 rows or more are
  split into bands across GOMAXPROCS goroutines. BT.709 because VideoToolbox converts RGB input with it,
  so a stream looks the same whichever backend produced it.'
- 'codec.EncoderConfig.BT709 carries the request to declare BT.709 primaries/transfer/matrix in video
  range: VA-API sets the video signal fields of the VUI in its Go-written SPS (H.264 and HEVC); Intel
  VPL attaches mfxExtVideoSignalInfo (third extension buffer, dropped after mfxExtCodingOption3 when the
  runtime rejects the configuration); Media Foundation sets MF_MT_VIDEO_PRIMARIES, MF_MT_TRANSFER_FUNCTION,
  MF_MT_YUV_MATRIX and MF_MT_VIDEO_NOMINAL_RANGE on the output and input media types and retries without
  them when the MFT refuses the type; VideoToolbox sets the same properties it sets for its own RGB input.'
- pixconv.Encoder converts into one reused NV12 buffer; that is safe because Encoder.Send copies the frame
  before it returns.
acceptance:
  decrgb-conversion-exact:
    text: The table conversion is within 1 of the floating-point equations for BT.601, BT.709 and BT.2020
      in video and full range, for even and odd sizes, padded rows and pictures split across goroutines;
      range ends and primaries map as expected; RGB to NV12 and back agrees within 2 for flat colours.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-pixconv-unit-test
  decrgb-stream-colour:
    text: The wrapper follows the colour description of H.264 and HEVC parameter sets and AV1 sequence
      headers as they arrive, falls back to the size rule without one, ignores broken ones, releases the
      backend frame, and returns independent frames that outlive Close.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-pixconv-unit-test
  decrgb-selection:
    text: An NV12-only backend gets the conversion outside the reorder layer (directly on the backend
      for WithDecodeOrder or a backend that reorders itself); a backend with RGB output and NV12 requests
      are passed through; backend order wins; an unavailable backend is skipped; a backend failure is
      returned as is.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-selection-test
  decrgb-hardware-comparison:
    text: Frames decoded by the hardware decoder to NV12 and converted in Go match the backend's own RGBA
      output and ffmpeg's conversion within 30 dB 8x8-block PSNR, in the same display order, for a stream
      that names its matrix and for untagged small and large pictures; RGBA is the exact mirror of BGRA
      with alpha 255.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-videotoolbox-comparison-test
  decrgb-vaapi-path:
    text: Through the real VA-API backend RGBA and BGRA frames are the BT.601 conversion of the NV12 frame
      at the same place in display order, including a cropped HEVC stream.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-vaapi-fake-driver-test
  decrgb-windows-samples:
    text: examples/player, texture and thumbnails run on Windows (Media Foundation or NVDEC) and on Linux
      hardware with correct colours.
    scope:
      milestone: decoder-rgb-conversion
    verified_by:
    - decrgb-hardware-run
  encrgb-conversion-exact:
    text: The fixed-point conversion is within 1 of the floating-point BT.709 equations for even and odd
      sizes, padded rows and pictures split across goroutines; black/white/grey/primaries map to the video-range
      values; destination padding is left alone.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - encrgb-pixconv-unit-test
  encrgb-selection:
    text: An NV12-only backend gets the conversion and BT709; a backend with RGB input and NV12 requests
      are passed through; backend order wins; an unavailable backend is skipped; a backend failure is
      returned as is.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - encrgb-selection-test
  encrgb-hardware-roundtrip:
    text: RGBA and BGRA frames converted in Go and encoded by the hardware encoder decode (ffmpeg, RGB,
      declared matrix) to the source within 35 dB 8x8-block PSNR and the stream declares bt709.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - encrgb-videotoolbox-roundtrip-test
  encrgb-vaapi-path:
    text: Through the real VA-API backend the driver receives the BT.709 video-range picture and the SPS
      of H.264 and HEVC streams declares BT.709.
    scope:
      milestone: encoder-rgb-conversion
    verified_by:
    - encrgb-vaapi-fake-driver-test
  encrgb-windows-webrtc:
    text: examples/webrtc starts on Windows with an Intel or AMD GPU (Media Foundation) and the browser
      shows the fireworks with correct colours.
    scope:
      milestone: encoder-rgb-conversion
      platform: windows
    verified_by:
    - encrgb-windows-hardware-run
