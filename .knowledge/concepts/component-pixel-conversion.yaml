history:
  decrgb-delivered-2026-10-10:
    summary: Delivered the day after the encoder side; conversion, colour selection and the VA-API path
      are tested, the Windows and Linux hardware paths wait for a run.
  encrgb-delivered-2026-10-09:
    summary: Delivered after the webrtc sample failed on Windows; conversion, selection and the VA-API
      path are tested, the Media Foundation and Intel VPL paths wait for a hardware run.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:decoder-rgb-conversion, milestone:encoder-rgb-conversion
      was folded into this concept (keys prefixed with the milestone's tag; dated measurements kept as
      evidence notes); the milestone files remain as superseded stubs with their timelines.
    supersedes:
    - milestone:decoder-rgb-conversion
    - milestone:encoder-rgb-conversion
