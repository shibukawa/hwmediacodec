history:
  pipe-delivered-2026-10-10:
    summary: The author asked whether other package changes would raise reusability and then for the recommended
      points in the recommended order - interfaces and small helpers, the loops, the playback core (milestone:playback).
  layout-delivered-2026-10-10:
    summary: The author suggested moving annexb (as encoder/annexb or similar), said compatibility was
      not needed and asked for the best layout.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:m2-darwin-encode, milestone:display-order-rgba,
      milestone:darwin-av1-decode, milestone:ios-videotoolbox, milestone:packet-pipeline, milestone:package-layout,
      milestone:av1-decode-linux-windows was folded into this concept (keys prefixed with the milestone's
      tag; dated measurements kept as evidence notes); the milestone files remain as superseded stubs
      with their timelines.
    supersedes:
    - milestone:m2-darwin-encode
    - milestone:display-order-rgba
    - milestone:darwin-av1-decode
    - milestone:ios-videotoolbox
    - milestone:packet-pipeline
    - milestone:package-layout
