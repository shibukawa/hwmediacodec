id: component:core-api
type: component
title: 'Core API of the root package: packets, frames, pipelines, package layout'
summary: 'The root package github.com/shibukawa/hwmediacodec: Probe, NewDecoder/NewEncoder and the audio
  constructors, Packet and Frame, the Send/Receive/Flush contract with ErrAgain, the PacketReader/PacketWriter/FrameReader/FrameWriter
  interfaces with DecodeReader, EncodeWriter and CopyFrames, HasHardware, and the layout of the core module
  (encoding/, mediacontainer/, image/, net/, capture, playback) with ebitenvideo, net/webrtc and examples
  as separate modules. Consolidated on 2026-10-16 from the milestone concepts packet-pipeline, package-layout
  and the API parts of the backend milestones.'
lifecycle: active
authority: authored
aliases:
- root package
- PacketReader
- DecodeReader
- EncodeWriter
- package layout
- パッケージ構成
constraints:
- Packet.Data for AV1 is one temporal unit whose OBUs carry obu_has_size_field=1 (the last one may run
  to the end); temporal delimiter OBUs are optional and passed through; Annex-B does not apply.
- 'GOOS=android compiles only the backend-independent packages and the MediaCodec backend: vaapi, vpl
  and nvidia carry the constraint "linux && !android", files picked by the _linux suffix carry "!android",
  and backends_android.go registers the MediaCodec backend (backends_other.go covered android until milestone:android-mediacodec).'
- 'PacketReader hands out hwmediacodec.Packet values and declares TimeScale(); the decoder is opened with
  WithTimeScale(src.TimeScale()) so Frame.PTS is in the reader''s units. Packet.PTS counts from the start
  of the presentation: mp4.PacketSource subtracts the edit-list offset (DTS can then be negative; decoders
  ignore it), while VideoTrack.Packet keeps the stored sample times. The converter moved to PacketSource
  and its timestamp tests pass unchanged.'
- DecodeReader calls Receive first and feeds one packet when the decoder asks (ErrAgain or, right after
  a Reset, io.EOF); a packet the decoder refuses with ErrAgain is kept and offered again. It treats the
  end as reached only after it flushed the decoder itself. Reset flushes and discards, for use after PacketSeeker.SeekKeyframe.
  It checks the context on every turn but, like the loops it replaces, does not sleep when a decoder answers
  ErrAgain on both calls.
- EncodeWriter and DecodeReader own neither the codec nor the reader/writer; closing stays with the caller.
  CopyFrames releases each frame after writing it and does not flush.
- 'Lazy construction is done by composition: the converter''s frame writer opens the encoder for the size
  of the first decoded picture and wraps an EncodeWriter; its packet writer interleaves the copied tracks.'
- capture.Recorder now returns the pixel buffer to its pool after the packets of that frame were written
  rather than right after Send; one buffer is held slightly longer.
- 'internal/testutil and internal/mediatest stay two packages: the root package''s internal tests use
  testutil, which therefore cannot import the root package, while mediatest builds on the public API.
  mediatest now delegates the ffmpeg checks to testutil.'
- 'Publishing the parameter-set parsers (internal/h264, hevc, av1) as encoding/* was considered and left
  for when a user needs it: it would freeze a large internal API.'
- 'No compatibility shims: the author stated on 2026-10-10 that compatibility is not needed yet and asked
  for the best layout. Programs written against v0.1.0 must change hwmediacodec/annexb to hwmediacodec/encoding/annexb
  and hwmediacodec/ivf to hwmediacodec/mediacontainer/ivf.'
- 'annexb is under encoding/, in the sense of the standard library''s encoding/json and encoding/binary:
  a data format that is both read and written (decoders consume Annex-B access units, encoders produce
  them). It is not a container, so it is not under mediacontainer/. It was first moved to bitstream/annexb
  because the author''s "encoder/annexb" was read as the encoder side only; the author meant encoding/
  and it was renamed the same day.'
- encoding/, mediacontainer/ and image/ are namespace directories without Go files, named after their
  standard-library counterparts where one exists (encoding, image).
- ebitenvideo, net/webrtc (added 2026-10-10, milestone:net-webrtc) and examples are separate modules because
  of Ebitengine and pion; their go.mod files require the released core version (v0.2.0 since 2026-10-10),
  so a change to the core API reaches them only through a core release and a bumped require line.
- 'HLS is under net/ (net/hls, first placed at mediacontainer/hls): it is an HTTP delivery protocol on
  top of the mp4 segments, not a container; the author asked for net/hls and net/webrtc.'
- Packet.Data is one temporal unit in the low-overhead OBU format, as on macOS; every unit yields exactly
  one frame with its packet's PTS; all four decoders implement codec.DisplayOrderer for AV1, so the reorder
  layer is bypassed and WithDecodeOrder is a no-op.
- Decoding starts and resumes after Flush at a unit with a shown key frame; the last sequence header OBU
  is kept in Go and prepended to such a unit when it carries none (NVDEC, VPL, Media Foundation), since
  their parsers are recreated or restarted.
- 8-bit Main profile 4:2:0 to NV12 only on these backends; 10-bit, seq_profile 1 and 2 and monochrome
  report ErrUnsupported (VA-API checks the sequence header itself; the others rely on the driver's answer).
acceptance:
  pipe-helpers:
    text: With fake codecs, DecodeReader returns every frame once and in order for one-in-one-out, reordering
      and full-queue decoders, flushes once, keeps EOF sticky, restarts after Reset and a seek, and passes
      reader errors and cancellation on; EncodeWriter writes every packet with and without look-ahead
      and stops on the writer's error; CopyFrames transcodes 40 frames.
    scope:
      milestone: packet-pipeline
    verified_by:
    - pipe-pipeline-test
  pipe-small-helpers:
    text: HasHardware agrees with Probe for every codec and direction; RGBAImage copies RGBA and BGRA
      frames with padded strides and refuses NV12; RGBAFrame shares an image's pixels, sub-images included;
      the length-prefixed conversions round-trip and reject bad lengths.
    scope:
      milestone: packet-pipeline
    verified_by:
    - pipe-pipeline-test
  pipe-users-follow:
    text: Every test of the four modules passes with capture, mp4, the image packages, the samples and
      ebitenvideo on the new types; the command-line tool decodes bit-exactly like ffmpeg, transcodes
      and encodes.
    scope:
      milestone: packet-pipeline
    verified_by:
    - pipe-all-tests
    - pipe-cli-run
  layout-builds-and-tests:
    text: Every package of the core module builds (also GOWORK=off, linux, windows) and its tests pass
      with the new import paths; examples and ebitenvideo build and pass.
    scope:
      milestone: package-layout
    verified_by:
    - layout-layout-test-run
