facts:
  api:
    encoder: NewEncoder(ctx, codec, width, height, opts...) -> Encoder{Send(ctx, *Frame) error; Receive(ctx)
      (Packet, error); Flush(ctx) error; Close() error}
    options: WithFrameRate, WithBitrate, WithRateControl(VBR|CBR), WithQuality, WithKeyframeInterval,
      WithBFrames, WithLowLatency, WithProfile, WithInputFormat; shared WithSoftwareFallback and WithTimeScale
      (Option satisfies DecoderOption and EncoderOption)
    frame: Frame.ForceKeyframe is an encoder input; caller-owned frames may be reused after Send returns
    packet: Packet{Data (Annex-B AU), PTS, DTS, Keyframe}; DTS == PTS without B-frames
    option_types: DecoderOption/EncoderOption changed from func types to interfaces (ApplyDecoder/ApplyEncoder)
      so that one option value can serve both constructors
    decoder: NewDecoder returns display order by default (reorder.Wrap around the backend unless it implements
      codec.DisplayOrderer); WithDecodeOrder() disables it; WithOutputFormat(NV12|RGBA|BGRA)
    encoder_dor: WithInputFormat(NV12|RGBA|BGRA)
    pixel_formats: PixelFormat.PlaneCount(), PlaneLayout(i, w, h) (rows, rowBytes), FrameSize(w, h); RGBA/BGRA
      are one plane, 4 bytes per pixel, stride == 4*Width, alpha 255 out / ignored in
    order_keys: codec.Order{Seq, POC, Reorder} travels from Packet (SetPacketOrder) through the backend
      to Frame (SetFrameOrder); backends copy it blindly
    cli: decode -format nv12|rgba|bgra -decode-order; encode -format nv12|rgba|bgra; transcode now re-encodes
      in display order
    decoder_av1mac: NewDecoder(ctx, AV1, WithOutputFormat(NV12|RGBA|BGRA)); Packet.Data is one temporal
      unit; Frame.PTS == Packet.PTS; WithDecodeOrder is a no-op; WithSoftwareFallback does not help without
      the hardware engine
    probe: Capability{Backend videotoolbox, Codec AV1, Direction Decode, Hardware true} only when VTIsHardwareDecodeSupported('av01')
      != 0
    cli_av1mac: decode -codec av1 input.ivf (PTS from the IVF timebase, rescaled to 90 kHz); transcode
      -in av1; probe prints av1 decode
    root: PacketReader{Codec, TimeScale, ReadPacket}; PacketSeeker{+SeekKeyframe, Length}; PacketWriter{WritePacket};
      PacketWriteCloser; PacketWriterFunc; FrameReader{ReadFrame}; FrameWriter{WriteFrame}; NewDecodeReader(dec,
      src) -> ReadFrame, Reset; NewEncodeWriter(enc, dst) -> WriteFrame, Flush, Packets; CopyFrames(ctx,
      dst, src); HasHardware(ctx, codec, dir); RGBAFrame(img, pts); Frame.RGBAImage()
    annexb: AppendUnit(dst, nal); AppendLengthPrefixed(dst, nal); FromLengthPrefixed(dst, sample, lengthSize)
    removed: capture.Sink, capture.Funcs, ebitenvideo.Source, ebitenvideo.Seeker
  delivery_results:
    milestone:packet-pipeline:
      result:
        status: delivered 2026-10-10
    milestone:package-layout:
      result:
        status: delivered 2026-10-10
  milestone_notes:
    layout:
      layout:
        root: github.com/shibukawa/hwmediacodec - Probe, NewDecoder, NewEncoder
        encoding: encoding/annexb
        mediacontainer: mediacontainer/mp4, mediacontainer/ivf
        image: image/heif, image/avif
        net: net/hls (core module), net/webrtc (module of its own)
        capture: capture
        separate_modules: ebitenvideo, net/webrtc, examples
