id: milestone:net-webrtc
type: milestone
title: net/webrtc - the WebRTC broadcaster as a module of its own
summary: 'The Broadcaster of the WebRTC sample (examples/webrtc/server.go, package main) became github.com/shibukawa/hwmediacodec/net/webrtc:
  a capture.Sink that hands each H.264 access unit to a pion track per viewer and an http.Handler for the
  one-POST signalling. It has its own go.mod, like ebitenvideo, so that pion (about twenty modules) is
  not a requirement of the core module. The player page stayed in the sample.'
lifecycle: active
authority: authored
aliases:
- webrtc package
- Broadcaster
- WebRTC 配信パッケージ
scope:
  milestone: net-webrtc
constraints:
- 'Asked on 2026-10-10 where the pion dependency should live (core module, nested module, or not moving),
  the author chose the nested module. The import path is the same either way; go.work lists ./net/webrtc.'
- 'net/webrtc/go.mod requires hwmediacodec v0.1.0, which is enough for the package itself (it only uses
  hwmediacodec.Packet); its tests import mediacontainer/mp4, encoding/annexb and internal/mediatest and
  need the workspace until a core release contains them. examples/go.mod has no require line for net/webrtc
  yet because no version is tagged: release order is core tag, then net/webrtc and ebitenvideo tags, then
  examples.'
- 'ServeHTTP is the signalling endpoint only: any POST with a JSON session description is answered, other
  methods get 405, the path is not inspected. The sample mounts it at POST /offer and serves its page
  at /. The package no longer logs: a rejected offer is the HTTP error, a failing track drops the viewer.'
- 'Packet times are taken as 90 kHz units (capture.TimeScale) for the sample durations.'
non_goals:
- Trickle ICE, WebSocket signalling, audio, codecs other than H.264, simulcast.
acceptance:
  broadcaster:
    text: A pion viewer that posts an offer receives the access units of an ffmpeg-made stream, identical
      NAL unit by NAL unit and decodable by ffmpeg to the source's frame checksums; a late viewer starts
      at a keyframe; a PLI reaches the keyframe callback; a GET is answered 405.
    scope:
      milestone: net-webrtc
    verified_by:
    - broadcaster-test
  sample-follows:
    text: The webrtc sample serves its page at /, passes POST /offer to the broadcaster and answers 404
      elsewhere; it starts and answers over HTTP.
    scope:
      milestone: net-webrtc
    verified_by:
    - page-test
    - webrtc-boot-run
