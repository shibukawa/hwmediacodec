id: milestone:net-webrtc
type: milestone
title: net/webrtc - the WebRTC broadcaster as a module of its own
summary: 'Superseded on 2026-10-16: its constraints, acceptance, verification, open questions and facts
  now live in component:net-webrtc (keys prefixed webrtc-). Original summary: The Broadcaster of the WebRTC
  sample (examples/webrtc/server.go, package main) became github.com/shibukawa/hwmediacodec/net/webrtc:
  a capture.Sink that hands each H.264 access unit to a pion track per viewer and an http.Handler for
  the one-POST signalling. It has its own go.mod, like ebitenvideo, so that pion (about twenty modules)
  is not a requirement of the core module. The player page stayed in the sample.'
lifecycle: superseded
authority: authored
aliases:
- webrtc package
- Broadcaster
- WebRTC 配信パッケージ
scope:
  milestone: net-webrtc
non_goals:
- Trickle ICE, WebSocket signalling, audio, codecs other than H.264, simulcast.
relations:
- relation: implements_part_of
  to: requirement:hwmediacodec
- relation: follows
  to: milestone:examples-webrtc
- relation: follows
  to: milestone:package-layout
- relation: superseded_by
  to: component:net-webrtc
history:
  delivered-2026-10-10:
    summary: The author asked for net/hls and net/webrtc and chose a separate module for the pion dependency.
  superseded-2026-10-16:
    summary: Folded into component:net-webrtc on 2026-10-16 so that the current state of each backend
      and package is read from one concept; this file keeps the slice's definition and timeline.
