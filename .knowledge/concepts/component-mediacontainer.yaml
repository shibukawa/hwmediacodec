open_questions:
  webm-ogg-container:
    text: Should Opus also be written to and read from Ogg (.opus/.ogg files), the container the author
      had in mind with "opus/ogg"?
    state: open
    resolution: Not needed for WebM (Opus goes into Matroska blocks directly); left for the author to
      ask for as a separate container package.
    scope:
      platform: any
  webm-av1-encode:
    text: The WebM video writer has no AV1 encoder to take packets from; the agreed AV1 encode slice (NVENC,
      VPL, VA-API, vendor MFTs, WebCodecs) will be the first live producer, and a recorder to WebM (capture
      + webm.Muxer) would follow it.
    state: open
    scope:
      platform: any
  mp4-next-candidates:
    text: Which other sample code should follow - the HLS playlist server (examples/hls/server.go, standard
      library only, depends on mp4.Segment), the HEIC/AVIF codec (examples/heif, mp4ff) or the WebRTC
      broadcaster (pion)?
    state: open
    resolution: The HLS playlist followed on 2026-10-10 (milestone:mediacontainer-hls); heif is discussed
      as image/heif, pending a standard-library-style API (delivered, milestone:image-heif).
    scope:
      platform: darwin
      gpu: apple-silicon
  mp4-ivf-annexb-placement:
    text: annexb and ivf sit at the module root while MP4 is under mediacontainer; should ivf move or
      be aliased there for consistency?
    state: answered
    resolution: Moved without aliases on 2026-10-10 (milestone:package-layout) - ivf to mediacontainer/ivf,
      annexb to encoding/annexb.
    scope:
      platform: darwin
      gpu: apple-silicon
  exmp4-encoder-dts-semantics:
    text: Should the VideoToolbox encoder (and the Encoder contract in general) guarantee DTS <= PTS by
      shifting decode times itself, instead of leaving it to the muxer? ffmpeg's videotoolbox encoder
      does such a shift.
    state: open
    resolution: Left in the muxer for now because the shift needs the whole stream's largest lag (or the
      encoder's reorder depth) and the current packets are still internally consistent; revisit if a second
      consumer of DTS appears (fMP4/HLS segmenter in the next slice).
    scope:
      platform: darwin
      gpu: apple-silicon
facts:
  api:
    ivf: ivf.NewReader(io.Reader) (*Reader, error) with Header() {FourCC, Width, Height, TimebaseNum,
      TimebaseDen, FrameCount} and Next() (frame, pts, error); ivf.NewWriter(io.Writer, fourcc, width,
      height, timebaseNum, timebaseDen) with WriteFrame(data, pts) and Close() (patches the frame count
      when the writer can seek)
    mp4: import github.com/shibukawa/hwmediacodec/mediacontainer/mp4; Open(path) / NewDemuxer(io.ReadSeeker)
      -> Demuxer{Video, Others, Duration, Close}; VideoTrack{Packet, AccessUnit, Keyframes, KeyframeAtOrBefore,
      FrameRate, PacketSource, ElementaryStream}; Create(path) / NewMuxer(io.WriteSeeker) -> Muxer{AddVideoTrack,
      AddPassthroughTrack, Close}; CreateVideoFile(path, codec, timeScale); NewSegmenter(codec, timeScale,
      target, onInit, onSegment)
    container: Open/NewDemuxer -> Demuxer{Video() *VideoTrack, Others() []*Track, Duration()}; Track{ID,
      Handler, TimeScale, MediaTimeOffset, SampleCount, Sample(i), Info(i), TimeOf, PresentationTime};
      VideoTrack{Codec, Width, Height, FrameRate, Keyframes, KeyframeAtOrBefore, AccessUnit(i), Packet(i)};
      Create/NewMuxer -> Muxer{AddVideoTrack(codec, timeScale) *VideoWriter, AddPassthroughTrack(*Track)
      *TrackWriter, Close}; VideoWriter.WritePacket(hwmediacodec.Packet); TrackWriter.WriteSample(Sample)
    segmenter: NewSegmenter(codec, timeScale, target, onInit, onSegment) -> WritePacket, Close; Segment{Seq,
      Data, Start, Duration}
    container_extex: VideoTrack.ElementaryStream() io.ReadSeeker
    webm: import github.com/shibukawa/hwmediacodec/mediacontainer/webm; Open(path) / NewDemuxer(io.ReadSeeker)
      -> Demuxer{Video() *VideoTrack, Audio() *AudioTrack, Tracks(), TimestampScale(), Duration(), Close};
      VideoTrack{Codec, Width, Height, TimeScale, FrameCount, Packet(i), KeyframeAtOrBefore, Length, PacketSource()};
      AudioTrack{Format(), FrameCount, Packet(i), Length, PacketSource()}; Create(path) / NewMuxer(io.WriteSeeker)
      -> Muxer{AddVideoTrack(AV1, timeScale) *VideoWriter, AddAudioTrack(format, timeScale) *AudioWriter,
      Close}; MaxFrames, InterleaveWindow
  delivery_results:
    milestone:mediacontainer-mp4:
      result:
        status: delivered 2026-10-10
  milestone_notes:
    exmp4:
      implementation:
        demux: mp4.DecodeFile with DecModeLazyMdat; sample offsets expanded from stsc/stco/co64, times
          from stts/ctts, sync from stss; Mdat.ReadData per sample
        mux: ftyp + 64-bit-size mdat written up front and patched at Close, moov last; stbl built from
          mp4ff box structs (stts/ctts/stss/stsc/stsz/stco|co64); passthrough tracks reuse the source
          stsd, hdlr, media header, language and edit list
