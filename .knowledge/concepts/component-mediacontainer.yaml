id: component:mediacontainer
type: component
title: 'Containers: mediacontainer/mp4 (demuxer, muxer, fMP4 segmenter, audio tracks) and mediacontainer/ivf'
summary: 'mediacontainer/mp4 reads and writes MP4/MOV around the codec API on top of mp4ff: Annex-B access
  units with parameter sets in front of keyframes out of avc1/hvc1/av01 tracks, a progressive muxer fed
  with encoder packets (DTS shift and edit list for B-frames, parameter sets into the sample entry), passthrough
  tracks, AAC and Opus audio tracks with the encoder delay in the edit list, PacketSource/AudioPacketSource
  for playback with keyframe seeking, VideoFile as an encoder sink and the CMAF/fMP4 Segmenter for HLS.
  mediacontainer/ivf reads and writes IVF (AV1). Consolidated on 2026-10-16 from milestone:mediacontainer-mp4
  and the container parts of the sample milestones.'
lifecycle: active
authority: authored
aliases:
- mp4 package
- mediacontainer
- MP4 demuxer
- MP4 muxer
- Segmenter
- ivf
- コンテナ
constraints:
- 'The earlier "two dependencies" wording (purego and golang.org/x/sys only) was a description in the
  READMEs, not a requirement of the author: asked on 2026-10-10, the author said a dependency on mp4ff
  is fine. Ebitengine and pion still stay out of the core module (ebitenvideo and examples are separate
  modules for that).'
- mp4ff is pure Go, so CGO_ENABLED=0 and the cross builds are unaffected. Programs that do not import
  mediacontainer/mp4 do not link it; it only shows in go.mod and go.sum (mp4ff itself requires go-test/deep
  for its tests).
- 'Path mediacontainer/mp4, package name mp4: mediacontainer is a namespace directory without Go files,
  leaving room for other formats. Inside the package github.com/Eyevinn/mp4ff/mp4 is imported as mp4ff;
  a program that uses both needs the same alias.'
- The tests need the ffmpeg helpers that lived in examples/internal/testutil; they are now internal/mediatest
  (first named internal/mp4test) in the core module. The first move kept a copy in examples on the wrong
  assumption that another module cannot import a core internal package; the internal rule goes by import
  path, so examples and net/webrtc import internal/mediatest and the copy is gone (ebitenvideo had been
  importing internal/testutil all along). The bundled-clip test needs examples/assets and stayed in the
  examples module (examples/assets/assets_test.go).
- VideoToolbox with B-frames numbers decode times from the first PTS, so reordered pictures carry DTS
  > PTS (observed - the first P has pts 2048 / dts 512, a pyramid B has pts 512 / dts 1536 at 15360 Hz).
  MP4 requires DTS <= PTS, so the muxer shifts every DTS back by the largest lag and writes an edit list
  (elst media_time = first presentation time) that hides the start delay; ffprobe then reports presentation
  times identical to the source.
- Demuxed access units are Annex-B with the parameter sets from avcC/hvcC prepended to every sync sample,
  so decoding can start at any keyframe; the muxer learns VPS/SPS/PPS from the packets and strips them
  from the samples (avc1/hvc1 sample entries).
- Track.MediaTimeOffset exposes the edit-list offset; thumbnails are named with presentation time (PTS
  minus that offset), and KeyframeAtOrBefore works in presentation time.
- The segmenter needs PTS == DTS (no B-frames) and cuts at the first keyframe after the target length,
  so the HLS sample sets the encoder keyframe interval to fps*segment and WithLowLatency; segments are
  styp+moof+mdat with per-sample flags, tfdt continuing across segments, init segment from mp4ff CreateEmptyInit
  + SetAVCDescriptor/SetHEVCDescriptor.
- ElementaryStream supports only Seek(0, io.SeekStart) (ebitenvideo loops by rewinding); other seeks return
  an error.
acceptance:
  av1mac-ivf-round-trip:
    text: ivf.Writer output is read back by ivf.Reader (and by ffprobe) with the same frames, timestamps,
      frame count and timebase, is byte-identical to ffmpeg's IVF of the same frames, and truncated files
      and bad signatures are errors.
    scope:
      milestone: darwin-av1-decode
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - av1mac-ivf-unit-test
  mp4-tests-follow:
    text: The demuxer, muxer, elementary-stream, packet-source, segmenter and recorder-to-MP4 tests pass
      in the core module unchanged apart from imports.
    scope:
      milestone: mediacontainer-mp4
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - mp4-mp4-tests
  mp4-builds:
    text: The core module builds on its own (GOWORK=off), with CGO_ENABLED=0 and for linux and windows;
      examples and ebitenvideo build against it.
    scope:
      milestone: mediacontainer-mp4
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - mp4-build-check
  mp4-samples-follow:
    text: Every examples test passes with the samples importing mediacontainer/mp4.
    scope:
      milestone: mediacontainer-mp4
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - mp4-examples-tests
  exmp4-demux-matches-ffprobe:
    text: For H.264 (B-frames) and HEVC (hvc1 and hev1) files written by ffmpeg, the demuxer reports the
      same sample count, the same normalised presentation-time sequence and the same number of keyframes
      as ffprobe, and the Annex-B access units it emits decode with ffmpeg to the same per-frame MD5s
      as the MP4 itself.
    scope:
      milestone: examples-mp4-tools
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exmp4-container-demux-test
  exmp4-mux-round-trip:
    text: Remuxing the demuxed access units plus the audio track yields a file that ffmpeg decodes without
      errors, with the same codecs, packet counts, size, has_b_frames, hvc1 tag, per-frame MD5s, presentation
      times and duration (within 50 ms) as the source.
    scope:
      milestone: examples-mp4-tools
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exmp4-container-mux-test
  exscreen-segmenter:
    text: An ffmpeg-made stream with a keyframe every 10 frames at 30 fps segmented at 1 s gives three
      1 s segments, each one fragment of 30 samples starting with a sync sample and tfdt continuing; init
      + segments decode with ffmpeg to the source's frame MD5s; a 100 ms target cuts at every keyframe.
    scope:
      milestone: examples-screencast-hls
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exscreen-segmenter-test
  extex-elementary-stream:
    text: ElementaryStream yields exactly the concatenation of AccessUnit(i), annexb.Reader splits it
      back into the same access units after a rewind, and seeking elsewhere fails.
    scope:
      milestone: examples-texture
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - extex-stream-test
