history:
  exmp4-accepted-2026-10-09:
    summary: Author asked for usage samples (file converter, keyframe thumbnails, HEIC/HEIF and AVIF conversion,
      Ebitengine playback, playback as a texture, screen recording with HLS/WebRTC viewing) and agreed
      to the proposed order - converter and thumbnails first, then recording and HLS, texture playback,
      WebRTC, HEIF/AVIF last.
  exmp4-delivered-2026-10-09:
    summary: Examples module with the container bridge, convert and thumbnails; container tests pass with
      ffmpeg alone, convert and thumbnails tests and a 1080p run pass on the author's M3.
  exscreen-delivered-2026-10-09:
    summary: Second sample slice (screen recording and HLS) delivered after the converter/thumbnails slice;
      all tests pass on the author's M3 and the live HLS stream was played in a Chromium browser pane.
  exscreen-moved-2026-10-09:
    summary: screencast.Recorder left the examples module for the core module as capture.Recorder (milestone:capture-package);
      NewMP4File became CreateVideoFile of the MP4 package and the MP4 acceptance test moved there; the
      package itself (container, with the Segmenter) became mediacontainer/mp4 in the core module on 2026-10-10
      (milestone:mediacontainer-mp4), and the Playlist of examples/hls/server.go became net/hls (milestone:mediacontainer-hls);
      the sample keeps the player page (examples/hls/page.go).
  exfw-delivered-2026-10-09:
    summary: Requested mid-session by the author (good-looking Kage-based fireworks with an occasional
      gopher, keyboard-selectable shells, browser auto-open) after the WebRTC/HLS samples existed.
  extex-delivered-2026-10-09:
    summary: Third sample slice delivered after recording/HLS; mesh and stream tests pass, rendering checked
      through a screencast recording.
  exwebrtc-delivered-2026-10-09:
    summary: Fourth sample slice delivered after the texture sample; loopback tests pass without hardware,
      the live stream played in a Chromium pane on the M3.
  explayer-delivered-2026-10-09:
    summary: Author supplied the clip ("自分で撮影したものなのでライセンスは問題ありません") and asked the player, texture and
      Kage samples to use it because the test patterns had too much contrast.
  imgconv-delivered-2026-10-10:
    summary: The author asked for the sample converter to use pure-Go encoders and decoders when there
      is no hardware codec, and for the sample to be called imgconv.
  consolidated-2026-10-16:
    summary: On 2026-10-16 the content of the milestone concepts milestone:ios-videotoolbox, milestone:browser-webcodecs,
      milestone:examples-mp4-tools, milestone:examples-screencast-hls, milestone:examples-fireworks, milestone:examples-texture,
      milestone:examples-webrtc, milestone:examples-heif-avif, milestone:examples-player-assets, milestone:imgconv-fallback
      was folded into this concept (keys prefixed with the milestone's tag; dated measurements kept as
      evidence notes); the milestone files remain as superseded stubs with their timelines.
    supersedes:
    - milestone:ios-videotoolbox
    - milestone:browser-webcodecs
    - milestone:examples-mp4-tools
    - milestone:examples-screencast-hls
    - milestone:examples-fireworks
    - milestone:examples-texture
    - milestone:examples-webrtc
    - milestone:examples-heif-avif
    - milestone:examples-player-assets
    - milestone:imgconv-fallback
