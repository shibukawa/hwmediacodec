id: component:examples
type: component
title: 'The examples module: converter, thumbnails, record, hls, webrtc, player, texture, imgconv, mobile,
  fireworks scene'
summary: A separate Go module of complete programs built on the library, with the bundled waterfall clip
  (examples/assets, the author's own footage), the fireworks scene behind record/hls/webrtc, the Ebitengine
  player and texture samples (also for the browser), the HEIC/AVIF converter with its cgo-free fallback
  codecs, and the Ebitengine mobile game with its Xcode and Android projects. Consolidated on 2026-10-16
  from the examples-* and imgconv-fallback milestones.
lifecycle: active
authority: authored
aliases:
- examples module
- sample programs
- サンプル
- fireworks
- imgconv
- waterfall clip
constraints:
- The public API, the ebitenvideo and playback packages and the examples are unchanged in behaviour; the
  Ebitengine mobile sample exports only a Dummy function because gobind cannot bind ebiten.Game method
  signatures.
- Timestamps pass through unchanged. Both decoder and encoder are opened with WithTimeScale(track time
  scale), so frame PTS are MP4 sample times and encoder packets carry PTS/DTS in the same unit; the muxer
  stores them as given, apart from a constant DTS shift.
- 'Thumbnails decode with WithDecodeOrder() and WithOutputFormat(RGBA): a sequence of keyframes has decode
  order equal to display order, so each picture comes out immediately instead of waiting in the reorder
  buffer, and the plane maps onto image.RGBA without copying.'
- The first demo scene drew with DrawImage only. Ebitengine 2.10 anti-aliased vector fills (24 FillCircle
  + StrokeCircle per frame) cost about 80 ms a frame at 720p and dragged Draw to 12 fps, which first looked
  like a capture problem. The scene was later replaced by the fireworks show (milestone:examples-fireworks).
- 'Rendering: stars are 32 px radial sprites drawn with BlendLighter into cur (full brightness, cleared
  each frame); acc is faded by a SourceOver black at alpha 0.09 plus a ReverseSubtract of 2/255 (a pure
  multiplicative fade leaves permanent faint ghosts in 8-bit buffers) and then receives cur at 0.14; the
  shader reads cur, acc and the skyline mask (Images[0..2], all screen-sized as DrawRectShader requires).'
- The first version drew every frame at full brightness into one accumulating buffer and saturated to
  white blobs; the two-layer split and smaller sprites fixed it.
- 'Gopher shell: silhouette from ellipses (body, ears, eyes with pupil holes, snout, nose, teeth, arms,
  feet) sampled at density 0.13 points per unit area with per-feature multipliers (body 0.55, eyes 1.3,
  teeth 1.6) and outlines; star velocity v0 = (target - gravityFall)/travel where travel and fall are
  integrated with the scene''s own particle.step at the scene TPS (a closed-form exponential was 2.5 %
  off the discrete integration); tilt +-0.15 rad, scale 0.92-1.08 per axis, 2.5-unit jitter; forms in
  1.1 s, then sinks.'
- 'Shells: v = sqrt(2 g h) for a chosen apex, trail sparks every tick, burst when vy >= 0; Crackle stars
  carry splitAt and explode into six sparks; all sizes scale with height/720.'
- Scene cost at 720p on the M3 with the record sample capturing is about 5-7 ms per draw including ReadPixels;
  60 fps is kept.
- The window keeps the keyboard; browsers only watch. browser.OpenURL is called after the HTTP server
  starts; failures are printed, not fatal.
- 'Title screen (added on the author''s request): the scene starts idle with a centred "HANABI" title,
  a blinking "PRESS A FOR THE AUTO SHOW" and the key list, drawn with text/v2 and the Go Regular font
  from golang.org/x/image; A starts the automatic show, any other key starts manual play and is handled
  as a launch key when it is one; Scene.Start(auto) does the same from code. record skips the title (-auto
  defaults to true, -launch starts manual play), hls and webrtc show it unless -auto.'
- 'Screen-off streaming: Ebitengine needs a window to exist (no headless backend), but it keeps running
  Update/Draw while the window is minimized on macOS - measured 2026-10-09 with hls -auto -minimized:
  the window minimized 1 s after start and after 14 s the playlist held five 2.000 s segments at 60 fps.
  The -minimized flag does that; a truly windowless stream would render frames without Ebitengine and
  feed the same Recorder/Segmenter/Broadcaster, which never touch the display.'
- 'The player image is a plain *ebiten.Image updated in place, so no ebitenvideo API change was needed:
  DrawImage, DrawTriangles (as the texture) and DrawRectShader (Images[0]) all take it as is.'
- Ebitengine DrawTriangles interpolates texture coordinates affinely; each cube face is split into an
  8x8 grid whose corners are projected individually so that the perspective error stays invisible.
- Back faces are culled by the projected winding (corners listed counter-clockwise from outside give a
  positive cross product on screen with y down when facing the camera); the first attempt had the sign
  inverted and showed five faces head-on, which the mesh unit test caught.
- DrawRectShader requires the destination rectangle and Images[0] to have the same size, so the shader
  is drawn at video size and scaled with GeoM; scanlines are keyed to dstPos.y so they do not alias with
  the video resolution.
- The clip is embedded with go:embed (1.4 MB) so that go run ./player and go run ./texture work from any
  directory; container.NewDemuxer takes the bytes.Reader. The ebitenvideo module cannot import examples
  (it would make the two modules depend on each other), so the MP4-capable player lives in examples/player
  and ebitenvideo/example stays a raw-stream demo.
- 'texture box: half-extents (1, aspect, 1) with aspect = clamp(h/w, 0.5, 2), so the four side faces keep
  the video''s aspect; top and bottom are square. Camera focal 0.75*h, distance 4.2 to fit a 2:1 box.'
- 'Shader amounts for real footage: barrel 0.05*r2, ripple 0.002, scanline 0.93 +- 0.07, vignette 0.25*r2
  (were 0.10 / 0.004 / 0.85 +- 0.15 / 0.45).'
- examples/player plays the audio track of an MP4 file (AAC or Opus) through the system's codec and Ebitengine's
  audio, with the pictures following the sound (component:playback keys sound-); -mute and platforms
  without an audio backend play silently. The texture sample still ignores sound. The clip's AAC track
  is copied by convert and listed by the container tests.
- 'The author asked for the fallback in the sample converter, not in the library: image/heif and image/avif
  stay hardware-only and the examples module takes the new dependencies (gen2brain/avif v0.6.0 with wazero
  v1.12.0, gen2brain/h265 v0.2.3).'
- 'The author asked for pure-Go codecs. gen2brain/h265 is Go code; no AV1 encoder or decoder written in
  Go was found, so the AVIF fallback is WebAssembly run by wazero: cgo-free, CGO_ENABLED=0 builds work,
  but it is not Go source. The README and the program''s messages say so.'
- Fallback only on errors.Is(err, hwmediacodec.ErrUnsupported), which also covers a hardware decoder that
  exists but refuses the stream (VideoToolbox and 4:4:4 AV1). Other errors are reported, not hidden. -engine
  hardware and -engine go force one side; who did the work is printed on standard error.
- The hardware path encodes into memory, so nothing reaches the output when the fallback takes over, and
  a failed conversion leaves no file.
- 'The fallback encoders store no irot: -rotate turns the pixels (same displayed picture). The AVIF fallback
  is told to write 4:2:0 because its default 4:4:4 (seq_profile 1) is refused by hardware decoders.'
- Both fallback libraries also register heic/avif with the image package when imported; the sample therefore
  calls the packages directly for HEIF input instead of image.Decode.
acceptance:
  browser-ebitengine-in-browser:
    text: examples/player built for js/wasm plays the bundled clip in a browser at the display rate without
      skipped frames, and seeking works.
    scope:
      milestone: browser-webcodecs
      platform: js
    verified_by:
    - browser-player-in-browser
  browser-clip-plays-without-hevc:
    text: A browser without an HEVC decoder (Firefox) gets the bundled clip in H.264, chosen without any
      setting, and automated tests cover the choice and both encodings.
    scope:
      milestone: browser-webcodecs
      platform: js
    verified_by:
    - browser-bundled-clip-fallback
  exmp4-convert-end-to-end:
    text: convert produces an MP4 whose video has the target codec, the source frame count and size, PSNR
      >= 30 dB against the source, B-frames when requested, identical presentation times as reported by
      ffprobe, and the audio track copied with the same codec and packet count.
    scope:
      milestone: examples-mp4-tools
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exmp4-convert-test
    - exmp4-convert-1080p-run
  exmp4-thumbnails-end-to-end:
    text: With -all the tool writes one image per keyframe named by presentation time, each within 30
      dB (8x8 block PSNR) of ffmpeg's decode of the same frame; -every picks the keyframe at or before
      each instant; -width scales with the aspect ratio kept.
    scope:
      milestone: examples-mp4-tools
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exmp4-thumbnails-test
  exscreen-record-app:
    text: The record app at 1280x720 and 60 fps records 5 s without drops at about 56 fps including window
      start-up, with ReadPixels costing a few milliseconds per draw.
    scope:
      milestone: examples-screencast-hls
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exscreen-record-run
  exfw-gopher-shape:
    text: gopherPoints yields 500-1600 points inside the box, none inside the pupils, all colour classes
      present with at least 100 white (eye/teeth) points; after 1.1 s of integration at 60 TPS a burst
      at (600, 300) spans about 280x290 px centred within 25/40 px, white stars sitting in the upper half.
    scope:
      milestone: examples-fireworks
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exfw-fireworks-unit-test
  exfw-solver-exact:
    text: A star aimed with displacementForUnitVelocity lands within 1 px of its target after the formation
      time.
    scope:
      milestone: examples-fireworks
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exfw-fireworks-unit-test
  exfw-looks:
    text: Recorded through the record sample, frames show distinct shell types with trails, the skyline
      with lit windows and a rippled reflection, and the gopher shell forms a recognisable gopher (ears,
      round body, white eyes) that then fades.
    scope:
      milestone: examples-fireworks
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exfw-fireworks-record-run
  extex-cube-mesh:
    text: Head-on only the front face is emitted (25 vertices, 96 indices for 4x4 cells) with texture
      coordinates spanning the texture once and a centred square projection; 45 degrees shows two faces,
      tilted three; all indices are in range.
    scope:
      milestone: examples-texture
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - extex-mesh-test
  extex-renders:
    text: The app plays an HEVC MP4 at 1280x720 and, recorded through screencast for 13 s, shows the flat
      video, the lit cube with the video on three visible faces, and the shader effect in frames extracted
      at 2 s, 6 s and 10 s.
    scope:
      milestone: examples-texture
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - extex-texture-run
  exwebrtc-browser-playback:
    text: A Chromium browser connects through the page at /, receives 1280x720 H.264 at the game's frame
      rate with no packet loss, and the decoded picture shows the scene.
    scope:
      milestone: examples-webrtc
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - exwebrtc-webrtc-live-run
  explayer-clip-demuxes:
    text: The embedded clip demuxes to an HEVC 720x1280 track of 293 samples at 29.6-29.7 fps with one
      audio track, PacketSource.Length 9.8-9.9 s, keyframe 0 first, and every access unit converts to
      Annex-B.
    scope:
      milestone: examples-player-assets
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - explayer-assets-container-test
  explayer-player-plays-clip:
    text: The player opens the clip the way main does, reports 720x1280 and a length of about 9.88 s,
      shows a frame and seeks to 5 s.
    scope:
      milestone: examples-player-assets
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - explayer-player-test
  explayer-box-aspect:
    text: boxMesh with aspect 2 projects a front face twice as tall as wide; aspect 1 keeps the earlier
      cube checks.
    scope:
      milestone: examples-player-assets
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - explayer-mesh-test
  explayer-looks:
    text: Recorded through the texture sample, the clip appears pillarboxed in flat mode, on a tall box
      in box mode and with a barely visible curve and scanlines in shader mode.
    scope:
      milestone: examples-player-assets
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - explayer-texture-clip-run
  imgconv-fallback-round-trip:
    text: With -engine go both formats encode and decode within 32 dB (4x4-block PSNR) of the source,
      and where the machine has a hardware decoder it reads the fallback encoders' files to the same quality.
    scope:
      milestone: imgconv-fallback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - imgconv-imgconv-test
  imgconv-auto-choice:
    text: -engine auto uses the hardware for every format and direction Probe lists and the fallback otherwise;
      forcing the hardware where there is none is ErrUnsupported with nothing written.
    scope:
      milestone: imgconv-fallback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - imgconv-imgconv-test
  imgconv-cross-read:
    text: The fallback HEIC decoder reads the hardware encoder's files, a rotated 128-pixel grid included,
      with the same size and rotation direction.
    scope:
      milestone: imgconv-fallback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - imgconv-imgconv-test
  imgconv-command:
    text: On the M3, imgconv writes a 1000x700 PNG as AVIF through the fallback, reads it back with the
      hardware decoder, writes and reads a rotated HEIC with -engine go, and -engine hardware for AVIF
      output fails without leaving a file.
    scope:
      milestone: imgconv-fallback
      platform: darwin
      gpu: apple-silicon
    verified_by:
    - imgconv-imgconv-run
