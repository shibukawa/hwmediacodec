facts:
  api:
    convert: flags -codec h264|hevc -bitrate 6M|2500k -cbr -quality -gop -bframes -profile -software -q
    thumbnails: flags -every 10s -all -width -format jpg|png -quality -o -software
    record: flags -o -codec -bitrate -fps -size -seconds
    fireworks: NewScene(w, h, tps) -> Scene{HandleInput, Update, Draw, Launch(kind, x), Particles, Status,
      Auto}; Help(); Kind (Peony..Gopher), ParseKind
    flags: record -launch <kind> -auto (default true); hls/webrtc -open (default true) -auto (default
      false) -minimized
    texture: flags -codec -fps (raw streams only) -size -seconds -record -software; keys 1/2/3 modes,
      space pause; modes cycle every 4 s until a key is pressed
    heifconv: flags -quality -tile -rotate -info -software -jpeg-quality; output format by extension (.heic/.heif/.hif,
      .avif, .png, .jpg)
    assets: WaterfallMP4 []byte, WaterfallName, Waterfall() io.ReadSeeker
    player: flags -codec -fps (raw streams) -once -software; optional path argument
    texture_explayer: optional path argument (default the clip); boxMesh(cam, ay, ax, texW, texH, aspect,
      grid)
  delivery_results:
    milestone:examples-mp4-tools:
      result:
        status: delivered 2026-10-09
        performance: 1080p H.264 (bf=2) -> HEVC 8 Mbit/s with B-frames at 162 fps on an M3 including demux,
          mux and audio copy
    milestone:examples-fireworks:
      result:
        status: delivered 2026-10-09
    milestone:examples-texture:
      result:
        status: delivered 2026-10-09
    milestone:examples-webrtc:
      result:
        status: delivered 2026-10-09
    milestone:examples-player-assets:
      result:
        status: delivered 2026-10-09
    milestone:imgconv-fallback:
      result:
        status: delivered 2026-10-10
  milestone_notes:
    imgconv:
      flags: -quality -tile -rotate -info -engine auto|hardware|go -software -jpeg-quality
